name: Charter track

# Follows the charter's service releases, and previews charter changes before they are released (#253;
# operator ruling 2026-11-18 on #253: the pin follows releases by default, charter main runs on demand).
# It replaces charter's open-packs-drift.yml (charter ADR-0070, amended 2026-11-13).
#
# Every track runs the required check's own jobs (validate-packs.yml, called with a charter target), so the
# PR gate, the release track, the on-demand track and the nightly main track share every step: charter_service_jar.sh,
# charter_pack_check_jar.sh with charter_pack_check.py (#252), charter_service_check.py and the schema pass. A called run first moves the pin and
# re-derives the pack manifests, digests and pack pages (scripts/ci/charter_pin.py apply).
#
# - release track (the daily schedule, or a dispatch with track=release): lists the charter's releases and
#   takes the newest service-v* release or pre-release. When it is newer than the lock's release_tag, it
#   runs the checks with that release's service and pack-check jars (each checked against its .sha256 asset) and
#   commit set to the tag's commit. Only a run on main of this repository acts on the verdict:
#     green: opens ONE pull request (branch charter/service-release-<tag>) that bumps release_tag, jar_sha256,
#            pack_check_sha256 and commit with the re-derived files; an open bump pull request of an older release is closed;
#     red:   opens ONE issue labelled charter:release-red, or rewrites the open one, naming the release and
#            the errors of the failing jobs. A scheduled run that cannot resolve the release says so there too.
#   While a bump pull request for the newest release is open, or after one was closed unmerged, the track does
#   not check that release again. Once the lock reaches the release an open red issue names, the issue is closed.
#   A lock without a release_tag (a main pin, taken on demand) is never replaced by this track.
# - on-demand track (a dispatch with track=ref, the default, or the charter:head label on a pull request):
#   builds the charter at charter_ref (default main; a branch, tag, pull/<n>/head or commit) from source and
#   runs the same checks, pack-check (built from the same source) included. It reports in the job summary, never bumps the lock and uses
#   no secret.
# - nightly main track (the nightly schedule, or a dispatch with track=main): the on-demand track against
#   charter main, unattended (#311; operator ruling 2026-11-19 on #311). It replaces the nightly charter-main
#   check of charter's open-packs-drift.yml (charter ADR-0070: "a nightly, non-blocking open-packs run against
#   charter main"). It reports only: it never bumps the lock, and it is not a required check. Only a run on
#   main of this repository acts on the verdict:
#     red:   opens ONE issue labelled charter:main-red, or rewrites the open one, naming the charter commit and
#            the errors of the failing jobs. A run that cannot resolve charter main says so on the same issue;
#     green: closes the open charter:main-red issue.
#   It keeps clear of the release track: its own label, its own issue, its own concurrency queue.
#
# Tokens (operator ruling on #314; the org locks "Allow GitHub Actions to create and approve pull requests").
# Only the bump job holds contents: write or a secret:
# - the job's own token (contents: write on that job only) pushes the bump branch and makes its commit through
#   the GitHub API, so GitHub signs the commit. The bump job runs no repository code: no checkout, no Python. The pin
#   tooling runs in the derive job, which holds no write scope, exposes no token to any step and hands over only
#   file changes; the bump job checks
#   every path and builds the commit request from fixed text (#310);
# - the repository secret PR_CREATION_TOKEN, a fine-grained PAT on spec-kitty-charter and spec-kitty-open-packs
#   with Actions and Pull requests read and write and no Contents, opens the bump pull request and closes a
#   superseded one. A pull request opened with it starts the pull_request workflows, so the required check
#   runs on the bump pull request itself. Only the step that opens and closes pull requests holds it, and that
#   step runs nothing but gh. This workflow uses its Pull requests scope; its Actions scope is the operator's
#   choice for other uses. Without the secret the bump job fails, naming it, before it pushes.
# Every other job uses only the workflow's own token, read-only apart from the issue jobs' issues: write.
#
# Provenance (#310). Before a bump, the read-only provenance job checks the release's service jar and pack-check jar:
# - a jar that is not the file the bump pins (another SHA-256) is an integrity failure: the job fails and no bump is
#   derived or opened;
# - its build attestation is verified against spec-kitty-charter's release workflow and the tag (gh attestation
#   verify --signer-workflow --source-ref). A missing or failing attestation is a warning only (operator ruling): the
#   bump pull request is opened anyway and its body states, per jar, verified or not verified.

on:
  schedule:
    # Release track: daily, off the hour.
    - cron: '41 5 * * *'
    # Nightly main track (#311): a different hour from the release track. The jobs below tell the two apart by
    # this exact string (github.event.schedule); tests/ci/test_workflows.py keeps them in step.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      track:
        description: "ref: check the packs against charter_ref, built from source (never bumps). release: the scheduled release track. main: the nightly main track (charter main; report only)."
        type: choice
        options: [ref, release, main]
        default: ref
      charter_ref:
        description: "ref track: a charter branch, tag, pull/<n>/head or 40-hex commit"
        type: string
        default: main
      release_tag:
        description: "release track: check this service-v* tag instead of the newest; it acts only when it is the newest and newer than the lock"
        type: string
        default: ""
  # The charter:head label runs the on-demand track on a pull request, against charter main.
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # A pull request's newer run replaces its older one, but another label's event gets a group of its own, so it
  # never cancels a charter:head run; each on-demand dispatch runs on its own; release-track runs on one ref queue
  # behind each other, so two never open the same pull request or issue; so do nightly main-track runs, on a
  # queue of their own, so they never hold up a release run.
  group: >-
    charter-track-${{ github.event_name == 'pull_request'
    && format('pr-{0}{1}', github.event.pull_request.number,
    github.event.action == 'labeled' && github.event.label.name != 'charter:head'
    && format('-label-{0}', github.run_id) || '')
    || (github.event_name == 'workflow_dispatch' && inputs.track == 'ref') && format('run-{0}', github.run_id)
    || (github.event_name == 'workflow_dispatch' && inputs.track == 'main'
    || github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') && format('main-{0}', github.ref)
    || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve the charter target
    # On a pull request only with the charter:head label, never while it is paused, and on a label event
    # only when that label is the one added.
    if: >-
      ${{ github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'charter:head')
      && !contains(github.event.pull_request.labels.*.name, 'pr:pause-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'charter:head')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Looks up the bump pull request of the newest release.
      pull-requests: read
    outputs:
      track: ${{ steps.target.outputs.track }}
      run: ${{ steps.target.outputs.run }}
      act: ${{ steps.target.outputs.act }}
      commit: ${{ steps.target.outputs.commit }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      jar_sha256: ${{ steps.target.outputs.jar_sha256 }}
      pack_check_sha256: ${{ steps.target.outputs.pack_check_sha256 }}
      current: ${{ steps.target.outputs.current }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve the target
        id: target
        env:
          # Reads the charter's public releases; the token only lifts the anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
          TRACK: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.track
            || github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' && 'main' || 'release')
            || 'ref' }}
          # The main track always checks charter main, whatever charter_ref a dispatch carries.
          CHARTER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.track != 'main' && inputs.charter_ref || 'main' }}
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          values="$RUNNER_TEMP/target.env"
          current="$(python3 scripts/ci/charter_lock.py release_tag)"
          if [[ "$TRACK" == release ]]; then
            python3 scripts/ci/charter_pin.py newest-release > "$RUNNER_TEMP/newest.env"
            newest="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/newest.env")"
            newer="$(sed -n 's/^newer=//p' "$RUNNER_TEMP/newest.env")"
            tag="${RELEASE_TAG_INPUT:-$newest}"
            act=false
            if [[ "$newer" == true && "$tag" == "$newest" ]]; then act=true; fi
            note=""
            if [[ "$act" == true ]]; then
              # This repository's own bump pull requests only: a fork can name a branch the same.
              states="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "charter/service-release-$tag" --state all --limit 20 \
                --json number,state,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | "\(.state) #\(.number)"')"
              if grep -q '^OPEN ' <<< "$states"; then
                act=false
                note="Its bump pull request $(grep '^OPEN ' <<< "$states" | head -n 1 | cut -d' ' -f2) is open: not checked again."
              elif grep -q '^CLOSED ' <<< "$states"; then
                act=false
                note="Its bump pull request $(grep '^CLOSED ' <<< "$states" | head -n 1 | cut -d' ' -f2) was closed unmerged: not proposed again until a newer release."
              fi
            fi
            if [[ "$act" == true || -n "$RELEASE_TAG_INPUT" ]]; then
              python3 scripts/ci/charter_pin.py resolve-release "$tag" > "$values"
              run=true
            else
              run=false
              : > "$values"
            fi
            ref="$tag"
          else
            python3 scripts/ci/charter_pin.py resolve-ref "$CHARTER_REF" > "$values"
            run=true
            act=false
            ref="$CHARTER_REF"
          fi
          {
            echo "track=$TRACK"
            echo "run=$run"
            echo "act=$act"
            echo "current=$current"
            echo "ref=$ref"
            cat "$values"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "## Charter track: $TRACK"
            echo
            if [[ "$TRACK" == release ]]; then
              echo "The lock pins \`${current:-a main commit (no release_tag)}\`; the newest charter release is \`$newest\`."
              if [[ -z "$current" ]]; then
                echo "A main pin is taken on demand, so the release track does not replace it."
              elif [[ -n "$note" ]]; then
                echo "$note"
              elif [[ "$run" == false ]]; then
                echo "Nothing newer: nothing to check."
              fi
              if [[ -n "$RELEASE_TAG_INPUT" ]]; then
                echo "Checking \`$RELEASE_TAG_INPUT\` as asked (acts on it: $act)."
              fi
            elif [[ "$TRACK" == main ]]; then
              echo "Nightly main track: checking charter \`main\`, built from source. Report only: the lock is never bumped,"
              echo "and from \`main\` a red run opens or rewrites the one \`charter:main-red\` issue, a green run closes it."
            else
              echo "Checking charter \`$CHARTER_REF\`, built from source. The lock is never bumped by this track."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check's own jobs, against the target.
  checks:
    name: Charter checks
    needs: resolve
    if: ${{ needs.resolve.outputs.run == 'true' }}
    permissions:
      contents: read
      # The called gate reads a pull request's labels for the pause guard.
      pull-requests: read
    uses: ./.github/workflows/validate-packs.yml
    with:
      charter_commit: ${{ needs.resolve.outputs.commit }}
      charter_release_tag: ${{ needs.resolve.outputs.release_tag }}
      charter_jar_sha256: ${{ needs.resolve.outputs.jar_sha256 }}
      charter_pack_check_sha256: ${{ needs.resolve.outputs.pack_check_sha256 }}

  report:
    name: Report
    needs: [resolve, checks]
    if: ${{ always() && needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Summarise the checks
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ needs.resolve.outputs.track }}
          ACT: ${{ needs.resolve.outputs.act }}
          REF: ${{ needs.resolve.outputs.ref }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RESULT: ${{ needs.checks.result }}
          ON_MAIN: ${{ github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          {
            echo "## Charter checks: $RESULT"
            echo
            echo "Charter \`$REF\` at commit \`$COMMIT\`; release jar: \`${RELEASE_TAG:-none, built from source}\`."
            echo
            scripts/ci/charter_track_report.sh "$GITHUB_RUN_ID" || echo "(the run's jobs could not be listed)"
            echo
            if [[ "$TRACK" == main && "$ON_MAIN" != true ]]; then
              echo "Nightly main track off main: no issue is opened or closed (it would $([[ "$RESULT" == success ]] && echo close the open charter:main-red issue || echo open or rewrite the charter:main-red issue))."
              echo
            fi
            if [[ "$TRACK" != release ]]; then
              echo "$([[ "$TRACK" == main ]] && echo "Nightly main track" || echo "On-demand track"): the lock is never bumped. The checks ran after the pin move re-derived every pack"
              echo "manifest, digest and pack page at the target, so they judge the packs as a bump would carry them;"
              echo "a pull request's own gate judges those files as committed."
            elif [[ "$ACT" != true ]]; then
              echo "Release track on a release that is not newer than the lock: nothing is opened."
            elif [[ "$ON_MAIN" != true ]]; then
              echo "Release track off main: nothing is opened (it would open the $([[ "$RESULT" == success ]] && echo bump pull request || echo red-release issue))."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Before a bump, both release jars (#310). Read-only, runs no repository code.
  # - A jar that is not the pinned file (another SHA-256) is an integrity event: an error, and this job fails, so
  #   nothing is derived or published. A wrong jar never produces a bump pull request.
  # - A build attestation that is missing or does not verify (pinned to the charter's release workflow and the tag) is
  #   a warning only (operator ruling on #310): the bump pull request is opened anyway and says so.
  provenance:
    name: Release provenance
    needs: resolve
    if: >-
      ${{ needs.resolve.outputs.track == 'release' && needs.resolve.outputs.act == 'true'
      && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Reads only: the charter's public release assets (contents) and their build attestations (attestations).
      contents: read
      attestations: read
    outputs:
      service: ${{ steps.verify.outputs.service }}
      pack_check: ${{ steps.verify.outputs.pack_check }}
    steps:
      - name: Check both release jars and their build attestations
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CHARTER: spec-kitty/spec-kitty-charter
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          JAR_SHA256: ${{ needs.resolve.outputs.jar_sha256 }}
          PACK_CHECK_SHA256: ${{ needs.resolve.outputs.pack_check_sha256 }}
        run: |
          # No `set -e`: each check records a state; only an integrity failure fails the job, at the end.
          set -uo pipefail
          version="${RELEASE_TAG#service-v}"
          jars="$RUNNER_TEMP/jars"
          mkdir -p "$jars"
          failed=0
          echo "## Release provenance: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          check() {  # <output name> <jar> <the SHA-256 the bump pins>
            local name="$1" jar="$2" pinned="$3" state=unverified
            if ! gh release download "$RELEASE_TAG" --repo "$CHARTER" --pattern "$jar" --dir "$jars" --clobber; then
              echo "::warning::could not download $jar of $RELEASE_TAG: its build attestation is not verified (#310)"
            elif [[ "$(sha256sum "$jars/$jar" | cut -d' ' -f1)" != "$pinned" ]]; then
              echo "::error::$jar of $RELEASE_TAG is not the file the bump pins (its SHA-256 is not $pinned): no bump is made (#310)"
              state=mismatch
              failed=1
            elif ! gh attestation verify "$jars/$jar" --repo "$CHARTER" \
                --signer-workflow "$CHARTER/.github/workflows/service-release.yml" --source-ref "refs/tags/$RELEASE_TAG"; then
              echo "::warning::$jar of $RELEASE_TAG has no build attestation that verifies against $CHARTER's release workflow (#310; warn only)"
            else
              state=verified
            fi
            echo "$name=$state" >> "$GITHUB_OUTPUT"
            echo "- \`$jar\`: $state" >> "$GITHUB_STEP_SUMMARY"
          }
          check service "spec-kitty-charter-service-$version.jar" "$JAR_SHA256"
          check pack_check "pack-check-$version.jar" "$PACK_CHECK_SHA256"
          exit "$failed"

  # Green on a newer release, on main: the pin tooling re-derives the packs here, with no write scope and no token in
  # any step (#310). This job
  # hands its file changes to the bump job as an artifact; it can push nothing and open nothing.
  derive:
    name: Derive the bump
    needs: [resolve, checks, provenance]
    if: >-
      ${{ needs.resolve.outputs.track == 'release' && needs.resolve.outputs.act == 'true'
      && needs.checks.result == 'success'
      && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Reads the repository only. This job runs the pin tooling over the new release's contract, so it holds no
      # write scope and no secret (#310); the bump job takes only its checked file changes.
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the schema validator's dependencies
        run: |
          pip install --only-binary :all: "pyyaml==6.0.3" "jsonschema==4.26.0"
      - name: Re-derive the packs at the release
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          JAR_SHA256: ${{ needs.resolve.outputs.jar_sha256 }}
          PACK_CHECK_SHA256: ${{ needs.resolve.outputs.pack_check_sha256 }}
          CURRENT: ${{ needs.resolve.outputs.current }}
        run: |
          set -euo pipefail
          python3 scripts/ci/charter_pin.py apply --commit "$COMMIT" --release-tag "$RELEASE_TAG" --jar-sha256 "$JAR_SHA256" --pack-check-sha256 "$PACK_CHECK_SHA256"
          python3 scripts/ci/charter_pin.py changelog --release-tag "$RELEASE_TAG" --commit "$COMMIT" --previous "$CURRENT" --date "$(date -u +%F)"
          # Only the file changes travel on: the bump job builds the commit request itself, from fixed text.
          mkdir -p "$RUNNER_TEMP/charter-bump"
          head="$(git rev-parse HEAD)"
          python3 scripts/ci/charter_pin.py commit-payload --branch unused --head-oid "$head" --headline unused \
            | jq '.fileChanges' > "$RUNNER_TEMP/charter-bump/file-changes.json"
          echo "$head" > "$RUNNER_TEMP/charter-bump/head"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charter-bump
          path: ${{ runner.temp }}/charter-bump/
          if-no-files-found: error
          retention-days: 7

  # The bump pull request. This job holds the tokens, so it runs no repository code and no file from the artifact: no
  # checkout, no Python, no pip. It builds the commit request from fixed text and takes only the file changes from the
  # derive job, each path checked against the files a bump writes (#310).
  bump:
    name: Open the bump pull request
    needs: [resolve, checks, provenance, derive]
    if: >-
      ${{ needs.resolve.outputs.track == 'release' && needs.resolve.outputs.act == 'true'
      && needs.checks.result == 'success'
      && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushes the bump branch and its commit with the job's own token. Pull requests are opened and closed
      # with PR_CREATION_TOKEN (operator ruling on #314), so the job token only reads them.
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Require PR_CREATION_TOKEN
        env:
          HAS_PR_TOKEN: ${{ secrets.PR_CREATION_TOKEN != '' }}
        run: |
          # Before any branch is pushed, so a missing secret leaves nothing behind.
          if [[ "$HAS_PR_TOKEN" != true ]]; then
            echo "::error::The repository secret PR_CREATION_TOKEN is not set: the bump pull request cannot be opened. Set it to the fine-grained PAT described in docs/guides/validate-a-pack.md (Pull requests read and write on this repository; no Contents)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charter-bump
          path: ${{ runner.temp }}/charter-bump
      - name: Look up the bump state
        id: lookup
        env:
          # The job's own token: reads pull requests and issues, deletes an interrupted run's branch. Runs only gh.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          # One branch per release, cut from this run's main commit; an open bump pull request for an older
          # release is closed once the new one is open, so one stays open.
          branch="charter/service-release-$RELEASE_TAG"
          gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select((.isCrossRepository | not) and (.headRefName | startswith("charter/service-release-"))) | "\(.number)\t\(.headRefName)"' \
            > "$RUNNER_TEMP/open-prs.tsv"
          if awk -F '\t' -v branch="$branch" '$2 == branch { found = 1 } END { exit !found }' "$RUNNER_TEMP/open-prs.tsv"; then
            echo "A pull request from $branch is already open; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
            closed="$(gh pr list --repo "$REPO" --head "$branch" --state closed --limit 20 --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
            if [[ -n "$closed" ]]; then
              echo "::notice::#$closed from $branch was closed without merging; delete the branch to have it proposed again."
              exit 0
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"  # left by an interrupted run
          fi
          red="$(gh issue list --repo "$REPO" --label charter:release-red --state open --limit 1 --json number --jq '.[0].number // empty')"
          {
            echo "go=true"
            echo "branch=$branch"
            echo "red=$red"
          } >> "$GITHUB_OUTPUT"

      - name: Check the derived changes and build the commit
        id: build
        if: ${{ steps.lookup.outputs.go == 'true' }}
        env:
          # No token. jq and shell only: the request is fixed text around the checked file changes.
          ARTIFACT: ${{ runner.temp }}/charter-bump
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.lookup.outputs.branch }}
          RED: ${{ steps.lookup.outputs.red }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          JAR_SHA256: ${{ needs.resolve.outputs.jar_sha256 }}
          PACK_CHECK_SHA256: ${{ needs.resolve.outputs.pack_check_sha256 }}
          CURRENT: ${{ needs.resolve.outputs.current }}
          ATTEST_SERVICE: ${{ needs.provenance.outputs.service }}
          ATTEST_PACK_CHECK: ${{ needs.provenance.outputs.pack_check }}
        run: |
          set -euo pipefail
          # The provenance job only lets a bump through with these states; anything else stops here.
          for state in "$ATTEST_SERVICE" "$ATTEST_PACK_CHECK"; do
            if [[ "$state" != verified && "$state" != unverified ]]; then
              echo "::error::unexpected provenance state '$state'; nothing is pushed"
              exit 1
            fi
          done
          # The derive job's checkout must be this run's commit, the one the branch is cut from.
          if [[ "$(head -n 1 "$ARTIFACT/head")" != "$HEAD_SHA" ]]; then
            echo "::error::the derived changes were cut from $(head -n 1 "$ARTIFACT/head"), not $HEAD_SHA; nothing is pushed"
            exit 1
          fi
          # The branch is the one the lookup made for this release, never another.
          if [[ "$BRANCH" != "charter/service-release-$RELEASE_TAG" ]]; then
            echo "::error::the bump branch is '$BRANCH', not charter/service-release-$RELEASE_TAG; nothing is pushed"
            exit 1
          fi
          # Every path is one a bump writes. The pattern is anchored and no segment may start with a dot, so a path
          # is relative, holds no . or .. segment and is never under .github/; a control character (a trailing
          # newline, which jq's $ would let through) is refused on its own. Only a generated pack page may be deleted
          # (a pack that is gone); the authored pages beside them (index, catalog-proposal) are never touched.
          rewritten='^(charter\.lock\.yaml|docs/changelog/CHANGELOG\.md|packs/[A-Za-z0-9_-][A-Za-z0-9._-]*\.source\.yaml|(packs|tests/fixtures/valid)/[A-Za-z0-9_-][A-Za-z0-9._-]*/pack-manifest\.yaml)$'
          page='^docs/packs/[A-Za-z0-9_-][A-Za-z0-9._-]*\.md$'
          authored='^docs/packs/(index|catalog-proposal)\.md$'
          refused="$(jq -r --arg rewritten "$rewritten" --arg page "$page" --arg authored "$authored" '
            def bad: if type != "string" then "(a path that is not text)"
                     elif test("[[:cntrl:]]") then tojson
                     elif test($authored) then tojson
                     else null end;
            if (type != "object") or ((keys - ["additions", "deletions"]) != []) then "(the file changes are not additions and deletions)"
            else ([(.additions // [])[] | .path | (bad // (if test($rewritten) or test($page) then empty else tojson end))],
                  [(.deletions // [])[] | .path | (bad // (if test($page) then empty else tojson end))]
                  | .[]) end' "$ARTIFACT/file-changes.json")"
          if [[ -n "$refused" ]]; then
            while IFS= read -r path; do echo "::error::the derived changes hold a path a bump does not write: $path"; done <<< "$refused"
            exit 1
          fi
          # The lock the commit carries must pin exactly what the gate checked and the provenance job re-checked:
          # this release, its commit and both digests. The artifact cannot pin anything else.
          if ! jq -e --arg commit "$COMMIT" --arg tag "$RELEASE_TAG" --arg jar "$JAR_SHA256" --arg check "$PACK_CHECK_SHA256" '
              [.additions[] | select(.path == "charter.lock.yaml")] as $locks
              | ($locks | length) == 1
                and ($locks[0].contents | @base64d | split("\n")) as $lines
                | (["commit: " + $commit, "release_tag: " + $tag, "jar_sha256: " + $jar, "pack_check_sha256: " + $check]
                   | all(. as $want | $lines | index([$want]) != null))
                  and ([$lines[] | select(test("^(commit|release_tag|jar_sha256|pack_check_sha256):"))] | length) == 4
            ' "$ARTIFACT/file-changes.json" > /dev/null; then
            echo "::error::the derived charter.lock.yaml does not pin exactly $RELEASE_TAG ($COMMIT) with the checked digests; nothing is pushed"
            exit 1
          fi
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --arg headline "chore(charter): pin charter release $RELEASE_TAG (#253)" \
            --arg body "Opened by charter-track.yml: $RUN_URL" --slurpfile changes "$ARTIFACT/file-changes.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: [($changes[0].additions // [])[] | {path, contents}],
                              deletions: [($changes[0].deletions // [])[] | {path}]}}}}' > "$RUNNER_TEMP/request.json"

          # What stands behind each digest (#310): the provenance job's states. A mismatch never gets here.
          attested() {  # <what> <state>
            case "$2" in
              verified) echo "- $1: verified against \`spec-kitty/spec-kitty-charter\`'s release workflow (\`gh attestation verify\`)" ;;
              unverified) echo "- $1: **not verified**: the jar could not be downloaded again, or no build attestation was found, or it did not verify" ;;
              *) echo "- $1: **not verified**" ;;  # unreachable: the states were checked above
            esac
          }
          {
            echo "Charter published \`$RELEASE_TAG\`, and the packs pass the whole gate against it (#253)."
            echo
            echo "- \`release_tag\`: \`${CURRENT}\` → \`$RELEASE_TAG\`"
            echo "- \`commit\`: \`$COMMIT\` (the tag's commit)"
            echo "- \`jar_sha256\`: \`$JAR_SHA256\` (the release's service \`.sha256\` asset)"
            echo "- \`pack_check_sha256\`: \`$PACK_CHECK_SHA256\` (the release's pack-check \`.sha256\` asset)"
            echo
            echo "The required checks ran both jars, each refused unless it matches its digest, and the commit pins"
            echo "exactly these values. Their build provenance (#310; a missing attestation warns, it does not block):"
            echo
            attested "the service jar" "$ATTEST_SERVICE"
            attested "the pack-check jar" "$ATTEST_PACK_CHECK"
            if [[ "$ATTEST_SERVICE" != verified || "$ATTEST_PACK_CHECK" != verified ]]; then
              echo
              echo "**Check both digests by hand before merging:** compare them with the release page and its assets."
            fi
            echo
            echo "Every pack manifest, digest and pack page is re-derived at the new pin, and a changelog entry is added."
            echo "Proven green by $RUN_URL against \`main\` at \`$HEAD_SHA\`. Review the changelog entry before merging."
            echo "If \`main\` has moved since, **Update branch** before merging: that push runs the gate on the merge"
            echo "result, and a pack added since needs its manifest re-derived at the new pin."
            if [[ -n "$RED" ]]; then echo; echo "Closes #$RED."; fi
            echo
            echo "---"
            echo "_Opened by \`.github/workflows/charter-track.yml\`._"
          } > "$RUNNER_TEMP/pr.md"

      - name: Push the bump branch
        id: push
        if: ${{ steps.lookup.outputs.go == 'true' }}
        env:
          # The job's own token: creates the branch at this run's commit, then the commit GitHub signs. Runs only gh.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.lookup.outputs.branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$HEAD_SHA" > /dev/null
          oid="$(gh api graphql --input "$RUNNER_TEMP/request.json" --jq '.data.createCommitOnBranch.commit.oid')"
          echo "committed $oid on $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # The only step that holds PR_CREATION_TOKEN, and it runs nothing but gh.
      - name: Open the bump pull request
        if: ${{ steps.push.outputs.branch != '' }}
        env:
          # The job's own token: deletes the superseded branches (contents: write).
          GH_TOKEN: ${{ github.token }}
          # A fine-grained PAT (Pull requests read and write, no Contents): opens and closes the pull requests,
          # so the bump pull request's own pull_request workflows, the required check among them, run.
          PR_TOKEN: ${{ secrets.PR_CREATION_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          title="chore(charter): pin charter release $RELEASE_TAG"
          if ! url="$(GH_TOKEN="$PR_TOKEN" gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr.md")"; then
            echo "::error::PR_CREATION_TOKEN could not open the pull request from $BRANCH: check that the PAT has Pull requests read and write on $REPO, has not expired and is approved by the organization. The branch is pushed; the next run deletes and recuts it, or open the pull request by hand."
            exit 1
          fi
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Each superseded pull request is closed (the PAT), then its branch is deleted (the job token). A failure
          # does not stop the others, but it fails the job: no later run looks at a closed pull request again.
          failed=0
          while IFS=$'\t' read -r number old_branch; do
            [[ -n "$number" ]] || continue
            if ! GH_TOKEN="$PR_TOKEN" gh api -X PATCH "repos/$REPO/pulls/$number" -f state=closed > /dev/null; then
              echo "::error::PR_CREATION_TOKEN could not close #$number, superseded by $url; close it by hand."
              failed=1
              continue
            fi
            GH_TOKEN="$PR_TOKEN" gh pr comment "$number" --repo "$REPO" --body "Superseded by $url, which pins a newer charter release." \
              || echo "::warning::closed #$number but could not comment on it"
            if ! gh api -X DELETE "repos/$REPO/git/refs/heads/$old_branch"; then
              echo "::error::could not delete $old_branch of the superseded #$number; delete it by hand."
              failed=1
            fi
          done < "$RUNNER_TEMP/open-prs.tsv"
          exit "$failed"

  # Red on a newer release, on main: one labelled issue. A scheduled run that cannot even resolve the release (the
  # releases listing, the tag or its .sha256 asset) says so on the same issue, so the track never fails unseen.
  alert:
    name: Open the red-release issue
    needs: [resolve, checks]
    if: >-
      ${{ always() && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main'
      && (needs.resolve.outputs.track == 'release' && needs.resolve.outputs.act == 'true'
      && needs.checks.result == 'failure'
      || needs.resolve.result == 'failure' && github.event_name == 'schedule' && github.event.schedule != '23 2 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Open or update the charter:release-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVED: ${{ needs.resolve.result }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          CURRENT: ${{ needs.resolve.outputs.current }}
        run: |
          set -euo pipefail
          label=charter:release-red
          gh label create "$label" --repo "$REPO" --force --color B60205 \
            --description "A newer charter service release fails the packs (charter-track.yml)"
          body="$RUNNER_TEMP/issue.md"
          if [[ "$RESOLVED" == failure ]]; then
            title="Charter track cannot resolve the newest charter release"
            {
              echo "The scheduled release track could not resolve the newest charter service release: the releases"
              echo "listing, the tag's commit or one of the release's two \`.sha256\` assets could not be read. Nothing was checked."
              echo
              echo "Run: $RUN_URL. A release whose assets are still uploading resolves on the next day's run."
            } > "$body"
          else
            title="Charter release $RELEASE_TAG fails the packs"
            {
              echo "Charter release \`$RELEASE_TAG\` (commit \`$COMMIT\`) fails the packs of \`main\` at \`$GITHUB_SHA\`,"
              echo "so the lock stays at \`$CURRENT\` (#253)."
              echo
              echo "Run: $RUN_URL (pack-check report artifact: \`charter-pack-check-report\`)."
              echo
              scripts/ci/charter_track_report.sh "$GITHUB_RUN_ID" || echo "(the run's jobs could not be listed; see the run)"
              echo
              echo "Before migrating, check that the errors are the release's and not a download or fetch that failed;"
              echo "re-running the failed jobs of the run settles that."
            } > "$body"
          fi
          {
            echo
            echo "Every red run rewrites this description; a comment marks each change of title. A pull request that"
            echo "migrates the packs and bumps \`charter.lock.yaml\` to the release settles it: the next run closes it."
            echo
            echo "---"
            echo "_Opened by \`.github/workflows/charter-track.yml\`._"
          } >> "$body"
          # A plain label filter, not --search: the search API is eventually consistent.
          issue="$(gh issue list --repo "$REPO" --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "$issue" ]]; then
            gh issue create --repo "$REPO" --label "$label" --title "$title" --body-file "$body"
            exit 0
          fi
          old_title="$(gh issue view "$issue" --repo "$REPO" --json title --jq .title)"
          gh issue edit "$issue" --repo "$REPO" --title "$title" --body-file "$body"
          if [[ "$old_title" != "$title" ]]; then
            gh issue comment "$issue" --repo "$REPO" --body "Now: $title. $RUN_URL"
          fi

  # The lock reached the release an open red issue names (a migration pull request bumped it, with or without
  # "Closes"): close the issue, on main.
  settle:
    name: Close a settled red-release issue
    needs: resolve
    if: >-
      ${{ needs.resolve.outputs.track == 'release'
      && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Close the charter:release-red issue the lock has passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ needs.resolve.outputs.current }}
        run: |
          set -euo pipefail
          found="$(gh issue list --repo "$REPO" --label charter:release-red --state open --limit 1 --json number,title \
            --jq '.[0] | select(.) | "\(.number)\t\(.title)"')"
          [[ -n "$found" ]] || { echo "No open charter:release-red issue."; exit 0; }
          number="${found%%$'\t'*}"
          if [[ "${found#*$'\t'}" == "Charter track cannot resolve the newest charter release" ]]; then
            gh issue close "$number" --repo "$REPO" --reason completed --comment "The release track resolves again (lock: \`${CURRENT:-a main pin}\`)."
            exit 0
          fi
          tag="$(sed -nE 's/^Charter release (service-v[0-9A-Za-z.+-]+) fails the packs$/\1/p' <<< "${found#*$'\t'}")"
          if [[ -n "$tag" ]] && python3 scripts/ci/charter_pin.py at-or-past "$tag"; then
            gh issue close "$number" --repo "$REPO" --reason completed \
              --comment "\`charter.lock.yaml\` pins \`$CURRENT\` on \`main\`, at or past \`$tag\`: settled."
          else
            echo "#$number stays open: the lock (${CURRENT:-a main pin}) has not reached ${tag:-its release}."
          fi

  # The nightly main track, on main: one charter:main-red issue while charter main fails the packs, closed by the
  # next green run (#311). Report only; kept apart from charter:release-red. A nightly run that cannot resolve
  # charter main (a scheduled run, or a dispatch with track=main) says so on the same issue.
  main-red:
    name: Keep the charter:main-red issue
    needs: [resolve, checks]
    if: >-
      ${{ always() && github.repository == 'spec-kitty/spec-kitty-open-packs' && github.ref == 'refs/heads/main'
      && (needs.resolve.outputs.track == 'main' && (needs.checks.result == 'failure' || needs.checks.result == 'success')
      || needs.resolve.result == 'failure'
      && (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *'
      || github.event_name == 'workflow_dispatch' && inputs.track == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Open, update or close the charter:main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVED: ${{ needs.resolve.result }}
          RESULT: ${{ needs.checks.result }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          CURRENT: ${{ needs.resolve.outputs.current }}
        run: |
          set -euo pipefail
          label=charter:main-red
          # A plain label filter, not --search: the search API is eventually consistent.
          issue="$(gh issue list --repo "$REPO" --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ "$RESOLVED" == success && "$RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPO" --reason completed \
                --comment "Charter \`main\` at \`$COMMIT\` passes the packs of \`main\` at \`$GITHUB_SHA\` again: $RUN_URL"
            else
              echo "Charter main is green; no open $label issue."
            fi
            exit 0
          fi
          gh label create "$label" --repo "$REPO" --force --color D93F0B \
            --description "Charter main fails the packs: nightly, report only (charter-track.yml)"
          body="$RUNNER_TEMP/issue.md"
          if [[ "$RESOLVED" == failure ]]; then
            title="Charter track cannot resolve charter main"
            {
              echo "The main track could not resolve charter \`main\` to a commit. Nothing was checked."
              echo
              echo "Run: $RUN_URL. The next nightly run, or a dispatch with \`track: main\`, tries again."
            } > "$body"
          else
            title="Charter main fails the packs"
            {
              echo "Charter \`main\` at \`$COMMIT\`, built from source, fails the packs of \`main\` at \`$GITHUB_SHA\`."
              echo "This is unreleased charter: the lock stays at \`${CURRENT:-a main pin}\` and nothing is blocked (#311)."
              echo "Migrate the packs before charter releases the change, or raise it on the charter pull request that made it."
              echo
              echo "Run: $RUN_URL (pack-check report artifact: \`charter-pack-check-report\`)."
              echo
              scripts/ci/charter_track_report.sh "$GITHUB_RUN_ID" || echo "(the run's jobs could not be listed; see the run)"
              echo
              echo "Before migrating, check that the errors are charter's and not a fetch or build that failed;"
              echo "re-running the failed jobs of the run settles that."
            } > "$body"
          fi
          {
            echo
            echo "Every red nightly run rewrites this description; a comment marks each change of title. The next green"
            echo "run closes it. Report only: this issue blocks nothing, and the release track keeps its own"
            echo "\`charter:release-red\` issue."
            echo
            echo "---"
            echo "_Opened by \`.github/workflows/charter-track.yml\`._"
          } >> "$body"
          if [[ -z "$issue" ]]; then
            gh issue create --repo "$REPO" --label "$label" --title "$title" --body-file "$body"
            exit 0
          fi
          old_title="$(gh issue view "$issue" --repo "$REPO" --json title --jq .title)"
          gh issue edit "$issue" --repo "$REPO" --title "$title" --body-file "$body"
          if [[ "$old_title" != "$title" ]]; then
            gh issue comment "$issue" --repo "$REPO" --body "Now: $title. $RUN_URL"
          fi
