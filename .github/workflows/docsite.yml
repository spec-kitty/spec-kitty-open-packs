# DocKitty docsite: build on every pull request, deploy to GitHub Pages from main.
#
# Mirrors spec-kitty/doc-kitty's deploy.yml: actions pinned by commit SHA,
# least-privilege Pages/OIDC permissions only on the deploy job, one Pages
# publish at a time and never cancel an in-flight publish. PRs (including fork
# PRs) only run the read-only build job; the deploy job runs on main only.
#
# Decision: docs/architecture/adr/2026-10-10-5-dockitty-docsite.md
#
# The build installs @spec-kitty/doc-toolkit@^0.1.1 from GitHub Packages
# (npm.pkg.github.com; doc-kitty#108), authenticated with the workflow's
# GITHUB_TOKEN. The package must grant this repository read access
# (package settings -> Manage Actions access).
# No pnpm-lock.yaml is committed yet: generating one needs a read:packages
# token. Once it is committed, switch the install to `--frozen-lockfile`
# (plus `cache: pnpm` below).
name: Docsite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docsite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The pack reference must match packs/ before anything is built or deployed.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pack reference is up to date (generator --check)
        run: |
          pip install "pyyaml==6.0.3"
          python scripts/docs/generate_pack_reference.py --check

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@spec-kitty"

      - name: Enable corepack (pnpm from package.json "packageManager")
        run: corepack enable

      - name: Install dependencies
        # TODO: commit pnpm-lock.yaml (needs a read:packages token) and use --frozen-lockfile.
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate frontmatter (DocKitty contract)
        run: pnpm docs:validate

      - name: Check source links and related refs
        run: pnpm docs:links

      - name: Build the site
        run: pnpm build

      - name: Check built links (base-aware)
        run: pnpm docs:built-links

      # Defence in depth for pack-sourced text (the generator escapes it): no
      # built page may carry a script-scheme link.
      - name: "No javascript:/data: links in the built site"
        run: |
          if grep -rIlE 'href="(javascript|vbscript|data):' dist; then
            echo "::error::script-scheme href found in dist (see files above)"; exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Least privilege for Pages publishing via OIDC — only on this job.
    permissions:
      contents: read
      pages: write
      id-token: write
    # One Pages publish at a time; never cancel an in-progress publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables Pages (source: GitHub Actions) if it is not on yet. If the token
      # may not change repo settings, this step fails and a repo admin must set
      # Settings → Pages → Source = "GitHub Actions" once.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
