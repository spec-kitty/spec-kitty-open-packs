name: Validate packs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Charter Pack validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A pinned spec-kitty/spec-kitty commit with the 4.x Charter Pack cutover
        # (#3732). The 4.0.0rc6 wheel on PyPI predates `charter pack validate` and
        # `doctor charter-packs`; switch to a PyPI pin once a release ships them.
        # Bump deliberately; never float to a branch.
        #
        # 83ca247ebc (core main) succeeds c3fc8aa349 (#6048/#6046), which added the
        # `pack_level` PackDescriptor field the re-seeded built-in pack now carries;
        # the prior pin 3b7c6dde (pre-pack_level rc7) rejected it as an extra input.
        spec-kitty: ["83ca247ebc0d06b3e11010840a7a99510b5a1b58"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install spec-kitty-cli
        run: pip install "spec-kitty-cli @ git+https://github.com/spec-kitty/spec-kitty@${{ matrix.spec-kitty }}"
      - name: Validate packs
        run: scripts/ci/validate-packs.sh
      - name: Check the built-in pack
        run: scripts/ci/check-built-in.sh

  # Fixed-name gate so branch protection can require ONE stable check that does not
  # move when the spec-kitty matrix pin is bumped. Require "Validate packs gate" as
  # the protected status check, never a matrix leg like
  # "Charter Pack validation (<pin>)", whose name changes with the pin.
  gate:
    name: Validate packs gate
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation leg to have passed
        run: |
          result='${{ needs.validate.result }}'
          if [[ "$result" != "success" ]]; then
            echo "::error::Charter Pack validation did not succeed (result: $result)"
            exit 1
          fi
          echo "All Charter Pack validation legs passed."
