name: Validate packs

# "Validate packs gate" is the one required check on main (docs/guides/contributing.md,
# ADR 2026-11-01-1). It reports on every event below, so a pull request never waits for a check that
# does not start. Nothing here reads a pull-request-only payload field without first checking that
# the event is a pull request.
#
# `pr:pause-ci`: a maintainer labels a parked pull request to stop its CI during a pile-up. Adding
# the label cancels the running check. While it is on, validation is skipped and the gate FAILS, so
# a paused pull request never reads as green. Removing it runs CI again. The label is read on pull
# requests only: main and a release carry no labels, so they are never paused. A change to any other
# label re-runs validation in a concurrency group of its own, so it never cancels a real run.

on:
  pull_request:
    # The default three, plus the label events the pause guard needs.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the same gates before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Pull requests: one group per PR, and a newer run cancels the older one. Adding or removing
  # pr:pause-ci joins that group, so pausing cancels the running check. Any other label's event gets
  # a `label-` group, so it neither cancels a real run nor displaces one waiting.
  # Every other run (a push to main, a release's call, a dispatch) has a group of its own (its run
  # id): main runs never cancel each other, and none waits behind another.
  group: >-
    validate-packs-${{ github.event_name == 'pull_request'
    && format('{0}pr-{1}',
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'pr:pause-ci' && 'label-' || '',
    github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Charter Pack validation
    # Skipped on a paused pull request; the gate then fails.
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr:pause-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the validator and scanner dependencies
        run: pip install "pyyaml==6.0.3" "jsonschema==4.26.0" "tree-sitter==0.25.2" "tree-sitter-java==0.23.5"
      # Packs validate against the spec-kitty-charter pack schemas, pinned by commit in
      # charter.lock.yaml, not against the spec-kitty core CLI. This is the fast per-pack pre-check;
      # the Charter service validation job asks the charter service itself.
      # Every step below runs even when an earlier one failed, so one run reports all
      # of the red; the job is red when any of them is.
      - name: Validate packs against the charter schemas
        run: scripts/ci/validate-packs.sh
      - name: Check every pack's recorded digest
        if: ${{ !cancelled() }}
        run: scripts/ci/check-pack-digests.sh
      - name: Vocabulary guard
        if: ${{ !cancelled() }}
        # Retired doctrine ids, the renamed `merge` command and the retired governing
        # glossary surface stay out of every pack. Core runs the same rules after a
        # pin bump (spec-kitty/spec-kitty#6553); this catches them first.
        run: python3 scripts/ci/check_vocabulary.py
      - name: Generated pack pages are up to date
        if: ${{ !cancelled() }}
        # Two pack changes that each re-seed docs/packs/ can drift once combined; this catches it on
        # the push to main. docs-site.yml runs the same check, path-filtered.
        run: python3 scripts/docs/gen_pack_reference.py --check
      - name: Release tooling tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/release
      - name: Vocabulary guard tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/vocabulary
      - name: Pack validator tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/ci
      - name: Pack page generator tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/docs
      - name: Test-quality scanner tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests/assets

  # The charter service is the authority on composition and on whole-pack registration (charter
  # ADR-0070): this job starts it at the commit pinned in charter.lock.yaml and asks it to compose every
  # pack, register every org and project pack, and refuse every invalid fixture with the code its
  # expected-code file names. It also runs the charter's whole-pack round trip (driftTest) over every
  # pack from the same pinned source (#252). The per-pack schema pass above stays as the fast pre-check.
  charter-service:
    name: Charter service validation
    # Skipped on a paused pull request; the gate then fails.
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr:pause-ci')) }}
    runs-on: ubuntu-latest
    # The service build and the round trip share one Gradle build of the pinned source.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Fails closed unless the pin is a full commit (never a branch) and a release pin has its digest.
      - name: Read the charter pin
        id: pin
        run: |
          set -euo pipefail
          commit="$(python3 scripts/ci/charter_lock.py commit)"
          release_tag="$(python3 scripts/ci/charter_lock.py release_tag)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      # The file_not_held policy classifies each file a registration leaves out with the schema validator's
      # mirror of the pinned contract (one allowlist for both gates), so this job needs its two dependencies.
      - name: Install the schema validator's dependencies
        # Wheels only, so no setup script runs (a block scalar: `:all:` is not plain-scalar safe).
        run: |
          pip install --only-binary :all: "pyyaml==6.0.3" "jsonschema==4.26.0"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      # The round trip below always runs from the pinned source, so Gradle is set up for a release pin too.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # A release jar (checked against jar_sha256) when the pin names a service-v* release, else the
      # pinned commit built with ./gradlew :deployable:bootJar. The same script runs on a developer machine.
      - name: Obtain the charter service
        id: service
        run: |
          set -euo pipefail
          jar="$(scripts/ci/charter_service_jar.sh "$RUNNER_TEMP/charter-service")"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
      # The charter's whole-pack round trip over every pack, built-in-level ones included (#252; charter ADR-0070
      # decision 4, amended 2026-11-13): load, write back, compare by meaning. It refuses a pack-manifest.yaml whose
      # lists differ from the derived ones (manifest_membership), which no registration sees for a built-in-level pack.
      - name: Round-trip every pack through the charter (driftTest)
        id: drift
        if: ${{ !cancelled() }}
        run: scripts/ci/charter_drift_test.sh "$RUNNER_TEMP/charter-service"
      - name: Upload the round-trip report
        if: ${{ always() && steps.drift.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charter-drift-test-report
          path: ${{ runner.temp }}/charter-service/spec-kitty-charter/service/packs/build/reports/tests/driftTest
          if-no-files-found: warn
          retention-days: 14
      - name: Compose, register and refuse through the charter service
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        env:
          SERVICE_JAR: ${{ steps.service.outputs.jar }}
        run: python3 scripts/ci/charter_service_check.py --jar "$SERVICE_JAR"

  # Fixed-name gate so branch protection can require ONE stable check. Require
  # "Validate packs gate" as the protected status check.
  gate:
    name: Validate packs gate
    needs: [validate, charter-service]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The pause check reads the pull request's labels as they are now. release.yml, which calls
      # this workflow, grants the same.
      pull-requests: read
    steps:
      - name: Not paused by pr:pause-ci
        # Pull requests only. The labels are read as they are now, not from this run's payload: a run
        # that started before the label was added (another label's run, or a re-run of an old run)
        # must not post a green gate on a paused pull request.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if labels="$(gh api --paginate "repos/$REPO/issues/$NUMBER/labels" --jq '.[].name')"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::cannot read the pull request's labels; failing closed"
              exit 1
            fi
            sleep 5
          done
          if grep -Fxqi 'pr:pause-ci' <<< "$labels"; then
            echo "::error::CI is paused by the pr:pause-ci label; remove the label to run it. A paused pull request does not pass the gate."
            exit 1
          fi
      - name: Require the validation jobs to have passed
        env:
          EVENT: ${{ github.event_name }}
          VALIDATE: ${{ needs.validate.result }}
          CHARTER_SERVICE: ${{ needs.charter-service.result }}
        run: |
          failed=0
          for entry in "Charter Pack validation=$VALIDATE" "Charter service validation=$CHARTER_SERVICE"; do
            job="${entry%=*}"
            result="${entry##*=}"
            if [[ "$result" == "skipped" && "$EVENT" == "pull_request" ]]; then
              # The payload said paused, but the label is gone now (the step above passed).
              echo "::error::$job was skipped because this run started while pr:pause-ci was on; push, or re-run the newest run, for a verdict"
              failed=1
            elif [[ "$result" != "success" ]]; then
              echo "::error::$job did not succeed (result: $result)"
              failed=1
            fi
          done
          if (( failed )); then exit 1; fi
          echo "Charter Pack validation and Charter service validation passed."
