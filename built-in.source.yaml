# Provenance of built-in/ (spec-kitty-open-packs#31, core ADR 2026-08-16-2 Option B).
#
# built-in/ is the Spec Kitty consumer built-in pack, seeded byte-identical from core
# `packs/built-in/` at the commit below. Core's release vendors it back from a pinned
# commit of this repository (spec-kitty/spec-kitty#3504).
#
# Transition rule: until the authoring flip is ruled on, core is still where
# built-in content is edited. Re-seed from core; do not edit built-in/ here, or the
# two copies diverge. scripts/ci/check-built-in.sh enforces the digest below.
#
# DELIBERATE LOCAL PATCH (see local_patches below): built-in/ now carries a fix
# that is NOT YET in the seeded-from core commit, so the tree is no longer
# byte-identical to core. The digest below has been recomputed over the patched
# tree so check-built-in.sh passes. This is an intentional divergence from the
# transition rule above, pending a core-side fix + re-seed; a reviewer must decide
# whether to keep it here or redirect the fix to core first.
seeded_from:
  repository: https://github.com/spec-kitty/spec-kitty
  path: packs/built-in
  commit: 83ca247ebc0d06b3e11010840a7a99510b5a1b58
  date: '2026-10-17'
local_patches:
  - description: >
      Add the plan mission's four step contracts (plan-specify, plan-research,
      plan-plan, plan-review) under built-in/missions/built_in_step_contracts/.
      The seeded-from core commit ships the plan mission type but omits these
      contracts, so StepContractExecutor composition fails for every plan action
      ("No step contract found for mission/action plan/<action>"). Core lacks them
      too; the durable fix is core-side, after which this patch drops on re-seed.
    core_revendor: spec-kitty/spec-kitty#3504
# snapshot_sha256 from charter.offering.packs.pack_manifest over built-in/
# (every file except pack-manifest.yaml; length-prefixed path + size + bytes).
# Recomputed over the patched tree (see local_patches above).
tree_digest:
  algorithm: spec-kitty-snapshot-sha256
  value: fae0c298d0fb54882d41b0c859ea44fc380655d2dfb895570ac3cdcfa68adbcf
# The core versions this content is written against. Mission-step prompts name CLI
# commands, and step contracts bind to runtime code. It lives here, not in
# built-in/pack.yaml, because core's PackDescriptor schema forbids extra fields.
requires_core: '>=4.0.0rc7,<5'
