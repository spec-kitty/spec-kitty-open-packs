- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/6
  source_title: Fire-and-Forget Goroutine
  pack: go
  owner: styleguide:go-conventions
  home_pack: foundation
  id: unowned-asynchronous-work
  merged_into: null
  merge_reason: 'both: "swallows its rejection, and the caller continues as if the work had finished" / "nobody waiting for
    it … and its errors vanish"'
  title: Unowned Asynchronous Work
  description: Starting asynchronous work that nothing awaits or handles. Its failures vanish, it can outlive its caller,
    and the caller continues as if the work had finished.
  severity: severe
  severity_grounding: '"its errors vanish": failures go unseen, the guidance''s purpose is defeated -> severe; the javascript
    member says "swallows its rejection"'
  bad_example: "// go: Fire-and-Forget Goroutine\ngo sendAuditEvent(evt) // error ignored, may outlive the request\n\n// javascript:\
    \ Floating Promise\nfunction onSave(draft: Draft): void {\n  repository.save(draft);\n  notify('Saved');\n}"
  bad_example_source: bad_example of each member, verbatim, labelled by language
  good_example: "// go\n// Work that must outlive the request: context.WithoutCancel(ctx) (Go 1.21+), still owned and awaited.\n\
    g.Go(func() error { return sendAuditEvent(ctx, evt) })\n// ... later\nif err := g.Wait(); err != nil { /* handle */ }\n\
    \n// javascript\nasync function onSave(draft: Draft): Promise<void> {\n  await repository.save(draft);\n  notify('Saved');\n\
    }"
  title_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M)
  description_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M), from the members' shared claim
  operator_question: null
