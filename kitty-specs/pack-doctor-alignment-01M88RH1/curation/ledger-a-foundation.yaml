- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/4
  source_title: Entity over a Wire Layout
  pack: java
  owner: styleguide:java-conventions
  home_pack: foundation
  id: storage-or-wire-format-on-domain-types
  merged_into: null
  merge_reason: 'both: "so a wire-format change silently changes business behaviour" / "ties the database schema, the domain
    model and the wire format together: a field added to one breaks the others"'
  title: Storage or Wire Format on Domain Types
  description: Binding a core domain type directly to a storage schema or a wire format, through serialization or ORM attributes
    or an entity mapped onto a fixed record layout, so a change to one format silently changes business behaviour or breaks
    the others.
  severity: breaking
  severity_grounding: '"a field added to one breaks the others": a wrong result -> breaking; the rust member says "a wire-format
    change silently changes business behaviour"'
  bad_example: "// java: Entity over a Wire Layout\n@Entity\n@Table(name = \"payment\")\npublic class PaymentRecord {    \
    \           // also parsed from a fixed-width import file\n    @Id @Column(length = 16) String reference;   // bytes 0-15,\
    \ space padded\n    @Column(length = 11) String amountCents;     // bytes 16-26, signed digits\n    @Column(length = 1)\
    \ char statusCode;         // byte 27\n}\n\n// rust: Storage Attributes on Domain Types\n#[derive(Serialize, Deserialize,\
    \ sqlx::FromRow)]\npub struct Account {\n    #[serde(default)] // a missing field now means 0 to the business rules\n\
    \    pub balance: i64,\n}"
  bad_example_source: bad_example of each member, verbatim, labelled by language
  good_example: "// java\nrecord PaymentLine(String reference, long amountCents, byte status) {}   // the layout, nothing\
    \ else\n\nfinal class PaymentLineCodec {\n    PaymentLine read(ByteBuffer line) { /* offsets, padding and sign handling\
    \ live here */ }\n    void write(PaymentLine payment, ByteBuffer out) { /* ... */ }\n}\n\nfinal class PaymentMapper {\
    \                       // PaymentStatus follows the fromByte pattern above\n    Payment toDomain(PaymentLine line) {\n\
    \        return new Payment(line.reference().strip(),\n                BigDecimal.valueOf(line.amountCents(), 2),\n  \
    \              PaymentStatus.fromByte(line.status()));\n    }\n\n    PaymentEntity toEntity(Payment payment) { /* field\
    \ by field, no layout knowledge */ }\n}\n\n@Entity\nclass PaymentEntity { @Id String reference; BigDecimal amount; @Enumerated(EnumType.STRING)\
    \ PaymentStatus status; }\n\n// rust\npub struct Account { balance: Money }          // domain\n\n#[derive(Deserialize)]\n\
    struct AccountRow { balance_minor: i64, currency: String } // adapter\n\nimpl TryFrom<AccountRow> for Account { /* validate\
    \ and convert */ }"
  title_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M)
  description_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M), from the members' shared claim
  operator_question: null
  merge_note: 'good_example: each member''s verbatim good_example, labelled by language. The java comment "PaymentStatus follows
    the fromByte pattern above" points at java-conventions text a foundation file does not carry; it stays verbatim, since
    no ruling allows an edit (review nit N3)'
