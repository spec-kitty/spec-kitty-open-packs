- source: procedures/post-merge-arch-gate-adjudication.procedure.yaml#/anti_patterns/1
  source_title: Comparing against the lane base instead of the mission base
  pack: foundation
  owner: procedure:post-merge-arch-gate-adjudication
  id: comparing-against-the-lane-base-instead-of-the-mission-base
  merged_into: null
  merge_reason: null
  title: Comparing against the lane base instead of the mission base
  description: In coord topology, lane bases are intermediate commits that may already include other lanes' changes. Comparing
    a failing test against the lane base (rather than the true mission base branch) gives an incorrect pre-existing verdict
    when the failure was in fact introduced by an earlier lane.
  severity: breaking
  severity_grounding: '"gives an incorrect pre-existing verdict": a wrong result -> breaking'
  bad_example: A lane-c test failure is judged pre-existing because it also fails on lane-c's base, a commit that already
    carries lane-a's breaking change.
  bad_example_source: authored, grounded in "Comparing a failing test against the lane base" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
