- source: styleguides/typescript-conventions.styleguide.yaml#/anti_patterns/1
  source_title: Non-Null Assertion as Error Handling
  pack: javascript
  owner: styleguide:typescript-conventions
  home_pack: foundation
  id: asserting-instead-of-handling-a-missing-or-invalid-value
  merged_into: null
  merge_reason: 'both: "tells the compiler a value exists without checking it; the crash moves to runtime" / "A malformed
    input becomes a crash instead of an error the caller can handle"'
  title: Asserting Instead of Handling a Missing or Invalid Value
  description: Telling the compiler or the runtime that a value exists or is valid without checking it, as a non-null assertion
    or an unwrap on input does. A missing or malformed value becomes a crash at runtime, far from its cause, instead of an
    error the caller can handle.
  severity: breaking
  severity_grounding: '"the crash moves to runtime, far from the cause": a crash is a wrong outcome -> breaking; the rust
    member says "A malformed input becomes a crash"'
  bad_example: '// javascript: Non-Null Assertion as Error Handling

    const user = users.find((u) => u.id === id)!;

    greet(user.name);


    // rust: unwrap on Input

    let port: u16 = std::env::var("PORT").unwrap().parse().unwrap();'
  bad_example_source: bad_example of each member, verbatim, labelled by language
  good_example: "// javascript\nconst user = users.find((u) => u.id === id);\nif (user === undefined) {\n  throw new Error(`Unknown\
    \ user: ${id}`);\n}\ngreet(user.name);\n\n// rust\nlet port: u16 = std::env::var(\"PORT\")\n    .context(\"PORT is not\
    \ set\")?\n    .parse()\n    .context(\"PORT is not a valid port number\")?;"
  title_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M)
  description_source: authored (decision 01M89PVM9PJBPPE46BSHQN1P0M), from the members' shared claim
  operator_question: null
