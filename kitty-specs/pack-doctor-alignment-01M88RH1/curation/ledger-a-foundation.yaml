  title: Hard-wiring the squad as a gate
  description: 'Turning the squad into a required mission gate instead of optional, charter- or memory-activated enrichment.
    Bad: a status transition blocked until squad evidence is present, e.g. a work package that cannot be claimed until a squad
    report is attached. Good: the squad runs at the point-cut as guidance and the work proceeds independently of the squad''s
    outcome. The squad enriches; it never blocks.'
  severity: severe
  severity_grounding: 'charter example-pack precedent: hard-wiring-the-squad-as-a-gate.anti-pattern.yaml severity severe (the
    practice, Bad and Good are the same; only the e.g. differs: charter "raise a StatusGateError", source "a squad report
    is attached")'
  bad_example: 'Block a status transition until squad evidence is present: raise a StatusGateError before a work package can
    be claimed.'
  bad_example_source: authored, grounded in "Turning the squad into a required mission gate instead of optional, charter-
    or memory-activated enrichment" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH); text from the charter example-pack precedent hard-wiring-the-squad-as-a-gate.anti-pattern.yaml
