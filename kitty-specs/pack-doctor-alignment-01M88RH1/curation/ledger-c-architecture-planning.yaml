  source_title: Embedding the workflow inside the agent profile
  pack: pack-authoring
  owner: procedure:onboard-external-agent-to-pack
  id: embedding-the-workflow-inside-the-agent-profile
  merged_into: null
  merge_reason: null
  title: Embedding the workflow inside the agent profile
  description: Pasting the agent's step-by-step operating instructions into the specialization block of the agent profile
