- source: procedures/legacy-codebase-triage.procedure.yaml#/anti_patterns/3
  source_title: Substituting triage for deeper investigation
  pack: planning-analysis
  owner: procedure:legacy-codebase-triage
  id: substituting-triage-for-deeper-investigation
  merged_into: null
  merge_reason: null
  title: Substituting triage for deeper investigation
  description: 'This procedure produces a first-pass evidence base. It is not the brownfield-investigation skill (issue #665/#666),
    is not a default gate on any mission, and does not replace event storming, context discovery, threat modelling, or full
    architecture review where those are warranted. Cite this triage as input to those activities; do not let it stand in for
    them.'
  severity: severe
  severity_grounding: '"do not let it stand in for them": a required deeper review is skipped -> severe'
  bad_example: A risky payments rewrite is approved on the strength of the triage alone, with no threat model or architecture
    review.
  bad_example_source: authored, grounded in "do not let it stand in for them" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
