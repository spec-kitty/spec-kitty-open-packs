- source: procedures/onboard-external-agent-to-pack.procedure.yaml#/anti_patterns/3
  source_title: Creating an agent profile by default
  pack: pack-authoring
  owner: procedure:onboard-external-agent-to-pack
  id: creating-an-agent-profile-by-default
  merged_into: null
  merge_reason: null
  title: Creating an agent profile by default
  description: Authoring a new agent profile for every onboarded agent without checking whether the behaviour is already covered
    by the extracted directives, tactics, and toolguides wired to an existing profile. New profiles add routing and maintenance
    surface; only create one when the agent is a distinct reusable role.
  severity: smell
  severity_grounding: '"New profiles add routing and maintenance surface": a cost -> smell'
  bad_example: Onboarding a lint-fixing agent creates `lint-larry.agent.yaml`, though the extracted toolguide and directives
    already attach to the existing implementer profile.
  bad_example_source: authored, grounded in "Authoring a new agent profile for every onboarded agent without checking whether
    the behaviour is already covered" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
- source: procedures/onboard-external-agent-to-pack.procedure.yaml#/anti_patterns/0
