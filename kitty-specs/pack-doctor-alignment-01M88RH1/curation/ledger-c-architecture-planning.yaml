- source: procedures/onboard-external-agent-to-pack.procedure.yaml#/anti_patterns/6
  source_title: Skipping the existing-artifact overlap audit
  pack: pack-authoring
  owner: procedure:onboard-external-agent-to-pack
  id: skipping-the-existing-artifact-overlap-audit
  merged_into: null
  merge_reason: null
  title: Skipping the existing-artifact overlap audit
  description: 'Id-only deduplication without a semantic read: declaring two artifacts non-overlapping because their ids and
    titles differ, without reading their intent or enforcement fields. Two directives with different ids can have identical
    enforcement targets — the duplicate creates governance noise and splits authority. Always read intent, scope, and enforcement
    before concluding no overlap exists.'
  severity: severe
  severity_grounding: '"the duplicate creates governance noise and splits authority": defeats single authority -> severe'
  bad_example: A new `REVIEW_SMALL_PRS` directive is added because no id or title matches, though `READABLE_CONSISTENT_PRS`
    already enforces the same size limit.
  bad_example_source: authored, grounded in "declaring two artifacts non-overlapping because their ids and titles differ"
    (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
