  source_title: Meta-tracker as canonical parent
  pack: planning-analysis
  owner: styleguide:planning-and-tracking
  id: meta-tracker-as-canonical-parent
  merged_into: null
  merge_reason: 'all: a release/go-no-go rollup as the canonical parent of work tickets — "Making a release/go-no-go/stabilization
    rollup the canonical parent of functional tickets" / "Making a release or go/no-go rollup the canonical parent of work
    tickets" / "Parenting under a meta-tracker" (internal#78 also names the body checklist; the operator ruled it into this
    cluster, decision 01M89PV9YNGP5YCABX4HJ8Y1MW)'
  title: Meta-tracker as canonical parent
  description: 'Making a release/go-no-go/stabilization rollup the canonical parent of functional tickets hides real ownership:
    the work appears tracked but its true functional home is unknown, and closing the release issue orphans everything beneath
    it. Release gating belongs in milestones or labels.'
  severity: severe
  severity_grounding: '"hides real ownership" and "closing the release issue orphans everything beneath it": the tracking
    fails its purpose -> severe'
  bad_example: '"3.2.0 release tracker" set as the native parent of a CLI bug and a

    runtime refactor.'
  bad_example_source: bad_example
  good_example: 'Bug parented under the CLI-UX functional epic; refactor under the

    runtime epic; both referenced from the release rollup by checklist, and

    the rollup titled `META-TRACKER: 3.2.0 release`.'
  operator_question: null
