- source: procedures/legacy-codebase-triage.procedure.yaml#/anti_patterns/1
  source_title: Skipping the exclusion list
  pack: planning-analysis
  owner: procedure:legacy-codebase-triage
  id: skipping-the-exclusion-list
  merged_into: null
  merge_reason: null
  title: Skipping the exclusion list
  description: Without the vanity-file exclusion list agreed in step 1, the churn and bug-hotspot tables will be dominated
    by lockfiles and generated bundles. Any triage that omits the exclusion list is invalid and must be re-run.
  severity: breaking
