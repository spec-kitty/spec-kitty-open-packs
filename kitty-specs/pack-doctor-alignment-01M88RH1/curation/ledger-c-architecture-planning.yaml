- source: procedures/onboard-external-agent-to-pack.procedure.yaml#/anti_patterns/5
  source_title: Leaving new project-tier artifacts unactivated
  pack: pack-authoring
  owner: procedure:onboard-external-agent-to-pack
  id: leaving-new-project-tier-artifacts-unactivated
  merged_into: null
  merge_reason: null
  title: Leaving new project-tier artifacts unactivated
  description: Authoring project-tier artifacts and validating them, but never running spec-kitty charter activate --cascade
    all. Validation passes, yet the project graph never gains the new nodes or edges, so the artifacts are not part of the
    active charter and no action loads them. Activate them, then confirm with spec-kitty charter list.
  severity: breaking
  severity_grounding: '"the artifacts are not part of the active charter and no action loads them": the work silently has
    no effect, a wrong result -> breaking'
  bad_example: Three new project-tier tactics pass validation and are committed, but `spec-kitty charter activate --cascade
    all` is never run, so no action ever loads them.
  bad_example_source: authored, grounded in "never running spec-kitty charter activate --cascade all" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
- source: procedures/onboard-external-agent-to-pack.procedure.yaml#/anti_patterns/1
  source_title: Lifting the whole prompt into a single artifact
  pack: pack-authoring
  owner: procedure:onboard-external-agent-to-pack
  id: lifting-the-whole-prompt-into-a-single-artifact
  merged_into: null
  merge_reason: null
  title: Lifting the whole prompt into a single artifact
  description: Copying an entire system prompt or rules file verbatim into one directive or one agent profile. A source agent
    almost always contains several distinct kinds of knowledge — rules, techniques, tool usage, and conventions. Decompose
    it into the correct artifact kinds so each piece is independently governable and reusable, rather than trapping everything
    in one opaque blob.
  severity: severe
  severity_grounding: '"rather than trapping everything in one opaque blob": no piece is independently governable, defeating
    the decomposition -> severe'
  bad_example: A vendor agent's whole system prompt becomes one directive, `DIRECTIVE_LEGACY_AGENT`, mixing rules, tool usage
    and naming conventions.
  bad_example_source: authored, grounded in "Copying an entire system prompt or rules file verbatim into one directive or
    one agent profile" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
