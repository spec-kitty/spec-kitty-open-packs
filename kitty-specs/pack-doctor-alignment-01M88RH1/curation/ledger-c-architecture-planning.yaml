  bad_example: The churn table's top ten files are package-lock.json and generated bundles, because no exclusion list was
    agreed in step 1.
  bad_example_source: authored, grounded in "Without the vanity-file exclusion list agreed in step 1" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
