- source: procedures/legacy-codebase-triage.procedure.yaml#/anti_patterns/4
  source_title: Over-reading squash-merged history
  pack: planning-analysis
  owner: procedure:legacy-codebase-triage
  id: over-reading-squash-merged-history
  merged_into: null
  merge_reason: null
  title: Over-reading squash-merged history
  description: Repositories that squash every PR collapse multi-commit work into single events; the audit recipes will undercount
    activity. The triage must note the merge strategy and corroborate with PR metadata or issue-tracker data before drawing
    strong conclusions.
  severity: severe
  severity_grounding: '"the audit recipes will undercount activity": conclusions rest on undercounted data unless corroborated
    -> severe'
  bad_example: The triage reports one commit by the payments team in a quarter, from a repository that squashes every PR,
    without checking the PR count.
  bad_example_source: authored, grounded in "the audit recipes will undercount activity" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
