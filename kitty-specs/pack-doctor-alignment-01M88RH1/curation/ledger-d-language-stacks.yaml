- source: styleguides/drupal-security-performance.styleguide.yaml#/anti_patterns/4
  source_title: Credentials Out Of Version Control
  pack: drupal
  owner: styleguide:drupal-security-performance
  id: credentials-in-version-control
  merged_into: null
  merge_reason: null
  title: Credentials in Version Control
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Credentials Out Of
    Version Control"'
  description: A database password committed to `settings.php` is compromised the moment it lands in a commit, even in a private
    repository -- and deleting it in a later commit does not fix that, because git history retains every prior version of
    the file. Removal is cleanup, not remediation; the only remediation is rotating the credential. Keep secrets out of version
    control from the start.
  severity: breaking
  severity_grounding: '"is compromised the moment it lands in a commit": a security breach -> breaking'
  bad_example: "<?php\n// settings.php, committed to the repository\n$databases['default']['default'] = [\n  'database' =>\
    \ 'drupal',\n  'username' => 'drupal_user',\n  'password' => 'Sup3rSecret!',\n  'host' => 'db',\n];"
  bad_example_source: bad_example
  good_example: "<?php\n// settings.php, committed -- reads from the environment, no secret in git\n$databases['default']['default']\
    \ = [\n  'database' => getenv('DB_NAME'),\n  'username' => getenv('DB_USER'),\n  'password' => getenv('DB_PASSWORD'),\n\
    \  'host' => getenv('DB_HOST'),\n];\n// settings.local.php supplies real local values and is excluded via\n// .gitignore\
    \ -- it is never committed."
  operator_question: null
- source: styleguides/drupal-security-performance.styleguide.yaml#/anti_patterns/2
  source_title: Entity Query Access Check
  pack: drupal
  owner: styleguide:drupal-security-performance
  id: entity-query-without-an-explicit-access-check
  merged_into: null
  merge_reason: null
  title: Entity Query Without an Explicit Access Check
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Entity Query Access
    Check"'
  description: Implicit access checking on content entity queries was deprecated in Drupal 9.2.0 and throws an error from
    Drupal 10.0.0 -- on any supported Drupal (10/11) an entity query without an explicit `accessCheck()` fails outright, so
    this is a correctness requirement, not a lint. `accessCheck(FALSE)` remains legitimate for genuinely internal, non-user-facing
    queries (a cron sweep that must see every entity regardless of permissions) but must be explicit and commented, never
    the default because nobody set it. See drupal-conventions' Entity Query pattern for the injected-service shape this call
    sits inside; this entry owns only the access-check argument.
  severity: breaking
  severity_grounding: '"an entity query without an explicit `accessCheck()` fails outright, so this is a correctness requirement,
    not a lint": a failure -> breaking'
  bad_example: "<?php\n$nids = $this->entityTypeManager->getStorage('node')\n  ->getQuery()\n  ->condition('status', 1)\n\
    \  ->execute();"
  bad_example_source: bad_example
  good_example: "<?php\n$nids = $this->entityTypeManager->getStorage('node')\n  ->getQuery()\n  ->condition('status', 1)\n\
    \  ->accessCheck(TRUE)\n  ->execute();\n// Cron-only sweep: no user session to check against, so bypassing\n// access\
    \ control is deliberate and documented, not an oversight.\n$all_nids = $this->entityTypeManager->getStorage('node')\n\
    \  ->getQuery()\n  ->accessCheck(FALSE)\n  ->execute();"
  operator_question: null
- source: styleguides/drupal-conventions.styleguide.yaml#/anti_patterns/1
