- source: styleguides/python-conventions.styleguide.yaml#/anti_patterns/4
  source_title: Cleanup In Test Body
  pack: python
  owner: styleguide:python-conventions
  id: cleanup-in-test-body
  merged_into: null
  merge_reason: null
  title: Cleanup In Test Body
  description: Manual teardown at end of test instead of using pytest fixtures with yield or tmp_path. Cleanup is skipped
    on failure.
  severity: severe
  severity_grounding: '"Cleanup is skipped on failure.": state leaks past a failing test, defeating isolation -> severe'
  bad_example: "def test_write_output():\n    out = Path(\"/tmp/test_output.yaml\")\n    write_output(out, {\"key\": \"value\"\
    })\n    assert out.exists()\n    out.unlink()  # skipped if assertion fails"
  bad_example_source: bad_example
  good_example: "def test_write_output(tmp_path):\n    out = tmp_path / \"test_output.yaml\"\n    write_output(out, {\"key\"\
    : \"value\"})\n    assert out.exists()\n    # tmp_path fixture handles cleanup automatically"
  operator_question: null
- source: styleguides/python-conventions.styleguide.yaml#/anti_patterns/0
  source_title: Nested Conditional Logic
  pack: python
  owner: styleguide:python-conventions
  id: nested-conditional-logic
  merged_into: null
  merge_reason: null
  title: Nested Conditional Logic
  description: Deep if/else nesting instead of early-return guard clauses. Increases cognitive load and hides the happy path.
  severity: smell
