    Raw SQL"'
  description: Prefer Entity Query over hand-written SQL. Explicit accessCheck() is mandatory — implicit access checking throws
    an error from Drupal 10.0.0. See drupal-security-performance for the full treatment.
  severity: severe
  severity_grounding: states the preference ("Prefer Entity Query over hand-written SQL") but no outcome for raw SQL itself
    -> severe (operator ruling 2026-11-25, decision 01M8A2M3P2KMF8Y29QB82EHCMR)
  bad_example: $nids = db_query('SELECT nid FROM {node} WHERE status = 1')->fetchCol();
  bad_example_source: bad_example
  good_example: "$nids = $this->entityTypeManager->getStorage('node')->getQuery()\n  ->condition('status', 1)\n  ->accessCheck(TRUE)\n\
    \  ->execute();"
  operator_question: null
