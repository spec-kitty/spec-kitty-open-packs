- source: styleguides/typescript-conventions.styleguide.yaml#/anti_patterns/4
  source_title: Leaked Subscription
  pack: javascript
  owner: styleguide:typescript-conventions
  id: leaked-subscription
  merged_into: null
  merge_reason: null
  title: Leaked Subscription
  description: A subscription with no owner keeps running after its component or service is gone, causing leaks and duplicate
    side effects.
  severity: severe
  severity_grounding: '"keeps running after its component or service is gone, causing leaks and duplicate side effects": unowned
    work misbehaves -> severe'
  bad_example: "ngOnInit(): void {\n  this.ticks$.subscribe((tick) => {\n    this.refresh(tick);\n  });\n}"
  bad_example_source: bad_example
  good_example: "ngOnInit(): void {\n  this.ticks$.pipe(takeUntil(this.destroyed$)).subscribe((tick) => {\n    this.refresh(tick);\n\
    \  });\n}"
  operator_question: null
- source: styleguides/html-conventions.styleguide.yaml#/anti_patterns/2
  source_title: Missing or Redundant Alt Text
