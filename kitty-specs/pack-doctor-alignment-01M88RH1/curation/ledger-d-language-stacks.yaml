  bad_example: "def process(path: Path) -> dict:\n    if path.exists():\n        if path.is_file():\n            with open(path)\
    \ as f:\n                return yaml.safe_load(f)\n        else:\n            raise ValueError(\"Not a file\")\n    else:\n\
    \        raise FileNotFoundError(str(path))"
  bad_example_source: bad_example
  good_example: "def process(path: Path) -> dict:\n    if not path.exists():\n        raise FileNotFoundError(str(path))\n\
    \    if not path.is_file():\n        raise ValueError(f\"Not a file: {path}\")\n    with open(path) as f:\n        return\
    \ yaml.safe_load(f)"
