- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/8
  source_title: Backward goto and Fall-through Flow
  pack: go
  owner: styleguide:go-conventions
  id: backward-goto-and-fall-through-flow
  merged_into: null
  merge_reason: null
  title: Backward goto and Fall-through Flow
  description: Using goto to jump backwards or to emulate a sequence of fall-through steps. The control flow cannot be read
    top to bottom, and a step cannot be tested on its own.
  severity: smell
  severity_grounding: '"The control flow cannot be read top to bottom, and a step cannot be tested on its own.": a cost ->
    smell'
  bad_example: "step1:\n    if !validate(r) {\n        goto step3\n    }\n    enrich(r)\nstep3:\n    if retry {\n        goto\
    \ step1\n    }"
  bad_example_source: bad_example
  good_example: "var lastErr error\nfor attempt := 0; attempt < maxAttempts; attempt++ {\n    if err := validate(r); err !=\
    \ nil {\n        return fmt.Errorf(\"validate: %w\", err)\n    }\n    if lastErr = enrich(ctx, r); lastErr == nil {\n\
    \        return nil\n    }\n}\nreturn fmt.Errorf(\"enrich after %d attempts: %w\", maxAttempts, errors.Join(ErrRetriesExhausted,\
    \ lastErr))"
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/5
  source_title: Context Stored in a Struct
  pack: go
  owner: styleguide:go-conventions
  id: context-stored-in-a-struct
  merged_into: null
  merge_reason: null
  title: Context Stored in a Struct
  description: Keeping a context.Context in a struct field. Its lifetime no longer matches a call, so cancellation reaches
    the wrong work or none at all.
  severity: breaking
  severity_grounding: '"cancellation reaches the wrong work or none at all": a wrong result -> breaking'
  bad_example: "type Worker struct {\n    ctx context.Context\n}"
  bad_example_source: bad_example
  good_example: 'type Worker struct{ /* dependencies only */ }


    func (w *Worker) Run(ctx context.Context) error { /* ... */ }'
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/9
  source_title: Copying a Struct with a Mutex
  pack: go
  owner: styleguide:go-conventions
  id: copying-a-struct-with-a-mutex
  merged_into: null
  merge_reason: null
  title: Copying a Struct with a Mutex
  description: Passing or returning a struct that contains a sync.Mutex by value. The copy has its own lock, so the original
    fields are no longer protected. go vet's copylocks check reports it.
  severity: breaking
  severity_grounding: '"the original fields are no longer protected": a data race, a wrong result -> breaking'
  bad_example: "type Counter struct {\n    mu sync.Mutex\n    n  int\n}\nfunc (c Counter) Inc() { c.mu.Lock(); c.n++; c.mu.Unlock()\
    \ } // value receiver"
  bad_example_source: bad_example
  good_example: "func (c *Counter) Inc() {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.n++\n}"
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/2
  source_title: Error String Matching
  pack: go
  owner: styleguide:go-conventions
  id: error-string-matching
  merged_into: null
  merge_reason: null
  title: Error String Matching
  description: Deciding on an error by comparing or searching its message. Messages change, wrapping changes them, and the
    check silently stops matching.
  severity: breaking
  severity_grounding: '"the check silently stops matching": a wrong result, silently -> breaking'
  bad_example: if err != nil && err.Error() == "record not found" { /* ... */ }
  bad_example_source: bad_example
  good_example: if errors.Is(err, ErrNotFound) { /* ... */ }
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/4
  source_title: Package-level Mutable Globals
  pack: go
  owner: styleguide:go-conventions
  id: package-level-mutable-globals
  merged_into: null
  merge_reason: null
  title: Package-level Mutable Globals
  description: Holding connections, configuration or caches in package variables set from init() or main. Tests interfere
    with each other, and dependencies are invisible in function signatures.
  severity: severe
  severity_grounding: '"Tests interfere with each other, and dependencies are invisible in function signatures": defeats isolation
    -> severe'
  bad_example: "var db *sql.DB\n\nfunc init() {\n    db, _ = sql.Open(\"pgx\", os.Getenv(\"DATABASE_URL\"))\n}"
  bad_example_source: bad_example
  good_example: 'type Store struct{ db *sql.DB }


    func NewStore(db *sql.DB) *Store { return &Store{db: db} }'
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/7
  source_title: Producer-side Interface
  pack: go
  owner: styleguide:go-conventions
  id: producer-side-interface
  merged_into: null
  merge_reason: null
  title: Producer-side Interface
  description: A package exporting an interface next to its only implementation, mirroring every method. Consumers depend
    on more than they use, and the interface changes with each new method.
  severity: smell
  severity_grounding: '"Consumers depend on more than they use, and the interface changes with each new method": a cost ->
    smell'
  bad_example: 'package store

    type Store interface { Get(...); Put(...); Delete(...); List(...); Migrate(...) }

    type PGStore struct{ /* ... */ }'
  bad_example_source: bad_example
  good_example: "package billing\n// Only what billing calls.\ntype accountGetter interface {\n    Get(ctx context.Context,\
    \ id AccountID) (*Account, error)\n}"
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/3
  source_title: Typed nil Error
  pack: go
  owner: styleguide:go-conventions
  id: typed-nil-error
  merged_into: null
  merge_reason: null
  title: Typed nil Error
  description: Returning a nil pointer of a concrete error type as an error. The interface holds a type and a nil value, so
    err != nil is true and callers see a failure that never happened. go vet does not catch it.
  severity: breaking
  severity_grounding: '"callers see a failure that never happened": a wrong result -> breaking'
  bad_example: "func validate(o Order) error {\n    var verr *ValidationError // nil\n    if o.Qty <= 0 {\n        verr =\
    \ &ValidationError{Field: \"qty\"}\n    }\n    return verr // non-nil error even when the order is valid\n}"
  bad_example_source: bad_example
  good_example: "func validate(o Order) error {\n    if o.Qty <= 0 {\n        return &ValidationError{Field: \"qty\"}\n  \
    \  }\n    return nil\n}"
  operator_question: null
- source: styleguides/go-conventions.styleguide.yaml#/anti_patterns/1
  source_title: Unchecked Conversion into a Typed Set
  pack: go
  owner: styleguide:go-conventions
  id: unchecked-conversion-into-a-typed-set
  merged_into: null
  merge_reason: null
  title: Unchecked Conversion into a Typed Set
  description: Converting outside input straight into a named type, as in Status(n), which accepts any value of the underlying
    type and lets unknown codes flow through the system.
  severity: severe
  severity_grounding: '"accepts any value of the underlying type and lets unknown codes flow through the system": invalid
    states pass unchecked -> severe'
  bad_example: status := Status(req.StatusCode) // any uint8, e.g. 42, is now a "Status"
  bad_example_source: bad_example
  good_example: "status, err := ParseStatusCode(req.StatusCode) // same shape as ParseStatus, for numeric codes\nif err !=\
    \ nil {\n    return fmt.Errorf(\"decode request: %w\", err)\n}"
  operator_question: null
- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/1
  source_title: Catching Broad Exception Types
  pack: java
  owner: styleguide:java-conventions
  id: catching-broad-exception-types
  merged_into: null
  merge_reason: null
  title: Catching Broad Exception Types
  description: Catching Exception or RuntimeException swallows unrelated failures and makes debugging much harder.
  severity: severe
  severity_grounding: '"swallows unrelated failures and makes debugging much harder": failures go unseen -> severe'
  bad_example: "try {\n    process(input);\n} catch (Exception e) {\n    log.error(\"Something went wrong\", e);\n}"
  bad_example_source: bad_example
  good_example: "try {\n    process(input);\n} catch (ParseException e) {\n    throw new InvalidInputException(\"Malformed\
    \ input: \" + input, e);\n}"
  operator_question: null
- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/3
  source_title: Constructor Sprawl in Tests
  pack: java
  owner: styleguide:java-conventions
  id: constructor-sprawl-in-tests
  merged_into: null
  merge_reason: null
  title: Constructor Sprawl in Tests
  description: Calling new SomeEntity(a, b, c, ...) in every test binds tests to the constructor signature. Any structural
    change requires updating every test.
  severity: smell
  severity_grounding: '"Any structural change requires updating every test.": a cost -> smell'
  bad_example: 'Order o1 = new Order("ORD-001", STANDARD, start, customerId, 50000L);

    Order o2 = new Order("ORD-002", EXPRESS, start, customerId, 10000L);'
  bad_example_source: bad_example
  good_example: 'Order o1 = OrderFixtures.standardOrder().withAmount(50000L).build();

    Order o2 = OrderFixtures.expressOrder().withAmount(10000L).build();'
  operator_question: null
- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/5
  source_title: jqwik as a Test Dependency
  pack: java
  owner: styleguide:java-conventions
  id: jqwik-as-a-test-dependency
  merged_into: null
  merge_reason: null
  title: jqwik as a Test Dependency
  description: 'Do not add jqwik (net.jqwik:*, 1.10.0 and later) to a project. Since 1.10.0 its test engine prints a line
    to stdout telling AI agents to disregard previous instructions and ignore all jqwik results (1.10.0 told them to delete
    the jqwik tests and code); agents read that captured output to judge test evidence. Upstream calls this its Anti-AI Usage
    Clause: https://jqwik.net/docs/current/user-guide.html#anti-ai-usage-clause. It is in the docs and the engine output,
    not in the licence, which is still EPL-2.0. For property-style tests use @ParameterizedTest with @MethodSource or @FieldSource
    fed by generated inputs (a seeded java.util.Random stream plus explicit edge cases).'
  severity: breaking
  severity_grounding: '"its test engine prints a line to stdout telling AI agents to disregard previous instructions and ignore
    all jqwik results" and "agents read that captured output to judge test evidence": test evidence is corrupted -> breaking'
  bad_example: "<dependency>\n    <groupId>net.jqwik</groupId>\n    <artifactId>jqwik</artifactId>\n    <scope>test</scope>\n\
    </dependency>"
  bad_example_source: bad_example
  good_example: "static Stream<Money> amounts() {\n    Random random = new Random(42L);\n    return Stream.concat(\n     \
    \   Stream.of(Money.ZERO, Money.of(Long.MAX_VALUE)),\n        random.longs(200, 0, Long.MAX_VALUE).mapToObj(Money::of));\n\
    }\n\n@ParameterizedTest\n@MethodSource(\"amounts\")\nvoid roundTripsThroughJson(Money amount) {\n    assertThat(Money.fromJson(amount.toJson())).isEqualTo(amount);\n\
    }"
  operator_question: null
- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/2
  source_title: Platform-Dependent Encoding
  pack: java
  owner: styleguide:java-conventions
  id: platform-dependent-encoding
  merged_into: null
  merge_reason: null
  title: Platform-Dependent Encoding
  description: Omitting an explicit Charset makes the application non-portable and produces silent data corruption on non-UTF-8
    platforms.
  severity: breaking
  severity_grounding: '"produces silent data corruption on non-UTF-8 platforms": a wrong result -> breaking'
  bad_example: Files.writeString(outputPath, content); // uses platform default
  bad_example_source: bad_example
  good_example: Files.writeString(outputPath, content, StandardCharsets.UTF_8);
  operator_question: null
- source: styleguides/java-conventions.styleguide.yaml#/anti_patterns/0
  source_title: Returning Null
  pack: java
  owner: styleguide:java-conventions
  id: returning-null
  merged_into: null
  merge_reason: null
  title: Returning Null
  description: Returning null from public methods forces all callers to add null checks, spreading defensive code across the
    codebase.
  severity: smell
  severity_grounding: '"spreading defensive code across the codebase": a cost -> smell'
  bad_example: "public Config load(Path path) {\n    if (!path.toFile().exists()) return null;\n    // ...\n}"
  bad_example_source: bad_example
  good_example: "public Optional<Config> load(Path path) {\n    if (!Files.exists(path)) return Optional.empty();\n    //\
    \ ...\n}"
  operator_question: null
- source: styleguides/typescript-conventions.styleguide.yaml#/anti_patterns/0
  source_title: Any Leakage
  pack: javascript
  owner: styleguide:typescript-conventions
  id: any-leakage
  merged_into: null
  merge_reason: null
  title: Any Leakage
  description: An `any` parameter or return type spreads unchecked values through every caller; the compiler stops catching
    interface drift.
  severity: severe
  severity_grounding: '"the compiler stops catching interface drift": defeats type checking -> severe'
  bad_example: "function total(items: any): any {\n  return items.reduce((sum: any, item: any) => sum + item.price, 0);\n}"
  bad_example_source: bad_example
  good_example: "function total(items: readonly LineItem[]): number {\n  return items.reduce((sum, item) => sum + item.price,\
    \ 0);\n}"
  operator_question: null
- source: styleguides/html-conventions.styleguide.yaml#/anti_patterns/3
  source_title: ARIA Overriding Native Semantics
  pack: javascript
  owner: styleguide:html-conventions
  id: aria-overriding-native-semantics
  merged_into: null
  merge_reason: null
  title: ARIA Overriding Native Semantics
  description: ARIA in HTML advises against restating an element's implicit role, and changing a heading into presentation
    removes it from the outline; the native element already carries the right role and behaviour.
  severity: severe
  severity_grounding: '"changing a heading into presentation removes it from the outline": an accessibility failure -> severe'
  bad_example: '<button role="button" aria-label="button">Save</button>

    <h2 role="presentation">Billing</h2>'
  bad_example_source: bad_example
  good_example: '<button type="button">Save</button>

    <h2>Billing</h2>'
  operator_question: null
- source: styleguides/css-conventions.styleguide.yaml#/anti_patterns/2
  source_title: Deprecated Media Types
  pack: javascript
  owner: styleguide:css-conventions
  id: deprecated-media-types
  merged_into: null
  merge_reason: null
  title: Deprecated Media Types
  description: '`handheld`, `tv` and `projection` are deprecated and should not be used; query the capability you care about
    instead.'
  severity: smell
  severity_grounding: states the rule ("are deprecated and should not be used") but no outcome -> smell (operator ruling 2026-11-25,
    decision 01M8A2M3P2KMF8Y29QB82EHCMR)
  bad_example: "@media handheld {\n  .menu {\n    font-size: 1.2em;\n  }\n}"
  bad_example_source: bad_example
  good_example: "@media (pointer: coarse) {\n  .menu a {\n    min-block-size: 2.75rem;\n  }\n}"
  operator_question: null
- source: styleguides/css-conventions.styleguide.yaml#/anti_patterns/0
  source_title: Desktop-First Overrides
  pack: javascript
  owner: styleguide:css-conventions
  id: desktop-first-overrides
  merged_into: null
  merge_reason: null
  title: Desktop-First Overrides
  description: Desktop styles undone by narrower queries make every small screen pay for the large layout and multiply overrides.
  severity: smell
  severity_grounding: '"make every small screen pay for the large layout and multiply overrides": a cost -> smell'
  bad_example: ".layout {\n  display: grid;\n  grid-template-columns: 300px 1fr;\n}\n\n@media (max-width: 768px) {\n  .layout\
    \ {\n    display: block;\n  }\n}"
  bad_example_source: bad_example
  good_example: ".layout {\n  display: block;\n}\n\n@media (width >= 48em) {\n  .layout {\n    display: grid;\n    grid-template-columns:\
    \ 18.75rem 1fr;\n  }\n}"
  operator_question: null
- source: styleguides/css-conventions.styleguide.yaml#/anti_patterns/1
  source_title: Device-Named Breakpoints
  pack: javascript
  owner: styleguide:css-conventions
  id: device-named-breakpoints
  merged_into: null
  merge_reason: null
  title: Device-Named Breakpoints
  description: Breakpoints aimed at particular devices go stale with every new screen size; there are far too many devices
    to target.
  severity: smell
  severity_grounding: '"go stale with every new screen size": a cost -> smell'
  bad_example: "/* iPhone */\n@media (min-width: 375px) and (max-width: 414px) {\n  .article {\n    columns: 1;\n  }\n}"
  bad_example_source: bad_example
  good_example: "/* Beyond this width the line length of .article exceeds about 75ch. */\n@media (width >= 52em) {\n  .article\
    \ {\n    columns: 2;\n  }\n}"
  operator_question: null
- source: styleguides/html-conventions.styleguide.yaml#/anti_patterns/0
  source_title: Div as Button
  pack: javascript
  owner: styleguide:html-conventions
  id: div-as-button
  merged_into: null
  merge_reason: null
  title: Div as Button
  description: A clickable `<div>` has no role, cannot be focused with the keyboard and does not respond to Enter or Space.
  severity: severe
  severity_grounding: '"cannot be focused with the keyboard and does not respond to Enter or Space": an accessibility failure
    -> severe'
  bad_example: <div class="btn" onclick="save()">Save</div>
  bad_example_source: bad_example
  good_example: <button type="submit" class="btn">Save</button>
