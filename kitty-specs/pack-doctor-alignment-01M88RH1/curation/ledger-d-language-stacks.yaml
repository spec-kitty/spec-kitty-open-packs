- source: styleguides/drupal-security-performance.styleguide.yaml#/anti_patterns/1
  source_title: Plain Text Over Markup
  pack: drupal
  owner: styleguide:drupal-security-performance
  id: markup-for-untrusted-text
  merged_into: null
  merge_reason: null
  title: Markup for Untrusted Text
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Plain Text Over Markup"'
  description: '`#markup` is XSS-filtered against the admin tag list (via `Renderer::ensureMarkupIsSafe`) rather than escaped,
    so it still permits a broad set of HTML tags and is the wrong choice for untrusted input -- it does not close the same
    hole Twig''s auto-escaping does. Use `#plain_text` for untrusted content, since it escapes; use `Html::escape()` when
    the value must be interpolated outside a render array.'
  severity: breaking
  severity_grounding: '"is the wrong choice for untrusted input -- it does not close the same hole Twig''s auto-escaping does":
    cross-site scripting stays open -> breaking'
  bad_example: "<?php\nfunction my_module_build_greeting(string $user_supplied_name): array {\n  return ['#markup' => 'Hello,\
    \ ' . $user_supplied_name . '!'];\n}"
  bad_example_source: bad_example
  good_example: "<?php\nfunction my_module_build_greeting(string $user_supplied_name): array {\n  return ['#plain_text' =>\
    \ 'Hello, ' . $user_supplied_name . '!'];\n}"
  operator_question: null
- source: styleguides/drupal-security-performance.styleguide.yaml#/anti_patterns/3
  source_title: Render Array Cacheability
  pack: drupal
  owner: styleguide:drupal-security-performance
  id: render-array-without-cache-metadata
  merged_into: null
  merge_reason: null
  title: Render Array Without Cache Metadata
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Render Array Cacheability"'
  description: A render array built from entity or query data with no `#cache` metadata either caches forever under an accidental
    key or never caches at all -- both produce stale or needlessly recomputed content. Declare `tags`, `contexts`, and `max-age`
    based on what the data actually depends on.
  severity: breaking
  severity_grounding: '"either caches forever under an accidental key or never caches at all -- both produce stale or needlessly
    recomputed content": stale content is a wrong result -> breaking'
  bad_example: '<?php

    $build = [''#theme'' => ''item_list'', ''#items'' => $items];'
  bad_example_source: bad_example
  good_example: "<?php\n$build = [\n  '#theme' => 'item_list',\n  '#items' => $items,\n  '#cache' => [\n    'tags' => ['node_list',\
    \ 'taxonomy_term:' . $categoryId],\n    'contexts' => ['url.query_args'],\n    'max-age' => 3600,\n  ],\n];"
  operator_question: null
