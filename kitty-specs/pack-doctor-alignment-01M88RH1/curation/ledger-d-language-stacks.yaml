- source: styleguides/css-conventions.styleguide.yaml#/anti_patterns/3
  source_title: Hover-Only Interaction
  pack: javascript
  owner: styleguide:css-conventions
  id: hover-only-interaction
  merged_into: null
  merge_reason: null
  title: Hover-Only Interaction
  description: Content revealed only on hover cannot be reached on touch screens; show interactive features by default and
    add hover effects only where hover exists.
  severity: severe
  severity_grounding: '"cannot be reached on touch screens": content is unreachable for those users -> severe'
  bad_example: ".card .actions {\n  display: none;\n}\n\n.card:hover .actions {\n  display: flex;\n}"
  bad_example_source: bad_example
  good_example: ".card .actions {\n  display: flex;\n}\n\n@media (hover: hover) {\n  .card:hover {\n    box-shadow: 0 0 0\
    \ 2px #06c;\n  }\n}"
  operator_question: null
- source: styleguides/html-conventions.styleguide.yaml#/anti_patterns/1
  source_title: Inline Style and Handlers
  pack: javascript
  owner: styleguide:html-conventions
  id: inline-style-and-handlers
  merged_into: null
  merge_reason: null
  title: Inline Style and Handlers
  description: Inline `style` and `on*` attributes mix presentation and behaviour into structure, so they cannot be reused
    or changed from the stylesheet or script that owns them.
  severity: smell
  severity_grounding: '"cannot be reused or changed from the stylesheet or script that owns them": a cost -> smell'
  bad_example: '<p style="color: red" onclick="dismiss(this)">Payment failed</p>'
  bad_example_source: bad_example
  good_example: <p class="alert alert-error" data-dismissible>Payment failed</p>
