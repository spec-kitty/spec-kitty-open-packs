- source: styleguides/html-conventions.styleguide.yaml#/anti_patterns/4
  source_title: Layout Table
  pack: javascript
  owner: styleguide:html-conventions
  id: layout-table
  merged_into: null
  merge_reason: null
  title: Layout Table
  description: A table used for page layout is announced as data, with rows and columns, and does not reflow on narrow screens.
  severity: severe
  severity_grounding: '"is announced as data, with rows and columns, and does not reflow on narrow screens": an accessibility
    failure -> severe'
  bad_example: <table><tr><td>Sidebar</td><td>Content</td></tr></table>
  bad_example_source: bad_example
