  title: Views Data Without Table Aliases
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Views Data With Table
    Aliases"'
  description: hook_views_data() always prefixes columns with an explicit alias to avoid SQL ambiguity across joined tables.
  severity: severe
  severity_grounding: '"always prefixes columns with an explicit alias to avoid SQL ambiguity across joined tables": a mandatory
    rule is broken -> severe'
  bad_example: "$data['my_table']['status'] = [\n  'title' => t('Status'),\n  'field' => ['id' => 'standard'],\n];"
  bad_example_source: bad_example
  good_example: "$data['my_table']['my_table_status'] = [\n  'title' => t('Status'),\n  'real field' => 'status',\n  'field'\
    \ => ['id' => 'standard'],\n];"
  operator_question: null
