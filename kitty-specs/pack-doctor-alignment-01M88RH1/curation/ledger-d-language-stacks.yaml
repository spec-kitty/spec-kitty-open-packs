- source: styleguides/drupal-security-performance.styleguide.yaml#/anti_patterns/0
  source_title: Twig Output Escaping
  pack: drupal
  owner: styleguide:drupal-security-performance
  id: twig-raw-filter-on-user-input
  merged_into: null
  merge_reason: null
  title: Twig raw Filter on User Input
  title_source: 'authored (decision 01M89KEM7HW8675J5V54JPGE24); the source titles the rule to follow: "Twig Output Escaping"'
  description: Twig auto-escapes all variable output by default. `|raw` disables that protection entirely and reopens cross-site
    scripting for anything derived from user input; for genuine HTML, render through a text format (`#type => 'processed_text'`
    in a render array, or `check_markup()` outside one -- see drupal-conventions' Twig Auto-Escaping entry for the render-array
    construct) instead of bypassing escaping.
  severity: breaking
  severity_grounding: '"reopens cross-site scripting for anything derived from user input": a security hole -> breaking'
  bad_example: '{# comment.body may contain unsanitized markup from a webform submission #}

    <div class="comment">{{ comment.body|raw }}</div>'
  bad_example_source: bad_example
  good_example: "{# auto-escaping is sufficient for plain text #}\n<div class=\"comment\">{{ comment.body }}</div>\n{# intentional\
    \ HTML: comment.body.processed runs the value through the\n   text format's filters (equivalent to #type => 'processed_text'\
    \ /\n   check_markup() in PHP) -- never |raw #}\n<div class=\"comment\">{{ comment.body.processed }}</div>"
  operator_question: null
