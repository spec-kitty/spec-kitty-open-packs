- source: anti_pattern.graph.yaml#/nodes/0
  source_title: Assert on mock interactions
  pack: foundation
  owner: null
  id: assert-on-mock-interactions
  merged_into: null
  merge_reason: null
  title: Assert on mock interactions
  description: Verifying call counts, order or arguments of doubles tests how a result was produced, not what was produced;
    the test breaks on refactoring and stays green when the outcome is wrong.
  severity: breaking
  severity_grounding: '"the test breaks on refactoring and stays green when the outcome is wrong" (edge tactic:function-over-form-testing
    -rejects-> anti_pattern:assert-on-mock-interactions; same reason on directive:DIRECTIVE_054 and paradigm:tests-as-scaffold-not-friction;
    also tactic:tdd-red-green-refactor): a wrong result passes unnoticed -> breaking (operator ruling 2026-11-25, decision
    01M89KE3FCN4PZM0K03767GAWV)'
  bad_example: '`verify(emailSender, times(1)).send(any())` is the test''s only assertion, so it fails when sending is batched
    and passes when the email goes to the wrong recipient.'
  bad_example_source: authored, grounded in "stays green when the outcome is wrong" (operator ruling 2026-11-25, decision
    01M89KE3FCN4PZM0K03767GAWV)
  operator_question: null
- source: anti_pattern.graph.yaml#/nodes/1
  source_title: Mock owned logic to pin a call contract
  pack: foundation
  owner: null
  id: mock-owned-logic-to-pin-a-call-contract
  merged_into: null
  merge_reason: null
  title: Mock owned logic to pin a call contract
  description: Substituting logic the system under test owns to assert which helper was called couples the test to an implementation
    shape and can manufacture a state the real code never reaches.
  severity: breaking
  severity_grounding: 'DIRECTIVE_054 integrity rule "A test must not mock, stub, patch or spy on code the system under test
    owns", and "a double of owned logic makes the test pass for code that was never run" (edge tactic:tdd-red-green-refactor
    -rejects->; also directive:DIRECTIVE_054, paradigm:tests-as-scaffold-not-friction, procedure:unfake-an-over-mocked-test,
    and tactic:test-boundaries-by-responsibility, whose reason is the description): a mandatory rule, and a wrong result passes
    -> breaking'
  bad_example: an order-fulfilment test stubbed the step that records a shipment, to assert it was called once with the expected
    order ids.
  bad_example_source: procedure unfake-an-over-mocked-test steps[3] ("Run the real collaborators") worked example, first sentence
  operator_question: null
