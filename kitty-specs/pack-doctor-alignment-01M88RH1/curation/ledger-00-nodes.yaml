- source: drg/fragment.yaml#/nodes/2
  source_title: Anemic Domain Model
  pack: architecture
  owner: null
  id: anemic-domain-model
  merged_into: null
  merge_reason: null
  title: Anemic Domain Model
  description: Anemic Domain Models strip behaviour from domain objects, reducing them to data bags with external procedural
    services. This defeats the purpose of a rich, expressive domain model and scatters invariant enforcement across service
    layers.
  severity: severe
  severity_grounding: '"This defeats the purpose of a rich, expressive domain model" (edge paradigm:domain-driven-design -rejects->
    anti_pattern:anemic-domain-model): defeats the guidance''s purpose -> severe'
  bad_example: '`Order` holds only fields with getters and setters, while `OrderService.cancel(order)` checks the status,
    refunds the payment and sets `order.status` itself.'
  bad_example_source: authored, grounded in "Anemic Domain Models strip behaviour from domain objects, reducing them to data
    bags with external procedural services" (operator ruling 2026-11-25, decision 01M89KE3FCN4PZM0K03767GAWV)
  operator_question: null
- source: drg/fragment.yaml#/nodes/3
  source_title: Big Ball of Mud
  pack: architecture
  owner: null
  id: big-ball-of-mud
  merged_into: null
  merge_reason: null
  title: Big Ball of Mud
  description: A Big Ball of Mud architecture has no explicit context boundaries or ubiquitous language. Concepts leak across
    modules, coupling grows unchecked, and model integrity becomes impossible to maintain.
  severity: severe
  severity_grounding: '"model integrity becomes impossible to maintain" (edge paradigm:domain-driven-design -rejects-> anti_pattern:big-ball-of-mud):
    defeats the guidance''s purpose -> severe'
  bad_example: The billing module imports the shipping module's `Parcel` table class and writes its columns, and "customer"
    means the payer in one module and the recipient in the next.
  bad_example_source: authored, grounded in "A Big Ball of Mud architecture has no explicit context boundaries or ubiquitous
    language" (operator ruling 2026-11-25, decision 01M89KE3FCN4PZM0K03767GAWV)
  operator_question: null
