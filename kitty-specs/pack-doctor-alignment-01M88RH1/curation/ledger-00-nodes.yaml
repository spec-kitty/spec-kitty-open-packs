- source: drg/fragment.yaml#/nodes/1
  source_title: Big-Bang Rewrite
  pack: refactoring
  owner: null
  id: big-bang-rewrite
  merged_into: null
  merge_reason: null
  title: Big-Bang Rewrite
  description: replacing a legacy component or code path in a single-step cutover when it is too risky, instead of running
    the new implementation alongside the old and rerouting callers one at a time
  severity: severe
  severity_grounding: '"in a single-step cutover when it is too risky" (edge tactic:refactoring-strangler-fig -rejects-> anti_pattern:big-bang-rewrite):
    the avoidable risk the tactic exists to prevent -> severe'
  bad_example: Rewrite the billing module on a branch for three months, then switch every caller to it in one release and
    delete the old code the same day.
  bad_example_source: authored, grounded in "replacing a legacy component or code path in a single-step cutover when it is
    too risky" (operator ruling 2026-11-25, decision 01M89KE3FCN4PZM0K03767GAWV)
  operator_question: null
