- source: drg/fragment.yaml#/nodes/6
  source_title: Database-Driven Design
  pack: architecture
  owner: null
  id: database-driven-design
  merged_into: null
  merge_reason: null
  title: Database-Driven Design
  description: 'Starting from a database schema and generating code around it inverts the DDD priority: the domain model should
    drive persistence, not the other way around. Schema-first thinking produces models shaped by storage constraints rather
    than business rules.'
  severity: severe
  severity_grounding: '"inverts the DDD priority: the domain model should drive persistence" (edge paradigm:domain-driven-design
    -rejects-> anti_pattern:database-driven-design): defeats the guidance''s purpose -> severe'
  bad_example: The domain classes are generated from the `ORDERS` and `ORDER_LINES` tables, so `Order` has a `status_cd CHAR(1)`
    field and no `cancel()` method.
  bad_example_source: 'authored, grounded in "Starting from a database schema and generating code around it inverts the DDD
    priority: the domain model should drive persistence, not the other way around" (operator ruling 2026-11-25, decision 01M89KE3FCN4PZM0K03767GAWV)'
  operator_question: null
