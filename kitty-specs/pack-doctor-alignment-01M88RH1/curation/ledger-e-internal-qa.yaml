  source_title: Dark chrome or a white print margin
  pack: internal
  owner: styleguide:executive-debrief
  id: dark-chrome-or-a-white-print-margin
  merged_into: null
  merge_reason: null
  title: Dark chrome or a white print margin
  description: 'These are printed documents: use the light cream/paper treatment, never the dark website surface, and let
    the cream reach every page edge. The long form gets this from the generator (WeasyPrint paints the page background). The
    one-pager prints through Chromium, which paints the page-margin box white; shift its continuation-page content down in
    flow with a transparent top border instead, so the background stays cream.'
  severity: smell
  severity_grounding: states the rule ("use the light cream/paper treatment, never the dark website surface, and let the cream
    reach every page edge") but no outcome; proposed smell
  bad_example: A dark-mode debrief, or pages 2+ with a white strip above the content.
  bad_example_source: bad_example
  good_example: Cream full-bleed on every page; one-pager continuation pages inset in-flow so content sits lower and the background
    never turns white.
  operator_question: 'severity: smell, severe or breaking? (proposed smell; the text states a rule or practice, no outcome)'
- source: procedures/semi-auto-delivery.procedure.yaml#/anti_patterns/0
  source_title: Deciding silently
  pack: internal
  owner: procedure:semi-auto-delivery
  id: deciding-silently
  merged_into: null
  merge_reason: null
  title: Deciding silently
  description: Resolving an escalation-class decision — a regression-vs-stale-test verdict, a contract or boundary change,
    a test-expectation edit, a scope widening — without surfacing it to the operator. The operator cannot steer what was never
    signalled, and the fake-green half is the half that misleads the next agent.
  severity: severe
  severity_grounding: '"The operator cannot steer what was never signalled, and the fake-green half is the half that misleads
    the next agent": -> severe'
  bad_example: The runner edits a failing test's expected value to match the new output and reports green, without telling
    the operator.
  bad_example_source: authored, grounded in "Resolving an escalation-class decision" (decision 01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
