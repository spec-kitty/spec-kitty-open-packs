- source: procedures/meeting-minutes-pipeline.procedure.yaml#/anti_patterns/0
  source_title: Rendering without selecting a format
  pack: writing
  owner: procedure:meeting-minutes-pipeline
  id: rendering-without-selecting-a-format
  merged_into: null
  merge_reason: null
  title: Rendering without selecting a format
  description: Defaulting to decision minutes (or discussion notes) without asking. The format materially changes the structure
    and what counts as complete. Ask the user which format up front; a transcript-based suggestion is allowed, but the user
    chooses. A discussion meeting rendered as a decision table (mostly empty Decisions and Action cells) is a format-selection
    failure, not a content failure.
  severity: severe
  severity_grounding: '"The format materially changes the structure and what counts as complete": the record can be incomplete
    -> severe'
  bad_example: Given a knowledge-sharing call's transcript, the agent renders decision minutes without asking, leaving most
    Decisions and Action cells empty.
  bad_example_source: authored, grounded in "Defaulting to decision minutes (or discussion notes) without asking" (decision
    01M88RHJ9HN4N8HDE97SJ6ZBAH)
  operator_question: null
