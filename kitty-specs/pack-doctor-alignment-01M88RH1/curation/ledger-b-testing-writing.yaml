  source_title: Self-constructed oracle (an "injection proof" that never injects)
  pack: testing
  owner: styleguide:test-desiderata-and-boundaries
  id: self-constructed-oracle-an-injection-proof-that-never-injects
  merged_into: null
  merge_reason: null
  title: Self-constructed oracle (an "injection proof" that never injects)
  description: A test meant to prove a gate or ratchet goes red builds two divergent inputs and asserts they differ, without
    ever calling the gate. It is green whatever the product does, so it is not Behavioral. A non-vacuity proof invokes the
    real check on the planted input and asserts the check fails.
  severity: breaking
  severity_grounding: '"It is green whatever the product does": a wrong result passes -> breaking'
  bad_example: 'primary_state = reduce(read_events(primary_log))

    replica_state = reduce(read_events(replica_log))     # data the test wrote

    assert primary_state != replica_state                # never runs the gate'
  bad_example_source: bad_example
  good_example: "plant_divergence(replica_log)\nwith pytest.raises(AssertionError, match=\"replica parity\"):\n    assert_replica_parity(primary,\
    \ replica)          # the real check goes red"
  operator_question: null
