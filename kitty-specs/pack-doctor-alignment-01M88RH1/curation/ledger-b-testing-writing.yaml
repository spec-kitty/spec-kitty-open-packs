- source: styleguides/meeting-minutes-format.styleguide.yaml#/anti_patterns/2
  source_title: Missing or wrong section order
  pack: writing
  owner: styleguide:meeting-minutes-format
  id: missing-or-wrong-section-order
  merged_into: null
  merge_reason: null
  title: Missing or wrong section order
  description: 'Decision minutes: omitting a section or changing the order violates the format contract and makes the chat
    response harder to scan. When optionally published, the wrong order also breaks wiki task roll-up. Discussion notes have
    their own fixed order — Attendance, Topics Discussed, then an OPTIONAL Action Items section — where omitting Action Items
    is correct when nothing actionable arose (it is not a missing section). Reordering or renaming the mandatory sections
    is still a violation in either format.'
  severity: severe
  severity_grounding: '"violates the format contract ... the wrong order also breaks wiki task roll-up": a contract and a
    downstream consumer break -> severe'
  bad_example: 'Decision minutes — Sections: Action Items / Attendance / Minutes

    Discussion notes — Sections: Topics Discussed / Attendance'
  bad_example_source: bad_example
  good_example: 'Decision minutes — Sections: Attendance / Minutes / Action Items

    Discussion notes — Sections: Attendance / Topics Discussed [/ Action Items if any]'
  operator_question: null
- source: styleguides/meeting-minutes-format.styleguide.yaml#/anti_patterns/3
  source_title: Narrating existing state as a decision
  pack: writing
  owner: styleguide:meeting-minutes-format
  id: narrating-existing-state-as-a-decision
  merged_into: null
  merge_reason: null
  title: Narrating existing state as a decision
  description: Populating the Decisions column with facts about how things already work, or plans already in motion, as if
    they were decided in this meeting. A decision is something the group resolved or agreed upon during the meeting itself.
    Pre-existing policy, current architecture, and informational context belong in the Notes column — not Decisions. Knowledge-sharing
    and demo sessions will typically have empty Decisions cells for most or all agenda items; that is correct and expected.
  severity: severe
  severity_grounding: states the practice ("Populating the Decisions column with facts about how things already work ... as
    if they were decided in this meeting") but no explicit outcome; proposed severe (the record misstates what was decided)
  bad_example: 'Agenda item: "managed container overview" (presenter walking through existing setup)

    Decisions: "Managed containers chosen as the hosting platform for idle services"

    — Wrong: this was not decided in the meeting; it is existing infrastructure being explained.


    Agenda item: "Infrastructure as code" (presenter explaining current practice)

    Decisions: "Terraform is the IaC standard; manual infrastructure deployment is not used"

    — Wrong: this is current practice being documented, not a decision reached today.'
  bad_example_source: bad_example
  good_example: 'Agenda item: "managed container overview" (presenter walking through existing setup)

    Decisions: (empty)

    Notes: "Apps hosted on a managed container service / Scales to zero when idle — no cost when unused"


    Agenda item: "App hosting tiers" (discussion with directional outcome)

    Decisions: "Template repositories + shared CI library identified as the integration mechanism — tiers and governance to
    be defined with Priya Shah, Morgan Blake, and Chris Nguyen"'
  operator_question: 'severity: smell or severe? (proposed severe; the text states the practice, no explicit outcome)'
