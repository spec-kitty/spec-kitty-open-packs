  description: A tutorial that says "if you prefer X do this, otherwise do that" forces a first-time learner to make a decision
    they lack the context to make. The guaranteed-path contract of a tutorial is broken the moment it branches.
  severity: severe
  severity_grounding: '"The guaranteed-path contract of a tutorial is broken the moment it branches": defeats the guidance''s
    purpose -> severe'
  bad_example: '## Step 3

    If you use Postgres, run the migration with `--pg`; if you use SQLite,

    skip the flag; if you are on Windows you may need to quote the path...'
  bad_example_source: bad_example
  good_example: "## Step 3\nRun the migration:\n    spec-kitty migrate\n(This tutorial uses the default SQLite backend. To\
    \ target Postgres, see\nthe how-to: Configure a Postgres backend.)"
