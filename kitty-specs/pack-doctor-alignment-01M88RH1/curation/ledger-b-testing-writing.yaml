  source_title: Empty or ownerless Action Items in discussion notes
  pack: writing
  owner: styleguide:meeting-minutes-format
  id: empty-or-ownerless-action-items-in-discussion-notes
  merged_into: null
  merge_reason: null
  title: Empty or ownerless Action Items in discussion notes
  description: In the discussion-notes format the Action Items section is optional. Do not emit an empty table or a "no actions"
    placeholder — omit the whole section when nothing actionable arose. Conversely, if an action IS listed it must still have
    a named owner; optional does not mean unattributed.
  severity: severe
  severity_grounding: '"if an action IS listed it must still have a named owner": a mandatory rule is broken -> severe'
  bad_example: '## Action Items


    | Owner | Action | Deadline |

    |-------|--------|----------|

    | | (none this meeting) | |

    | The team | follow up on hosting | |'
  bad_example_source: bad_example
  good_example: '(No actions arose, so the Action Items section is omitted entirely.)


    — or, when an action did arise —


    ## Action Items


    | Owner | Action | Deadline |

    |-------|--------|----------|

    | Alex Rivera | share the cold-start numbers | |'
  operator_question: null
