- source: styleguides/test-desiderata-and-boundaries.styleguide.yaml#/anti_patterns/1
  source_title: Over-mocking to compensate for a missing boundary
  pack: testing
  owner: styleguide:test-desiderata-and-boundaries
  id: over-mocking-to-compensate-for-a-missing-boundary
  merged_into: null
  merge_reason: null
  title: Over-mocking to compensate for a missing boundary
  description: Patching five infrastructure functions to test one behavior means the test is fighting the absence of a seam.
    Substitute only at the allow-listed seams of DIRECTIVE_054; if you find yourself doubling owned logic, extract the boundary
    instead. Heavy mocking also makes tests pass when the real integration is broken (loss of Predictive).
  severity: breaking
  severity_grounding: '"Heavy mocking also makes tests pass when the real integration is broken": a wrong result passes ->
    breaking'
  bad_example: "with patch(\"a.find_config_root\"), patch(\"a.save_order\"), \\\n     patch(\"a.run_command\"), patch(\"a.load_initial_state\"\
    ), \\\n     patch(\"a.check_permissions\"):\n    run_command_under_test()   # nothing real is exercised"
  bad_example_source: bad_example
  good_example: '# Extract the decision into a pure function; mock nothing.

    result = decide(domain_inputs)

    assert result == expected'
  operator_question: null
