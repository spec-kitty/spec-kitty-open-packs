- source: styleguides/testing-principles.styleguide.yaml#/anti_patterns/3
  source_title: The Literal-Scan Trap
  pack: testing
  owner: styleguide:testing-principles
  id: the-literal-scan-trap
  merged_into: null
  merge_reason: null
  title: The Literal-Scan Trap
  description: Pinning a test to the literal text of production code — function names, class names, module paths, docstring
    wording — couples the test to implementation shape, not behavior. Every cleanup or rename forces a re-pin, teaching contributors
    that tests are friction to work around. A literal-symbol scan that has been re-pinned twice on shape-only changes is retired
    with proof that integration paths still cover the behavior; a line-count ceiling on a single file is replaced by a project-wide
    metric that does not gate on one file's momentary size.
  severity: severe
  severity_grounding: '"couples the test to implementation shape, not behavior. Every cleanup or rename forces a re-pin":
    false alarms defeat the test as a safety net -> severe'
  bad_example: "# Asserts a specific class name appears verbatim in the source file.\n# Must be re-pinned every time the class\
    \ is renamed or the file is reorganised —\n# even when no behavior changed. Two re-pins = one deletion waiting to happen.\n\
    def test_domain_object_present():\n    src = Path(\"src/myproject/orders/domain.py\").read_text()\n    assert \"class\
    \ Order\" in src  # shape pin, not a behavioral contract\n\n# LOC gate: fails for the contributor who added a docstring;\n\
    # passes for the one who doubled a neighboring file not under the gate.\ndef test_orders_module_not_too_large():\n   \
    \ lines = Path(\"src/myproject/cli/orders.py\").read_text().splitlines()\n    assert len(lines) <= 500, f\"orders.py too\
    \ large: {len(lines)} lines\""
  bad_example_source: bad_example
  good_example: "# Behavioral contract through the public surface — survives any internal reorganisation.\ndef test_order_rejects_empty_customer_id():\n\
    \    with pytest.raises(ValueError, match=\"customer_id\"):\n        Order(customer_id=\"\", total_cents=1200)\n\n# Size\
    \ metric delegated to Sonar / ruff; pytest asserts the behavioral contract only.\ndef test_orders_command_lists_all_orders(runner,\
    \ tmp_store):\n    result = runner.invoke(app, [\"orders\", \"list\", \"--store\", tmp_store])\n    assert result.exit_code\
    \ == 0"
  operator_question: null
