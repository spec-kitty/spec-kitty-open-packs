- source: styleguides/given-when-then-authoring.styleguide.yaml#/anti_patterns/1
  source_title: Multiple Whens in One Scenario
  pack: testing
  owner: styleguide:given-when-then-authoring
  id: multiple-whens-in-one-scenario
  merged_into: null
  merge_reason: 'both: two behaviours in one test, so a failure no longer says which broke — "a failure no longer identifies
    which trigger broke" / "A failure no longer identifies which behaviour broke"'
  title: Multiple Whens in One Scenario
  description: More than one When collapses several behaviours into a single scenario, so a failure no longer identifies which
    trigger broke and the Then can no longer describe one coherent outcome. Each trigger deserves its own scenario.
  severity: smell
  severity_grounding: '"a failure no longer identifies which trigger broke": a diagnosis cost; the failure is still caught
    -> smell'
  bad_example: 'Given an empty cart

    When the customer adds an item

    And the customer checks out

    And the customer requests a refund

    Then the refund is processed'
  bad_example_source: bad_example
  good_example: 'Given a cart containing one item

    When the customer checks out

    Then an order is created for that item'
  operator_question: null
