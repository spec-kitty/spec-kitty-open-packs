- source: styleguides/test-desiderata-and-boundaries.styleguide.yaml#/anti_patterns/5
  source_title: Forgetting that a stub is a second copy of the contract
  pack: testing
  owner: styleguide:test-desiderata-and-boundaries
  id: forgetting-that-a-stub-is-a-second-copy-of-the-contract
  merged_into: null
  merge_reason: null
  title: Forgetting that a stub is a second copy of the contract
  description: A stub restates its collaborator's contract by hand, so when the real dependency changes the test stays green
    for a world that no longer exists (the foundation paradigm tests-as-scaffold-not-friction explains why). Keep stubs at
    allow-listed seams and make them honor the real contract.
  severity: breaking
  severity_grounding: '"the test stays green for a world that no longer exists": a wrong result passes -> breaking'
  bad_example: 'stub_rates.get_rate.return_value = Decimal("1.1")   # the real service now raises on stale rates

    assert convert(100, "EUR", "USD", rates=stub_rates) == Decimal("110")   # stays green anyway'
  bad_example_source: bad_example
  good_example: "# A fake at the network seam that keeps the real contract, failure branch included.\n@pytest.fixture\ndef\
    \ rates():\n    return FakeRateService(rates={\"EUR/USD\": Decimal(\"1.1\")}, stale={\"EUR/GBP\"})\n\ndef test_converts_at_the_current_rate(rates):\n\
    \    assert convert(100, \"EUR\", \"USD\", rates=rates) == Decimal(\"110\")\n\ndef test_refuses_a_stale_rate(rates):\n\
    \    with pytest.raises(StaleRateError):\n        convert(100, \"EUR\", \"GBP\", rates=rates)"
  operator_question: null
