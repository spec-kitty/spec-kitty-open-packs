- source: styleguides/quadruple-a-test-format.styleguide.yaml#/anti_patterns/0
  source_title: Missing Assumption Check
  pack: testing
  owner: styleguide:quadruple-a-test-format
  id: missing-assumption-check
  merged_into: null
  merge_reason: 'both: omitting the precondition/assumption check, so a broken setup decides the result — "Omitting the assumption
    check lets a wrong fixture or a drifted default state present itself as a failure" / "Skipping the precondition assertion.
    When test setup silently fails, the test passes for the wrong reason"'
  title: Missing Assumption Check
  description: Omitting the assumption check lets a wrong fixture or a drifted default state present itself as a failure of
    the behaviour under test. The test then either fails for the wrong reason (wasting an investigation) or, worse, passes
    because the arranged state was never the state the behaviour needs.
  severity: breaking
  severity_grounding: '"or, worse, passes because the arranged state was never the state the behaviour needs": a wrong result
    passes -> breaking'
  bad_example: "def test_discount_applies_to_gold_members():\n    member = make_member()          # is this actually a gold\
    \ member?\n    price = pricing.quote(member)\n    assert price == Decimal(\"90.00\")  # green even if make_member() drifts\
    \ to silver"
  bad_example_source: bad_example
  good_example: "def test_discount_applies_to_gold_members():\n    member = make_member(tier=\"gold\")\n    assert member.tier\
    \ == \"gold\"      # assumption check pins the precondition\n    price = pricing.quote(member)\n    assert price == Decimal(\"\
    90.00\")"
  operator_question: null
