- source: styleguides/test-desiderata-and-boundaries.styleguide.yaml#/anti_patterns/4
  source_title: Gold plating as a licence to double owned logic
  pack: testing
  owner: styleguide:test-desiderata-and-boundaries
  id: gold-plating-as-a-licence-to-double-owned-logic
  merged_into: null
  merge_reason: null
  title: Gold plating as a licence to double owned logic
  description: '"Avoid gold plating" (build only what is needed now) is sometimes read as permission to substitute owned logic
    because running it for real costs setup. It is not. The rare cheap substitutes the allow-list permits (DIRECTIVE_054:
    schema-only validation by a library, an outbound notification) are boundary seams; logic the behavior depends on runs
    for real. If the real slice is too heavy, extract a pure seam instead.'
  severity: breaking
  severity_grounding: '"logic the behavior depends on runs for real" (DIRECTIVE_054''s rule; the entry rejects reading gold
    plating as licence to double owned logic): a mandatory rule, as for foundation mock-owned-logic-to-pin-a-call-contract
    -> breaking'
  bad_example: "# \"Running the discount rules for real is overkill here.\"\nwith patch(\"shop.pricing.apply_discount_rules\"\
    , return_value=Decimal(\"90\")):\n    assert checkout(cart).total == Decimal(\"90\")    # tests the stub, not pricing"
  bad_example_source: bad_example
  good_example: '# The discount rules are owned logic: run them; seed a cart that triggers one.

    cart = cart_with(items=[book(price="100")], coupon="TEN_OFF")

    assert checkout(cart).total == Decimal("90")'
  operator_question: null
- source: styleguides/mutation-aware-test-design.styleguide.yaml#/anti_patterns/1
  source_title: Identity Value Inputs
  pack: testing
  owner: styleguide:mutation-aware-test-design
  id: identity-value-inputs
  merged_into: null
  merge_reason: null
  title: Identity Value Inputs
  description: Using 0 for addition, 1 for multiplication, or an empty string makes the original operator and its mutation
    produce the same result.
  severity: severe
  severity_grounding: '"makes the original operator and its mutation produce the same result": the test cannot see that class
    of fault, its purpose is defeated for it -> severe'
  bad_example: "def test_discount():\n    assert apply_discount(price=100, rate=0) == 100  # 100 * 0 == 100 / 0 would crash,\n\
    \                                                     # but 100 - 0 == 100 + 0 == 100"
  bad_example_source: bad_example
  good_example: "def test_discount():\n    assert apply_discount(price=100, rate=0.2) == 80.0  # 100 - 20 != 100 + 20"
  operator_question: null
