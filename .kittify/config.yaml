charter_packs:
  org:
    packs:
    # spec-kitty-internal (org tier): the in-house / maintainer doctrine pack.
    # This repository is its CANONICAL home (see the Provenance section of
    # packs/internal/README.md); it is registered here for the repo's own
    # maintainer governance. Its governing `base` preset's must-have items (the
    # skills land-pr, issue-triage, mission-from-issue, report-debrief, semi-auto
    # and the maintainer procedures) are its required floor in the charter
    # service. Core does not apply must_have yet, and without org-charter.yaml's
    # skill_namespace it cannot render the kitty-* skills: do not run
    # `spec-kitty upgrade` here until core aligns, or it retires the committed
    # kitty-* skill directories (see packs/internal/README.md, "Pack skills").
    - name: internal
      local_path: packs/internal
    # spec-kitty-qa (org tier): the QA / promise-traceability doctrine pack that
    # lives here. Registered for the repo's own governance; inert by default
    # (it requires nothing), with specific entries opted in per
    # mission via `charter activate`.
    - name: qa
      local_path: packs/qa
charter: .kittify/charter/charter.yaml

# Operator decision, 2026-11-04 (mission strict-pack-composition): the CLI's charter preflight
# refuses every implement with `synthesized_drg missing`. This repository has never had a
# synthesized DRG, and synthesizing needs agent-authored charter artifacts built on the doctrine
# that mission changes. Governance context still loads; charter freshness is not checked.
preflight:
  enabled: false
