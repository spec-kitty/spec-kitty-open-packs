- source: paradigm:c4-incremental-detail-modeling
  target: anti_pattern:big-upfront-design
  relation: rejects
  reason: Big Upfront Design attempts to specify every architectural detail before implementation begins. C4 incremental detail
    modeling favours progressive discovery -- start with a context diagram and add lower levels only when they earn their
    keep.
- source: paradigm:c4-incremental-detail-modeling
  target: anti_pattern:code-is-the-documentation
  relation: rejects
  reason: Relying solely on source code as documentation forces every stakeholder -- including non-technical sponsors -- to
    read code to understand system boundaries. C4 provides visual abstractions that make architecture accessible without requiring
    code literacy.
- source: paradigm:c4-incremental-detail-modeling
  target: anti_pattern:single-diagram-architecture
  relation: rejects
  reason: A single all-in-one architecture diagram conflates audiences and abstraction levels, producing a poster that nobody
    can review in a reasonable time. C4 explicitly separates concerns into distinct levels.
