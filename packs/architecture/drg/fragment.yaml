- source: directive:USE_C4_MODEL_TECHNIQUES
  target: paradigm:c4-incremental-detail-modeling
  relation: suggests
  when: communicating a system's architecture to more than one audience at more than one level of detail, so it must be broken
    into progressive zoom levels (System Context, Container, Component, Code) rather than a single all-in-one diagram
  reason: The C4 hub suggests the C4 incremental-detail paradigm as its core mental model; the `when` is the paradigm's own
    stated purpose (progressive zoom, right detail per audience). Composition-only under today's traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: paradigm:domain-driven-design
  relation: suggests
  when: the architecture being documented is organised around a domain model, so its container/component boundaries should
    reflect bounded contexts and the ubiquitous language
  reason: 'The reinforcement (''supporting'') bridge the #3063 operator attested: the C4 architecture-documentation hub suggests
    the Domain-Driven Design paradigm so architecture diagrams and domain boundaries reinforce each other. `suggests` is the
    closest attested relation for a soft supporting/reinforces pointer (no new relation kind invented). INBOUND to the already-action-reachable
    DDD paradigm (Family A), so it delivers nothing new and moves no pin — composition-only under today''s traversal. The
    documentation-family leg of ''supporting the documentation and DDD paradigms'' is already covered by the member edge to
    paradigm:c4-incremental-detail-modeling, which IS the documentation/architecture-modelling paradigm.'
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: procedure:c4-diagram-authoring
  relation: requires
  when: creating or revising an architecture diagram
  reason: Zooms in from context only as far as needed, keeps one abstraction level per diagram, matches detail to the audience,
    and keeps diagrams as code.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: procedure:drill-down-documentation
  relation: suggests
  when: capturing decisions, documentation, and architecture descriptions at a consistent abstraction level (organisational,
    architecture, design, code) with upward and downward traceability, rather than mixing levels in one artifact
  reason: The C4 hub suggests the drill-down documentation procedure as the abstraction-level discipline that keeps each artifact
    at one C4 zoom level; the `when` is the procedure's own stated purpose/entry condition. Composition-only under today's
    traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: tactic:architecture-diagram-review-checklist
  relation: suggests
  when: an architecture diagram is about to be shared, committed, or included in documentation and must communicate to its
    audience without a verbal walkthrough (title, legend, typed described elements, labelled unidirectional relationships)
  reason: The C4 hub suggests the diagram review checklist as its quality gate; the `when` is the tactic's own stated purpose.
    Composition-only under today's traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: tactic:c4-zoom-in-architecture-documentation
  relation: suggests
  when: actually drawing the architecture diagrams — starting from the System Context and zooming in to Container and Component
    levels only where additional detail adds value
  reason: The C4 hub suggests the zoom-in documentation workflow as the concrete step-by-step technique; the `when` is the
    tactic's own stated purpose. Composition-only under today's traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: writing::tactic:code-documentation-analysis
  relation: suggests
  when: reverse-engineering or reviewing an existing system's architecture — extracting terminology from its code and documentation
    to surface implicit context boundaries before they calcify into accidental coupling
  reason: The C4 hub suggests code/documentation analysis as the technique for discovering an existing system's architecture
    (implicit boundaries) prior to documenting it; the `when` is the tactic's own stated purpose (architectural review / boundary
    discovery). Composition-only under today's traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
  target: writing::toolguide:mermaid-diagramming
  relation: suggests
  when: rendering the architecture diagrams as text-based, version-controlled diagram-as-code in Mermaid so they diff and
    review beside the code
  reason: The C4 hub suggests the Mermaid toolguide as one text-based rendering option satisfying its 'keep diagrams as diagram-as-code'
    rule; the `when` is the toolguide's own stated scope. Composition-only under today's traversal.
- source: directive:USE_C4_MODEL_TECHNIQUES
