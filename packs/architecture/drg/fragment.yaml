  target: procedure:event-storming-discovery
  relation: suggests
  when: discovering domain events, commands, aggregates, policies, read models, and bounded-context boundaries from real business
    flows
  reason: Event Storming is a DDD-cluster discovery procedure (family-A). The operator's earlier guard keeps it OUT of the
    eager specify delivery (context-overload concern), so it is attached via the architect profile — INERT in the profile
    channel (requires/specializes_from only) — rather than via paradigm:domain-driven-design, which is scope-resolved (family-A)
    and would deliver it at specify. It can be switched to paradigm-delivered later if the operator wants it eager.
- source: agent_profile:architect-alphonso
  target: foundation::tactic:dependency-hygiene
  relation: requires
  reason: Dependency-tree decisions (registry restriction, transitive-CVE exclusion, JS/TS supply-chain posture) are first-class
    architectural choices; review designs for a documented dependency-hygiene stance before treating a component boundary
    as settled.
- source: agent_profile:architect-alphonso
  target: tactic:development-bdd
  relation: requires
  reason: Use BDD behavioral contract definition during architecture design to express observable system boundaries in stakeholder-readable
    terms. Behavioral contracts precede implementation and shape system component boundaries.
