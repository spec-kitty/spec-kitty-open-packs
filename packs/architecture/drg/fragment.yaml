  relation: requires
  reason: The Aggregate Design Rules styleguide encodes DDD tactical aggregate discipline (reference by identity, keep aggregates
    small, eventual consistency between aggregates via domain events). Activating DDD pulls it in.
- source: paradigm:domain-driven-design
  target: tactic:aggregate-boundary-design
  relation: requires
  reason: 'Aggregate Boundary Design is DDD tactical design (Evans / Vernon): defining transactional consistency boundaries
    and aggregate roots within a bounded context. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:anti-corruption-layer
  relation: requires
  reason: 'The Anti-Corruption Layer is a DDD context-mapping pattern (Evans): a translation layer that keeps a foreign system''s
    model from corrupting the domain''s ubiquitous language. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:bounded-context-canvas-fill
  relation: requires
  reason: 'Bounded Context Canvas Fill is DDD strategic design: it guides completing a Bounded Context Canvas (DDD Crew v5)
    capturing a context''s strategic classification and ubiquitous language. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: foundation::tactic:bounded-context-identification
  relation: requires
  reason: 'Bounded Context Identification is DDD strategic design (Evans): drawing boundaries around regions where a single
    consistent model and ubiquitous language apply. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: writing::tactic:context-boundary-inference
  relation: requires
  reason: 'Context Boundary Inference is DDD strategic design: it detects bounded-context boundaries from team ownership and
    terminology conflicts, documenting ubiquitous language per context. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:context-mapping-classification
  relation: requires
  reason: 'Context Mapping Classification is DDD strategic design: it classifies every relationship between bounded contexts
    using the canonical DDD context-mapping patterns. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:domain-event-capture
  relation: requires
  reason: 'Domain Event Capture is DDD tactical design (Evans / Fowler): funnelling significant state changes through immutable
    Domain Event objects. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:entity-value-object-classification
  relation: requires
  reason: 'Entity vs Value Object Classification is DDD tactical design (Evans): classifying each domain object as an Entity
    or a Value Object. Activating DDD pulls it in.'
- source: paradigm:domain-driven-design
  target: tactic:strategic-domain-classification
  relation: requires
  reason: 'Strategic Domain Classification is DDD strategic design (Evans): classifying each bounded context as Core, Supporting
    or Generic subdomain to guide investment. Activating DDD pulls it in. (Already action-reachable via paula-patterns'' review
