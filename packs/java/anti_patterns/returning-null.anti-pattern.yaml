schema_version: '1.0'
id: returning-null
title: Returning Null
description: Returning null from public methods forces all callers to add null checks, spreading defensive code across the
  codebase.
severity: smell
bad_example: |-
  public Config load(Path path) {
      if (!path.toFile().exists()) return null;
      // ...
  }
good_example: |-
  public Optional<Config> load(Path path) {
      if (!Files.exists(path)) return Optional.empty();
      // ...
  }
