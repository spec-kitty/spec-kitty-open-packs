id: maven-review-checks
schema_version: '1.0'
tool: maven-quality-stack
title: Maven Review Checks
guide_path: maven-review-checks.guide.md
summary: |
  Catalog of automated checks a reviewer should run or verify have been run before approving Java code. Organized by category: compilation, tests, coverage, style, static analysis, architecture, security, and mutation testing.
commands:
- mvn compile
- mvn test
- mvn verify
- mvn checkstyle:check
- mvn spotbugs:check
- mvn jacoco:report
- mvn dependency-check:check
- mvn org.pitest:pitest-maven:mutationCoverage
applies_to_languages:
- jvm
