# Provenance of packs/built-in/ (spec-kitty-open-packs#31, core ADR 2026-08-16-2 Option B).
#
# packs/built-in/ is the Spec Kitty consumer built-in pack, and this repository is where it
# is authored. Since spec-kitty/spec-kitty#6451 core keeps no copy: it fetches packs/built-in/
# from a pinned commit of this repository (core's own packs/built-in.source.yaml).
#
# seeded_from records the last core commit this tree was seeded from, before the
# authoring flip; it is history, not a re-seed instruction. Edit packs/built-in/ here and run
# `python3 scripts/ci/pack_digest.py --update`; scripts/ci/check-pack-digests.sh enforces it.
seeded_from:
  repository: https://github.com/spec-kitty/spec-kitty
  path: packs/built-in
  commit: f166339300dfe207ea7635a285e498beb877f1a0
  date: '2026-10-19'
# Since #73, packs/built-in/ is a distribution pack: it holds no artifacts, only its descriptor,
# README.md, presets and an empty manifest, and depends on its six members: foundation, writing,
# testing, refactoring, architecture and planning-analysis. A consumer that fetches packs/built-in/
# alone gets no doctrine; fetch its members at the same pin. Each member has its own sidecar,
# packs/<member>.source.yaml, to check its tree against.
# snapshot_sha256 (scripts/ci/pack_digest.py, core's algorithm; scripts/ci/built_in_digest.py stays as
# the compatibility entry point, and kitty-stack's `open-packs digest` is its caller) over packs/built-in/
# (every file except pack-manifest.yaml; length-prefixed path + size + bytes).
tree_digest:
  algorithm: spec-kitty-snapshot-sha256
  value: 80bb107a4064c5be4ac1deb8e177fefb47c9a0db680ae8d0210a4000f6a32700
