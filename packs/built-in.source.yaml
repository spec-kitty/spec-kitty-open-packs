# Provenance of packs/built-in/ (spec-kitty-open-packs#31, core ADR 2026-08-16-2 Option B).
#
# packs/built-in/ is the Spec Kitty consumer built-in pack, seeded byte-identical from core
# `packs/built-in/` at the commit below. Core's release vendors it back from a pinned
# commit of this repository (spec-kitty/spec-kitty#3504). spec-kitty/spec-kitty#6451
# replaces core's vendored copy with a direct source from this repository.
#
# Transition rule: until the authoring flip is ruled on, core is still where
# built-in content is edited. Re-seed from core; do not edit packs/built-in/ here, or the
# two copies diverge. scripts/ci/check-built-in.sh enforces the digest below.
seeded_from:
  repository: https://github.com/spec-kitty/spec-kitty
  path: packs/built-in
  commit: f166339300dfe207ea7635a285e498beb877f1a0
  date: '2026-10-19'
# snapshot_sha256 from charter.offering.packs.pack_manifest over packs/built-in/
# (every file except pack-manifest.yaml; length-prefixed path + size + bytes).
tree_digest:
  algorithm: spec-kitty-snapshot-sha256
  value: c55960229bb16ef9aff8b723375bf4396d2638f8dec5a74cbda1686bbfc01a83
# The core versions this content is written against. Mission-step prompts name CLI
# commands, and step contracts bind to runtime code. It lives here, not in
# packs/built-in/pack.yaml, because core's PackDescriptor schema forbids extra fields.
requires_core: '>=4.0.0rc7,<5'
