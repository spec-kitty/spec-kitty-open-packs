schema_version: '1.0'
id: qa
title: QA
description: 'The v0 display/acceptance config for the QA mission type: independent test strategy, planning, design, execution, and reporting across the seven-step QA lifecycle.'
expected_output_artifacts:
- artifact_key: output.test-report.qa
  artifact_class: output
  path_pattern: test-report.md
- artifact_key: output.qa-traceability.qa
  artifact_class: evidence
  path_pattern: qa-traceability.yaml
- artifact_key: output.qa-coverage.qa.optional
  artifact_class: evidence
  path_pattern: qa-coverage.json
- artifact_key: output.evidence.qa
  artifact_class: evidence
  path_pattern: evidence/**
steps:
- id: discovery
  title: Discovery
  description: Investigate the feature under test and gather the context a test strategy will be authored against.
  role: researcher
  prompt_path: steps/discovery.prompt.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action discovery --mission-type qa --json
  - id: scope-qa-charter
    description: Scope a timeboxed exploratory QA charter for this mission
    delegates_to:
      kind: directive
      candidates:
      - QA_006
  - id: apply-exploratory-tactics
    description: Apply exploratory-testing charter-writing technique to the scoped charter
    delegates_to:
      kind: tactic
      candidates:
      - qa-exploratory-charter-writing
- id: specify
  title: Test Strategy
  description: 'Define the QA test strategy: scope, risk areas, and what will and will not be tested.'
  role: qa-strategist
  prompt_path: steps/specify.prompt.md
  expected_output_artifacts:
  - artifact_key: input.spec.qa
    artifact_class: input
    path_pattern: spec.md
    blocking: true
    template_path: templates/test-strategy-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action specify --mission-type qa --json
  - id: define-traceable-exit-criteria
    description: Write the QA spec with traceable requirements and exit criteria that precede execution
    delegates_to:
      kind: directive
      candidates:
      - QA_001
      - QA_004
- id: plan
  title: Test Plan
  description: Translate the test strategy into a detailed, executable test plan with exit criteria, environments, and test data.
  role: qa-strategist
  prompt_path: steps/plan.prompt.md
  expected_input_artifacts:
  - artifact_key: input.spec.qa
    path_pattern: spec.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: workflow.plan.qa
    artifact_class: workflow
    path_pattern: plan.md
    blocking: true
    template_path: templates/test-plan-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action plan --mission-type qa --json
  - id: prioritize-by-risk
    description: Structure the QA test plan using risk-based prioritization
    delegates_to:
      kind: directive
      candidates:
      - QA_005
  - id: apply-prioritization-tactic
    description: Apply the risk-based test prioritization technique to the plan's structure
    delegates_to:
      kind: tactic
      candidates:
      - qa-risk-based-test-prioritization
  - id: review-test-plan
    description: Review the drafted test plan before it is handed off to task decomposition
    delegates_to:
      kind: procedure
      candidates:
      - qa-test-plan-review-workshop
- id: tasks
  title: Test Design
  description: Design the concrete test suite and work packages that implement the test plan, including exploratory charters.
  role: test-designer
  prompt_path: steps/tasks.prompt.md
  expected_input_artifacts:
  - artifact_key: workflow.plan.qa
    path_pattern: plan.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: workflow.tasks.qa
    artifact_class: workflow
    path_pattern: tasks.md
    blocking: true
    template_path: templates/test-suite-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action tasks --mission-type qa --json
  - id: reduce-test-surface
    description: Decompose the test-design task set using test-surface reduction techniques
    delegates_to:
      kind: tactic
      candidates:
      - qa-pairwise-test-reduction
      - qa-boundary-equivalence-partitioning
  - id: close-coverage-gaps
    description: Identify and close coverage gaps in the resulting task list
    delegates_to:
      kind: procedure
      candidates:
      - qa-coverage-gap-analysis
- id: implement
  title: Test Execution
  description: Execute the designed test suite and record defects found during execution.
  role: test-executor
  prompt_path: steps/implement.prompt.md
  expected_input_artifacts:
  - artifact_key: workflow.tasks.qa
    path_pattern: tasks.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.defect-log.qa
    artifact_class: output
    path_pattern: defect-log.md
    template_path: templates/defect-log-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action implement --mission-type qa --json
  - id: report-defects
    description: Execute the planned tests and report defects found during execution
    delegates_to:
      kind: directive
      candidates:
      - QA_002
  - id: apply-execution-tactics
    description: Apply execution-time techniques while running the test suite
    delegates_to:
      kind: tactic
      candidates:
      - qa-flaky-test-quarantine
      - qa-test-data-minimization
      - qa-regression-suite-selection
- id: review
  title: Test Report Review
  description: Review execution results for genuine, no-fake-green outcomes and produce the test report.
  role: qa-reporter
  prompt_path: steps/review.prompt.md
  expected_input_artifacts:
  - artifact_key: workflow.tasks.qa
    path_pattern: tasks.md
    blocking: true
  - artifact_key: output.defect-log.qa
    path_pattern: defect-log.md
  expected_output_artifacts:
  - artifact_key: output.test-report.review.qa
    artifact_class: output
    path_pattern: test-report.md
    blocking: true
    template_path: templates/test-report-template.md
  - artifact_key: output.qa-traceability.review.qa
    artifact_class: evidence
    path_pattern: qa-traceability.yaml
    blocking: true
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action review --mission-type qa --json
  - id: verify-no-fake-green
    description: Verify that implement's reported results are genuine, not a fake-green result
    delegates_to:
      kind: directive
      candidates:
      - QA_003
  - id: triage-defects
    description: Triage the defects surfaced during implementation
    delegates_to:
      kind: procedure
      candidates:
      - qa-defect-triage-ritual
- id: accept
  title: Acceptance
  description: Confirm exit criteria were actually met and record the release/acceptance decision.
  role: qa-reporter
  prompt_path: steps/accept.prompt.md
  expected_input_artifacts:
  - artifact_key: output.test-report.review.qa
    path_pattern: test-report.md
    blocking: true
  - artifact_key: output.qa-traceability.review.qa
    path_pattern: qa-traceability.yaml
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.qa-coverage.qa
    artifact_class: evidence
    path_pattern: qa-coverage.json
    blocking: true
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action accept --mission-type qa --json
  - id: confirm-evidence-integrity
    description: Confirm the no-fake-green principle holds one last time before go/no-go sign-off
    delegates_to:
      kind: directive
      candidates:
      - QA_003
  - id: run-go-no-go-review
    description: Run the go/no-go readiness review before accepting the mission
    delegates_to:
      kind: procedure
      candidates:
      - qa-go-no-go-readiness-review
