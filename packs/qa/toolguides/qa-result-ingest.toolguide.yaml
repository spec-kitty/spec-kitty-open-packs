id: qa-result-ingest
schema_version: '1.0'
tool: qa-result-ingest
title: QA Result Ingestion (JUnit-XML Producer)
guide_path: qa-result-ingest.guide.md
summary: |
  Resolve the script via `spec-kitty charter pack asset path qa-result-ingest` (the asset sidecar's id, which this toolguide shares in the toolguide kind), then invoke it with `--results PATH [--results PATH ...] --strategy PATH --tasks-dir PATH --since TIMESTAMP --mission-dir PATH [--json]`, or `--self-test` to run its built-in fixture/assertion suite instead (the tool prints its own derived pair count). The tool reads spec.md's Requirement Register, the test cases in every tasks/WP*.md (including automation_ref), and JUnit-XML result file(s), and writes or refreshes qa-traceability.yaml in the exact qa-traceability/v1 schema qa_carrier_lint.py already validates. Not ingested in v1, named explicitly rather than left as a vague "other formats": TAP, TRX (MSTest/VSTest's own native XML schema), Cucumber JSON, Robot Framework's native XML, and CTRF. Within JUnit-XML itself, only the outcome-as-child-element dialect (<failure>/<error>/<skipped/>) is supported — the outcome-as-status-attribute dialect some emitters use (e.g. <testcase status="failed"> with no <failure> child) is explicitly unsupported and is detected and refused, never silently mis-read as passing. Exit code communicates status: 0 (ingested), 1 (blocked — a named guard fired on well-formed input), 2 (error — unusable input, or a refused unsupported dialect). Nothing in the runtime runs this ingester or acts on its exit code; run it yourself before the carrier lint (see the pack README, Known limitations).
commands:
- spec-kitty charter pack asset path qa-result-ingest
- python qa_result_ingest.py --results PATH --strategy PATH --tasks-dir PATH --since TIMESTAMP --mission-dir PATH
- python qa_result_ingest.py --results PATH --strategy PATH --tasks-dir PATH --since TIMESTAMP --mission-dir PATH --json
- python qa_result_ingest.py --self-test
