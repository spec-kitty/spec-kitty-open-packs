id: qa-carrier-lint
schema_version: '1.0'
tool: qa-carrier-lint
title: QA Traceability Carrier Lint (Coverage Validator)
guide_path: qa-carrier-lint.guide.md
summary: |
  Validates a qa-traceability/v1 carrier (qa-traceability.yaml) and computes qa-coverage.json, a machine-readable coverage record: requirement/case coverage counts, JUnit-XML and session-evidence classification, and the bridge-check invariant against tasks/WP*.md frontmatter. Resolve the script via `spec-kitty charter pack asset path qa-traceability-lint` — the asset sidecar's own id, distinct from this toolguide's own id (qa-carrier-lint) — then invoke it with `--carrier PATH --mission-dir PATH [--json]`, or `--self-test` to run its built-in fixture/assertion suite instead (the tool prints its own pair count). Exit code communicates status: 0 (measured, verdict ready), 1 (measured, verdict blocked), 2 (not_measured, or error on a malformed carrier). Nothing in the runtime runs this validator or acts on its verdict; run it yourself (see the pack README, Known limitations).
commands:
- spec-kitty charter pack asset path qa-traceability-lint
- python qa_carrier_lint.py --carrier PATH --mission-dir PATH
- python qa_carrier_lint.py --carrier PATH --mission-dir PATH --json
- python qa_carrier_lint.py --self-test
