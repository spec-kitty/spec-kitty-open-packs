schema_version: '1.0'
id: qa-defect-triage-ritual
title: QA Defect Triage Ritual
description: |
  A periodic ISTQB severity/priority classification meeting over defects surfaced by test execution. It classifies severity and priority on defects already surfaced. It does not route work to an agent or a person, and it does not debug root cause.
entry_condition: |
  A batch of newly-surfaced defects is awaiting agreed severity and priority classification.
exit_condition: |
  Every defect in the batch carries an agreed severity and an agreed priority.
steps:
- title: Confirm each item is a confirmed defect — per the qa-glossary defect term — not a false-fail result
  description: |
    Before classifying, confirm the item is this pack's own defect term and not a false-fail result (a reported failure with no underlying defect in the test object).
- title: Classify each defect's severity — critical, high, medium, or low per the qa-glossary severity term — on technical impact alone
  description: |
    Assign severity per this pack's severity term (qa-glossary), judged independently of urgency. Use the glossary's scale as written.
  role: operator
- title: Classify each defect's priority — P1 to P4 per the qa-glossary priority term — on scheduling urgency, independently of severity
  description: |
    Assign priority per this pack's priority term (qa-glossary), judged independently of severity. Use the glossary's scale as written.
  role: operator
- title: Record the rationale for any severity/priority pairing that looks unusual
  description: |
    Where a defect's severity and priority pull in different directions, note the rationale so a later reader does not mistake it for a classification error.
- title: Confirm every defect in the batch has both fields recorded before closing the ritual
  description: |
    Do not close the ritual while any defect in the batch is missing either its severity or its priority classification.
