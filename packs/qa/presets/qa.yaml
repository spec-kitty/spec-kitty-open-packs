# The `qa` activation preset of the qa pack, in the sanitized preset shape of
# charter ADR-0042. A mission type names roles, not agent profiles (ADR-0032);
# this preset activates the profiles that fill the qa mission type's roles,
# and the qa mission type itself. The pack stays inert until a project applies
# it. qa-defect-triager-dmitri fills no step's role; it is activated for
# on-demand defect triage.
schema_version: "1.0"
id: qa
description: >-
  Run QA missions: activates the qa mission type and the five QA agent profiles
  (strategist, test designer, test executor, reporter and defect triager).
activated_mission_types:
  - id: qa
activated_agent_profiles:
  - id: qa-strategist-quinn
  - id: qa-test-designer-tessa
  - id: qa-test-executor-elena
  - id: qa-reporter-rhea
  - id: qa-defect-triager-dmitri
