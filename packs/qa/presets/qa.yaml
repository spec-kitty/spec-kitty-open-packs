# The `qa` activation preset of the qa pack, in the sanitized preset shape of
# charter ADR-0042. A preset is self-contained, not incremental: it is the whole
# activation selection, and which profiles it holds is an operator's choice. A
# mission type names roles, not agent profiles (ADR-0032); this preset selects
# the QA pack's own profiles for the roles the qa mission type's later steps
# name (qa-strategist, test-designer, test-executor, qa-reporter), and the qa
# mission type itself. The discovery step's `researcher` role is not filled by
# a profile of this pack, so this preset holds none for it; an operator who
# wants one activates it separately or in a preset of their own. The pack stays
# inert until a project applies this preset.
# qa-defect-triager-dmitri fills no step's role; it is selected for on-demand
# defect triage.
schema_version: "1.0"
id: qa
description: >-
  Run QA missions: activates the qa mission type and the five QA agent profiles
  (strategist, test designer, test executor, reporter and defect triager).
activated_mission_types:
  - id: qa
activated_agent_profiles:
  - id: qa-strategist-quinn
  - id: qa-test-designer-tessa
  - id: qa-test-executor-elena
  - id: qa-reporter-rhea
  - id: qa-defect-triager-dmitri
