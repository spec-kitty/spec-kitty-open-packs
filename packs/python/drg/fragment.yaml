- source: agent_profile:python-pedro
  target: foundation::tactic:delete-the-assertion-not-the-test
  relation: requires
  reason: When a touched test is friction (green for the wrong reason or false-red on a correct change), replace its assertion
    with a contract-pinned, red-first one and keep the setup/edge-cases — mine the non-obvious regressions first. Delete a
    whole test only when it is provably zero-coverage or superseded; never delete to dodge a red.
- source: agent_profile:python-pedro
  target: foundation::tactic:dependency-hygiene
  relation: requires
  reason: Pin direct dependency versions in pyproject.toml/uv.lock, restrict resolution to PyPI, audit license compliance,
    and regenerate the SBOM after any dependency change — the pip/uv checks this tactic already covers for Python.
- source: agent_profile:python-pedro
  target: foundation::tactic:supply-chain-install-safety
  relation: requires
  reason: Run the checklist, per DIRECTIVE_051, before accepting a new or changed pip/uv dependency, using the python-supply-chain
    toolguide for exact commands, and record the evidence rather than an aspirational statement of intent.
- source: agent_profile:python-pedro
  target: foundation::tactic:tdd-red-green-refactor
  relation: requires
  reason: Core Python red-green-refactor discipline; migrated from a misfiled operating-procedures entry (it names a tactic,
    not a procedure).
- source: agent_profile:python-pedro
  target: foundation::tactic:test-scaffolding-as-design-smell
  relation: requires
  reason: Write code whose behavior is testable without infrastructure. If a unit test would need real files, git, or several
    mocks to run, invert the dependency and extract a pure seam before adding the test, rather than expanding the mock setup.
- source: agent_profile:python-pedro
