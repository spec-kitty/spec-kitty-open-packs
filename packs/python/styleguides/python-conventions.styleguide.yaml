schema_version: "1.0"
id: python-conventions
title: Python Conventions Styleguide
scope: code
applies_to_languages:
  - python

principles:
  - name: "Guard clauses over nesting"
    description: "Guard clauses over nesting: validate inputs early and fail fast rather than wrapping logic in conditional branches."
  - name: "Type hints on all public APIs"
    description: "Type hints on all public APIs: function signatures, return types, and complex variables must be annotated."
  - name: "Modern Python"
    description: "Modern Python: use built-in generic types (dict, list, tuple), union syntax (str | None), and pathlib for all path operations."
  - name: "f-strings only"
    description: "f-strings only: no %-formatting, no .format(), no string concatenation for interpolation."
  - name: "Quad-A test structure"
    description: "Quad-A test structure: tests follow the testing pack's quad-a-test-structure asset (skeleton and checklist)."
  - name: "Fixtures over setup/teardown"
    description: "Fixtures over setup/teardown: use pytest fixtures for test isolation and automatic cleanup."
  - name: "One assertion focus per test"
    description: "One assertion focus per test: each test validates a single behavior. Use parametrize for variations."
  - name: "Docstrings on public APIs"
    description: "Docstrings on public APIs: Google-style docstrings on modules, classes, and public functions."

patterns:
  - name: Guard Clauses
    description: "Check invalid conditions at function entry and raise immediately, keeping the happy path unindented."
    bad_example: |
      def read_config(path: Path) -> dict:
          if path.exists():
              if path.is_file():
                  with open(path) as f:
                      return yaml.safe_load(f)
              else:
                  raise ValueError("Not a file")
          else:
              raise FileNotFoundError(f"Not found: {path}")
    good_example: |
      def read_config(path: Path) -> dict:
          if not path.exists():
              raise FileNotFoundError(f"Not found: {path}")
          if not path.is_file():
              raise ValueError(f"Not a file: {path}")
          with open(path) as f:
              return yaml.safe_load(f)

  - name: Quad-A Test Structure
    description: "The phases are defined in the testing pack's quad-a-test-structure asset; this is the pytest shape of them."
    bad_example: |
      def test_read_missing(tmp_path):
          result = read_task(tmp_path / "missing.yaml")
          assert result is None
    good_example: |
      def test_read_missing(tmp_path):
          # Arrange
          task_file = tmp_path / "missing.yaml"
          # Assumption check
          assert not task_file.exists(), "precondition: file should not exist"
          # Act & Assert
          with pytest.raises(FileNotFoundError):
              read_task(task_file)

  - name: Modern Type Hints
    description: "Use built-in generics and union syntax. Add from __future__ import annotations for forward references."
    bad_example: |
      from typing import Dict, List, Optional, Union
      def process(data: Dict[str, Any]) -> Optional[List[str]]:
          pass
    good_example: |
      from __future__ import annotations
      def process(data: dict[str, Any]) -> list[str] | None:
          pass

  - name: Path Operations
    description: "Use pathlib.Path for all filesystem work. Never join paths with string concatenation."
    bad_example: |
      config_path = os.path.join(base_dir, "config", "settings.yaml")
      os.makedirs(os.path.dirname(output), exist_ok=True)
    good_example: |
      config_path = base_dir / "config" / "settings.yaml"
      output.parent.mkdir(parents=True, exist_ok=True)

  - name: YAML I/O
    description: "Use safe_load for reading, preserve key order on write, handle empty files."
    good_example: |
      with open(path, "r", encoding="utf-8") as f:
          data = yaml.safe_load(f) or {}
      with open(path, "w", encoding="utf-8") as f:
          yaml.dump(data, f, default_flow_style=False, sort_keys=False)

tooling:
  formatter: "ruff format (or black)"
  linter: "ruff check"
  type_checker: "mypy --strict (or pyright)"
  test_runner: "pytest with pytest-cov"
  import_order: "ruff (isort rules)"

quality_test: "Can a new contributor read one test and understand what behavior it validates, what preconditions it requires, and what a failure means — without reading the production code?"
