# The pack's DRG fragment, the only DRG file an org Charter Pack may ship.
# Read by `charter pack validate`, `doctor charter-packs`, `charter context`
# and profile health.
# Edge endpoints are URNs (<kind>:<id>), local nodes included. The pack's name,
# source and layer come from the operator's configuration, never from this file.
nodes:
  - id: CAVE_001
    kind: directives
    title: "Caveman Terse Output"
    body_path: directives/cave-001-terse-output.directive.yaml
  - id: cave-sty-001-communication
    kind: styleguides
    title: "Caveman Communication Styleguide"
    body_path: styleguides/cave-sty-001-communication.styleguide.yaml
  - id: cave-dev
    kind: mission_types
    title: "Cave Dev Mission Type"
    body_path: missions/cave-dev/cave-dev.mission-type.yaml
  - id: cave-dev/discovery
    kind: actions
    title: "Discovery (caveman)"
  - id: cave-dev/specify
    kind: actions
    title: "Specify (caveman)"
  - id: cave-dev/plan
    kind: actions
    title: "Plan (caveman)"
  - id: cave-dev/tasks
    kind: actions
    title: "Tasks (caveman)"
  - id: cave-dev/analyze
    kind: actions
    title: "Analyze (caveman)"
  - id: cave-dev/implement
    kind: actions
    title: "Implement (caveman)"
  - id: cave-dev/review
    kind: actions
    title: "Review (caveman)"
  - id: cave-dev/accept
    kind: actions
    title: "Accept (caveman)"
edges:
