name: "Cave Dev"
description: "The software-development lifecycle, re-voiced in the caveman terse output style. Same seven canonical steps and the same engineering rigour as software-dev; only the agent's output prose is compressed (outcome-first, filler cut, payloads and negations kept exact)."
version: "1.0.0"
domain: other
workflow:
  phases:
    - name: discovery
      description: "Gather context before specifying. Caveman voice applies to findings prose, not to quoted source."
    - name: specification
      description: "Write the spec. Acceptance criteria stay precise and complete; only the surrounding prose is terse."
    - name: planning
      description: "Produce the implementation plan. Decisions stated outcome-first."
    - name: tasks
      description: "Decompose into work packages."
    - name: implementation
      description: "Build the work packages. Progress replies are terse; code, commands and diffs are exact."
    - name: review
      description: "Review the work. Findings outcome-first; evidence exact."
    - name: acceptance
      description: "Confirm the result against the spec and record the decision."
artifacts:
  required: [spec.md, plan.md, tasks.md]
  optional: []
validation:
  checks: []
