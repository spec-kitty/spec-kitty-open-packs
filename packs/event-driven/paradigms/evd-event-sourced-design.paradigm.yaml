schema_version: "1.0"
id: evd-event-sourced-design
name: Event-Driven, Event-Sourced Design
summary: >
  Treat the ordered log of domain events as the source of truth and every other
  piece of state as a projection derived from it. A change is recorded once, as
  an immutable, versioned fact appended by the one writer that owns its stream;
  current state, read models and side effects (files, git, notifications,
  remote calls) are rebuilt or triggered by consumers that read the log. The
  flow is publish -> ledger -> subscribe: producers and consumers never call
  each other and share nothing but published event contracts. The domain core
  stays pure: it decides which events happened and hands them to a port; an
  adapter behind that port is the only code that writes the ledger. Because
  the log is complete, state can be rebuilt from scratch, inspected as of any
  past point, and re-derived after a projection bug is fixed. Adopt it where an
  audit trail, replay, or independent consumers are worth the cost of
  versioning events forever; a plain CRUD store is the better default
  elsewhere.
principles:
  - name: The log is the truth
    description: The ordered record of events is authoritative, and all other state is derived from it.
  - name: Facts are immutable
    description: An event states what happened and is never rewritten; corrections are new events.
  - name: One writer per stream
    description: A single owner appends to each stream, so ordering and responsibility are unambiguous and no two writers race to decide what happened.
  - name: Producers and consumers stay apart
    description: They share only published event contracts, so either side can change or be added without the other knowing.
  - name: A pure core behind a port
    description: The domain decides what happened without touching storage, so its decisions can be tested and replayed in isolation.
  - name: State can always be rebuilt
    description: Because the log is complete, any projection can be recreated or inspected at any past point.
  - name: Pay for it only where it pays back
    description: Audit, replay and independent consumers must justify the lasting cost of versioning events.
