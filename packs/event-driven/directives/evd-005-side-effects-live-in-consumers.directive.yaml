id: EVD_005
schema_version: "1.0"
title: Side Effects Live in Consumers, Not in the Domain Core
enforcement: required
intent: >
  The domain core decides what happened; it does not touch the world. Writing files,
  committing to git, calling remote services or sending notifications are reactions
  to events, run by consumers after the event is in the ledger. Keeping them out of
  the core makes it pure, testable without I/O, and safe to replay: rebuilding state
  never re-sends an email or re-commits a file.
scope: >
  Domain logic (aggregates, policies, decision functions) and every side effect that
  follows a state change: filesystem, version control, network, notifications.
validation_criteria:
  - "Domain functions take state and a request and return events (or a refusal); they
    perform no I/O. Their tests need no filesystem, git repository or network."
  - "Every side effect runs in a consumer that subscribes to the event that justifies it,
    after that event was appended."
  - "A consumer is idempotent per event id, so a redelivered or replayed event does not
    repeat the effect (`evd-idempotent-consumer`)."
  - "Replaying the ledger to rebuild a projection does not trigger side-effecting
    consumers; replay and live delivery are distinguishable."
  - "A failed side effect is recorded (for example as a later failure event or a parked
    delivery) and retried by the consumer; it never rolls back the event that caused it."
explicit_allowances:
  - "Reading reference data the decision needs (configuration, a clock passed in) is
    allowed when it is handed to the domain function as an argument."
references:
  - type: tactic
    id: evd-event-bridge-port
    when: when separating the pure core from adapters
  - type: tactic
    id: evd-idempotent-consumer
    when: when writing the consumer that performs the effect
