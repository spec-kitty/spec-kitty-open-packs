schema_version: '1.0'
id: identity-value-inputs
title: Identity Value Inputs
description: Using 0 for addition, 1 for multiplication, or an empty string makes the original operator and its mutation produce
  the same result.
severity: severe
bad_example: |-
  def test_discount():
      assert apply_discount(price=100, rate=0) == 100  # 100 * 0 == 100 / 0 would crash,
                                                       # but 100 - 0 == 100 + 0 == 100
good_example: |-
  def test_discount():
      assert apply_discount(price=100, rate=0.2) == 80.0  # 100 - 20 != 100 + 20
