schema_version: '1.0'
id: substring-case-insensitive-message-assertion
title: Substring/Case-Insensitive Message Assertion
description: Asserting an error or log message with a substring or case-insensitive check lets every case-change, prefix,
  or suffix mutation of that string survive. Assert the exact string; define it as a module-level constant when reused.
severity: severe
bad_example: |-
  def test_guard_rejects_missing_actor():
      ok, error = validate_transition("planned", "claimed", actor=None)
      assert ok is False
      assert "actor" in error.lower()   # survives "Actor" -> "actor" mutation
good_example: |-
  ACTOR_REQUIRED_MSG = "Transition planned -> claimed requires actor identity"

  def test_guard_rejects_missing_actor():
      ok, error = validate_transition("planned", "claimed", actor=None)
      assert ok is False
      assert error == ACTOR_REQUIRED_MSG   # kills all case/prefix/suffix mutations
