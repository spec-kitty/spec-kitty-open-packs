id: quadruple-a-test-format
schema_version: '1.0'
title: Quadruple-A Test Format
scope: testing
principles:
- name: A test has four phases
  description: 'A test has four phases: Arrange, Assumption checks, Act, Assert. Naming them turns a test into the canonical skeleton for pinning ONE behaviour. The skeleton and a review checklist live in the quad-a-test-structure asset.'
- name: Arrange phase
  description: 'Arrange: set up the system in the desired state to commence the test — construct the objects, load the fixtures, and put collaborators into the precondition the behaviour under test requires.'
- name: Assumption checks
  description: 'Assumption checks: verify the system is in the pre-condition state before acting, so a wrong fixture fails loudly here instead of masquerading as a failure of the behaviour under test.'
- name: Act phase
  description: 'Act: execute the code or behaviour under test, now that the system is in the desired state. Exactly one action is exercised — the single trigger whose effect the test exists to describe.'
- name: Assert phase
  description: 'Assert: validate that the effects of the action are what you expect — the observable outcome, the returned value, the raised error, the emitted event — not the internal mechanism by which it was produced.'
- name: One behaviour per test
  description: One behaviour per test. The four phases describe a single behavioural increment; a test that needs two Act phases or two unrelated Assert clusters is two behaviours and should be split.
patterns:
- name: The Four Phases, Labelled
  description: |
    Write the phases in intent order — Arrange, Assumption check, Act, Assert — and label them, so a reader sees the precondition, the trigger, and the expected effect at a glance. The assumption check verifies the arranged state is the one the test claims, converting a silent wrong-fixture bug into a visible, self-describing failure.
  bad_example: |
    def test_rejects_expired_item():
        item = Item(expiry_date=date.today() - timedelta(days=1))
        # No assumption check: if a refactor makes the fixture non-expired,
        # this test fails "wrongly" and the real precondition bug is invisible.
        with expect_raises(ExpiredError):
            service.process(item)
  good_example: |
    def test_rejects_expired_item():
        # Arrange — put the system in the desired state
        item = ItemFixtures.expired_yesterday()
        # Assumption check — verify the precondition actually holds
        assert item.expiry_date < date.today()
        # Act — execute the single behaviour under test
        with expect_raises(ExpiredError):
            service.process(item)
        # Assert is fused with Act here: the raised error IS the effect
- name: Assumption Check Preceding Arrange
  description: |
    When the system's DEFAULT state already is the precondition, assert that starting state first, then arrange only the delta. The assumption check earns its place at the top: it pins the environment the rest of the test relies on, so a change to the default that would silently invalidate the test fails here with a clear message.
  bad_example: |
    def test_first_write_creates_the_ledger():
        # Arranges a delta while ASSUMING an empty start it never checks;
        # a leftover ledger from another test makes the assert meaningless.
        entry = LedgerEntry(amount=100)
        ledger.append(entry)
        assert ledger_path.exists()
  good_example: |
    def test_first_write_creates_the_ledger():
        # Assumption check FIRST — the default state IS the precondition
        assert not ledger_path.exists()
        # Arrange — the minimal delta the behaviour needs
        entry = LedgerEntry(amount=100)
        # Act
        ledger.append(entry)
        # Assert
        assert ledger_path.exists()
- name: Assumption checks
  description: |
    Assumption checks: verify the system is in the pre-condition state before acting, so a wrong fixture fails loudly here instead of masquerading as a failure of the behaviour under test. The assumption check MAY PRECEDE Arrange when the system's default state already IS the precondition — you assert the starting state first, then (if needed) arrange further — so the phase is about position in intent, not a rigid line order.
quality_test: Can a reader name the precondition (Arrange + Assumption check), the single trigger (Act), and the expected effect (Assert) of this test at a glance, and would a wrong fixture fail at the assumption check rather than masquerade as a behaviour failure?
