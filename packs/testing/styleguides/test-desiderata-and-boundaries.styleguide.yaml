schema_version: "1.0"
id: test-desiderata-and-boundaries
title: Test Desiderata and Clear Test Boundaries
scope: testing
applies_to_languages: []

# Sources (traceable adoption):
#   - Kent Beck, "Test Desiderata" — https://testdesiderata.com/
#   - Stijn Dejongh, "Define Test Boundaries" —
#     https://patterns.sddevelopment.be/practices/define_test_boundaries/
# Complements the broader `testing-principles` styleguide; this artifact focuses
# on (a) the desiderata as properties to trade off deliberately and (b) drawing
# the test boundary by functional responsibility so infrastructure is stubbed at
# a real seam rather than mocked ad hoc.

principles:
  # — Kent Beck's twelve test desiderata: properties to optimize through deliberate
  #   trade-offs. The checklist asset lists them; this styleguide keeps how to use them.
  - name: "Desiderata are trade-offs"
    description: "Desiderata are trade-offs: choose which properties a given test optimizes; do not pretend one test maximizes all twelve at once."
  - name: "The twelve desiderata"
    description: "The twelve properties (Isolated, Composable, Deterministic, Fast, Writable, Readable, Behavioral, Structure-insensitive, Automated, Specific, Predictive, Inspiring) are defined once, in the testing pack's test-desiderata-checklist asset."
  # — Clear Test Boundaries (Define Test Boundaries):
  - name: "Boundary by responsibility, not by layer"
    description: "Boundary by responsibility, not by layer: include exactly the components responsible for the behavior under test; everything else is outside the boundary."
  - name: "Infrastructure sits outside the boundary"
    description: "Infrastructure sits outside the boundary: DIRECTIVE_054's allow-listed seams (filesystem, database, network to external services, clock, randomness, git and other external processes) may be replaced by doubles or pure inputs; 054 owns the list."
  - name: "Assert observable outcomes, not mechanisms"
    description: "Assert observable outcomes, not mechanisms: test the behavior crossing the boundary, not internal call counts or field values, to stay structure-insensitive."
  - name: "Heavy scaffolding signals a wrong boundary"
    description: "Heavy setup or a double of owned logic means the boundary is wrong: extract a pure seam that takes domain inputs. Real IO itself is allowed (DIRECTIVE_054); it is not the smell."
  # — Detect as far left as possible: every desideratum a machine can check is
  #   checked before a human (or a slow suite) has to notice it.
  - name: "Shift detection left"
    description: "Shift detection left: catch each violation at the earliest, cheapest point that can see it. What a formatter, linter, or static check can reject never waits for a test run."
  - name: "Behavioral is proven, not assumed"
    description: "Behavioral is proven, not assumed: a test guarding a contract shows it can go red (plant the break and watch it fail). A test asserting on data it built itself, or on a stub's return value, is not Behavioral however green."
  - name: "Test name is the contract"
    description: "The name is the contract: Readable and Specific require that the body asserts exactly what the name promises. A test named 'does not leak X' that asserts X is present, or 'exits non-zero on Y' that accepts any exit, is a defect in the test."

patterns:
  - name: Map each desideratum to its earliest detector
    description: >
      For every property, know where a violation is caught first, and move the
      check as far left as the tooling allows. In a Python/pytest codebase:
      Specific can be linted (ruff PT018 composite assertions, one behaviour per
      test); Behavioral is partly linted (ruff PT011/PT030 broad raises or warns
      without match=, PT017 assertion inside an except, PT012/PT031 multi-statement
      raises or warns blocks) and otherwise proven by a planted-break self-test;
      Isolated and Deterministic are checked statically (banned wall-clock and
      global-state APIs) before they surface as flaky reruns; Realistic data is
      checked by a static literal-shape scan of identifiers in fixtures;
      Structure-insensitive is checked by a census of internal patches and
      private-name imports per test. Review is for judgement a machine cannot
      make: whether the assertion matches the name, whether a stub hides the path
      under test.
    bad_example: |
      # Found three reviews later, by a human:
      with pytest.raises(Exception):   # passes on ANY failure, including a typo
          run(bad_input)
    good_example: |
      # pyproject.toml: rejected by the linter, before any test runs
      [tool.ruff.lint]
      select = [..., "PT011", "PT012", "PT017", "PT030"]
      # Legacy hits are frozen per file in a shrink-only baseline, with a guard
      # test that fails on growth, on stale entries, and on a planted violation.

  - name: Draw the boundary by functional responsibility
    description: >
      Pick the behavior to validate, identify the components responsible for it,
      and place the test boundary around exactly those. Infrastructure (IO, a database, external services) may be replaced with
      simple inputs or doubles at the allow-listed seams of DIRECTIVE_054. This keeps tests Fast, Isolated, Writable, and
      Structure-insensitive (Define Test Boundaries; Beck's desiderata).
    bad_example: |
      # The unit reaches the filesystem + git directly, so the "unit" test needs
      # many patches to run: a smell about the patches, not about real files.
      def test_overlap_rejected(tmp_path):
          _write_order_dir(tmp_path)
          with patch("...find_config_root"), \
               patch("...save_order"), patch("...run_command"), \
               patch("...load_initial_state"):    # infra scaffolding
              schedule_deliveries(order="o-1", validate_only=True)
          # assertion buried behind subprocess/JSON parsing
    good_example: |
      # A pure seam takes domain inputs; the behavior is validated with plain
      # stubs — no files, no git, no command mocking. The IO stays outside.
      def test_overlap_rejected():
          plan = build_delivery_plan({
              "D1": slot(window=("09:00", "11:00")),
              "D2": slot(window=("10:00", "12:00")),   # overlapping, narrow
          })
          assert not validate_slots(plan).passed

  - name: Resolve desiderata tension by design, not by accepting brittleness
    description: >
      When two desiderata appear to conflict (e.g. Predictive vs Fast,
      Behavioral vs Structure-insensitive), prefer a design change — a clearer
      boundary, a pure function, composition — over a brittle test. A pure seam
      at the boundary usually recovers Fast + Isolated + Specific simultaneously.
    good_example: |
      # Behavioral AND structure-insensitive: assert the outcome that crosses the
      # boundary, regardless of which internal helper produced it.
      assert resolve_shipping(order, "o-1").carrier == expected
  - name: "Shift detection left"
    description: >
      Shift detection left: catch each violation at the earliest, cheapest point
      that can see it. What a formatter, linter, or static check can reject never
      waits for a test run; what a unit test can catch never waits for an
      integration or end-to-end run; what a lint-time check can catch never waits
      for review.
  - name: "Behavioral is proven, not assumed"
    description: >
      Behavioral is proven, not assumed: a test that guards a contract shows it
      can go red — plant the break (or run against the unfixed code) and watch it
      fail. A test that asserts on data it built itself, or on a stub's return
      value, is not Behavioral however green it is.
  - name: "Test name is the contract"
    description: >
      The name is the contract: Readable and Specific require that the body
      asserts exactly what the name promises. A test named 'does not leak X' that
      asserts X is present, or 'exits non-zero on Y' that accepts any exit, is a
      defect in the test. Sources: https://testdesiderata.com/;
      https://patterns.sddevelopment.be/practices/define_test_boundaries/.

quality_test: >
  Can the behavior under test be validated with plain in-memory inputs or real
  files and a real git repo in a temp dir, with doubles only at allow-listed seams
  (DIRECTIVE_054)? If the test needs several patched infrastructure functions or
  a double of logic the unit owns, the boundary is in the wrong place — extract a
  pure seam before adding the test.
