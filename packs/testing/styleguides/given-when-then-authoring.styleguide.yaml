schema_version: "1.0"
id: given-when-then-authoring
title: Given-When-Then Scenario Authoring
scope: testing
applies_to_languages: []

principles:
  - name: "A scenario has three parts"
    description: "A scenario has three parts: Given (the precondition/context), When (the single trigger), Then (the observable outcome). This is the same behavioural skeleton the specs in this repository already use — one scenario describes one behaviour."
  - name: "Given establishes preconditions"
    description: "Given establishes the context and preconditions the behaviour needs — the state of the world before the trigger. It is not an action; it is where the system starts."
  - name: "When is the single trigger"
    description: "When is the single trigger — exactly one event or action whose effect the scenario exists to describe. Two Whens are two behaviours; split them."
  - name: "Then states the observable outcome"
    description: "Then states the observable outcome — what an outside observer can verify after the trigger. It asserts effects and contracts, not the internal mechanism that produced them."
  - name: "Extend phases with And and But"
    description: "And / But extend the phase they follow (a second Given fact, a second Then observation); they never smuggle a second trigger into a scenario. Reach for Background to lift Givens shared by every scenario in a feature."
  - name: "Write in domain language, declaratively"
    description: "Write in domain language, declaratively. Say WHAT holds and WHAT is observed in the ubiquitous language of the domain — not the imperative UI steps (click, type, navigate) or the code-level calls that happen to realise it."
  - name: "Keep scenarios runner-agnostic"
    description: "Keep scenarios runner-agnostic. A well-authored Given-When-Then reads the same whether it is executed by one BDD runner, another, or by a plain unit test; it names behaviour, not a tool."

patterns:
  - name: One Trigger, Domain Language, Declarative
    description: >
      Anchor the scenario on a single When phrased in domain terms, with Given
      setting the precondition and Then naming the observable outcome. The result
      reads as a behavioural contract a stakeholder can validate, and survives a
      change of implementation or test runner unchanged.
    good_example: |
      Given an account with a balance of 100 EUR
      When the holder withdraws 30 EUR
      Then the balance is 70 EUR
      And a withdrawal receipt is issued
    bad_example: |
      Given the user opens the accounts page
      When they click "Withdraw", type "30", and press Enter
      And the API returns 200
      Then the <span id="balance"> element shows "70"

  - name: Background for Shared Context
    description: >
      When every scenario in a feature shares the same opening Givens, lift them
      into a Background so each scenario states only the context that
      distinguishes it. The behaviours stay one-per-scenario and the shared
      precondition is declared once.
    good_example: |
      Background:
        Given a registered customer with a verified email

      Scenario: A verified customer can place an order
        When they submit a cart of in-stock items
        Then the order is accepted

  - name: "Keep scenarios runner-agnostic"
    description: >-
      Keep scenarios runner-agnostic. A well-authored Given-When-Then reads the same whether it is executed by
      one BDD runner, another, or by a plain unit test; it names behaviour, not a tool. (The Gherkin DSL is
      one notation for writing these scenarios; the authoring conventions here are independent of it.)

quality_test: "Does each scenario state one precondition (Given), one trigger (When), and one observable outcome (Then) in domain language, and would it still read correctly if executed by a different runner or as a plain unit test?"
