schema_version: "1.0"
id: testing-principles
title: Testing Principles Styleguide
scope: testing
applies_to_languages: []

principles:
  - name: "Fast, Isolated, Specific"
    description: "Fast, Isolated and Specific are three of Beck's twelve desiderata; the testing pack's test-desiderata-checklist asset defines them once."
  - name: "Repeatable results"
    description: "Repeatable: a test gives the same result on any machine; order independence and determinism are the desiderata checklist's Isolated and Deterministic."
  - name: "Self-validating tests"
    description: "Self-validating: a test either passes or fails — no human inspection of logs required."
  - name: "Timely tests"
    description: "Timely: tests are written at the same time as (or before) the production code they validate."
  - name: "Thorough coverage"
    description: "Thorough: the test suite covers edge cases, failure paths, and boundary conditions — not only the happy path."
  - name: "Truthful tests"
    description: "Truthful: a passing test proves the behavior it describes is actually present in production code."
  - name: "Realistic test data"
    description: "Realistic: test data mirrors the shape and invariants of production data — real-format identifiers, valid lengths and ranges, plausible values."
  - name: "Documenting the system"
    description: "Documenting: reading the test suite gives a new contributor a clear model of how the system behaves — this is the refactor-stable, documents-the-system sense; see test-desiderata-and-boundaries for the desiderata that trade off confidence-to-ship."
  - name: "Pyramid shape and mocks have owners"
    description: "Pyramid shape and mock boundaries have one owner each: layer shape lives in named testing tactics; the seam list lives in DIRECTIVE_054 (foundation); the test-desiderata-checklist asset defines the desiderata. Apply those."
  - name: "Exemplary tests"
    description: "Exemplary: tests are the best usage examples of the production code they exercise."
  - name: "Minimal tests"
    description: "Minimal: each test contains only the code necessary to validate one behavior increment."
  - name: "Invariants over shape"
    description: "Invariants over shape: architecture and acceptance tests pin behavioral invariants — what must be absent, what contract must hold — not implementation shape."
  - name: "Negative and behavioral forms first"
    description: "Negative and behavioral forms first: prefer forbidden-pattern-absent AST scans and behavioral contracts exercised through public surfaces over positive literal-presence scans."
  - name: "Size metrics belong to static analysis"
    description: "Size metrics belong to static analysis: do not encode LOC ceilings, function-count limits, or complexity thresholds in pytest. These metrics belong in static-analysis tooling — Sonar, ruff C901 — configured project-wide."
  - name: "Convert or delete, never re-pin"
    description: "Convert or delete, never re-pin: when a test fails on a behavior-preserving refactor, either convert it to an invariant-stable form (behavioral or negative) or delete it with surviving-coverage proof."
  - name: "Shrink-only count ratchets are sanctioned"
    description: "Shrink-only count ratchets are sanctioned: exception-set and allowlist count ratchets are acceptable only when they can shrink — new entries require a visible human approval step in code review."
  - name: "Transitional shape guards need a retirement plan"
    description: "Transitional shape guards need a retirement plan: tests written to enforce a transitional architectural state must carry a known retirement path — a comment referencing the issue that closes them when the migration completes."

patterns:
  - name: Single-Responsibility Test
    description: >
      Each test names and exercises exactly one refactor-stable behavior. Tests that cross
      multiple responsibilities are harder to name, harder to diagnose, and harder to
      maintain. (Where to draw the boundary is the test-boundaries-by-responsibility tactic's
      subject, and which seams may be substituted is DIRECTIVE_054's; this pattern is about
      what one test method asserts.)
    bad_example: |
      @Test
      void testEverything() {
          // Creates entity, persists it, loads it back, validates it, sends an event, checks the log
      }
    good_example: |
      @Test void shouldPersistAndReload() { /* repository contract only */ }
      @Test void shouldEmitCreatedEvent()  { /* event emission only */ }
      @Test void shouldRejectInvalidName() { /* validation only */ }

  - name: Frozen Composite Gate Keys
    description: >
      Build architectural gate allowlists from frozen tool-derived composite keys —
      (file, enclosing_qualname, token_line) — rather than seed-derived live re-computation.
      Frozen keys are immune to line-number drift: inserting or removing lines above an
      allowlisted site does not change the key. Seed-derived keys re-derive the token at
      scan time and silently pass when the content at the seed line changes to match the
      live production state — making a real content change at an allowlisted site invisible
      to the gate.
    good_example: |
      # Allowlist stores the frozen enclosing qualname + verbatim token string.
      # Refreshed only by running the one-time derivation tool — never hand-edited.
      _ALLOWED_SITES = frozenset({
          GateAllowlistKey(
              enclosing_qualname="resolve_invoice_dir",
              token_line="return primary_invoice_dir_for_account(root, account_id)",
          ),
      })
      # Staleness guard: every frozen key must still exist in the live scan.
      def test_pinned_keys_still_live(live_keys):
          stale = _ALLOWED_SITES - live_keys
          assert not stale, f"Evict or re-approve: {stale}"
    bad_example: |
      # Allowlist stores raw line numbers; re-derives token at scan time.
      # Inserting a blank line above the site shifts the seed line to new content —
      # the derived token changes, the live token does not → false gate failure.
      # If the seed-line content is edited to match the new live token,
      # MATCH is True — a real content change passes undetected.
      _RAW_SEEDS = [("src/module.py", 217)]  # line-number seed only

  - name: Negative AST Invariant
    description: >
      Scan for the ABSENCE of a forbidden pattern — import, call site, attribute access —
      via AST traversal rather than asserting the PRESENCE of a literal string. Absence
      assertions survive renaming and reformatting; they encode a real architectural
      constraint ("this module must never call X directly"). Positive literal-presence
      assertions break on any reformatting and encode no constraint beyond "this exact
      text appeared here once."
    good_example: |
      # AST scan: fails only when the forbidden call is introduced — survives all renaming.
      import ast, pathlib
      def test_no_direct_os_getcwd_in_resolver():
          src = pathlib.Path("src/myproject/resolver.py").read_text()
          tree = ast.parse(src)
          direct_calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == "getcwd"
          ]
          assert not direct_calls, "resolver must not call os.getcwd() directly"
    bad_example: |
      # Literal-presence scan: breaks on reformatting, passes when a renamed-but-
      # semantically-equivalent path is taken — encodes zero architectural invariant.
      def test_resolver_uses_canonical_root():
          src = pathlib.Path("src/myproject/resolver.py").read_text()
          assert "canonical_root()" in src  # re-pin required on every rename
  - name: "Realistic test data"
    description: >
      Realistic: test data mirrors the shape and invariants of production data —
      real-format identifiers, valid lengths and ranges, plausible values. Fabricated
      placeholder values that violate production constraints test a world that cannot
      occur; they mask real behavior and mislead debugging.
  - name: "Documenting the system"
    description: >
      Documenting: reading the test suite gives a new contributor a clear model of how
      the system behaves — this is the refactor-stable, documents-the-system sense; see
      test-desiderata-and-boundaries for the desiderata that trade off
      confidence-to-ship (Inspiring) against the other eleven.
  - name: "Pyramid shape and mocks have owners"
    description: >
      Pyramid shape and mock boundaries have one owner each: layer shape and proportion
      live in the testing-select-appropriate-level tactic and run order in the
      test-pyramid-progression tactic; the seam list (where a test may substitute a
      collaborator) lives in DIRECTIVE_054 (foundation), with the
      test-boundaries-by-responsibility tactic saying how to draw the boundary;
      the test-desiderata-checklist asset defines the desiderata and
      test-desiderata-and-boundaries owns trading them off, and names over-mocking
      as the symptom of a missing seam.
      Apply those instead of a local copy.
  - name: "Invariants over shape"
    description: >
      Invariants over shape: architecture and acceptance tests pin behavioral
      invariants — what must be absent, what contract must hold — not implementation
      shape. A test that fails on a clean refactor that preserved all observable
      behavior was measuring the wrong thing; the fix is in the test, not the change.
  - name: "Negative and behavioral forms first"
    description: >
      Negative and behavioral forms first: prefer forbidden-pattern-absent AST scans
      and behavioral contracts exercised through public surfaces over positive
      literal-presence scans. Literal-presence assertions break on renaming and
      reformatting while encoding no architectural invariant; absence assertions
      survive them and encode a real constraint.
  - name: "Size metrics belong to static analysis"
    description: >
      Size metrics belong to static analysis: do not encode LOC ceilings,
      function-count limits, or complexity thresholds in pytest. These metrics belong
      in static-analysis tooling — Sonar, ruff C901 — configured project-wide. A
      per-file pytest gate ignores the rest of the codebase and fails the contributor
      who added a docstring while passing the one who doubled a neighboring file.
  - name: "Convert or delete, never re-pin"
    description: >
      Convert or delete, never re-pin: when a test fails on a behavior-preserving
      refactor, either convert it to an invariant-stable form (behavioral or negative)
      or delete it with surviving-coverage proof. Re-pinning to the new literal shape
      teaches contributors that tests are friction not a safety net, and compounds the
      debt on every future cleanup.
  - name: "Shrink-only count ratchets are sanctioned"
    description: >
      Shrink-only count ratchets are sanctioned: exception-set and allowlist count
      ratchets are acceptable only when they can shrink — new entries require a
      visible human approval step in code review. A ratchet whose count increases
      silently is a debt accumulator; one that decreases only on cleaning is a health
      signal.
  - name: "Transitional shape guards need a retirement plan"
    description: >
      Transitional shape guards need a retirement plan: tests written to enforce a
      transitional architectural state must carry a known retirement path — a comment
      referencing the issue that closes them when the migration completes. Tests
      without a plan outlive their purpose and accumulate into a quarantine backlog
      requiring a formal adjudication pass to clear.

quality_test: "Can a new contributor read one test and understand what behavior it validates, what preconditions are required, and what a failure means — without reading the production code?"
