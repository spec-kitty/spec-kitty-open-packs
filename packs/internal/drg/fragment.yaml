edges:
  # Reference-not-duplicate: the landing runbook refines built-in Charter Pack doctrine that
  # already ships publicly, rather than re-authoring it. Targets are
  # fully-qualified <kind>:<id> DRG URNs (singular kind), verified present in
  # packs/built-in/.
  - source: "procedure:landing-contributor-prs"
    target: "foundation::directive:RED_MAIN_RELEASE_DISCIPLINE"
    relation: refines
  - source: "procedure:landing-contributor-prs"
    target: "foundation::tactic:pr-agent-worktree-isolation"
    relation: refines
  # The landing pass takes the shared delivery rules (deferral bar, tree check, PR body,
  # changelog, generated docs, base ref) from their one owner.
  - source: "procedure:landing-contributor-prs"
    target: "procedure:mission-wrap-up-sequence"
    relation: requires
    reason: "The deferral bar, tree check, base ref, PR-body contract, changelog and generated-docs rules a landing pass applies."
  # No-full-heavy-suite directive reconciles with (does not duplicate) the
  # built-in test-run discipline and red-main policy: bounded/single test
  # runs, and reds outside blast radius are CI's to report, not to chase
  # by widening the local run.
  - source: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    target: "testing::tactic:no-parallel-duplicate-test-runs"
    relation: refines
  - source: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    target: "foundation::directive:RED_MAIN_RELEASE_DISCIPLINE"
    relation: refines
  # The built-in post-merge adjudication procedure inventories failing gates;
  # this directive bounds how a mission agent runs them locally (named gate
  # files, never the whole architectural directory).
  - source: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    target: "foundation::procedure:post-merge-arch-gate-adjudication"
    relation: refines
  # Postmortem authoring chain (all targets are local nodes declared above).
  # The procedure suggests the writing styleguide and the branded-deliverable
  # tactic; the tactic requires the generation toolguide; the toolguide requires
  # the generator asset.
  - source: "procedure:project-evolution-postmortem"
    target: "styleguide:report-writing"
    relation: suggests
  - source: "procedure:project-evolution-postmortem"
    target: "tactic:branded-deliverable"
    relation: suggests
  # Executive-debrief chain: the generation procedure suggests its styleguide and
  # reuses the branded-deliverable discipline; the styleguide refines the general
  # report-writing styleguide rather than restating its voice rules.
  - source: "procedure:executive-debrief-generation"
    target: "styleguide:executive-debrief"
    relation: suggests
  - source: "procedure:executive-debrief-generation"
    target: "tactic:branded-deliverable"
    relation: suggests
  - source: "styleguide:executive-debrief"
    target: "styleguide:report-writing"
    relation: refines
  - source: "tactic:branded-deliverable"
    target: "toolguide:branded-document-generation"
    relation: requires
  - source: "toolguide:branded-document-generation"
    target: "asset:spec-kitty-branded-pdf"
    relation: requires
  # Repository-specific refinements of repository-agnostic built-in Charter Pack artifacts.
  # Each internal node refines the built-in artefact it specialises.
  - source: "procedure:spec-kitty-arch-gate-adjudication"
    target: "foundation::procedure:post-merge-arch-gate-adjudication"
    relation: refines
  - source: "procedure:spec-kitty-arch-gate-adjudication"
    target: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    relation: requires
  - source: "directive:SPEC_KITTY_RED_MAIN_POLICY"
    target: "foundation::directive:RED_MAIN_RELEASE_DISCIPLINE"
    relation: refines
  - source: "styleguide:spec-kitty-package-tiers"
    target: "styleguide:tiered-standards"
    relation: refines
  - source: "styleguide:spec-kitty-tracker-labels"
    target: "planning-analysis::styleguide:planning-and-tracking"
    relation: refines
  # The terminology guard moved here from built-in with its outbound edges.
  - source: "toolguide:terminology-guard"
    target: "foundation::directive:DIRECTIVE_044"
    relation: suggests
  - source: "toolguide:terminology-guard"
    target: "foundation::tactic:canonical-source-unification"
    relation: suggests
  - source: "toolguide:terminology-guard"
    target: "foundation::tactic:occurrence-classification-workflow"
    relation: suggests
  - source: "styleguide:spec-kitty-docs-lint-config"
    target: "writing::styleguide:common-docs"
    relation: refines
  - source: "tactic:spec-kitty-gate-non-vacuity-exemplar"
    target: "foundation::tactic:architectural-gate-non-vacuity"
    relation: refines
  - source: "tactic:spec-kitty-ratchet-cost"
    target: "foundation::tactic:frozen-baseline-shrink-only-ratchet"
    relation: refines
    when: "when applying the repository-agnostic ratchet mechanics this tactic prices"
  # Backlog-triage authoring chain (moved from built-in). Ported
  # verbatim from the built-in tactic.graph.yaml / procedure.graph.yaml edge
  # set for these two artifacts, plus their outbound edges to built-in
  # nodes (moscow-scoping-lens, issue-triage-state-machine,
  # planning-and-tracking, github-tracker) -- an internal node referencing a
  # built-in one is allowed; only the reverse direction is forbidden.
  - source: "tactic:tracker-backlog-iterative-deepening"
    target: "foundation::tactic:moscow-scoping-lens"
    relation: suggests
    when: "Scoping what an emergent epic must, should, could, or won't carry once a ring surfaces it."
  - source: "procedure:tracker-organisation-workflow"
    target: "tactic:tracker-backlog-iterative-deepening"
    relation: requires
    reason: "Sequences the backlog sweep in widening time windows so emergent groupings become epics before later rings reach them."
  - source: "procedure:tracker-organisation-workflow"
    target: "foundation::tactic:moscow-scoping-lens"
    relation: suggests
    reason: "Provides the scoping lens for negotiating what each bucket or slice must, should, could, or won't carry, distinct from the priority label taxonomy."
  - source: "procedure:tracker-organisation-workflow"
    target: "planning-analysis::procedure:issue-triage-state-machine"
    relation: suggests
    reason: "Per-ticket triage — one category and one state with durable handoff or rejection context — feeding this tracker-wide organisation pass."
  - source: "procedure:tracker-organisation-workflow"
    target: "planning-analysis::styleguide:planning-and-tracking"
    relation: suggests
    reason: "Defines the epic/meta-tracker hierarchy, issue-type, priority, and triage conventions this workflow enforces while organising the tracker."
  - source: "procedure:tracker-organisation-workflow"
    target: "foundation::toolguide:github-tracker"
    relation: suggests
    reason: "Supplies the gh CLI + GraphQL mechanics (sub-issues, types, parent walks) used to read and re-home tickets during the organisation pass."
  # Test-suite quality assessment chain: the procedure requires the scan
  # toolguide, which requires the scanner asset; the review itself applies the
  # built-in test doctrine rather than restating it.
  - source: "procedure:test-suite-quality-assessment"
    target: "toolguide:test-quality-triage"
    relation: requires
    reason: "How to run the static triage asset and read its outputs."
  - source: "toolguide:test-quality-triage"
    target: "asset:test-quality-scan"
    relation: requires
  - source: "procedure:test-suite-quality-assessment"
    target: "testing::styleguide:test-desiderata-and-boundaries"
    relation: suggests
    reason: "The twelve desiderata, the shift-left detector map and the harness anti-patterns the review applies."
  - source: "procedure:test-suite-quality-assessment"
    target: "testing::styleguide:testing-principles"
    relation: suggests
    reason: "The good-test rubric (truthful, minimal, specific, realistic, isolated) the verdicts are judged against."
  - source: "procedure:test-suite-quality-assessment"
    target: "foundation::directive:DIRECTIVE_041"
    relation: suggests
    reason: "Tests are scaffold, not friction; a green test that stays green on a regression gives no coverage."
  - source: "procedure:test-suite-quality-assessment"
    target: "testing::procedure:development-assist-test-cleanup"
    relation: suggests
    reason: "The KEEP, RETIRE and SPLIT-BY-KIND classification for Mission-scaffold tests."
  - source: "procedure:test-suite-quality-assessment"
    target: "foundation::procedure:adversarial-squad-deployment"
    relation: suggests
    reason: "How to run the domain review squads as bounded, profile-loaded lenses."
  - source: "procedure:test-suite-quality-assessment"
    target: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    relation: requires
    reason: "Verification runs named test files only, never whole heavy suites."
  # Cloud-session dispatch binds the per-kind doctrine rather than restating it.
  - source: "procedure:cloud-session-dispatch"
    target: "directive:CLOUD_SESSION_ORCHESTRATION"
    relation: requires
    reason: "Sibling access, orchestrator-mediated writes, blocked-session replacement and shared numbering are binding."
  - source: "procedure:cloud-session-dispatch"
    target: "directive:NO_FULL_HEAVY_SUITES_IN_MISSION"
    relation: requires
    reason: "The runner targets specific gate files and never runs the full heavy suites."
  - source: "procedure:cloud-session-dispatch"
    target: "foundation::directive:DIRECTIVE_025"
    relation: suggests
    reason: "Tidy-first / enabler sequencing for structural dispatches."
  - source: "procedure:cloud-session-dispatch"
    target: "foundation::directive:RECONCILE_CHANGE_SCOPE_TENSIONS"
    relation: suggests
    reason: "The tidy-first carve-out that separates the preparatory step from the functional change."
  - source: "procedure:cloud-session-dispatch"
    target: "refactoring::procedure:refactoring"
    relation: suggests
    reason: "Behaviour-preserving refactoring workflow for tidy-first runs."
  - source: "procedure:cloud-session-dispatch"
    target: "testing::procedure:test-first-bug-fixing"
    relation: suggests
    reason: "Red-first workflow for bugfix dispatches."
  - source: "procedure:cloud-session-dispatch"
    target: "procedure:test-suite-quality-assessment"
    relation: suggests
