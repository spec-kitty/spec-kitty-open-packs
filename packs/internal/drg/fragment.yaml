    target: "procedure:mission-wrap-up-sequence"
    relation: requires
    reason: "The closeout and the shared delivery rules it owns; a Mission runs it end to end, an Op enters at its compaction step."
  - source: "procedure:semi-auto-delivery"
    target: "testing::procedure:test-first-bug-fixing"
