id: terminology-guard
schema_version: '1.0'
tool: the repository's vocabulary check
title: Terminology Guard
guide_path: terminology-guard.guide.md
summary: |
  Describes when and how to run the repository's vocabulary check before pushing a change to user-facing prose, docs or doctrine. The check catches retired or superseded terms that have reappeared in active files and fails CI if it finds any. The repository's charter or contributor docs name the check and its command; this guide does not hard-code one. Maintainer-only.
