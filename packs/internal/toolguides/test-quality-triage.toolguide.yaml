id: test-quality-triage
schema_version: '1.0'
tool: test-quality-scan.py
title: Test-Quality Triage (static scan of pytest and JUnit corpora)
guide_path: test-quality-triage.guide.md
summary: |
  How to run the maintainer-only static triage asset that opens a Python/pytest or Java/JUnit test-suite quality assessment. It parses Python with the standard-library ast module and Java with optionally installed tree-sitter bindings, runs no tests, flags weak-oracle and implementation-coupling patterns per test, attaches git provenance, and writes a ranked worklist plus one resumable review ledger per domain. Covers the make target, direct and uv invocation through the `charter pack asset` resolver, Java discovery and dependencies, window mode (--since), each language's flag mappings, output domains, and the false positives that make every flag a candidate rather than a verdict.
commands:
- make test-quality-scan
- spec-kitty charter pack asset path test-quality-scan
- test-quality-scan.py
applies_to_languages:
- python
- java
