id: spec-kitty-docs-lint-config
schema_version: '1.0'
title: Spec Kitty Docs Structural-Lint Config
scope: docs
principles:
- name: Repository-specific structural-lint config
  description: 'Repository-specific structural-lint config: the Spec Kitty repository''s own configuration for the common-docs structural lint (its root allowlist, sanctioned sections, frozen-evidence exclusions).'
patterns:
- name: Repository-specific structural-lint config
  description: |
    This styleguide carries the Spec Kitty repository's own configuration for the common-docs structural lint (its root allowlist, sanctioned sections, frozen-evidence exclusions). It refines the built-in common-docs styleguide, whose structural_lint_config is a repository-agnostic default. The repository's docs gates load this file (scripts/docs/touched_set_gates.py, tests/docs/test_docs_structural_lint.py).
structural_lint_config:
  curated_complete_sections:
  - architecture
  concern_bucket_to_section:
    how_to_internal: development/
    how_to_external: guides/
    reference_policy: development/
    point_in_time: plans/engineering-notes/
    ops_runbook: operations/
    generated_report: reports/
    generated_nav: pinned
    doctrine_artifact: src/doctrine/
  point_in_time_patterns:
  - ^\d{4}-\d{2}
  point_in_time_markers:
  - frontmatter_field: doc_status
    frontmatter_value: point_in_time
  - frontmatter_field: doc_status
    frontmatter_value: closeout
  point_in_time_allowlist:
  - adr/**
  - plans/research/**
  - plans/investigations/**
  - plans/**
  - archive/**
  frontmatter_required_fields:
  - doc_status
  - updated
  frontmatter_in_scope_exclusions:
  - '**/README.md'
  - adr/**
  - archive/program-evidence/**
  - changelog/unreleased/**
  shadow_tree_nav_exemptions:
  - index.md
  - README.md
  - toc.yml
  - README-*.x.md
  - 00-SYNTHESIS.md
  redirect_stub_description_prefix: 'Redirect stub:'
  guides_boundary: docs/guides/ is the canonical home for user-facing (external-audience) how-tos only; internal-audience (contributor/maintainer) how_to content and all reference_policy content route to development/. guides/ is not a relocation target for internal-audience how_to or reference_policy content moved by this mission (FR-009, research D2).
  sanctioned_content_sections:
  - index
  - context
  - architecture
  - adr
  - plans
  - api
  - configuration
  - integrations
  - security
  - guides
  - operations
  - migrations
  - changelog
  - development
  - reports
  - convergence
  - archive
  non_content_dirs:
  - assets/
  - contracts/
  - templates/
  - templates/spec-kitty/
  root_allowlist:
  - README.md
  - LICENSE
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CLAUDE.md
  - AGENTS.md
  - CODE_OF_CONDUCT.md
  - SECURITY-POSITION.md
  - CONTRIBUTORS.md
  - RELEASE_CHECKLIST.md
  - .all-contributorsrc
  - ascii-art.txt
  one_index_per_dir: true
