# The `base` activation preset of the internal pack, in the sanitized preset shape of charter
# ADR-0042. It is a governing preset: its must-have items are the required floor of every
# project whose closure holds this pack, and a deactivation of one is refused
# (charter ADR-0031: requirement is authored as a preset; charter #431 retired org-charter.yaml,
# tracked here as #242).
