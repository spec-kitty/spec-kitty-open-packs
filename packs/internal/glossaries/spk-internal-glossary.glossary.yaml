# Spec Kitty internal: a glossary context (charter ADR-0049); each term is term:spk-internal-glossary/<term-id>.
schema_version: '1.0'
id: spk-internal-glossary
name: Spec Kitty internal
description: Spec Kitty maintainer/engineering terminology (internal, not shipped).
terms:
  - id: red-main
    name: red main
    definition: The policy that main is allowed to carry known-failing tests when they are honestly documented (an ADR-tracked
      P0), rather than papered over. CI, not a green local run, is the release authority. See built-in directive RED_MAIN_RELEASE_DISCIPLINE.
    status: active
    see_also:
      - term:spk-internal-glossary/baseline-red-gotcha
  - id: baseline-red-gotcha
    name: baseline-red gotcha
    definition: The trap where a broad local test run shows red that is NOT caused by your change (pre-existing known-P0 reds,
      CI-environment-only failures, or stale-install false reds). A failure is only yours if it is red on your branch AND
      green on the merge-base.
    status: active
    see_also:
      - term:spk-internal-glossary/red-main
      - term:spk-internal-glossary/stale-install-false-red
  - id: stale-install-false-red
    name: stale-install false red
    definition: A false failure produced when code that shells out to the installed `spec-kitty` executable runs against an
      out-of-date editable install; the test only reflects reality after `pip install -e .`.
    status: active
  - id: landing-pass
    name: landing pass
    definition: 'A maintainer work session that takes one or more contributor PRs from "open with red CI" to "merge-ready":
      claim, isolate, rebase, classify reds, fold fixes, verify, post evidence, and hand off. The maintainer never merges.'
    status: active
    see_also:
      - term:spk-internal-glossary/fold
      - term:spk-internal-glossary/campsite-cleaning
  - id: fold
    name: fold
    definition: A maintainer remediation commit applied directly onto a contributor's PR branch during a landing pass (rebase,
      test fix, campsite cleanup), keeping the contributor's authorship while making the branch merge-ready.
    status: active
    see_also:
      - term:spk-internal-glossary/landing-pass
  - id: campsite-cleaning
    name: campsite cleaning
    definition: The boy-scout practice of leaving touched code cleaner than found — bounded, in-scope cleanups folded alongside
      the primary change, never an open-ended refactor. One of the eight Quality & Tech-Debt Standing Orders.
    status: active
  - id: mission-tracer-file
    name: mission tracer file
    definition: A durable per-mission record capturing the decision trail and evidence for a unit of work, so later agents
      can reconstruct why choices were made without re-deriving them. See built-in procedure mission-tracer-files.
    status: active
  - id: red-first-verification
    name: red-first verification
    definition: For a bugfix, the discipline of first confirming the new/failing test is RED against the unpatched code (proving
      it captures the defect) before applying the fix and watching it go green. Guards against tests that pass vacuously.
    status: active
    see_also:
      - term:spk-internal-glossary/red-main
  - id: safe-commit
    name: safe commit
    definition: The commit pattern Spec Kitty's git layer uses to record work without clobbering concurrent changes or crossing
      worktree boundaries — targeted staging over a blanket `git add -A`.
    status: active
  - id: cutover-guard
    name: cutover-guard
    definition: A repo-specific CI gate that fails when a migration/cutover is incompletely applied (e.g. old and new surfaces
      both present). Reads the repository root checkout's working tree, so a run from a lane worktree or a PR-landing worktree
      checks the wrong tree.
    status: active
  - id: coord-primary-partition
    name: coord/primary partition
    definition: The execution-workspace split routing lifecycle surfaces (status, notes, trace, issue-matrix, move-task) to
      the coord branch and stable planning (spec/plan/WP outlines) to the primary branch. Missions with no coordination topology
      route everything to primary. Read lifecycle state through the CLI, never from a checkout's files; see `resolved status
      surface`.
    status: active
  - id: pr-landing-worktree
    name: pr-landing worktree
    definition: A maintainer's dedicated checkout of a pull request's branch for a landing pass, for example `.worktrees/pr-<N>-landing`.
      One per pull request; never shared across pull requests and never a status surface. `spec-kitty doctor workspaces --prune`
      removes it after the pull request merges.
    status: active
