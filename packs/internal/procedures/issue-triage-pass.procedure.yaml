schema_version: '1.0'
id: issue-triage-pass
title: Issue Triage Pass
description: |
  Run a governed triage pass over a set of open GitHub issues in the canonical repository, so that each issue is correctly typed, prioritised, labelled by domain, parented, linked to what blocks it and (when obvious) given a milestone, and so deprecated, inconsistent, duplicate or clustering issues are reported instead of being mis-triaged in silence. The pass is run by an orchestrator that dispatches triage subagents; it is a batch pass, not the backlog-wide restructuring that tracker-organisation-workflow describes. The `issue-triage` pack skill is the thin entry point to this procedure. Terms used here. The operator is the human in charge of the run: the maintainer who invoked it. The canonical repository is the repository the issues live in. The canonical remote is the git remote that points at it; find it with `git remote -v`. Every `gh` command here runs against the canonical repository: in a fork clone, run `gh repo set-default` once to point `gh` at it. The tracker guide is the repository's own guide to its labels, types, milestones and issue workflow, as its charter or contributor docs name it. The workflow-state labels are the issue-side labels that guide defines as human workflow state (for example `status:*` and `taken-by-human`), set by a person or by contributor tooling. The label names below are examples; use the ones the tracker guide defines.
entry_condition: |
  The operator has asked for a set of issues to be triaged: an explicit list of numbers, a time window such as `14d` (open issues created in the last 14 days), a label filter such as `label:status:triage`, or a natural-language selection. With no selection, the scope is every open issue created in the last 7 days.
exit_condition: |
  Every issue in scope is triaged or listed as "not triaged" with the reason, every flagged item has been put to the operator and its ruling applied (or reported as still open), and the operator has one consolidated report.
steps:
- title: Read the tracker guide and fix the rules for the pass
  description: |
    Read the repository's tracker guide in full and treat it as binding. Apply the tracker-organisation-workflow procedure and the label scheme the tracker guide defines. If the repository has no tracker guide, say so and ask the operator which labels to use. Two rules are decision points and belong in every subagent brief. First, never apply `priority:P0` yourself: when an issue meets a P0 criterion, name the criterion and flag it for the operator. Second, flag rather than guess on anything ambiguous (non-obvious parent or milestone, a possible duplicate or deprecation). When a priority is a guess, set `priority:P2` together with `triage:needs-revision`.
- title: Resolve the work list and the shared inputs
  description: |
    Record the start time of the pass (UTC). Enumerate the issues the scope selects yourself, so every subagent works from one fixed list; if the scope selects no issue, report "no issues in scope" and stop. Example for the default window (GNU `date`; on macOS use `date -v-7d +%Y-%m-%d`): `gh issue list --state open --search "created:>=$(date -d '7 days ago' +%Y-%m-%d)" --limit 200 --json number,title,labels,createdAt`. Pull the milestones (`gh api repos/{owner}/{repo}/milestones --jq '.[] | {number, title, description}'`) and the functional epics (`gh issue list --state open --label epic --limit 100 --json number,title`) once, so each subagent does not re-derive them. If `gh` reports missing token scopes, retry with `unset GITHUB_TOKEN`.
- title: Fix the code baseline
  description: |
    Check every claim that behaviour "still exists", "already shipped" or "was removed" against the main branch of the canonical repository, fetched now. A personal fork's `origin/main` can be far behind, which makes shipped work look missing and new code look removed. Find the canonical remote, fetch its `main`, measure the gap to `origin/main` (`git rev-list --count origin/main..<canonical-remote>/main`), and pass `<canonical-remote>/main` to every subagent as the ref to check against. Accept "resolved" only when the fix is present on that ref (`git grep <needle> <canonical-remote>/main`). If `origin` lags, say so in the report.
- title: Dispatch the triage subagents
  description: |
    Give each subagent 3 to 5 issues and run at most 4 at once. When the scope holds more than 20 issues, run further rounds until the list is done. Launch the subagents of a round in parallel, each with the `planner-priti` profile loaded as adversarial-squad-deployment's dispatch step describes (action `plan`). Every subagent gets the same shared context (the rules from the first step, the milestones, the epics, the baseline ref and the start time) and the brief: items (1) to (3) of this step, then the three "Brief" steps. Do not triage inline: each subagent loads the planner profile and its doctrine, and your own context stays free for aggregation. Brief, before you start: (1) work from the `planner-priti` profile as loaded for you (or load it by the route adversarial-squad-deployment gives) and apply it; (2) disclose in your report which profile and which directives, tactics and procedures you loaded and will apply; (3) use the baseline ref for every code-state check and disclose it.
- title: 'Brief: triage each issue'
  description: |
    Subagent brief, not run by the orchestrator. For each issue: read the full body and comments (`gh issue view <N> --comments`). Immediately before changing anything, re-read the state (`--json state,closedAt,stateReason`); if it closed since enumeration, do not touch it and report "closed mid-pass by <PR>". Then set the native type (`--type Bug|Feature|Task`; `Feature` is the tracker's type name, not a Mission). Apply one `priority:P*` label under the P0 rule above. Assign the domain label the tracker guide defines (for example `domain:*`). Add `good first issue` only for its real meaning. Parent the issue under a functional epic with a native sub-issue link when it clearly belongs there, never under a meta-tracker; leave it and flag it when parentage is ambiguous. Add a native `blocked_by` link when it cannot start until another issue or open PR lands (for a PR, link the issue the PR closes); for a related twin, comment a cross-reference on both issues.
- title: 'Brief: milestone, workflow-state labels and retired labels'
  description: |
    Subagent brief, not run by the orchestrator. Assign a milestone only when obvious, per the repository's milestone roadmap if it has one (a release-scope milestone only for a true release blocker); otherwise leave it unset and say so. Once the issue is triaged and no operator decision is pending on it, remove `status:triage`; leave it on an issue you flagged. Do not add or remove any other workflow-state label (`status:ready`, `status:claimed`, `status:blocked`, `taken-by-human`) or `ready-for-squad`: they are leases and queue state set by a person or by contributor tooling, so report one that looks stale and leave it. Never apply a label the tracker guide lists as retired or renamed; strip a retired kind label (for example `bug`, `enhancement` or `type:*`) and set the native type instead. A pending human call is `triage:needs-decision`.
- title: 'Brief: health scan and report'
  description: |
    Subagent brief, not run by the orchestrator. Flag with evidence descriptions that are deprecated or superseded (mark `triage:repro-needed` if the issue may already be fixed, or `triage:stale` if it may be dead), internal inconsistencies between title, body and labels, emerging clusters (several issues circling one cause or surface), and duplicates (mark a suspected one `triage:maybe-duplicate` and cross-reference the twin; on a confirmed duplicate keep the community-authored issue). Mark an unadjudicated root cause `triage:needs-investigation`. Consult the repository's architecture docs, ADRs and plans when you need context, and cite what you relied on. Report, per issue: the number, title, before and after (type, priority, domain, parent, milestone), the doctrine disclosure, the baseline ref, the health-scan findings and every item flagged for an operator decision. Make only defensible, evidence-grounded changes.
- title: Re-check, aggregate and report
  description: |
    The tracker and main move during a pass: a PR can close an issue while the subagents work. First re-check the state of every issue you will report or ask about, list the PRs merged since the start time (`gh pr list --state merged --search "merged:>=<start time>" --json number,closingIssuesReferences`), and re-fetch the canonical remote's `main`, so a fix that landed mid-pass is not split out or re-filed as new work. Then write one consolidated report: a table of each issue (number, title, what changed in type, priority, domain, parent, milestone); a section "Needs an operator decision" with each flagged item, the reasoning and the cited docs; every subagent's doctrine disclosure; the baseline ref used, with a note if `origin` lags and a caveat on any verdict that could not be confirmed against it; and counts of issues triaged, retyped, reprioritised, parented, given a milestone and flagged.
- title: Put the flagged items to the operator and apply their rulings
  description: |
    End the pass in one of two ways. No flagged items: report and stop. Flagged items: present the report and ask the operator about each item. Give each question enough context to decide without opening the issue: what the issue is, the concrete evidence (file and line, PR, sibling issues), the blast radius and what each option means. After each ruling, re-check the issue's state and apply it yourself, then report the final state; remove `status:triage` from an issue once its ruling is applied. Once the operator confirms a P0 Bug, follow the tracker guide's rule for P0 reproductions, if it has one: typically the red-first reproduction test goes in its own PR, with `Refs #<n>` and not `Closes`, carrying the repository's open-P0 marker and PR label. Do not mark the pass complete while flagged items are unresolved.
  role: operator
  on_failure: |
    If a subagent fails or a write is refused, list the affected issues as "not triaged" with the error. Retry at most once.
