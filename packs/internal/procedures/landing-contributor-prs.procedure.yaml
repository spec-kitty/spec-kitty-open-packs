schema_version: '1.0'
id: landing-contributor-prs
title: Landing Contributor PRs
description: |
  The maintainer workflow for taking a contributor PR from "open with red CI" to "merge-ready": sized up, claimed, rebased onto the current main of the canonical repository, every red check adjudicated, fixes added to the contributor branch, independently reviewed, documented, and handed off with evidence, so the operator can merge without re-deriving the adjudication. This procedure holds the rules; the repository's own landing guide, where it has one, holds the command-level detail. Each repository-specific item named here (the changelog mechanism, the PR template, the docs scripts, the make targets, the vocabulary check, the required checks) is the one the repository's charter or contributor docs (CONTRIBUTING, the PR template) define. The `land-pr` pack skill is the thin entry point to this procedure. Terms used here. The operator is the human in charge of the run: the maintainer who invoked it. The canonical repository is the repository the PR targets. The canonical remote is the git remote that points at it; its name differs per clone, so find it with `git remote -v`. Every `gh` command here runs against the canonical repository: in a fork clone, run `gh repo set-default` once to point `gh` at it. A landing fix (called a "fold" in the runbook) is one commit that the landing pass adds to the PR branch. A companion change is an edit that a gate requires next to your change, such as a regenerated index or a removed exclude entry. A review squad is a small set of reviewer subagents, each given a different focus; adversarial-squad-deployment owns how one is run. The landing queue is the set of PRs the operator has asked maintainers to land in this run, in the order they will be landed.
entry_condition: |
  A contributor (or older maintainer) PR is open and ready for review, typically with red or stale CI, and a maintainer has been asked to land it. A PR that is still a draft has not been handed off to the maintainers yet: say so and ask the operator before landing it. The maintainer is NOT the operator for merge purposes; the deliverable of this procedure is a merge-ready PR.
exit_condition: |
  The PR is rebased onto the current main of the canonical remote, green (or its remaining reds are documented as pre-existing with proof of green-on-base and a filed issue), carries a full evidence trail in its comment thread, and names any landing-order constraints. The hand-off is posted and the operator has the merge.
steps:
- title: Check the PR is handed off before anything else
  description: |
    Run `gh pr view <N> --json isDraft,author,statusCheckRollup`. If `isDraft` is true, stop before you touch the branch. The first thing in your reply to the operator is a prominent warning that the PR is STILL A DRAFT AND NOT HANDED OFF FOR LANDING, with its author and its CI state, and the question whether to land it anyway. Do not rebase, push or comment on a draft PR without the operator's explicit go-ahead. A draft is handed off only when its author flips it to ready for review (mission-wrap-up-sequence's closeout step). Continue only when the PR is ready for review, or the operator told you to land it anyway. Then ask the operator once, before the landing work begins: arm auto-merge (`gh pr merge <N> --auto`, with the merge method the repository uses) when this PR is merge-ready, or hand off for a manual merge? The default is not to arm it. No answer, or an unattended run, means hand off. The answer holds for this landing run only; for a queue of PRs, ask once for the queue.
  on_failure: |
    If you cannot read the draft state, stop and ask the operator.
- title: Decide whether the PR is worth landing
  description: |
    Read-only. Size the PR on two axes before investing in it. Old: its base is far behind main, or it is an aging contributor branch. Substantive: it changes behaviour (a capability, a fix or a contract change) rather than being a mechanical chore (a version bump, a dependency pin, a regenerated file, a typo). When unsure, treat it as old and substantive. Old or substantive: run the full check. (1) Superseded: did another PR or mission already land the change? Search the changelog, `git log -S`, and the issues the PR references. (2) Compatible: does its approach still fit the current design, or did a seam it depends on move? (3) Still needed: does the problem still reproduce on current main? Post the recommendation as a PR comment, with evidence: LAND as is, RESCOPE (keep the durable part), or CLOSE (superseded or moot). Continue only on LAND. On RESCOPE or CLOSE, stop and report the recommendation to the operator, and continue only when they answer. Recent and mechanical: run the short check instead. Is the change accurate (correct and coherent), desirable (actually wanted) and aligned with current conventions? If so, record the LAND call in your first comment and continue.
- title: Claim before touching
  description: |
    Post a claim comment on the PR before any rebase or review work: that a maintainer landing pass has started, what you will do, and in which landing queue. Assign the PR to the operator (`gh api user -q .login` gives the login of the maintainer who invoked the run; if the run names someone else, or you are unsure, ask). Prevents duplicated maintainer effort and surprise commits on the contributor's branch. Run every `gh` command against the canonical repository; in a fork clone `origin` is the fork. If `gh` reports missing token scopes, retry with `unset GITHUB_TOKEN`.
- title: One isolated worktree per PR
  description: |
    Fetch the canonical remote's main, then check the PR branch out into its own PR-landing worktree under `.worktrees/` (for example `.worktrees/pr-<N>-landing`), so `spec-kitty doctor workspaces` can find it later. Leave the maintainer's current checkout untouched. Start each landing pass with `git fetch origin` and `spec-kitty doctor workspaces`: it lists earlier landing worktrees whose PRs merged after their session ended, and `spec-kitty doctor workspaces --prune` removes them. Never share a worktree across PRs or mix a landing pass with hand-edits: concurrent work in one worktree silently reverts changes. See built-in tactic pr-agent-worktree-isolation.
  on_failure: |
    If a PR-landing worktree is stale or points at a missing gitdir, run `git worktree prune` to drop the broken registration, then create a fresh PR-landing worktree rather than reusing the broken one or making a stray standalone clone.
- title: Rebase onto current main of the canonical remote first
  description: |
    Fetch and rebase the PR branch onto the latest main of the canonical remote before classifying any failure, so you never adjudicate reds that main already fixed or introduced. Keep each commit's original author. The base ref is the one mission-wrap-up-sequence's rebase step names. A changelog conflict and a conflict in a generated docs file are resolved as that procedure's changelog and docs steps say; regenerate every other surface the rebase made stale, except the generated docs that its docs step leaves to the bot. A generated surface that the PR branch last built against an older main is missing what other PRs added since, and it reds a freshness gate although nothing in the PR is wrong. Run the repository's docs freshness check, if its charter or docs name one, to see which surface is stale, then regenerate it with its own script. This is part of landing, not scope creep. Never recapture a file that a scheduled CI job owns (for example a test-shard timing file), and never put such a recapture in a subagent brief. On a rebase conflict in such a file, keep the rows from main. Note a count drift in the hand-off as owned by automation.
- title: Re-check a PR the agent fleet prepared
  description: |
    If the PR was prepared by an agent fleet (a bot author), a squad review recorded on it shows only that it passed against the base the PR had at that time, not that it is ready now. Also search for the follow-up issues the fleet filed for its smaller findings (`gh issue list --search "#<PR number>"`, plus the PR's own comments and links). Fix each one in this landing, or at least make the PR-body correction it asks for, and add `Closes #<n>` to the PR body next to the PR's own issue line.
- title: Classify every red check
  description: |
    On the rebased tip, put each failing check in exactly one bin (the repository's landing guide, where it has one, has the commands): (a) defect in this PR: fix it on the branch; (b) a contract the PR legitimately crosses (a rule changed on main since its base): re-pin the contract in the same PR, with a dated rationale; (c) already failing on main: fold the fix in by default, except a red-first test the repository marks as an open P0 reproduction (leave it red) and a fix that is mission scope (file or find the P0 issue and pin the test to it). Failures that are not the PR's fault but only look red belong here too: an environment-only failure such as authentication, a stale install or a stale virtualenv (the baseline-red notes in the repository's agent or contributor docs), or an open P0 reproduction; (d) timing-sensitive test that fails intermittently: note it, watch for recurrence, tune the budget at the root, never retry to green. Start from main's own CI run at the merge base. Only a failure that is red on the branch and green on the base is the PR's to fix. File an issue for each pre-existing red that has none, and cite its number in the remediation summary (charter, Pre-existing Failure Reporting Rule).
  on_failure: |
    If you cannot attribute a failure, reproduce it on the merge base before treating it as the PR's; never green-wash a known P0 red.
- title: Fix what blocks the PR, one landing fix per commit
  description: |
    Apply each remediation as its own commit on the contributor's branch, with the subject `<type>(landing): <summary>` (a commit type the repository's commit convention allows). Keep fixes in scope; do not refactor open-endedly. Delegate a fix that needs more than a few edits to a subagent, its profile loaded as adversarial-squad-deployment describes (action `implement`). Use the cheaper model tier for grounded implementation and the stronger tier for review (model-task-routing). Give each subagent its own worktree and an explicit list of files it must not touch.
- title: Hold every landing fix to the test economy
  description: |
    Add a test only when it guards real behavior or a standing invariant through the existing entry point, with realistic data, and would fail on a real regression (DIRECTIVE_041, and the keep, retire or split rubric of development-assist-test-cleanup). Prefer strengthening an existing test over a new one; at most one focused test per landing fix unless a second covers a different failure mode. Do not add a duplicate assertion, a second planted control where one already proves the test can fail, a test that pins code shape, or a test that is inert once the fix lands. A test that only restates configuration is a change detector; a real run or an existing gate is the evidence (DIRECTIVE_034, and the long-term-value question of `acceptance-criteria-non-vacuity`). A red-first demonstration that is not worth keeping goes in the agent's report as evidence (command and failing output), not in the commit. Put these rules and both references in every implementer and reviewer brief, and ask each implementer for a table of every test it added or changed: the fix, the regression it catches, the existing coverage.
- title: Run locally only what CI cannot show
  description: |
    Read the PR's CI results first (`gh pr checks`); a green shard is authoritative for the files it ran, so do not repeat it locally. Run locally only what CI cannot show: a new reproduction, a red-first swap, a comparison against the merge base, and the targeted gates and changed-file tests of your own commits. Never run a full heavy suite (NO_FULL_HEAVY_SUITES_IN_MISSION). A workflow that runs only after a merge (for example a `workflow_run`-triggered workflow, which runs from the default-branch checkout) does not exercise a PR's edit to that workflow or to a script it calls before the merge. When the PR edits such a script, run it as the workflow does (same command, from the repository root, with the same environment) and confirm it starts.
- title: Format only the files you touched
  description: |
    Format only the files you touched, with the formatter and the command the repository's docs name (a formatter call on named files, or a make target that takes a file list). Never reformat the whole repository. If you deliberately format a file the formatter's config excludes, remove its exclude entry in the same commit and run any check the repository has on that exclude list.
- title: Red-first verification for bugfix PRs
  description: |
    For a bugfix, confirm the test is RED against the unpatched code before the fix, then green after, proving the test captures the defect rather than passing vacuously (the repository's landing guide, where it has one). A repro for an open P0 bug carries the repository's open-P0 marker, if it has one, until the fix.
- title: Independent review of the integrated diff
  description: |
    Skip only for a mechanical chore. For any substantive, architectural, contract or API-surface PR, dispatch a review squad (adversarial-squad-deployment) over the rebased diff: for example correctness and failure handling, boundaries and overlap with existing code, plus a design reviewer when the PR adds a new authority or seam. Reviewers use the stronger model tier, their profiles loaded as adversarial-squad-deployment describes (action `review`). Ask each reviewer to flag superfluous tests in the PR's diff (duplicates, inert self-compares, shape pins, redundant planted controls), and for each fix it suggests to say whether an existing test should be strengthened instead of a new one added. An existing review comment on the PR is input, not a substitute for a fresh pass. Fix every finding (major, minor and note) as its own landing fix, except those the deferral bar of mission-wrap-up-sequence's pre-PR review step lets you leave out; file and name those as that step says.
- title: Tidy the commit history only when it is needed
  description: |
    When the repository lands by rebase, each commit lands on main individually. Per-commit greenness is a preferred target, not a requirement (the merge bar is set in mission-wrap-up-sequence's compaction step). Rewrite only for readability or to remove personal data: collapse status-only churn into one commit, remove machine-local paths from the commit that introduced them, reword non-conventional subjects, and keep genuinely separate code changes as separate commits (clean-linear-commit-history tactic; the repository's landing guide may have a regroup recipe for a very long history). Keep the contributor's authorship; re-author only a maintainer-owned branch. Rewrite non-interactively. Before any force-push, run the tree check that mission-wrap-up-sequence's compaction step owns.
- title: Vet the tests the landing added
  description: |
    Before hand-off, dispatch a reviewer who is not the implementer (stronger model tier; for example profile `reviewer-renata`, loaded as adversarial-squad-deployment describes), read-only on the landing worktree. It applies development-assist-test-cleanup to every test that the landing added or changed (not the contributor's tests, which the independent review covers, and not tests that predate the PR). One verdict per test: KEEP (a real regression guard or standing invariant), RETIRE (inert once the fix lands, duplicates a broader guard, or pins transient code shape) or SPLIT-BY-KIND. The reviewer checks each KEEP goes red when the fix is reverted, and each RETIRE against the trap of coverage disguised as a duplicate: if the standing guard does not assert it, it was not a duplicate. Execute the verdicts as their own `test(landing):` commit. An issue-named test file (`test_issue_NNNN*`, `test_repro_NNNN*`) always gets a fold-or-keep verdict.
- title: Update the PR body, changelog and docs
  description: |
    What to update depends on the outcome. LAND: all of the following. RESCOPE: the changelog entry covers the kept part only. CLOSE: a closing rationale in the PR body instead of a changelog entry. Rewrite the PR body to the contract that mission-wrap-up-sequence's "Write the PR body" step owns. Add the changelog entry as its "Update the changelog" step says, and commit it as its own `docs(landing):` commit. Update the docs as its docs step says, including the rule on generated docs. A governance or process decision can be an ADR with status Accepted, filed where the repository's charter puts ADRs and named like the existing ones there; check the highest number on main first. Run the repository's docs checks on it. Write plain language, active voice, impact first.
- title: Push with discipline
  description: |
    Push over SSH with a lease taken from an explicit ref, as mission-wrap-up-sequence's rebase step says. Push to the contributor's fork branch (a branch on the canonical repository itself is directly pushable with maintain rights). Group related landing fixes into one push: each push starts a full CI run and cancels the previous one. Never push to `main` and never force-push `main`. Cherry-pick any commit you have not seen rather than overwriting it.
  on_failure: |
    If a permission prompt or safety classifier refuses a push that follows these rules, stop and hand the push to the operator; do not look for a different route around the protection.
- title: Post the remediation summary
  description: |
    Post one structured comment in the PR thread: the review verdict; what was rebased; each red's classification; each landing fix with its why; the verdicts of the independent review; the test verdict table from the vetting step (each test the landing added or changed, its KEEP, RETIRE or SPLIT verdict, and the regression a KEEP catches; no table means the vetting did not happen); verification performed, with counts; pre-existing failures with their filed issue numbers; landing-order constraints; and every check still failing with the reason it is not caused by this PR. Add contributor-education notes addressed to the author.
- title: Hand off, and arm auto-merge only if the operator chose it
  description: |
    The PR must be green (or green apart from documented reds), with the evidence trail posted. Merging into `main` on the canonical repository is the operator's decision, made per landing run: the first step asked whether to arm auto-merge at the end, and the default is not to. Without an explicit yes for this run, hand off and stop; the operator merges. With a yes, and only once the PR is merge-ready and has its complete fix pushed, run `gh pr merge <N> --auto` with the merge method the repository uses, which queues the merge until the repository's required checks pass and refuses on any red. Auto-merge fires on the first green, so a commit pushed later would be left behind.
- title: Confirm an armed auto-merge and watch it
  description: |
    Confirm it armed and did not merge at once: `gh pr view <N> --json state,autoMergeRequest` must show `state: OPEN` and a non-null `autoMergeRequest` while checks are pending. If the PR merged at once, tell the operator. Never merge by any other route, and never change the repository's branch protection or required checks. While it waits, a `cancelled` check is not a failure: a new push cancels the previous run, and branch protection uses the latest run per check. Only `failure` and `timed_out` on the current head are real. A required check that is absent on the head (no run at all, status BLOCKED with everything else green) is a configuration problem to report to the operator, not something to wait out.
- title: After the PR is merged
  description: |
    Verify the merge landed cleanly (your landing fixes are present, authorship is right). Watch the CI of `main` on the merge commit for new reds. A green PR does not cover the workflows that run only on `main` (for example an aggregate or a nightly workflow): if the PR touched a script they run, confirm they pass on the merge commit. A failure of such a workflow on the merge commit is a regression to fix. If a red appears on `main`, fix it promptly in a new PR, red-first, and hand that off.
- title: Remove the landing worktree and the merged branch
  description: |
    Run `git fetch origin` and `spec-kitty doctor workspaces --prune`: it removes the landing worktree and its local branch only when their content is on the local `origin/main` and nothing uncommitted, untracked or running is in it, never uses `--force`, keeps a branch tip no other local branch or tag reaches under `refs/spec-kitty/discarded/`, and prints a command to recreate each branch. It keeps and reports a worktree it cannot prove landed; a pass that only rebased and made no commit of its own is reported `NO_OWN_COMMITS`. To remove such a worktree by hand: never `git worktree remove --force`, and keep the tip with `git update-ref` before any `git branch -D`. If the repository does not delete merged branches itself, remove the merged PR branch on the remote yourself (if a plain `git push --delete` errors, use `gh api -X DELETE repos/{owner}/{repo}/git/refs/heads/<branch>`).
- title: Follow-up hygiene
  description: |
    Close your claim comments, file a tracked issue the same day for every deferred item (parented under a functional epic, never a meta-tracker), and leave the landing queue in a state the next maintainer can read. Run a triage pass on the new issues so the next landing pass starts from a clean queue.
