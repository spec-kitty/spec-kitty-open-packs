schema_version: '1.0'
id: targeted-mission-test-run
title: Targeted Mission Test Run
description: |
  Validate mission work with targeted test runs that respect the ban on heavy suites.
entry_condition: |
  Mission work needs local test validation, or a dispatch brief or WP prompt asks an implementer or reviewer to validate a change.
exit_condition: |
  Only the targeted surface ran, with bounded parallelism, the exact commands and pass/fail counts are in the PR, and out-of-radius reds were classified rather than chased.
steps:
- title: List the mirrored test files
  description: |
    Name the test file(s) mirroring each source module the diff touches, plus the owning module's fast tier (the repository's fast test command, as its docs name it, and the module's own test directory).
- title: Name the specific architectural gate files
  description: |
    Name each gate file that guards the change, for example the layer-rules gate for an import-direction change or the dead-symbol gate for a dead-symbol change; never the bare directory. Write the same named files into the validation section of any dispatch brief or WP prompt, never wording that resolves to a full suite.
- title: Run no heavy suite whole
  description: |
    Do not run the repository's architectural suite or any heavy suite directory whole.
- title: Run no slow-tier or full sweeps
  description: |
    Do not run an end-to-end suite, a full integration sweep, a performance, stress or timing run, or a full-suite make target.
- title: Bound parallel test runs
  description: |
    On a shared machine bound `pytest-xdist` explicitly (e.g. `-n 4`), never `-n auto`, and never start a second concurrent run of the same suite (see `no-parallel-duplicate-test-runs`). The machine-wide cap on heavy suites, the no-measurement rule for killed or piped runs, and attributing a red against the mission base are the testing pack's `shared-machine-test-measurement`; this repository's port bands, quotas and make targets stay here.
- title: Record the exact commands run
  description: |
    Record the targeted commands and pass/fail counts in the PR body.
- title: Leave out-of-radius reds to CI
  description: |
    Classify a red outside the blast radius via the baseline-red gotcha (known-P0 red, CI-environment failure, stale install, stale venv) instead of running a broader local sweep.
- title: Widen only on explicit operator request
  description: |
    Run a full heavy suite only when the operator asks for it by name (e.g. "run the full suite"); an agent's own risk judgment is not enough, so escalate it instead.
