schema_version: '1.0'
id: cloud-session-dispatch
title: Cloud Session Dispatch (hand tracker issues to an autonomous cloud runner)
description: |
  The maintainer workflow for handing one or more spec-kitty/spec-kitty tracker issues to a fresh Claude Code cloud session that runs a governed Spec Kitty mission end to end and delivers a PR flipped to ready for review. The runner starts from nothing, so the dispatch prompt is its whole world. This procedure makes that prompt complete: branch off main, set up the latest CLI, align to the charter, ground in the code before specifying, bind the doctrine for the kind of work, and deliver through the canonical mission loop and closeout to a PR the operator merges. It is the substance behind the operator-local `spk-dispatch-cloud` skill. Per ADR 2026-09-27-1, the skill stays a thin wrapper that requires this procedure. CLOUD_SESSION_ORCHESTRATION makes the read-only sibling, orchestrator-mediated write, blocked-session replacement and shared-number rules binding.
entry_condition: |
  The operator has asked for a tracker issue, or a coherent group of issues, to be delivered by a cloud runner, and the dispatching session can create remote sessions.
exit_condition: |
  A cloud session exists with a fully filled-in dispatch prompt (no placeholders). The operator has the session id, the branch name, a short summary of the instructions and any sequencing or collision note. No progress is claimed that was not read back from the session.
steps:
- title: Read every issue in full
  description: |
    Read the body, the comments (re-scope notes usually live there), the parent and sub-issues, the milestone, the priority, and linked issues and PRs. Never dispatch from titles.
- title: Check fleet capacity, collisions and blockers
  description: |
    List the operator's running sessions and the open PRs that touch the same files. Allow at most 3 runners with open, unmerged PRs per repository. Never put two runners on the same file family at once: contract YAML and its changelog, a storage layer, expected-red/file-kinds YAML, workflow files and service build files are examples of one family. When overlap is unavoidable, sequence the dispatches and name which runner rebases second. Land shared-infrastructure and pin-bump changes before feature waves. For a wave of more than two runners, first run one throwaway session against the environment setup script. Before dispatching pin-dependent work, verify that the consumer's pin can read the producer's current shape. Also check for an open P0 on the same surface, an unmerged prerequisite, or a frozen lane such as hosted work. Name each dependency in the prompt, sequence the work explicitly, or stop and ask.
  on_failure: |
    If the repository is at its WIP limit, another runner owns the surface, the setup probe fails, or a pin cannot read the required shape, report the collision or blocker to the operator instead of spawning.
- title: Settle conventions and foreseeable decisions before dispatch
  description: |
    Settle every foreseeable choice in the brief instead of letting runners choose independently. Fix the branch name as `issue-<n>-<slug>`, branched from the base ref that mission-wrap-up-sequence's rebase step names. A runner never merges, pushes to `main` or tags; it hands the operator the exact commands. If a force push is refused, it pushes to `<branch>-clean` or `<branch>-rebased` and lists the superseded branch for the operator to delete. Environment tooling comes from the setup script, not ad-hoc installs; a runner may try only the one documented fallback, `uv tool install --prerelease allow spec-kitty-cli` (see "Write the dispatch prompt"), and may not edit outside the repository, although per-run settings such as `GRADLE_USER_HOME=/tmp/gradle-home` are allowed. The delivery rules (changelog fragment, generated docs, CI watch and `pr:pause-ci`, the ready-for-review flip, commit attribution) are mission-wrap-up-sequence's, and the cross-runner integrity rules (sibling repositories, shared numbers, blocked sessions) are CLOUD_SESSION_ORCHESTRATION's: the prompt binds both by reference and does not re-type them. Post every operator ruling on the governing issue; runners cite that issue comment rather than chat. Record the settled choices in the dispatch prompt and keep one list of decisions that still need the operator.
  role: operator
- title: Pick the kind and bind its doctrine
  description: |
    Choose one kind and point the runner at the doctrine for it. Each kind also has non-goals the runner must respect. - tidy-first (structural, behaviour-preserving): charter Standing Order 2,
      DIRECTIVE_025 (tidy-first / enabler sequencing), the tidy-first carve-out
      in RECONCILE_CHANGE_SCOPE_TENSIONS, the built-in refactoring procedure
      and its refactoring tactics (extract-class-by-responsibility-split,
      move-method, change-function-declaration or parameter object,
      strangler-fig). No behaviour change. Move code first, then adjust
      callers. Make no logic edits while moving. Add no new size or ratchet
      gates: these runs rely on engineering discipline, not gates.
    - bugfix: test-first-bug-fixing and disciplined-defect-diagnosis, red-first
      through the pre-existing entry point. For an open P0, the reproduction
      carries the p0_repro marker until the fix, and the fix PR removes it.
    - test-quality: the test-suite-quality-assessment procedure. Retire a test
      only after re-proving its named covering guard with a planted break. Add
      seam units before trimming end-to-end tests.
    - feature: ATDD-first, with the canonical mission templates and the ADRs
      named in the issue.
    - docs: the docs mission patterns and the terminology canon.
- title: Write the dispatch prompt, with every field filled in
  description: |
    The prompt has these sections, in this order. (0) Setup: branch off the latest main (never push to main), run `bash scripts/dev/cloud-session-setup.sh` (it syncs the environment, installs the CLI from the checkout, keeps `.codegraph/` out of `git status` and starts the CodeGraph index build), read CLAUDE.md and the charter in full, and load `spec-kitty charter context --action <action>` for each phase. The charter overrides the prompt. Check `command -v spec-kitty` before attempting any install. If the setup script did not provide it, the runner may try exactly one documented fallback, `uv tool install --prerelease allow spec-kitty-cli`; if that fails, it reports and stops rather than trying another install route. (1) A read-only code-grounding run with its two discovery squads (similar surfaces and tracked issues), committed as the Mission's research note before anything is specified, as semi-auto-delivery's grounding step describes. The prompt names that step rather than restating it, and tells the runner never to widen scope past the dispatched issues silently. (2) The bound doctrine and the explicit non-goals. Bind the runner's semi-auto standing orders by reference: tell the runner to load `spec-kitty charter context --include procedure:semi-auto-delivery` and follow it (orientation, grounding-first, Mission-vs-Ops, the pause-and-escalate escalation classes, brownfield discipline, the test policy, the rebase cadence and the canonical closeout), rather than re-typing those standing orders into the prompt. (3) Numbered slices that can each be reviewed on their own, mapped to issues, with done-when criteria. (4) Testing per CLAUDE.md policy and NO_FULL_HEAVY_SUITES_IN_MISSION, with exact commands and counts recorded in "Tests run". (5) Delivery: the full canonical mission loop and mission-wrap-up-sequence's closeout (a draft PR first, CI to green, then the runner flips it to ready for review), with Closes only for fully delivered issues; the operator merges. (6) Commit attribution, bound by reference to the closeout step of mission-wrap-up-sequence. (7) CLOUD_SESSION_ORCHESTRATION, bound by reference: its integrity rules govern sibling repositories and sibling writes, and the runner lists its sibling drafts in its PR hand-off. (8) A runner sends one batched decision message, with a recommendation for each item, rather than acting independently or sending decisions piecemeal. Work started on a recommendation must be reversible, and a later operator ruling overrides it. (9) If a skill named in the brief is missing, including the adversarial squad, the runner reproduces that skill as parallel subagents, one per requested lens, each loading its profile as adversarial-squad-deployment's dispatch step describes, and discloses the fallback in its report.
- title: Spawn and report
  description: |
    Create the session against spec-kitty/spec-kitty at main, inheriting the model and environment. Report the session id, the title, the branch and the instruction summary. Start or update one status table with repository, PR, state, blocked-on and operator action for every runner. Never predict results. Read real state back (session status, events) before claiming any progress.
- title: Relay later guidance and replace blocked sessions
  description: |
    Send any steer or additional guidance the operator gives later to the running session as a labelled operator addendum. Relay every runner report to the operator promptly. Replace a blocked session as CLOUD_SESSION_ORCHESTRATION requires: a blocked session cannot pick up later environment changes. Preserve its report, branch, decisions and hand-off state in the status table before replacement. Do not archive or interrupt a healthy session unless the operator asks.
- title: Maintain the fleet record
  description: |
    Keep the status table current from actual runner reports: repository, PR, state, blocked-on and operator action. Record superseded `-clean` and `-rebased` branches and other stale branches for the operator to delete. Track unresolved decisions and cite the governing-issue comment once the operator rules. Never claim progress that was not read from the runner.
anti_patterns:
- title: Dispatching from a title
  content: |
    Re-scope notes, collisions and blocking P0s live in the comments and links. A prompt built from the title sends the runner after stale scope.
- title: Grounding prompt without discovery
  content: |
    Writing section (1) as a solo code-read with no similar-surfaces and tracked-issues squads. The runner then pointfixes the named surface and leaves its siblings and its issue family untouched.
- title: Placeholder prompts
  content: |
    A runner cannot ask what an unfilled field meant. Every section must be concrete before spawning.
- title: One PR for unrelated domains
  content: |
    Unrelated issues go to separate dispatches. Group issues only when they share a surface or a sequence.
- title: Gating instead of discipline
  content: |
    Adding size or ratchet gates the operator ruled out, instead of delivering the refactor itself.
- title: Claiming unread progress
  content: |
    Reporting a runner's outcome before reading it back from the session.
- title: Unbounded or colliding dispatch
  content: |
    Exceeding three open unmerged PRs per repository, putting runners on the same file family, or starting a wave before its environment probe and shared prerequisites have settled.
- title: Environment improvisation
  content: |
    Trying multiple install routes or editing outside the repository (sibling access and blocked sessions are CLOUD_SESSION_ORCHESTRATION's rules).
- title: Decision drip
  content: |
    Sending choices one at a time, acting irreversibly on a recommendation, or re-deciding a settled convention independently in each runner.
