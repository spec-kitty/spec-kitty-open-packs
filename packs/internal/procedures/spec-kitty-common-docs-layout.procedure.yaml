schema_version: '1.0'
id: spec-kitty-common-docs-layout
title: Spec Kitty Common Docs Layout
description: |
  Apply the repository's own Common Docs layout and frontmatter keys, as its charter or docs define them.
entry_condition: |
  A documentation page or ADR is being created, moved, or updated in a repository whose closure holds this pack.
exit_condition: |
  The page uses the sanctioned lifecycle keys, ADRs sit where the repository's charter puts them, and living architecture design sits in the one location the repository's docs name.
steps:
- title: Use the sanctioned lifecycle keys
  description: |
    Use `doc_status` (draft / active / deprecated / superseded / durable); `durable` marks domain throughlines that are re-verified on domain change, never retired.
- title: Keep the bare `status` key for ADRs only
  description: |
    Do not use a bare `status` key on a page, because it collides with the work package lane status. In ADRs it carries the MADR decision status (Proposed / Accepted / Deprecated / Superseded).
- title: Express cross-references as `related:`
  description: |
    List resolvable repo-relative `.md` paths under `related:`; never use the dead `citation_refs` field.
- title: File ADRs where the charter puts them
  description: |
    Read the repository's charter for the ADR location and layout: one flat folder, or one folder per era. File each ADR there with YAML frontmatter, and name it the way the existing ADRs are named. Keep living architectural design in the one unversioned location the repository's docs name.
