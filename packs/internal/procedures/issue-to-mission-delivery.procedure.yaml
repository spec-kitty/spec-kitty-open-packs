schema_version: '1.0'
id: issue-to-mission-delivery
title: Issue-to-Mission Delivery
description: |
  Take one or more GitHub issues in the canonical repository through a full governed Spec Kitty Mission (specify, plan, tasks, implement, review, accept, consolidate) to a pull request that is green and flipped from draft to ready for review. The procedure adds what is specific to starting from tracker issues: grounding the issues against current main, claiming them, and following the PR draft-first lifecycle. The close-out sequence itself, and the delivery rules it owns (changelog, generated docs, deferral bar, PR body, tree check, base ref and the ready-for-review flip), belong to mission-wrap-up-sequence. The `mission-from-issue` pack skill is the thin entry point to this procedure. Terms used here. The operator is the human in charge of the run: the maintainer who invoked it. The canonical repository is the repository the issues live in. The canonical remote is the git remote that points at it; find it with `git remote -v`. Every `gh` command here runs against the canonical repository: in a fork clone, run `gh repo set-default` once to point `gh` at it. The repository's charter and contributor docs (CONTRIBUTING, the PR template) define its labels, test commands and code rules. A review squad is a small set of reviewer subagents, each given a different focus; adversarial-squad-deployment owns when, who and how. The three tracer files are the Mission's running logs (tooling-friction.md, approach.md and design-decisions.md under the Mission's `traces/` directory; see mission-tracer-files).
entry_condition: |
  The operator named one or more issues, optionally followed by guidance (scope limits, order, specific concerns). If no issue is named, ask which to run. Record the guidance in the Mission spec. Scale the review effort to the work: a small fix gets a couple of reviewers per round; a governance, contract or API-surface change gets the full adversarial treatment.
exit_condition: |
  A pull request for the issues exists on the canonical repository, its CI is green (or green apart from documented pre-existing reds), it has been flipped from draft to ready for review as mission-wrap-up-sequence's closeout step describes, it carries the repository's ready label if it has one, and the operator has the hand-off report. Nothing has been merged.
steps:
- title: Start from the current main of the canonical remote
  description: |
    Find the canonical remote (`git remote -v`) and fetch it. Bring local `main` to `<canonical-remote>/main` with a fast-forward only; if the working tree has uncommitted changes or `main` cannot fast-forward, stop and report. Push nothing. If the update changed what the installed tools or the environment depend on, refresh the environment as the repository's contributor docs say: a stale install or a stale virtualenv gives false reds. Read the project charter (.kittify/charter/charter.md) and, before each workflow step (specify, plan, tasks, implement, review), load `spec-kitty charter context --action <step>`. The charter wins over any other guidance.
- title: Ground the issues before specifying
  description: |
    Read every named issue in full: body, comments, native sub-issues, `blocked_by` links, and the issues its comments reference. Dispatch a review squad of subagents; adversarial-squad-deployment owns how each delegate loads its profile (action `plan`) and gets its evidence. One reviewer confirms each issue still reproduces on current main (a brief reproduction) and was not superseded by a merged PR or an ADR (search `git log -S`, the changelog, referenced ADRs), and maps overlaps and dependencies between the issues. Another proposes the Mission boundary: which issues belong in one Mission, which are separate, and which are already closed or moot. Where an issue uses a term with several meanings in this repository (for example "primary", "merge" or "routing"), state which meaning applies before you scope the work. If every issue is resolved or superseded, stop and report. If only some are, report them, drop them from the scope and ask the operator to confirm the remaining scope before you continue.
- title: Claim every issue before any planning artifact
  description: |
    Before you write any planning artifact, claim every issue in scope, so no one else starts the same work (charter, Tracker Ticket Assignment Rule). For each issue: (1) comment that a Mission is being opened for it, with the intended scope in two or three sentences, and add the Mission slug in a follow-up comment once the specify step has created it; (2) assign the issue to the operator (`gh api user -q .login` gives the login of the maintainer who invoked the run; if the run names someone else, or you are unsure, ask) with `gh issue edit <n> --add-assignee <login>`, keeping existing assignees; if the issue is assigned to someone else who is active on it, stop and ask; (3) add the claim labels the repository's tracker guide defines, if any (for example `status:claimed` and `taken-by-human`), and comment `claimed by <harness>/<model> on <machine>`; the claim is a lease that tells other contributors and their tooling the issue is taken. Then re-read `gh issue view <n> --json assignees,labels` for every issue and confirm the operator and the claim labels are present. If any claim failed, stop and report. If `gh` reports missing token scopes, retry with `unset GITHUB_TOKEN`.
  on_failure: |
    Do not begin the specify step with an unclaimed issue.
- title: Specify, plan and tasks through the canonical commands
  description: |
    Run the specify, plan and tasks steps (`/spec-kitty.specify`, `/spec-kitty.plan`, `/spec-kitty.tasks`, or your tool's equivalent), then `spec-kitty agent mission finalize-tasks`. Never hand-build a path the resolver provides, and never copy structure from an older Mission. Add one row per issue to the Mission's issue matrix (the record of each referenced issue, its claim and its final verdict; `spec-kitty agent issue-verdict` sets a verdict). Create the three tracer files during planning and add to them with `spec-kitty agent tracer-append --mission <slug> --category approach|design-decisions|tooling-friction --entry "<text>"` as work proceeds (mission-tracer-files). After the spec and again after the tasks, have a review squad challenge the artifact (after tasks: look for work the tasks skip or under-specify), and update the artifact for each accepted finding.
- title: Survey the existing code, then implement
  description: |
    Before implementing, have a squad of reviewer subagents survey the code each work package will touch: the files and lines, other callers of the same code, places where the same fix would have to be repeated field by field, and places where a second source of truth could appear. Drive the work packages with `spec-kitty next --agent <name> --mission <slug>`; the per-work-package command is `spec-kitty agent action implement <WP> --agent <name>`. Never build a workspace path by hand. Fix each defect red-first through the pre-existing entry point (charter, ATDD-First Discipline; DIRECTIVE_034, test-first-bug-fixing). A repro for an open P0 bug carries the repository's open-P0 marker, if it has one, and the fix removes the marker; decide at wrap-up which repros stay as regression tests (development-assist-test-cleanup). Implementation uses the cheaper model tier and review the stronger tier (model-task-routing); every dispatched agent loads its profile as adversarial-squad-deployment describes (action `implement` or `review`). Add tests for new branches and helpers in the same PR, to the coverage the repository's gates require, and add a test only where it guards real behaviour or a standing invariant (DIRECTIVE_041). Follow the code rules the repository's charter and agent or contributor docs set. If a work package is rejected twice or blocked, stop and report. Never run a full heavy suite (NO_FULL_HEAVY_SUITES_IN_MISSION).
- title: Run the close-out sequence to a PR flipped to ready for review
  description: |
    Run the mission-wrap-up-sequence procedure end to end. It owns every delivery rule this run follows from here: the tree check before a force-push, the base ref, the changelog and generated-docs rules, the pre-PR review and its deferral bar, the PR-body contract, and the closeout that opens a draft PR, follows CI to green and flips the PR to ready for review. Two choices are specific to this procedure. Delegate each fold to a subagent on the cheaper model tier, with its profile loaded as adversarial-squad-deployment describes. Open the PR from the branch `issue-<n>-<slug>`. If the repository's tracker guide has a label that marks human-owned work (for example `taken-by-human`), add it to the PR when the closeout opens it and keep it on the issues.
- title: Label the PR as ready after the flip
  description: |
    After the closeout step has flipped the PR to ready for review, add the PR-queue label the repository's tracker guide defines for a finished PR, if it has one (for example `ready-for-squad`): the implementer has run the required tests and self-review, and the PR is finished and independently testable.
- title: Report and stop
  description: |
    Hand off as the last step of mission-wrap-up-sequence describes, and stop; the operator merges. If you are asked to follow up after the PR has merged, confirm the commits are on the canonical remote's `main`. Consolidation already removed the Mission's lane and coordination checkouts and branches; remove only your PR-landing or harness isolation worktree and the PR branch, and run `spec-kitty doctor workspaces --prune` for anything left.
anti_patterns:
- title: Specifying before the claim
  content: |
    An unclaimed issue invites a second runner (another agent or a person) onto the same work. Claim and verify first.
- title: Starting from a stale or wrong remote
  content: |
    A fork's `origin/main` can lag the canonical repository. Ground on the canonical remote, and push nothing to `main`.
