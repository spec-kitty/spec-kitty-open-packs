schema_version: '1.0'
id: meaning-carried-only-by-colour-or-only-by-a-diagram
title: Meaning carried only by colour or only by a diagram
description: Encoding status purely in colour, or stating a relationship only inside a diagram, excludes colour-blind readers and anyone who cannot see the render. Add a text label and restate the diagram's facts in prose.
severity: severe
bad_example: |-
  Lanes shown in red are blocked.   <!-- colour is the only signal -->
  (relationship shown only in the Mermaid graph, never in the text)
good_example: |-
  Blocked lanes are marked **blocked** and shown in red.
  As the diagram shows, WP03 is blocked on WP01 — WP03 cannot be claimed
  until WP01 is approved (this dependency is also stated here in prose).
