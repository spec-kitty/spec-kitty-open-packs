schema_version: '1.0'
id: skipped-or-size-driven-heading-levels
title: Skipped or size-driven heading levels
description: Jumping heading levels, or picking a level for its font size, destroys the document outline that screen-reader users navigate by. Descend one level at a time and use headings only for structure.
severity: severe
bad_example: |-
  # Configuration
  #### A small note        <!-- jumped H1 -> H4 for visual smallness -->
good_example: |-
  # Configuration
  ## Backends
  ### SQLite
