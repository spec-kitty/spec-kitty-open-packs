schema_version: '1.0'
id: hand-patching-a-generated-page-to-look-current
title: Hand-patching a generated page to look current
description: Editing generated output by hand to fix a drifted value makes the page diverge from its source and defeats the
  regeneration gate. Fix the source and regenerate.
severity: severe
bad_example: |-
  Hand-editing a signature in Sphinx-generated `docs/api/` so it matches the
  code, instead of re-running autodoc.
good_example: |-
  Update the annotated source and re-run the generator; the freshness gate
  then confirms the committed output matches regeneration.
