schema_version: "1.0"
id: ACTION_ITEM_ATTRIBUTION
title: Action Item Attribution
intent: >
  Every action item recorded in meeting minutes must be attributed to a named
  person. An unattributed action item cannot be followed up, tracked, or
  escalated — it becomes dead weight in the record. This rule is enforced as a
  hard validation gate: minutes containing ownerless actions are refused until
  the gap is resolved in the originating chat. The same gate applies
  before optional wiki publication.
enforcement: required
scope: >
  Applies to every action item in any meeting minutes generated by the Minutes
  Mahad agent or any process using the meeting-minutes-pipeline procedure,
  including optional wiki publication, and in BOTH output formats
  (decision minutes and discussion notes). The gate is about attribution, not
  the presence of actions: discussion notes may legitimately have no Action
  Items section at all, but any action that IS recorded — in either format —
  must carry a named owner. An ownerless action is a violation; the absence of
  actions in discussion notes is not.
integrity_rules:
  - "Refuse to return final minutes or publish while any action item lacks a named owner."
  - "Never invent or guess an owner. Ask about the gap in the originating chat."
  - "The em-dash separator (—) is canonical; tolerate en-dash or hyphen only during extraction, normalise before the final response."
