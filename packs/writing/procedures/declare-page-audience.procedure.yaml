schema_version: '1.0'
id: declare-page-audience
title: Page Audience Declaration
description: |
  Make the target reader of each touched documentation page machine-checkable.
entry_condition: |
  A change touches a documentation page in the project's documentation root.
exit_condition: |
  Every touched page names its readers in frontmatter as `audience:` entries, each with a `profile` and a `guidance_text`, and each profile names a persona the project defines (or a recorded gap).
steps:
- title: Declare the audience in frontmatter on every touched page
  description: |
    Add an `audience:` list to the page frontmatter rather than a prose note in the body. Each entry has a `profile` (the reader persona) and a `guidance_text` (one sentence on what that reader gets from the page). A persona is a short written profile of a reader type (role, familiarity with the subject, the decision the reader makes).
- title: Point the field at a defined persona
  description: |
    Set each `profile` to a persona the project keeps as a page in one place (doc-kitty resolves `profile: maintainer` to the page `context/audience/maintainer` under the docs root, and only warns when it is missing). If the project has none yet, name the persona in plain words and record the gap. An `audience:` value holding a repo-relative path is the legacy form.
- title: Require the field on touched pages only
  description: |
    Add the field when a page changes; do not fail untouched legacy pages for lacking it. DIRECTIVE_042 (Common Docs Documentation Standard) and the common-docs styleguide define the field's contract and tooling.
