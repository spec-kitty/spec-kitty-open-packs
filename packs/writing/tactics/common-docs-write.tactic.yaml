schema_version: "1.0"
name: Common Docs Write
id: common-docs-write
purpose: >
  How to author the body and frontmatter of a Common Doc to the styleguide so the
  page passes the structural lint and review: write the description inside the
  50-180 character band, express cross-references as related: page slugs, match the
  Divio type to the owning section, and follow the kebab-case naming convention.
  Use this once the page exists (scaffolded) and you are writing its content.
steps:
  - title: Match the Divio type to the section
    description: >
      Write the page as the Divio documentation type its section implies and keep
      one concern per file. Tutorials and guides/ are learning- and task-oriented;
      api/ and configuration/ are reference; architecture/ and adr/ are
      explanation (the why). Do not blend a how-to and a design rationale in one
      file — split them and cross-link with related:.
    examples:
      - "guides/open-the-dashboard.md is a task-oriented how-to; the why lives in an architecture/ explanation it links to."
      - "api/ pages are reference and are often generated; do not hand-write narrative explanation into them."
  - title: Write the description inside the band
    description: >
      Author the frontmatter description as a single string of 50-180 characters
      inclusive. Search results and link previews show it, as does an SEO step if
      the project has one. Make it a real summary of the page, not a
      placeholder. Count the characters yourself: review checks the band, and
      the structural lint does not.
    examples:
      - "A 120-character description that states what the page lets the reader do, within the 50-180 band."
      - "Rejected: a 30-character stub like 'Dashboard docs' that falls below the 50-character floor."
  - title: "Express cross-references as related: page slugs"
    description: >
      Link to other pages in the docs tree through the related: frontmatter
      list of page slugs (the path under the docs root without .md), each of
      which must resolve to an existing page; an entry may carry a note as
      ref and note. Put links outside the docs tree under
      external_references: (url, title and an optional note, or type and id). A docsite build that
      reads this shape fails on a slug that does not resolve; otherwise review
      checks every entry, and so does the project's own related: validator if
      it has one. Do not reintroduce the dead citation_refs sidecar field and
      do not bury cross-references only in prose where no gate can see them.
    examples:
      - "related: [ architecture/payment-retries, adr/2026-05-16-1-retry-backoff-policy ]: both slugs resolve to pages."
      - "Rejected: related: [ architecture/does-not-exist ]: the slug dangles, and the build or review fails it."
      - "Rejected for a new page: related: [ ../architecture/payment-retries.md ], the legacy path form."
  - title: Keep naming and lifecycle keys conventional
    description: >
      Use lowercase kebab-case file and directory names (ADR filenames keep their
      dated prefix), carry the project's lifecycle key (doc_status by default) with a value its docs
      styleguide defines, and refresh updated: YYYY-MM-DD
      whenever the body changes. Apply the styleguide rather than improvising; its
      rule-to-check table maps each of these rules to a lint check or to review.
    examples:
      - "Renaming Open_Dashboard.md to open-dashboard.md to satisfy kebab-case naming."
      - "Flipping doc_status: draft -> active and bumping updated: when the page is finalised."
  - title: Run the checks before handoff
    description: >
      Verify compliance by running checks, not by asserting it in prose. Run
      the common-docs-structural-lint asset over the docs root; the
      common-docs-structural-lint toolguide says how to resolve it and its
      policy file. Then review what the lint does not check: the description
      band, kebab-case names, every related: slug and the audience: entries.
      If the project has its
      own related: validator or page-inventory check, run it too. Treat a
      failing check as a blocker, not a note for a later pass.
    examples:
      - "python3 \"$(spec-kitty charter pack asset path common-docs-structural-lint)\" --styleguide \"$(spec-kitty charter pack asset path common-docs-structural-lint-config)\" docs exits 0 before handoff."
      - "The lint reports [frontmatter_contract] for a page with no updated: field; add it and rerun."
failure_modes:
  - "The description is shorter than 50 or longer than 180 characters and review rejects it."
  - "A cross-reference is written in prose or as citation_refs instead of a related: page slug, so no gate can verify it."
  - "A related: slug does not resolve to a page, and the build or review fails it."
  - "A how-to and a design rationale are merged into one file, breaking the one-concern-per-file and Divio-type conventions."
  - "Compliance is asserted in prose without running the structural lint or reviewing what it does not check."
