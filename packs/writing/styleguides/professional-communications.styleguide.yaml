id: professional-communications
schema_version: '1.0'
title: Professional Communications Styleguide
scope: docs
principles:
- name: Persona first
  description: 'Persona first: identify the target audience before drafting a single sentence. Every artifact names its target persona (see DIRECTIVE_047, Audience-Oriented Writing).'
- name: Minimal, rationale-backed edits
  description: 'Minimal, rationale-backed edits: when editing existing content, prefer the smallest change that fixes the problem, and state why the change was made.'
- name: Preserve the author's voice and facts
  description: 'Preserve the author''s voice and facts: do not introduce new facts, alter existing factual claims, or change the author''s conclusions without explicit approval.'
- name: Plain language over jargon
  description: 'Plain language over jargon: prefer common words over specialized terminology unless the target persona is already fluent in that terminology.'
- name: One document, one audience
  description: 'One document, one audience: when a single draft must serve genuinely divergent audiences, split into persona-specific variants rather than diluting the content for everyone.'
- name: Validate before publishing
  description: 'Validate before publishing: check the draft against the project''s configured style-guide checklist before considering it done - this styleguide defines the generic checklist pattern, not a specific organization''s brand rules.'
patterns:
- name: Validate before publishing
  description: |
    Validate before publishing: check the draft against the project's configured style-guide checklist (whatever that project's own tone/format rules are) before considering it done - this styleguide defines the generic checklist pattern, not a specific organization's brand rules.
