id: docs-freshness-sla
schema_version: '1.0'
title: Documentation Freshness SLA Styleguide
scope: docs
principles:
- name: Every page carries a freshness date
  description: 'Every page carries a freshness date. Frontmatter carries `updated: YYYY-MM-DD`, set to the date the page''s content was last verified against reality — not the date of an incidental typo fix.'
- name: Set explicit staleness thresholds
  description: Staleness thresholds are explicit and tiered by page volatility. A page is flagged stale when its `updated` date is older than the threshold for its tier.
- name: Reset freshness on behaviour change
  description: Behaviour change resets the clock regardless of the SLA. The freshness SLA is a backstop for silent drift, not a licence to defer.
- name: Regenerate generated pages and check them for drift
  description: Generated pages are freshened by regeneration, and any generated rollup the project keeps is checked for drift.
- name: Triage stale pages
  description: 'A stale page is triaged, not silently left live. When a page trips its threshold it enters a review: verify it against current behaviour and bump `updated`, or distil-and-retire it if the behaviour is gone.'
- name: Review cadence is scheduled, not incidental
  description: Review cadence is scheduled, not incidental. Documentation is reviewed for freshness on a recurring cadence (for example, a periodic audit sweep), independent of whether anyone happened to edit it.
- name: Deprecation and retirement are freshness outcomes, not clutter
  description: 'Deprecation and retirement are freshness outcomes, not clutter. The result of a freshness triage may be to mark a page `doc_status: deprecated | superseded` and schedule its retirement.'
- name: Durable throughlines are never aged out
  description: 'Durable throughlines are never aged out. A page marked `doc_status: durable` is a reserved, never-retire domain throughline: it is exempt from the staleness sweep and is never flagged stale or scheduled for retirement by the SLA.'
patterns:
- name: Verified-content freshness date
  description: |
    Set `updated` to the date the content was last checked against reality, so the staleness check measures information age, not edit age.
  bad_example: |
    ---
    title: Claim and Implement a Work Package
    updated: 2026-07-15   # only a typo was fixed; behaviour last checked months ago
    ---
  good_example: |
    ---
    title: Claim and Implement a Work Package
    type: how-to
    doc_status: active
    updated: 2026-07-15   # content verified against current CLI behaviour today
    ---
- name: Tiered staleness threshold
  description: |
    Assign a staleness threshold by the page's volatility tier so fast-moving surfaces are flagged sooner than slow-moving rationale.
  bad_example: |
    # "It feels old" — no threshold, so nothing is ever consistently flagged.
  good_example: |
    # Freshness tiers (illustrative):
    #   tutorial / how-to (CLI, API):   flag after 90 days
    #   hand-written reference:          flag after 180 days
    #   generated reference:             re-freshened every build
    #   explanation / ADR:               flag after 365 days
- name: Every page carries a freshness date
  description: 'Every page carries a freshness date. Frontmatter carries `updated: YYYY-MM-DD`, set to the date the page''s content was last verified against reality — not the date of an incidental typo fix. The freshness date is the input to every staleness check; a page without one cannot be triaged and is treated as stale by default.'
- name: Set explicit staleness thresholds
  description: Staleness thresholds are explicit and tiered by page volatility. A page is flagged stale when its `updated` date is older than the threshold for its tier. Tutorials and how-tos that track fast-moving surfaces (CLI, API) carry the tightest threshold; reference that is generated is re-freshened on every build; explanation and ADRs age slowest because rationale changes rarely. State the tier's threshold rather than leaving 'stale' to opinion.
- name: Reset freshness on behaviour change
  description: Behaviour change resets the clock regardless of the SLA. The freshness SLA is a backstop for silent drift, not a licence to defer. DIRECTIVE_037 (Living Documentation Sync) owns the same-change documentation-update rule; a behaviour-changing change bumps the affected pages' `updated` date under that same rule. The SLA catches the pages nobody touched; it never replaces same-change updates.
- name: Regenerate generated pages and check them for drift
  description: Generated pages are freshened by regeneration, and any generated rollup the project keeps is checked for drift. Auto-generated reference (rustdoc / JSDoc / Sphinx autodoc) and any generated rollup the project keeps are regenerated from source, and a check fails when the committed artifact drifts from what regeneration would produce. A generated page is never hand-patched to look fresh; it is regenerated.
- name: Triage stale pages
  description: 'A stale page is triaged, not silently left live. When a page trips its threshold it enters a review: verify it against current behaviour and bump `updated`, or distil-and-retire it if the behaviour is gone. Prioritise the triage by reader impact — a stale tutorial for a core workflow blocks more users than a stale explanation of an edge case — using the gap-prioritization procedure. A tripped threshold is a work item, not a warning to ignore.'
- name: Review cadence is scheduled, not incidental
  description: Review cadence is scheduled, not incidental. Documentation is reviewed for freshness on a recurring cadence (for example, a periodic audit sweep), independent of whether anyone happened to edit it. The cadence is what surfaces the pages that no behaviour change touched but that reality has quietly outgrown.
- name: Deprecation and retirement are freshness outcomes, not clutter
  description: 'Deprecation and retirement are freshness outcomes, not clutter. The result of a freshness triage may be to mark a page `doc_status: deprecated | superseded` and schedule its retirement. Freshness is not only ''update the date'' — it includes deciding a page should no longer be live.'
- name: Durable throughlines are never aged out
  description: 'Durable throughlines are never aged out. A page marked `doc_status: durable` is a reserved, never-retire domain throughline: it is exempt from the staleness sweep and is never flagged stale or scheduled for retirement by the SLA. Its freshness is maintained by re-verification on domain change (the behaviour-change-resets-the-clock rule still applies), not by the tiered ageing thresholds.'
tooling:
  freshness-date-present: 'documentation mission validate action (asserts every page carries an `updated: YYYY-MM-DD` and flags pages past their tier threshold as stale).'
  generated-page-drift-check: the project's own regeneration check for generated reference and for any generated rollup the project keeps (it regenerates the artifact and fails on drift). Where the project has no such check, review reruns the generator and compares; see the common-docs styleguide's `frontmatter-ssot` row.
  stale-page-triage: the documentation-gap-prioritization procedure (triage flagged-stale pages by reader impact and fill or retire in priority order).
quality_test: |
  For any documentation page, can you tell whether it is fresh — does it carry a verified `updated` date, is it within its tier's staleness threshold, was its clock reset by any behaviour change that touched it, are generated pages kept current by regeneration rather than hand-patching, and does every tripped threshold become a prioritised triage rather than a page silently left live?
