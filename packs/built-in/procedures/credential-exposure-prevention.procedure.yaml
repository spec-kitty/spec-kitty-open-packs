schema_version: '1.0'
id: credential-exposure-prevention
title: Credential Exposure Prevention
description: |
  Keep raw credential values out of everything an agent produces.
entry_condition: |
  A task involves credentials, secrets, or tokens, or output that could contain them.
exit_condition: |
  No raw credential appears in any prompt, log, commit, error or artifact, exposure is prevented connector-side under least privilege, and any leak stopped the work.
steps:
- title: Prevent exposure at the source
  description: |
    Never put a raw credential in a prompt, log line, commit message, error or artifact. Inject credentials connector-side so they never pass through model context, redact before the model sees output, and run under least privilege so a leak grants the narrowest access (see the secure-design-checklist).
- title: Strip credentials from unavoidable error text
  description: |
    As a defense-in-depth fallback, when a third-party client still emits the credential inside an error string, strip the value before surfacing it, keeping only non-sensitive parts (status code, error class, timestamp).
- title: Stop the line on exposure
  description: |
    Treat a credential appearing in output as a stop-the-line defect: halt and report rather than continuing with a redaction added after the fact.
