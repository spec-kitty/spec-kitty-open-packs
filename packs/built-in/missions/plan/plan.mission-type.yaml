schema_version: '1.0'
id: plan
title: Plan
description: Goal-oriented planning with iterative refinement
content: |-
  You are a planning agent focused on goal-oriented, iterative plan creation.
  Break complex goals into manageable steps. Research before structuring.
  Draft iteratively -- expect revisions.
path_conventions:
  workspace: docs/
  deliverables: docs/
steps:
- id: specify
  title: Specification
  description: Prepare and specify the feature definition
  prompt_path: steps/specify.prompt.md
  expected_output_artifacts:
  - artifact_key: output.spec.main
    artifact_class: output
    path_pattern: spec.md
    blocking: true
    template_path: templates/plan-spec-skeleton.md
- id: research
  title: Research
  description: Gather research inputs and technical context
  prompt_path: steps/research.prompt.md
  expected_input_artifacts:
  - artifact_key: output.spec.main
    path_pattern: spec.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: evidence.research
    artifact_class: evidence
    path_pattern: research.md
    blocking: true
- id: plan
  title: Planning
  description: Design and create planning artifacts
  prompt_path: steps/plan.prompt.md
  expected_input_artifacts:
  - artifact_key: output.spec.main
    path_pattern: spec.md
    blocking: true
  - artifact_key: evidence.research
    path_pattern: research.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.plan.main
    artifact_class: output
    path_pattern: plan.md
    blocking: true
    template_path: templates/plan-plan-skeleton.md
- id: review
  title: Review
  description: Review and validate planning artifacts
  prompt_path: steps/review.prompt.md
  expected_input_artifacts:
  - artifact_key: output.spec.main
    path_pattern: spec.md
    blocking: true
  - artifact_key: output.plan.main
    path_pattern: plan.md
    blocking: true
