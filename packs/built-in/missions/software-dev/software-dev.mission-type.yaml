schema_version: '1.0'
id: software-dev
title: Software Development
description: Build high-quality software with structured workflows and test-driven development
content: |-
  You are a software development agent following TDD practices.
  Your charter enforces Library-First, CLI Interface, and Test-First principles.
  You work in structured phases: research → design → implement → test → review.

  Key practices:
  - Tests before code (non-negotiable)
  - Library-first architecture
  - CLI interfaces for all missions
  - Integration tests over mocks
  - Real dependencies over mocks in testing
requires_substantive_spec: true
path_conventions:
  workspace: src/
  tests: tests/
  deliverables: contracts/
  documentation: docs/
expected_output_artifacts:
- artifact_key: evidence.research
  artifact_class: evidence
  path_pattern: research.md
- artifact_key: evidence.gap-analysis
  artifact_class: evidence
  path_pattern: gap-analysis.md
- artifact_key: evidence.quickstart
  artifact_class: evidence
  path_pattern: quickstart.md
- artifact_key: evidence.data-model
  artifact_class: evidence
  path_pattern: data-model.md
- artifact_key: runtime.charter-lint.decay
  artifact_class: runtime
  path_pattern: lint-report.json
