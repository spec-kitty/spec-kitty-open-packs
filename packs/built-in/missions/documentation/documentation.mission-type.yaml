schema_version: '1.0'
id: documentation
title: Documentation
description: Create and maintain high-quality software documentation following Write the Docs and Divio principles
content: |-
  You are a documentation agent following Write the Docs best practices and the Divio documentation system.

  Key Practices:
  - Documentation as code: docs live in version control alongside source
  - Divio 4-type system: tutorial, how-to, reference, explanation (distinct purposes)
  - Accessibility: clear language, proper headings, alt text for images
  - Bias-free language: inclusive examples and terminology
  - Iterative improvement: support `gap_filling` and `mission_specific` documentation

  Workflow Phases: discover → audit → design → generate → validate → publish

  Generator Integration:
  - JSDoc for JavaScript/TypeScript API reference
  - Sphinx for Python API reference (autodoc + napoleon)
  - rustdoc for Rust API reference

  Gap Analysis:
  - Audit existing docs to identify missing Divio types
  - Build coverage matrix showing what exists vs what's needed
  - Prioritize gaps by user impact
path_conventions:
  workspace: docs/
  deliverables: docs/
  documentation: docs/
expected_output_artifacts:
- artifact_key: evidence.research
  artifact_class: evidence
  path_pattern: research.md
- artifact_key: evidence.data-model
  artifact_class: evidence
  path_pattern: data-model.md
- artifact_key: evidence.quickstart
  artifact_class: evidence
  path_pattern: quickstart.md
- artifact_key: evidence.audit-report
  artifact_class: evidence
  path_pattern: audit-report.md
- artifact_key: runtime.charter-lint.decay
  artifact_class: runtime
  path_pattern: lint-report.json
steps:
- id: discover
  title: Documentation Discovery
  description: Identify documentation needs, target audience, and the iteration mode (`initial` / `gap_filling` / `mission_specific`).
  role: researcher
  prompt_path: steps/discover.prompt.md
  guidelines_path: steps/discover.guidelines.md
  expected_output_artifacts:
  - artifact_key: input.spec.documentation
    artifact_class: input
    path_pattern: spec.md
    blocking: true
    template_path: templates/documentation-spec-template.md
- id: audit
  title: Documentation Audit
  description: Analyze existing documentation and produce gap-analysis.md.
  role: researcher
  prompt_path: steps/audit.prompt.md
  guidelines_path: steps/audit.guidelines.md
  expected_input_artifacts:
  - artifact_key: input.spec.documentation
    path_pattern: spec.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: evidence.gap-analysis
    artifact_class: evidence
    path_pattern: gap-analysis.md
    blocking: true
- id: design
  title: Documentation Design
  description: Plan documentation structure, Divio types, and generator configuration in plan.md.
  role: architect
  prompt_path: steps/design.prompt.md
  guidelines_path: steps/design.guidelines.md
  expected_input_artifacts:
  - artifact_key: input.spec.documentation
    path_pattern: spec.md
    blocking: true
  - artifact_key: evidence.gap-analysis
    path_pattern: gap-analysis.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: workflow.plan.documentation
    artifact_class: workflow
    path_pattern: plan.md
    blocking: true
    template_path: templates/documentation-plan-template.md
- id: generate
  title: Documentation Generation
  description: Produce documentation artifacts under docs/.
  role: implementer
  prompt_path: steps/generate.prompt.md
  guidelines_path: steps/generate.guidelines.md
  expected_input_artifacts:
  - artifact_key: workflow.plan.documentation
    path_pattern: plan.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.docs.generated
    artifact_class: output
    path_pattern: docs/**/*.md
- id: validate
  title: Documentation Validation
  description: Verify Divio adherence, accessibility, and completeness; emit audit-report.md.
  role: reviewer
  prompt_path: steps/validate.prompt.md
  guidelines_path: steps/validate.guidelines.md
  expected_input_artifacts:
  - artifact_key: workflow.plan.documentation
    path_pattern: plan.md
    blocking: true
  - artifact_key: output.docs.generated
    path_pattern: docs/**/*.md
  expected_output_artifacts:
  - artifact_key: evidence.audit-report
    artifact_class: evidence
    path_pattern: audit-report.md
    blocking: true
- id: publish
  title: Documentation Publication
  description: Prepare documentation for release and emit release.md handoff.
  role: reviewer
  prompt_path: steps/publish.prompt.md
  guidelines_path: steps/publish.guidelines.md
  expected_input_artifacts:
  - artifact_key: evidence.audit-report
    path_pattern: audit-report.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.release.main
    artifact_class: output
    path_pattern: release.md
    blocking: true
- id: accept
  title: Acceptance
  description: Validate documentation completeness, quality gates, and readiness for publication.
  role: reviewer
  prompt_path: steps/accept.prompt.md
  guidelines_path: steps/accept.guidelines.md
  expected_input_artifacts:
  - artifact_key: output.release.main
    path_pattern: release.md
    blocking: true
  - artifact_key: evidence.audit-report
    path_pattern: audit-report.md
    blocking: true
on_demand_steps:
- id: retrospect
  title: Retrospective
  description: Capture what helped, what did not and the governance gaps of a finished mission as a retrospective record.
  role: facilitator
  prompt_path: steps/retrospect.prompt.md
