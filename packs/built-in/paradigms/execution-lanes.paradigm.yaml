schema_version: "1.0"
id: execution-lanes
name: Execution Lanes
summary: >
  The default Spec Kitty implementation workspace paradigm for Missions with
  more than one execution lane. Each execution lane is a lane branch; the work
  packages in a lane run in sequence on it, in a lane worktree that
  `spec-kitty implement` provides, so agents can implement, test, review, and
  hand off changes without mutating another lane's checkout. Status is not kept
  in the lane: it lives on the Mission's resolved status surface, and lane
  checkouts never change or serve it. Small Missions (at most 2 work packages,
  or one lane) use `single_branch` and need no lane. Shared mainline state is
  reached only through explicit review, consolidation, and quality gates.
