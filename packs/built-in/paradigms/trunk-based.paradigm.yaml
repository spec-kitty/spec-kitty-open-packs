schema_version: "1.0"
id: trunk-based
name: Trunk-Based Development
summary: >
  A branch-management paradigm where contributors integrate small, verified
  changes into the mainline frequently, avoiding long-lived divergence. Teams may
  integrate through a shared branch protected by continuous integration and
  staging hygiene. In Spec Kitty this exists as a resolvable compatibility
  paradigm for projects whose charter selects trunk-based development or a shared
  branch model. Work remains gated by targeted staging, explicit commit
  attribution, and test/typecheck verification before shared mainline state is
  promoted, with isolated verification evidence preserved for each change.
principles:
  - name: Integrate early and often
    description: Frequent merges keep differences small, so integration problems surface while they are cheap.
  - name: Small changes
    description: A small change is easier to review, verify and undo.
  - name: The mainline is always releasable
    description: What is shared has passed verification, so the mainline can be relied on at any moment.
  - name: Avoid long-lived divergence
    description: A branch that lives long becomes costly to merge and hides conflicts from the rest of the team.
  - name: Shared state is earned
    description: Because everyone builds on the mainline, a change has to show who made it and that it works before others depend on it.
