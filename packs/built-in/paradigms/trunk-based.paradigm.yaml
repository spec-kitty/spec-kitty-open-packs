schema_version: "1.0"
id: trunk-based
name: Trunk-Based Development
summary: >
  A branch-management paradigm where contributors integrate small, verified
  changes into the mainline frequently, avoiding long-lived divergence. Teams may
  integrate through a shared branch protected by continuous integration and
  staging hygiene. In Spec Kitty this exists as a resolvable compatibility
  paradigm for projects whose charter selects trunk-based development or a shared
  branch model. Work remains gated by targeted staging, explicit commit
  attribution, and test/typecheck verification before shared mainline state is
  promoted, with isolated verification evidence preserved for each change.
