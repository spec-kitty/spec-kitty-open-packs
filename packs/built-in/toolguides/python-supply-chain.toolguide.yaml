id: python-supply-chain
schema_version: '1.0'
tool: python-supply-chain-stack
title: Python Supply-Chain Install Safety
guide_path: python-supply-chain.guide.md
summary: |
  Ecosystem-specific commands and file names for the Python pip/uv/poetry stack: lockfile-driven reproducible installs, hash pinning, and index pinning. This guide carries the mechanics; the `supply-chain-install-safety` tactic (ecosystem-neutral) owns the checklist shape and the evidence a reviewer requires.
commands:
- uv lock
- uv sync --locked
- uv pip compile --generate-hashes
- pip install --require-hashes
- poetry lock
- poetry sync
applies_to_languages:
- python
last_updated: '2026-09-28'
