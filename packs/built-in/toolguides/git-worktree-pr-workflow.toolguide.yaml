tool: git
title: Git Worktree and PR-Landing Workflow
guide_path: git-worktree-pr-workflow.guide.md
summary: |
  Operational gotchas for multi-worktree git repositories and PR-landing pushes: the shared stash stack across worktrees, moving HEAD under a running background job, recovering from a --force-with-lease (stale info) rejection, and fork PR pushes over SSH.
