schema_version: '1.0'
id: fetching-services-via-drupal-inside-a-class
title: 'Fetching Services via \Drupal:: Inside a Class'
description: 'Services arrive through the constructor and a static create() factory; never fetch them via \Drupal:: inside
  a class.'
severity: severe
bad_example: $nodes = \Drupal::entityTypeManager()->getStorage('node')->loadMultiple();
good_example: |-
  public function __construct(protected EntityTypeManagerInterface $entityTypeManager) {}
  public static function create(ContainerInterface $container): static {
    return new static($container->get('entity_type.manager'));
  }
  // ...
  $nodes = $this->entityTypeManager->getStorage('node')->loadMultiple();
