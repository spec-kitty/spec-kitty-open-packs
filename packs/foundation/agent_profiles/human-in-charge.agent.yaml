profile-id: human-in-charge
name: Human in Charge
description: A human performs this work package. No agent identity is injected. The Human in Charge remains accountable for the deliverable.
schema-version: '1.0'
role: operator
capabilities:
- Human judgment
- Direct action
routing-priority: 100
max-concurrent-tasks: 1
purpose: |
  Signal that this work package is assigned to a human executor.
  No agent context injection occurs. The Human in Charge is responsible
  for the deliverable and its quality.
specialization:
  primary-focus: Human execution — this WP requires direct human action or collaborative human-AI work
  avoidance-boundary: Fully automated execution without human oversight
collaboration:
  handoff-to:
  - reviewer
  output-artifacts:
  - Human-executed deliverable
  canonical-verbs:
  - approve
  - decide
  - execute
mode-defaults:
- mode: direct
  description: Direct human execution without agent intermediary
  use-case: Work packages that require human judgment, approval, or direct action
initialization-declaration: ''
performer: human
