# Spec Kitty core: a glossary context (charter ADR-0049); each term is term:spec-kitty-core/<term-id>.
#
# This file is the authoring source of the canonical Spec Kitty terminology. Edit it by hand, through the
# glossary-curation workflow: the writing pack's glossary-maintenance-workflow procedure and foundation's
# glossary-curation-interview tactic. No generator writes it. The consumer-facing terms of core's docs/context
# pages are kept here; their house-only terms live in the internal pack's glossary.
schema_version: '1.0'
id: spec-kitty-core
name: Spec Kitty core
description: Canonical Spec Kitty terminology, the vocabulary a project meets in its Missions, charter, Charter Packs,
  CLI output and event logs. This file is its authoring source.
terms:
  - id: action-context
    name: action context
    definition: Aggregated runtime information resolved for a specific agent action, including mission slug, work package
      ID, base branch, workspace path, and dependency state. Passed to agents at step boundaries.
    status: active
  - id: adversarial-squad
    name: adversarial squad
    definition: A bounded set of profile-loaded delegates, dispatched at an SDD point-cut, each casting a distinct doctrine
      lens chosen for that point-cut's question so independent perspectives converge on findings a single reviewer would miss.
      Optional, never a gate. Owned by the built-in adversarial-squad-deployment procedure (the single owner
      of when, who, and how).
    status: active
  - id: advise-mode
    name: advise mode
    definition: An execution mode in which the harness proposes answers to interview questions for mission owner confirmation,
      without acting autonomously. The mission owner retains final authority on every decision.
    status: draft
  - id: agent-skills
    name: agent skills
    definition: The skills-first agent command discovery model in which capabilities are installed as skill packages under
      .agents/skills/ and resolved at runtime by name.
    status: active
  - id: base-branch
    name: base branch
    definition: 'At the mission level (branch-context output): alias for target_branch — the branch the mission is rooted
      in. At the worktree/WP level (WP prompt frontmatter): the specific git branch from which the individual lane worktree
      was created; may be a lane branch (e.g. kitty/mission-010-feature-lane-a) rather than the target branch itself. The
      same key therefore has different scopes: in branch-context JSON base_branch == target_branch; in WP frontmatter base_branch
      records the worktree''s immediate parent.'
    status: active
  - id: behaviour-driven-development
    name: behaviour-driven development
    definition: A collaboration practice, not a testing methodology, that operates through Discovery (Three Amigos conversations
      produce concrete behavioral examples), Formulation (examples become plain-language Given/When/Then specifications),
      and Automation (specifications connect to executable tests). See the paradigm and the bdd-scenario-formulation tactic.
    aliases:
      - behavior-driven development
    status: active
  - id: branch-strategy-gate
    name: branch strategy gate
    definition: The mission-create guard for PR-bound missions that requires an explicit operator or agent decision before
      planning artifacts are written on a primary branch. Interactive callers may confirm at the prompt; non-interactive callers
      record the already-made decision with --branch-strategy already-confirmed. When the recommended topic-branch path
      is chosen, pass --start-branch so the CLI switches before scaffold writes.
    status: active
  - id: build
    name: build
    definition: One checkout or worktree of one repository with its own execution context.
    status: active
  - id: build-id
    name: build_id
    definition: Per-checkout/worktree identity, unique per working tree. Unchanged from pre-081.
    status: active
  - id: bulk-edit
    name: bulk edit
    definition: A codebase-wide mechanical rename or terminology migration tracked as a mission with change_mode set to bulk_edit.
      Governed by the occurrence classification guardrail workflow.
    status: active
  - id: catastrophic-backtracking
    name: catastrophic backtracking
    definition: 'A regular-expression engine failure mode in which a vulnerable pattern combined with adversarial input drives
      matching time into exponential or polynomial complexity. Backtracking engines (Python `re`, JavaScript, Java, .NET)
      attempt every possible partition of the input when a match fails; patterns with nested or consecutive non-possessive
      repetitions can produce O(2^N) or O(N^c) retry storms. The `secure-regex-catastrophic-backtracking` tactic codifies
      the four dangerous-shape patterns, the rewrite ladder (bound quantifier → refactor nested → possessive/atomic group
      → negated char class), and the escape hatches (drop the regex, re2, multi-pass, bounded-input cap). Every fix requires
      a wall-clock regression test asserting linear runtime on an adversarial input (default budget: ≤100 ms for 100 000 chars).
      Synonym "ReDoS" (Regular-expression Denial of Service) is acceptable only as a parenthetical.'
    status: active
  - id: ceremony-commit
    name: ceremony commit
    definition: DEPRECATED. Replaced by `status commit`. This term obscures intent and is forbidden in active source. See
      the canonical `status commit` entry.
    status: deprecated
  - id: change-mode
    name: change mode
    definition: 'A mission-level metadata flag (change_mode: bulk_edit) that activates the bulk-edit guardrail workflow, requiring
      an occurrence map before any work package may be approved.'
    status: active
  - id: charter
    name: charter
    definition: A governance document synthesizing a project's purpose, constraints, team norms, and the body of project-specific
      governance artifacts — directives, tactics, and styleguides — into a durable reference artifact. Produced by the charter
      interview workflow.
    status: active
  - id: characterization-test
    name: characterization test
    definition: 'A test that captures the observable behavior of existing code as fixture-driven assertions,

      written before any refactor of that code. The refactor must leave the characterization test

      green. See the `tdd-red-green-refactor` tactic. Distinguished from snapshot tests (overloaded

      term) and regression tests (too broad).'
    status: active
  - id: responsibility-boundary
    name: responsibility boundary
    aliases:
      - responsibility border
    definition: The edge of what the system under test owns for the behavior under test, drawn by responsibility rather
      than by layer, module or class. Collaborators inside it run for real; only dependencies outside it that are on the
      mock-boundary directive's allow-list may be substituted.
    status: active
  - id: change-detector-test
    name: change-detector test
    definition: A test that restates configuration or structure. It goes red only because the thing does not exist yet and
      afterwards fails only when someone changes it on purpose, so it guards no lasting behavior. Where a real run or an
      existing gate is the evidence, it is not written, as the test-first directive sets out. Not a characterization test,
      which pins existing behavior so a refactor can be checked against it.
    status: active
  - id: charter-lint
    name: charter lint
    definition: Graph-native decay detection that validates the internal consistency and freshness of doctrine artifacts in
      the doctrine reference graph. Identifies stale references, missing edges, and definition drift.
    status: draft
  - id: conflict-prediction
    name: conflict prediction
    definition: A dry-run forecast of which files will conflict and which conflicts are auto-resolvable, produced before a
      merge begins to help the mission owner decide whether to proceed.
    status: draft
  - id: current-branch
    name: current branch
    definition: 'The git branch checked out in the repository root checkout at the moment a spec-kitty workflow command (specify,
      plan, tasks, implement) is invoked. Read ephemerally from the working tree; never persisted in any mission artifact.
      Exposed as current_branch / CURRENT_BRANCH in branch-context JSON output. Spec Kitty never derives the mission target
      from current_branch: it reads target_branch from meta.json, so the branch contract is stable regardless of which branch
      the operator is on when driving the mission.'
    status: active
  - id: decision-moment
    name: decision moment
    definition: A local CLI artifact representing a choice point in an interview flow (charter, specify, or plan) where the
      mission owner or a delegated agent must provide input before the flow can continue.
    status: draft
  - id: deliberate-linearity
    name: deliberate linearity
    definition: A function whose body is intentionally kept long-and-linear (rather than extracted into named helpers) for
      traceability against a documented contract, code-review map, or output-section sequence. Deliberate linearity functions
      are NOT refactor candidates regardless of Sonar S3776 score. Identified by an explicit code comment justifying the structure
      and/or a published output-section contract that reviewers verify line-by-line. Refactoring a deliberately linear function
      without updating its contract is a regression in traceability. Distinct from structural debt.
    status: active
  - id: diff-compliance-gate
    name: diff compliance gate
    definition: The review-time check that validates a work package diff against its occurrence map. Blocks approval if uncategorized
      or improperly changed occurrences are found.
    status: active
  - id: directive
    name: directive
    definition: A doctrine artifact encoding a specific governance rule or constraint. The primary building block of a project's
      governance; referenced by agent profiles and action scopes. Its `enforcement` field is a default enforcement level (see
      enforcement level).
    status: active
  - id: doctrine-reference-graph
    name: doctrine reference graph
    definition: The directed graph of interconnected doctrine directives, tactics, and styleguides that defines a project's
      governance structure. Abbreviated as drg. Edges encode requires, suggests, and replaces relationships between nodes.
    status: active
  - id: drg
    name: drg
    definition: Abbreviation for doctrine reference graph — the directed graph of interconnected governance artifacts (directives,
      tactics, styleguides) defining a project's doctrine.
    status: active
  - id: enforcement-level
    name: enforcement level
    definition: How strictly an in-force directive binds, ranked `required` > `lenient-adherence` > `advisory` (the charter's
      directive schema). `required` means a deviation outside the directive's own `explicit_allowances` is a defect; `lenient-adherence`
      means the same, and the schema requires such a directive to list at least one allowance (the deviations it permits);
      `advisory` means the directive is guidance an agent weighs. A directive's `enforcement` field is the pack-supplied default
      level; which level applies in a project is the adopting charter's decision. Directive prose, and content that cites
      a directive, never restates the level. Distinct from activation presets' `must_have` items and `policy.yaml` levels,
      which decide which artefacts are in force.
    avoid:
      - criticality
      - binding level
    status: active
    see_also:
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/charter
      - term:spec-kitty-core/activation-preset
  - id: evidence-bundle
    name: evidence bundle
    definition: The set of inputs provided to charter synthesis — code-reading signals, configured URLs, and bundled corpus
      snapshots. Determines what the harness can reason about when generating doctrine artifacts.
    status: draft
  - id: feature-slug
    name: feature slug
    definition: DEPRECATED. The Terminology Canon prohibits 'feature' for the Mission domain object. Use `mission_slug` (see
      the canonical `mission_slug` entry).
    status: deprecated
  - id: feature-branch
    name: feature branch
    definition: 'Alias of topic branch: a short-lived branch carrying one change to a pull request. Prefer "topic branch"
      in canonical and operator-facing language.'
    status: deprecated
  - id: friendly-name
    name: friendly_name
    definition: The human-readable title string of a mission, used for display in dashboards and logs. Mutable — changing
      it does not affect routing or identity.
    status: active
  - id: gate-binding
    name: gate binding
    definition: A versioned doctrine declaration attaching a named gate handler to a status-transition edge (`{on_transition,
      handler, handler_kind, schema_version, fail_open, provenance}`), carried by a guard of the work-package lifecycle. A binding
      is a field/relationship, not a standalone artefact. Do NOT confuse with the five pre-existing `*gate*` senses (branch
      strategy gate / diff compliance gate / dependency gate / merge dependency gate / sonar quality gate) — those are unrelated
      one-off guards, not gate bindings. The dependency gate's check is also declared on the work-package lifecycle, as the
      `dependency-ready` guard.
    status: active
  - id: gate-handler
    name: gate handler
    definition: A named, dispatchable check registered in `GATE_REGISTRY`; the Spec-Kitty pre-review engine is the first handler,
      keyed to the `for_review` edge. Registry membership is the callable source; activation decides whether it runs. Do NOT
      confuse with the five pre-existing `*gate*` senses (branch strategy gate / diff compliance gate / dependency gate /
      merge dependency gate / sonar quality gate) — those are unrelated one-off guards, not doctrine-resolved dispatch callables.
    status: active
  - id: glossary-chokepoint
    name: glossary chokepoint
    definition: The middleware enforcement point in the agent pipeline where glossary semantic checks are applied before generation
      proceeds. Configured by the strictness setting.
    status: draft
  - id: harness
    name: harness
    definition: The host LLM or external system responsible for generating doctrine content during charter synthesis. Operates
      under a contract with spec-kitty's validation and staging pipeline; does not write artifacts directly.
    status: active
  - id: implementation-concern
    name: implementation concern
    definition: Plan-level architectural unit of intent identified as IC-## in plan.md. An implementation concern captures
      purpose, requirements, affected surfaces, sequencing, and risks. It is not executable and is translated into one or
      more work packages by the tasks workflow.
    status: active
  - id: lane
    name: lane
    definition: Legacy name for a work package's WP state (see `wp state`), kept in event field names (`from_lane`, `to_lane`).
      Canonical states are planned, claimed, in_progress, for_review, in_review, approved, done, blocked, and canceled. The
      alias doing means in_progress. approved means review passed and consolidation pending; done means consolidated into
      the target. In prose, a bare "lane" means an execution lane (as in lane branch and lane worktree); when you mean the
      WP's lifecycle state, say WP state.
    status: active
  - id: wp-state
    name: wp state
    definition: The lifecycle state of a work package (planned, claimed, in_progress, for_review, in_review, approved, done,
      blocked, canceled), as the status event log records it. Older text and the event field names `from_lane`/`to_lane` call
      it a lane; in prose prefer WP state, so it is not confused with an execution lane. Read it with `spec-kitty agent tasks
      status`.
    status: active
  - id: execution-lane
    name: execution lane
    definition: A group of work packages that `finalize-tasks` computes to run in sequence. In lane topologies each execution
      lane has one lane branch. By default (no explicit `--topology`), a Mission of at most 2 work packages, or with one lane,
      runs `single_branch` and has no lane branch. Not a WP state.
    status: active
  - id: lane-branch
    name: lane branch
    definition: The branch that carries one execution lane's commits, named `kitty/mission-<slug>-<mid8>-lane-<id>`. It carries
      no copy of the Mission's status that anyone reads or writes; status lives on the resolved status surface. Consolidation
      removes it as its final step once it can prove the lane landed.
    status: active
  - id: lane-worktree
    name: lane worktree
    definition: 'A Spec Kitty checkout of a lane branch under `.worktrees/`, allocated when an agent runs `spec-kitty agent
      action implement` (the internal `spec-kitty implement` allocator does the work). WP deliverables are written and
      committed there. Any status files it shows are never a status surface: nothing writes them there and no reader reads
      them. Never create, reuse or delete one by hand.'
    status: active
  - id: coordination-worktree
    name: coordination worktree
    definition: The checkout of a Mission's coordination branch, used by the coordination topologies (`coord`, `lanes_with_coord`)
      to write lifecycle state. The coordination branch, not this checkout's working tree, is the lifecycle home; read status
      through the CLI, never from this checkout's files. Consolidation removes it as its final step.
    status: active
  - id: write-checkout
    name: write checkout
    definition: The checkout a `single_branch` Mission writes in, on the Mission's write branch; usually the repository root
      checkout, or an owned checkout. One writer at a time.
    status: active
  - id: harness-isolation-worktree
    name: harness isolation worktree
    definition: 'A checkout that an agent harness creates for an agent (for example `Agent(isolation: "worktree")`). Spec
      Kitty neither creates nor tracks it. It is not a lane worktree and never a status surface; do not run `spec-kitty agent action implement`
      or status writes from it.'
    status: active
  - id: write-branch
    name: write branch
    definition: 'The branch a Mission''s commits and, outside the coordination topologies, its status commits land on before
      consolidation: the Mission topic branch `kitty/mission-<slug>-<mid8>`, or the target branch when the Mission writes
      to it directly. The write checkout (`single_branch`) is checked out on it. Not the primary branch, which is the repository''s
      default branch.'
    status: active
  - id: resolved-status-surface
    name: resolved status surface
    definition: The one place a Mission's status is read from and written to, as the CLI resolves it per topology. For `coord`
      and `lanes_with_coord` it is the coordination branch; for `single_branch` and `lanes` it is the write branch. Status
      commits land there. A lane checkout never shows, changes or serves the status files, and no reader reads status from
      a lane worktree, a coordination worktree or any other checkout's files. Read it with `spec-kitty agent tasks status
      --mission <handle>`.
    status: active
  - id: approved
    name: approved
    definition: WP state meaning review passed, feedback resolved, and the WP is ready to consolidate. approved is not integrated
      and must not be treated as done. `spec-kitty consolidate` owns the approved -> done transition.
    status: active
  - id: done
    name: done
    definition: WP state meaning the WP has been consolidated into the mission target branch, or explicitly force-marked as
      integrated with evidence. Review approval alone is not done.
    status: active
  - id: accepted-work-package
    name: accepted work package
    definition: A WP counted by mission acceptance readiness because its WP state is approved or done. Accepted does not imply
      done; approved accepted work packages remain consolidation-pending.
    status: active
  - id: merge-pending-work-package
    name: merge-pending work package
    definition: An approved WP that mission acceptance may count as accepted-ready but that has not yet been consolidated.
      Such WPs stay in the approved state until `spec-kitty consolidate` records done.
    status: active
  - id: dependency-readiness
    name: dependency readiness
    definition: 'The condition the dependency gate evaluates before a work package may be claimed or implemented: every WP
      listed in its `dependencies` frontmatter must be in the `approved` or `done` WP state, or `canceled` with a reason an
      operator recorded. `approved` is included deliberately
      — `done` is emitted only by whole-mission consolidation, so requiring a dependency to be strictly `done` would deadlock
      every same-mission dependency chain (the dependent WP could never start, so the mission could never consolidate, so
      the dependency could never reach `done`). The consolidation dependency gate treats `{approved, done}` as satisfied in
      the same way. `for_review`, `in_review`, `blocked`, `canceled` without such a reason, and missing status are not ready.'
    status: active
  - id: dependency-gate
    name: dependency gate
    definition: 'The pre-implementation enforcement point that refuses to start a work package until it meets dependency readiness
      (all declared dependencies are ``approved`` or ``done``, or ``canceled`` with a reason an operator recorded). Enforced consistently at every claim path. The read-only surfaces
      — the ``next`` claim-discovery preview (``preview_claimable_wp``) and orchestrator-api ``list-ready`` — only ever surface
      ``planned`` candidates, so a dependency-blocked planned WP is simply withheld (preview returns ``dependencies_not_satisfied``;
      list-ready omits it). The imperative claim verbs — ``agent action implement``, the low-level ``implement`` command (before
      any workspace is created), and orchestrator-api ``start-implementation`` — additionally apply a resume guard: they enforce
      readiness only on the not-yet-started (``planned``/``claimed``) claim transition, so re-invoking implement on an already
      ``in_progress`` WP is a no-op resume, not a re-gated claim, and a dependency that later regresses out of ``approved``/``done``
      does not block resuming in-flight work. On block the imperative verbs surface the stable ``dependencies_not_satisfied``
      reason/error code.'
    status: active
  - id: machine-level-runtime
    name: machine-level runtime
    definition: The ~/.kittify/ directory on a developer's machine, containing templates, global agent configs, and skills
      shared across all projects on that machine. Distinct from the per-project .kittify/ directory.
    status: active
  - id: main-repo
    name: main repo
    definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout'
      for location or the explicit branch term you mean.
    status: deprecated
  - id: main-repository
    name: main repository
    definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout'
      for location or the explicit branch term you mean.
    status: deprecated
  - id: main-repository-root
    name: main repository root
    definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout'
      for location or the explicit branch term you mean.
    status: deprecated
  - id: merge-state
    name: merge state
    definition: DEPRECATED. Replaced by `consolidation state`. The `.kittify/merge-state.json` file it named is retired. Only
      landing a Mission's lanes is called consolidation; a pull request merge and `git merge` keep their names.
    status: deprecated
  - id: consolidation-state
    name: consolidation state
    definition: The per-Mission runtime record at `.kittify/runtime/merge/<mission_id>/state.json` that tracks a consolidation's
      progress, so `spec-kitty consolidate --resume` can continue an interrupted consolidation without data loss.
    status: draft
  - id: merge-target-branch
    name: merge_target_branch
    definition: The branch where completed work-package code must ultimately land. Stored in every WP prompt's frontmatter
      (alongside planning_base_branch) to give implementing agents an explicit merge destination. In meta.json it is the legacy
      alias of target_branch, read as a fallback when target_branch is absent (older missions). All three (target_branch,
      planning_base_branch and merge_target_branch) carry the same value; the separation makes intent explicit in agent-facing
      prompts and prevents a temporary branch from leaking into work-package frontmatter in place of the persisted target.
    status: active
  - id: mid8
    name: mid8
    definition: The first 8 characters of a mission_id, used as a compact disambiguator in branch names and worktree paths.
      Not a stable identity on its own — always paired with mission_slug.
    status: active
  - id: migration
    name: migration
    definition: A versioned, idempotent transformation that upgrades project filesystem state from one spec-kitty version
      to another. Migrations are applied in sequence and must not be re-applied once completed.
    status: active
  - id: minimal-viable-trail
    name: minimal viable trail
    definition: The minimum auditable artifact trail that every spec-kitty action is required to leave, scaled to action weight.
      Lightweight actions leave a log entry; heavy actions leave provenance sidecars and durable state artifacts.
    status: draft
  - id: mission
    name: mission
    definition: 'A unit of governed delivery: the concrete tracked item, stored under the Mission''s own spec directory and
      linked to exactly one Mission Type, that carries one piece of work from agreed intent to a verified result.'
    avoid:
      - Feature
    status: active
  - id: mission-run
    name: mission run
    definition: One runtime execution of a Mission's step loop, keyed by `run_id`.
    avoid:
      - mission session
    status: active
  - id: topic-branch
    name: topic branch
    definition: A short-lived branch carrying one change to a pull request.
    avoid:
      - feature branch
      - PR branch
    status: active
  - id: mission-id
    name: mission_id
    definition: The ULID-based canonical, immutable machine identity for a mission, assigned at creation and used for all
      event routing and disambiguation. Never displayed as a mission number.
    status: active
  - id: mission-number
    name: mission_number
    definition: A display-only sequential integer assigned to a mission at consolidation. Never used for lookup, locking,
      or event routing — use mission_id for those purposes.
    status: active
  - id: mission-slug
    name: mission_slug
    definition: The human-readable kebab-cased identifier for a mission (e.g., my-feature), used alongside mid8 in branch
      and worktree names. Chosen by the mission owner at creation.
    status: active
  - id: node-id
    name: node_id
    definition: Stable machine fingerprint (12-char hex). Unchanged from pre-081.
    status: active
  - id: occurrence-classification
    name: occurrence classification
    definition: The act of categorizing each instance of a changing string by semantic context — source code, import paths,
      serialized keys, CLI commands, documentation, and so on. Required before bulk-edit work packages are approved.
    status: active
  - id: occurrence-map
    name: occurrence map
    definition: A mission-level artifact (occurrence_map.yaml) that classifies every occurrence of a changing identifier by
      semantic context. Required before any bulk-edit work package may proceed.
    status: active
  - id: plan-concern-refs
    name: plan_concern_refs
    definition: Field in wps.yaml work package entries listing the IC-## implementation concerns from plan.md that the work
      package addresses. The field is wps.yaml-only and must not be copied into WP prompt frontmatter.
    status: active
  - id: phase
    name: phase
    definition: Grouping container for mission primitives, not the enforcement unit
    status: active
  - id: pipeline-shape
    name: pipeline-shape
    definition: 'A classification label applied to a function whose body is a sequence of independent

      decisions over a shared input. Pipeline-shape functions are the principal refactor target

      for the `chain-of-responsibility-rule-pipeline` tactic. The shape marker is "3+ independent

      decisions over a common input" — not "function is long". Distinct from deliberate linearity,

      where the sequential structure is intentional and documented. See

      `docs/architecture/04_implementation_mapping/code-patterns.md` entry 1.'
    status: active
  - id: planning-repository
    name: planning repository
    definition: DEPRECATED alias for 'repository root checkout'. Do not use — agents interpret this as a separate repository.
      Use 'repository root checkout' instead.
    status: deprecated
  - id: planning-base-branch
    name: planning_base_branch
    definition: The branch that was active in the repository root checkout when WP prompts were generated (at finalize-tasks
      time). Stored in every WP prompt's frontmatter and in lanes.json to root lane-worktree allocation correctly regardless
      of which branch the operator is on when running finalize-tasks. It equals target_branch. It exists so that running finalize-tasks
      from a temporary branch cannot leak that branch into WP frontmatter and break lane allocation once the temporary branch
      is deleted.
    status: active
  - id: preflight-validation
    name: preflight validation
    definition: Checks `spec-kitty consolidate` runs before it moves any branch (git state, target branch, review artefacts,
      origin freshness). A failing preflight check blocks the consolidation entirely.
    status: draft
  - id: primary-branch
    name: primary branch
    definition: The repository's default integration branch, normally resolved from origin/HEAD and commonly named main, master,
      or develop. The specify branch-context output exposes this value as primary_branch only for branch-strategy recommendation;
      it is not automatically the mission's target_branch once target_branch has been persisted in meta.json.
    status: active
  - id: primitive
    name: primitive
    definition: Custom mission-defined executable operation or step unit
    status: active
  - id: project
    name: project
    definition: SaaS collaboration surface grouping one or more repositories. Not the local Git resource.
    status: active
  - id: project-root-checkout
    name: project root checkout
    definition: 'DEPRECATED: Use ''repository root checkout'' instead. The non-worktree checkout at the root
      of the current repository.'
    status: deprecated
  - id: project-uuid
    name: project_uuid
    definition: Optional SaaS-assigned collaboration identity. Absent until a repository is bound to a SaaS project. Never
      locally minted.
    status: active
  - id: pr-bound-mission
    name: pr-bound mission
    definition: A mission expected to land through a pull request rather than direct work on the primary branch. During mission
      create, --pr-bound activates the branch strategy gate so the branch choice is explicit before planning artifacts are
      written.
    status: active
  - id: provenance
    name: provenance
    definition: A record of what generated a given artifact — the actor identity, timestamp, and source (seed file, user clarification,
      or LLM generation). Enables audit and reproducibility.
    status: active
  - id: provenance-sidecar
    name: provenance sidecar
    definition: A metadata file co-located with a generated artifact, recording its synthesis provenance. Allows any artifact
      to be traced back to its origin without modifying the artifact itself.
    status: active
  - id: repo-slug
    name: repo_slug
    definition: Optional owner/repo Git provider reference (e.g. spec-kitty/spec-kitty). Unchanged from pre-081 meaning.
    status: active
  - id: repository
    name: repository
    definition: Local Git resource (one .git directory) holding mission artifacts. Formerly called "project" in pre-081 code.
    status: active
  - id: repository-root-checkout
    name: repository root checkout
    definition: The non-worktree checkout at the root of the current repository. Planning commands (specify, plan, tasks)
      run here. It is a location, not a branch name.
    status: active
  - id: repository-label
    name: repository_label
    definition: Human-readable repository display name derived from git remote or directory name. Mutable, not a stable identity.
      Formerly called project_slug.
    status: active
  - id: repository-uuid
    name: repository_uuid
    definition: Stable local repository identity, minted once per repository. Used as the namespace key that keeps one repository's
      records apart from another's. Formerly mislabeled project_uuid.
    status: active
  - id: rule-pipeline
    name: rule pipeline
    definition: 'A pipeline of small pure functions, each checking applicability, optionally executing its narrow piece of
      work, and returning a result threaded to the next function. Three flavors are recognized: Validator (accumulating findings),
      Transformer (chained state, actions and an optional error), Scorer (a weighted number). See the `chain-of-responsibility-rule-pipeline`
      tactic.'
    status: active
  - id: scope
    name: scope
    definition: Bounded semantic scope (mission_local, team_domain, audience_domain, spec_kitty_core)
    status: active
  - id: semantic-conflict
    name: semantic conflict
    definition: Mismatch or ambiguity in term usage with assigned severity score
    status: active
  - id: skill
    name: skill
    definition: A markdown file encoding a domain-specific agent workflow, discoverable as a named command. Skills are the
      primary unit of reusable agent capability in spec-kitty. The word names three distinct artifacts, so name the sense.
      A pack skill is a charter-activatable skill that a team shares through an org pack or the project tier. A doctrine skill
      ships with the Spec Kitty CLI. A command skill is a generated spec-kitty.<command> skill.
    status: active
  - id: skill-package
    name: skill package
    definition: A self-contained agent capability directory with a SKILL.md descriptor, installable under .agents/skills/.
      Provides the discoverable packaging format for a skill.
    status: active
  - id: sonar-quality-gate
    name: sonar quality gate
    definition: 'The SonarCloud project-level pass/fail evaluation for `spec-kitty_spec-kitty` on the

      new-code window. Aggregates six conditions (reliability rating, security rating,

      maintainability rating, new coverage, new duplicated lines density, new security hotspots

      reviewed). Reports `OK` or `ERROR` per condition plus a top-level status. Pulled via the

      public REST API at `https://sonarcloud.io/api/qualitygates/project_status`; the helper

      `work/snippets/sonarcloud_branch_review.sh` formats this for terminal use. Thresholds (as

      of 2026-05-14): new_reliability_rating GT 1 (A), new_security_rating GT 1 (A),

      new_maintainability_rating GT 1 (A), new_coverage LT 80%, new_duplicated_lines_density

      GT 3%, new_security_hotspots_reviewed LT 100%.'
    status: active
  - id: status-commit
    name: status commit
    definition: 'An auto-commit created by spec-kitty to record workflow state changes (WP state transitions, lane assignment,
      WP claims). A status commit lands on the Mission''s resolved status surface: the coordination branch for coordination
      topologies, the write branch otherwise. It never lands on a lane branch, and never on a protected branch.'
    avoid:
      - ceremony commit
      - ceremony
      - ceremony write
      - status-writing operation
      - status-writing command
    status: active
  - id: status-writing-operation
    name: status-writing operation
    definition: DEPRECATED. Replaced by `status commit`. This phrasing landed during a partial rename; it is forbidden in
      active source. See the canonical `status commit` entry.
    status: deprecated
  - id: strictness
    name: strictness
    definition: Glossary enforcement mode (off, medium, max)
    status: active
  - id: start-branch
    name: start branch
    definition: The branch passed to mission create with --start-branch. The CLI creates or switches to this branch before
      writing mission scaffolding, and it must match --target-branch when both options are supplied so mission metadata and
      the checked-out branch describe the same planning branch.
    status: active
  - id: structural-debt
    name: structural debt
    definition: A function whose cognitive complexity has accumulated beyond reviewable bounds AND whose responsibilities
      are independently dispatching concerns with no shared state between branches. A structural debt function is a refactor
      candidate per the `refactoring-extract-first-order-concept` and `refactoring-extract-class-by-responsibility-split`
      tactics. Distinguished from deliberate linearity by the *absence* of a documented design intent and by the presence
      of independent dispatch arms or triplicated patterns, for example a command handler whose three modes share no state
      after option parsing and repeat the same output logic three times.
    status: active
  - id: styleguide
    name: styleguide
    definition: A doctrine artifact specifying coding or writing conventions for a project. Applied during implementation
      and review to keep outputs consistent.
    status: active
  - id: synthesis-manifest
    name: synthesis manifest
    definition: The authoritative commit marker written last during charter synthesis. Its presence and hash integrity indicate
      a complete, valid synthesis run. Absence or hash mismatch signals a partial or corrupted run.
    status: active
  - id: tactic
    name: tactic
    definition: A doctrine artifact describing a reusable workflow or procedure that agents follow to accomplish a specific
      class of task. Composed of ordered steps and cross-references.
    status: active
  - id: target-branch
    name: target branch
    definition: The git branch on which a mission's code, planning artifacts, and status events must ultimately land. Persisted
      in meta.json under the key target_branch at mission-create time and never overwritten; merge_target_branch is its legacy
      alias in older meta.json files. All downstream commands (finalize-tasks, implement, review, consolidate) derive the
      branch contract from this stored value, not from the operator's current branch at invocation time. In branch-context
      JSON output, target_branch and base_branch carry the same value when queried at the mission level.
    status: active
  - id: teamspace
    name: teamspace
    definition: A shared workspace or channel used for collaborative input to spec-kitty decision moments, particularly in
      widen mode flows.
    status: draft
  - id: widen-mode
    name: widen mode
    definition: A CLI feature that allows a mission owner to escalate an interview question to a collaborative channel for
      group input, with the response written back into the local decision moment.
    status: draft
  - id: work-package
    name: work package
    definition: Execution slice inside a Mission, the unit of human/agent handoff
    status: active
    aliases:
      - WorkPackage
  - id: workspace
    name: workspace
    definition: The checkout a work package is implemented in. For lane topologies it is the WP's lane worktree; for `single_branch`
      it is the write checkout. Resolve it with `spec-kitty agent action implement`, which prints it; never construct the path.
    status: active
  - id: wp
    name: wp
    definition: Abbreviation for work package
    status: active
  - id: lightweight-mode
    name: lightweight mode
    definition: '`spec-kitty review` invocation that performs consistency checks but is explicitly NOT a release gate. Skips
      dead-code and BLE001 audits; reports state with that limitation.'
    status: active
  - id: post-merge-mode
    name: post-merge mode
    definition: '`spec-kitty review` invocation that enforces the full mission-review release-gate contract; requires `issue-matrix.md`,
      Gate 1-4 records, and `mission-exception.md` when applicable.'
    status: active
  - id: mode-mismatch
    name: mode mismatch
    definition: Diagnostic class fired when an operator explicitly requests `--mode post-merge` against a mission whose `baseline_merge_commit`
      is absent.
    status: active
  - id: issue-matrix-schema-drift
    name: issue-matrix schema drift
    definition: Diagnostic class fired when an `issue-matrix.md` file uses columns outside the canonical mandatory + named-optional
      vocabulary.
    status: active
  - id: canonical-issue-matrix
    name: canonical issue-matrix
    definition: The canonical machine-readable issue-matrix artifact, `issue-matrix.json`, recording each mission issue's
      verdict; supersedes the legacy `issue-matrix.md`, which is still read via failover for pre-migration missions.
    status: active
  - id: encoding-chokepoint
    name: encoding chokepoint
    definition: The single ingestion boundary at which charter content's source encoding is detected and recorded as provenance
      before downstream consumers see it.
    status: active
  - id: encoding-provenance
    name: encoding provenance
    definition: The persisted audit trail (JSONL) of every encoding decision the chokepoint made, including detected encoding,
      confidence, normalization action, and bypass usage.
    status: active
  - id: transition-gate
    name: transition gate
    definition: A check that must pass before a work-package status-transition edge (e.g. `in_progress->for_review`) is allowed.
      Resolved from the repo's active doctrine and dispatched through the inverted move-task hook (`_mt_run_transition_gates`);
      the flagship handler is the scoped pre-review regression check. Do NOT confuse with the five pre-existing `*gate*` senses
      (branch strategy gate / diff compliance gate / dependency gate / merge dependency gate / sonar quality gate) — those
      are unrelated one-off guards, not doctrine-resolved lane-edge checks.
    status: active
  - id: unsafe-bypass
    name: unsafe bypass
    definition: 'An operator-chosen override of the encoding chokepoint''s hard-fail behavior; uses the highest-confidence
      decode candidate and records `bypass_used: true` in provenance.'
    status: active
  - id: review-py-package
    name: review.py package
    definition: 'Deprecated: an internal layout detail of the Spec Kitty CLI (its review command is a package of sibling files,
      no longer a single module), not a concept a project meets.'
    status: deprecated
  - id: charter-content-migration
    name: charter-content migration
    definition: The scan and normalize-or-fail-loud flow that brings existing Missions' charter content into compliance with
      the charter-content chokepoint contract.
    status: active
  - id: enhances
    name: enhances
    definition: Declarative field on a Charter Pack artifact (tactic, styleguide, paradigm, procedure, agent profile) that
      asserts the artifact augments a built-in artifact with the same ID via field-merge. Suppresses the same-ID-collision
      advisory and auto-emits an `ENHANCES` DRG edge.
    avoid:
      - augments
      - extends
    status: active
  - id: overrides
    name: overrides
    definition: Declarative field on a Charter Pack artifact that asserts the artifact fully replaces a built-in artifact
      with the same ID. Suppresses the same-ID advisory and auto-emits an `OVERRIDES` DRG edge.
    avoid:
      - replaces
      - supersedes
    status: active
  - id: requirement-id
    name: requirement id
    definition: A stable identifier for one spec requirement -- a kind (FR, NFR, C, or SC), a digit string whose width is
      significant, an optional single lowercase letter suffix, and an optional mission-slug qualifier; canonical form is kind
      uppercase, digits verbatim, suffix lowercase. Not to be confused with an implementation-concern ID (a separate plan-level
      grammar) or a work package ID.
    status: active
  - id: success-criterion
    name: success criterion
    definition: A measurable outcome a spec declares with the SC kind; it is a requirement id that is tracked (reported in
      finalize-tasks' informational success-criteria coverage) but not gating -- an undeclared SC ref cited on a work package
      still fails as unknown_spec_id. Not to be confused with a user story's acceptance scenario or a functional requirement,
      whose mapping is coverage-gated.
    status: active
  - id: qualified-citation
    name: qualified citation
    definition: A requirement id prefixed with another mission's slug and a hash separator (foreign-qualified). It belongs
      to the named mission, is never declared, required, flagged, or warned about, and is reported as foreign-qualified --
      never failing -- when cited in a work package's refs; the qualifier itself is never resolved. Not to be confused with
      a GitHub issue reference or a file path.
    status: active
  - id: tool-surface-drift
    name: tool-surface drift
    definition: 'The state of a generated tool surface file that Spec Kitty still tracks as managed but whose content no longer
      matches anything Spec Kitty wrote, so Spec Kitty will not overwrite it without consent. In practice someone edited a
      generated slash-command file, command skill, managed skill, agent profile or plugin-bundle component. `spec-kitty upgrade`
      keeps such a file, names it (`Not updated, your local edit was kept: <path>`) and exits non-zero (whether it should
      is still open) with the outcome `drift_unresolved` and the failure reason `surface_drift`; `spec-kitty doctor tool-surfaces`
      reports the same file as drifted. Not tool-surface drift: a missing file (upgrade recreates it); a file that matches
      an older generated version (stale; upgrade rewrites it); a file Spec Kitty never generated (user-owned, left untouched);
      a difference between two branches'' copies of `.kittify/metadata.yaml`. A known defect can misclassify an unedited generated
      file as drifted; that is the defect, not this term. Never write bare ''drift'' in operator-facing text; say which file
      was kept and why.'
    avoid:
      - drift
    status: active
  - id: integrating-worktree
    name: integrating worktree
    definition: 'A linked git worktree whose checked-out branch is a mission, lane or coordination branch (a `kitty/mission-`
      branch, as recognized by the branch-naming authority), or whose branch cannot be read (a detached HEAD counts, to fail
      safe). Its branch will later be integrated into another branch of the same Mission. `spec-kitty upgrade`, run from the
      repository root checkout, skips integrating worktrees: it writes, stamps and commits nothing in them, which is why a
      lane can still show a pre-upgrade `.kittify/metadata.yaml`. Not an integrating worktree: a worktree on an ordinary branch,
      such as a topic or landing branch, where upgrade still upgrades and commits; the repository root checkout, which never
      is one. For a per-work-package execution checkout in general, say lane worktree (see the `lane worktree` entry).'
    status: active
  - id: target-owned-bookkeeping
    name: target-owned bookkeeping
    definition: 'A tracked file at the project root that Spec Kitty fully generates, marks ''do not edit'', and that no work
      package authors, declared target-owned in the state contract; today only `.kittify/metadata.yaml`. Its authoritative
      copy is the one on the merge target branch. When two branches of one Mission carry different copies, each integration
      site (consolidate, review start, implement resume, lane sync) resolves the conflict to a fixed side without asking:
      the copy closer to the merge target branch wins, and between two lanes the receiving lane keeps its own until consolidation.
      Not target-owned: an operator-editable file (`.gitattributes`, `.gitignore`, `.kittify/config.yaml`), whose conflicts
      still refuse. For where a Mission artifact is stored, say PRIMARY partition; `.kittify/metadata.yaml` is not a Mission
      artifact and has no partition. No site computes ''the repository root checkout''s copy''. Do not call it ''primary-owned'':
      that earlier name suggested the PRIMARY partition or the primary branch, and the merge target branch need not be the
      primary branch.'
    avoid:
      - primary-owned bookkeeping
    status: active
  - id: charter-offering
    name: charter offering
    definition: 'Everything offered to a project: the Charter Packs it can draw from (the built-in pack and each configured
      org pack) plus the project layer. The offer side of the charter; the activation side is the active charter. Not the
      project''s activated set: say active charter.'
    avoid:
      - doctrine catalog
    status: active
  - id: charter-pack
    name: charter pack
    definition: 'A distributable bundle of charter components (artifacts and their DRG edges) together with optional activation
      presets shipped as presets/<name>.yaml. An org pack enforces activations through a governing preset: a preset whose
      items carry must_have: true. Identified by charter_pack_id (built-in, an org pack''s configured name, or project); org
      packs are configured under charter_packs.org.packs. Not a named starting set of activations (say activation preset)
      and not the project''s activation state (say active charter).'
    avoid:
      - doctrine pack
      - doctrine pack id
    status: active
  - id: activation-preset
    name: activation preset
    definition: A named set of activations that a Charter Pack ships (presets/<name>.yaml), applied with `spec-kitty charter
      activate [--pack <pack>] --preset <name>`. Applying it replaces every activation key it governs; changing a customised
      key needs --force; the applied preset name is not stored. The built-in pack ships default (no per-kind restriction,
      plus the built-in mission types) and minimal. Not a context-scoped activation entry (that is the activation registry).
    avoid:
      - pack default charter
      - default charter pack
    status: active
  - id: active-charter
    name: active charter
    definition: 'What a project has activated: its activated_<kind> keys, activated_kinds and mission_type_activations, plus
      the deactivated_<kind> exclusions, held in the activation ledger .kittify/charter/activation.yaml (a project not yet
      upgraded to 4.0.0rc8 still keeps the allow keys in .kittify/config.yaml or the charter.yaml it points to); listed by
      `spec-kitty charter list --json`. ''Active'' and ''inactive'' alone still describe one artifact (''an active directive'');
      ''active charter'' names the project''s activated set as a whole; the .kittify/charter/ tree is never called ''active''.'
    avoid:
      - charter selection
    status: active
  - id: activation-ledger
    name: activation ledger
    definition: 'The git-tracked file .kittify/charter/activation.yaml, the single authority for what a project has activated:
      activated_kinds, mission_type_activations, the three-state activated_<kind> allow state and the deactivated_<kind> exclusions.
      The effective set of a kind is its allow state minus its exclusions, and an exclusion never removes an org-required
      id. `spec-kitty init` writes it; `spec-kitty upgrade` or `spec-kitty migrate activation-ledger` moves an older project''s
      keys into it. Not the Migration Ledger (.kittify/migration-ledger.jsonl, which records the upgrade migrations that ran).'
    status: active
  - id: project-layer
    name: project layer
    definition: The project's own charter components under the one flat root .kittify/charter-packs/ (charter_pack_id project).
      Part of the charter offering; ships no presets; listed by `spec-kitty charter pack list` as project. Not the materialised
      .kittify/charter/ tree (say Charter Bundle).
    status: active
  - id: charter-bundle
    name: charter bundle
    definition: 'The materialised .kittify/charter/ tree as a unit: charter.md, the synthesis manifest, the DRG cache and
      provenance. Produced by `spec-kitty charter generate` and `spec-kitty charter synthesize`. Never called ''active'':
      the project''s activation state is the active charter.'
    status: active
  - id: doctrine-pack
    name: doctrine pack
    definition: DEPRECATED. Replaced by `Charter Pack`. Retired by the charter-pack cutover; see the Charter Pack entry.
    status: deprecated
  - id: doctrine-pack-id
    name: doctrine pack id
    definition: DEPRECATED. Replaced by `charter_pack_id`, the identity of a Charter Pack. See the Charter Pack entry.
    status: deprecated
  - id: doctrine-catalog
    name: doctrine catalog
    definition: 'DEPRECATED. Replaced by `charter offering`: everything offered to a project. See the Charter offering entry.'
    status: deprecated
  - id: charter-selection
    name: charter selection
    definition: 'DEPRECATED. Replaced by `active charter`: what a project has activated. See the Active charter entry.'
    status: deprecated
  - id: pack-default-charter
    name: pack default charter
    definition: 'DEPRECATED. Replaced by `activation preset`: the built-in pack''s default preset. See the Activation preset
      entry.'
    status: deprecated
  - id: exclusion
    name: Exclusion
    definition: 'An artifact id a user explicitly deactivated, stored in the Activation ledger as a `deactivated_<plural>`
      entry (a deny-list entry). It survives every later command, upgrade, interview and regeneration. Only an explicit choice
      removes it: `charter activate <kind> <id>` (including `--only`), a cascade with `--include-deactivated`, or `charter
      activate --preset X --force`. Ids dropped by `--only` narrowing are not excluded.'
    status: active
    see_also:
      - term:spec-kitty-core/activation-ledger
      - term:spec-kitty-core/effective-deny
      - term:spec-kitty-core/required-floor
  - id: effective-deny
    name: Effective deny
    definition: 'The deny-list that actually subtracts: the activation ledger''s exclusions, matched by file stem, declared
      id or DRG URN, minus the required floor. An exclusion of a required artifact is therefore inert, and `spec-kitty doctor`
      reports it as stale.'
    status: active
    see_also:
      - term:spec-kitty-core/exclusion
      - term:spec-kitty-core/required-floor
      - term:spec-kitty-core/activation-ledger
  - id: required-floor
    name: Required floor
    definition: The artifacts a project cannot deactivate, each attributed to the pack that requires it. They are the must-have
      items of every governing preset (an activation preset with at least one `must_have` item) in the project's pack closure.
      Precedence never decides membership of the floor.
    status: active
    see_also:
      - term:spec-kitty-core/effective-deny
      - term:spec-kitty-core/exclusion
      - term:spec-kitty-core/charter-pack
  - id: doctrine-domain
    name: Doctrine Domain
    definition: The domain model that structures reusable governance knowledge in Spec Kitty. It organizes behavior and constraints
      into composable artifacts (paradigms, directives, tactics, templates, styleguides, and toolguides).
    status: active
    see_also:
      - term:spec-kitty-core/paradigm
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/template-set
      - term:spec-kitty-core/styleguide
      - term:spec-kitty-core/toolguide
  - id: paradigm
    name: Paradigm
    definition: A worldview-level framing for how work is approached in a domain. Paradigms influence selection and interpretation
      of directives and tactics but are not executable step recipes themselves.
    status: active
    see_also:
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/active-charter
  - id: procedure
    name: Procedure
    definition: A reusable charter subworkflow that a mission-type step delegates to, through a substep's `delegates_to`,
      for part of a mission action. Procedures are structured playbooks, not tracked Missions and not runtime sessions.
    status: active
    see_also:
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/mission-action
  - id: template-set
    name: Template Set
    definition: A structured set of doctrine templates that shape output artifacts and interaction contracts for mission actions
      and procedures. Template sets allow consistent behavior across mission types while remaining configurable through charter
      selections.
    status: active
    see_also:
      - term:spec-kitty-core/procedure
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/active-charter
  - id: toolguide
    name: Toolguide
    definition: A doctrine artifact defining tool-specific operational guidance, syntax, and constraints (for example PowerShell
      usage conventions) used by agents and contributors during execution.
    status: active
    see_also:
      - term:spec-kitty-core/styleguide
      - term:spec-kitty-core/tactic
  - id: schema
    name: Schema (Doctrine Artifact)
    definition: A machine-validated contract that defines the allowed structure and fields of a charter artifact. Pack validation
      rejects an artifact that does not match its schema.
    status: active
    see_also:
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/styleguide
      - term:spec-kitty-core/toolguide
  - id: specification-by-example
    name: Specification by Example (Paradigm)
    definition: A paradigm that builds shared understanding of behavior through concrete, business-readable examples which
      become the canonical source of truth for requirements, acceptance checks, and living documentation.
    status: active
    see_also:
      - term:spec-kitty-core/paradigm
      - term:spec-kitty-core/living-documentation-sync
      - term:spec-kitty-core/usage-examples-sync
      - term:spec-kitty-core/example-mapping-workshop
  - id: living-documentation-sync
    name: Living Documentation Sync (Directive)
    definition: 'Directive DIRECTIVE_037. Requires behavior-describing artifacts to evolve together: when observable behavior
      changes, the canonical examples, acceptance checks, narrative specs, user docs, glossary entries, code-level docs, and
      architecture records are updated in the same change.'
    status: active
    see_also:
      - term:spec-kitty-core/directive
      - term:spec-kitty-core/specification-by-example
      - term:spec-kitty-core/usage-examples-sync
  - id: usage-examples-sync
    name: Usage Examples Sync (Tactic)
    definition: Tactic `usage-examples-sync`. The step-by-step pattern for keeping canonical usage examples, acceptance checks,
      and the artifacts that quote them aligned during a behavior change.
    status: active
    see_also:
      - term:spec-kitty-core/tactic
      - term:spec-kitty-core/living-documentation-sync
      - term:spec-kitty-core/example-mapping-workshop
  - id: example-mapping-workshop
    name: Example Mapping Workshop (Procedure)
    definition: Procedure `example-mapping-workshop`. Turns a behavior request into concrete rules, canonical examples, and
      open questions that stakeholders and implementers share as the current source of truth for the behavior.
    status: active
    see_also:
      - term:spec-kitty-core/procedure
      - term:spec-kitty-core/specification-by-example
      - term:spec-kitty-core/living-documentation-sync
      - term:spec-kitty-core/usage-examples-sync
  - id: charter-mediated-selection
    name: Charter-Mediated Selection
    definition: 'The pattern in which the charter is the sole authority on which artifacts apply to a Mission run: the packs
      are the knowledge store, the charter is the selector, and the runtime asks the charter for the activated set instead
      of reading the packs directly. The mechanism is the `activated_<kind>` state; `selected_<kind>` only records what was
      chosen.'
    status: active
    see_also:
      - term:spec-kitty-core/global-selection
      - term:spec-kitty-core/context-scoped-selection
      - term:spec-kitty-core/charter-pack
      - term:spec-kitty-core/activated-kind
  - id: global-selection
    name: Global Selection
    definition: 'A selection mode in which the charter declares that an artifact should be active for every work-package prompt,
      whatever the action or mission type, through a `selected_<kind>` list. Declaring is not activating: a declared entry
      is added to the resolved `activated_<kind>` set, which remains the activation authority. Example: "this project always
      uses the python-conventions styleguide".'
    status: active
    see_also:
      - term:spec-kitty-core/context-scoped-selection
      - term:spec-kitty-core/charter-mediated-selection
      - term:spec-kitty-core/activated-kind
  - id: context-scoped-selection
    name: Context-Scoped Selection
    definition: 'Selection mode in which the charter declares an artifact is active only for a specific Activation Context
      (mission_type × action). Surfaces in the prompt as a fetch command paired with a "when you <action>, run …" conditional.
      Example: *"when writing a code comment in a software-dev mission, fetch the caveman styleguide."* Implemented via the
      Activation Registry.'
    status: active
    see_also:
      - term:spec-kitty-core/activation-registry
      - term:spec-kitty-core/activation-context
      - term:spec-kitty-core/global-selection
  - id: activation-registry
    name: Activation Registry
    definition: A charter-level list of (activation context, Charter Pack, artifact id) entries saying which artifacts activate
      in which contexts. It lives on the charter, not on the artifact, so projects can activate one shared artifact in different
      contexts without forking it.
    status: active
    see_also:
      - term:spec-kitty-core/activation-context
      - term:spec-kitty-core/context-scoped-selection
      - term:spec-kitty-core/charter-pack
  - id: activation-context
    name: Activation Context
    definition: 'The key that scopes a context-scoped activation: a `mission_type` (`software-dev`, `documentation`, `research`,
      `plan` or the wildcard `generic`) and an `action` (`specify`, `plan`, `tasks`, `implement`, `review`, `accept` and the
      other mission and charter actions). It is matched against the current Mission''s type and the action in flight when
      the charter context is built.'
    status: active
    see_also:
      - term:spec-kitty-core/activation-registry
  - id: selected-kind
    name: selected_<kind>
    definition: The charter field family that records a global selection, one list per artifact kind (`selected_directives`,
      `selected_tactics`, `selected_styleguides`, `selected_toolguides`, `selected_paradigms`, `selected_procedures`, `selected_agent_profiles`
      and so on). It is the charter-authored record of a choice, added to the resolved `activated_<kind>` set; it is not an
      activation source of its own.
    status: active
    see_also:
      - term:spec-kitty-core/global-selection
      - term:spec-kitty-core/charter-mediated-selection
      - term:spec-kitty-core/activated-kind
  - id: activated-kind
    name: activated_<kind>
    definition: 'The per-kind activation allow state, one key per activatable artifact kind (`activated_directives`, `activated_tactics`,
      `activated_glossaries`, `activated_skills` and so on), held in the activation ledger beside the kind''s `deactivated_<kind>`
      exclusions. It has three states: an absent key means every available artifact of the kind; an empty list means none;
      a non-empty list is the activated set. It is the mechanism behind charter-mediated selection.'
    status: active
    see_also:
      - term:spec-kitty-core/activation-ledger
      - term:spec-kitty-core/exclusion
      - term:spec-kitty-core/charter-mediated-selection
      - term:spec-kitty-core/global-selection
      - term:spec-kitty-core/selected-kind
  - id: three-layer-drg
    name: Three-layer DRG
    definition: 'The Doctrine Relationship Graph composed in three layers: the built-in packs'' graph fragments, zero or more
      org packs'' `drg/fragment.yaml` extensions, and optional project-layer annotations. Each layer is additive: the org
      and project layers may extend or annotate the nodes below them, never remove or reclassify them.'
    status: active
    see_also:
      - term:spec-kitty-core/charter-pack
      - term:spec-kitty-core/organization-tier
      - term:spec-kitty-core/charter-mediated-selection
  - id: tension
    name: in_tension_with (DRG relation)
    definition: A symmetric DRG relation marking two co-valid artifacts that compete on the same decision; neither side is
      wrong until an operator deactivates one or activates a reconciler. Retired from the charter contract, which carries
      `impacts` instead; author `impacts`.
    status: deprecated
    see_also:
      - term:spec-kitty-core/reconciliation
      - term:spec-kitty-core/rejection
      - term:spec-kitty-core/three-layer-drg
  - id: reconciliation
    name: reconciles_tension (DRG relation)
    definition: A directional DRG relation from an active reconciling artifact to one side of a declared tension pair. The
      pair counts as resolved only when an active artifact carries this edge to both sides; it is always authored, never inferred.
    status: active
    see_also:
      - term:spec-kitty-core/tension
      - term:spec-kitty-core/rejection
      - term:spec-kitty-core/three-layer-drg
  - id: rejection
    name: rejects (DRG relation)
    definition: A directional DRG relation from a good artifact to a marked anti-pattern, rejecting a named bad practice.
      The target is not a competing equal (as in a tension) and was never a valid rule (as in a supersession).
    status: active
    see_also:
      - term:spec-kitty-core/tension
      - term:spec-kitty-core/reconciliation
      - term:spec-kitty-core/three-layer-drg
  - id: hard-dependency
    name: requires (DRG relation)
    definition: 'A directional DRG relation marking a mandatory prerequisite: the source cannot be meaningfully resolved without
      the target. Charter context resolution for an action follows `requires` edges transitively, with no hop limit, and activating
      the source pulls the target in. The most heavily used relation in the built-in graph.'
    status: active
    see_also:
      - term:spec-kitty-core/soft-recommendation
      - term:spec-kitty-core/governance-scope
      - term:spec-kitty-core/three-layer-drg
  - id: soft-recommendation
    name: suggests (DRG relation)
    definition: A directional DRG relation to content that is relevant but optional. Charter context resolution follows `suggests`
      edges only a bounded number of hops, and activation offers the target for the operator to accept or decline.
    status: active
    see_also:
      - term:spec-kitty-core/hard-dependency
      - term:spec-kitty-core/three-layer-drg
  - id: workflow-application
    name: applies (DRG relation)
    definition: A directional DRG relation from an agent profile to the procedure or tactic it executes as its operating workflow.
      Nothing traverses it, so an authored `applies` edge names a relationship no reader follows; use `requires` when the
      profile must reach the artifact. Distinct from `scope`, which names what an action is governed by.
    status: active
    see_also:
      - term:spec-kitty-core/governance-scope
      - term:spec-kitty-core/three-layer-drg
  - id: governance-scope
    name: scope (DRG relation)
    definition: A directional DRG relation from a mission-step action node to the directives and tactics that govern performing
      that action. It is the entry point of charter context resolution, which walks `scope` edges first and then expands through
      `requires` and `suggests`.
    status: active
    see_also:
      - term:spec-kitty-core/workflow-application
      - term:spec-kitty-core/hard-dependency
      - term:spec-kitty-core/soft-recommendation
      - term:spec-kitty-core/three-layer-drg
  - id: glossary-vocabulary
    name: vocabulary (DRG relation)
    definition: A directional DRG relation from a resolved artifact to a glossary node, meant to surface which glossary terms
      matter once the charter context for an action is resolved. No shipped artifact emits it yet; treat it as dormant.
    status: draft
    see_also:
      - term:spec-kitty-core/governance-scope
      - term:spec-kitty-core/three-layer-drg
  - id: template-instantiation
    name: instantiates (DRG relation)
    definition: A directional DRG relation from a mission-step action node to the template it produces. `scope` links an action
      to content it must follow; `instantiates` links it to content it produces.
    status: active
    see_also:
      - term:spec-kitty-core/governance-scope
      - term:spec-kitty-core/three-layer-drg
  - id: supersession
    name: replaces (DRG relation)
    definition: A directional DRG relation asserting that the source fully supersedes the target, which stops applying once
      the source is active. Kept for older hand-authored fragments; current practice deactivates the superseded artifact or,
      in a pack overlay, uses `overrides`.
    status: active
    see_also:
      - term:spec-kitty-core/overlay-override
      - term:spec-kitty-core/tension
      - term:spec-kitty-core/three-layer-drg
  - id: delegation
    name: delegates_to (DRG relation)
    definition: A directional DRG relation for a runtime handoff, one agent profile handing work to another. Kept apart from
      `specializes_from` so static derivation never leaks into handoff. No shipped artifact emits it; handoffs are written
      in a profile's collaboration prose today.
    status: draft
    see_also:
      - term:spec-kitty-core/lineage
      - term:spec-kitty-core/three-layer-drg
  - id: lineage
    name: specializes_from (DRG relation)
    definition: A directional, static DRG relation in which a profile or artifact derives from a parent, narrowing or extending
      it, for example a language-specialist implementer profile specialising the generic implementer. Resolved when profiles
      are composed; never a runtime handoff.
    status: active
    see_also:
      - term:spec-kitty-core/delegation
      - term:spec-kitty-core/three-layer-drg
  - id: overlay-enhancement
    name: enhances (DRG relation)
    definition: A directional overlay relation from an org- or project-level pack artifact to a built-in artifact, field-merging
      content into it while keeping the built-in's action sequence and step inputs and outputs. Never between two built-in
      artifacts.
    status: active
    see_also:
      - term:spec-kitty-core/overlay-override
      - term:spec-kitty-core/three-layer-drg
      - term:spec-kitty-core/organization-tier
  - id: overlay-override
    name: overrides (DRG relation)
    definition: A directional overlay relation from an org- or project-level pack artifact that fully replaces a built-in
      artifact's content instead of merging into it. Silently dropping steps or step inputs and outputs is refused.
    status: active
    see_also:
      - term:spec-kitty-core/overlay-enhancement
      - term:spec-kitty-core/three-layer-drg
      - term:spec-kitty-core/organization-tier
  - id: refinement
    name: refines (DRG relation)
    definition: A directional DRG relation in which an artifact narrows or sharpens the applicability or meaning of a parent
      without replacing it; a traversable relation in its own right, never a stand-in for `applies` or `specializes_from`.
      No shipped artifact emits it yet.
    status: draft
    see_also:
      - term:spec-kitty-core/workflow-application
      - term:spec-kitty-core/lineage
      - term:spec-kitty-core/three-layer-drg
  - id: organization-tier
    name: Organization Tier
    definition: The middle layer of the three-layer DRG, contributed by the org Charter Packs a project configures. Each org
      pack ships its artifacts, an optional DRG fragment and optional activation presets; a governing preset among them sets
      the required floor of every project whose closure holds the pack.
    status: active
    see_also:
      - term:spec-kitty-core/three-layer-drg
      - term:spec-kitty-core/charter-pack
      - term:spec-kitty-core/active-charter
  - id: catalog-miss
    name: Catalog Miss
    definition: An artifact id that a charter selection names (for example `selected_directives`) but no pack in the charter
      offering holds. `spec-kitty doctor` reports catalog misses as errors.
    status: active
    see_also:
      - term:spec-kitty-core/charter-offering
      - term:spec-kitty-core/active-charter
      - term:spec-kitty-core/organization-tier
  - id: kittify
    name: .kittify/
    definition: Project-local configuration and shared memory directory.
    status: active
    see_also:
      - term:spec-kitty-core/charter
      - term:spec-kitty-core/mission
  - id: kitty-specs
    name: kitty-specs/
    definition: Holds one Mission directory per Mission (`kitty-specs/<mission_slug>/`), with its planning artifacts (`spec.md`,
      `plan.md`, `tasks.md`, `tasks/`, plus supporting files), `meta.json` and the status event log `status.events.jsonl`.
    status: active
    see_also:
      - term:spec-kitty-core/mission
      - term:spec-kitty-core/work-package
  - id: worktrees
    name: .worktrees/
    definition: 'Holds the Git worktrees a Mission''s execution lanes use: one lane worktree per lane (`.worktrees/<slug>-lane-<id>`)
      and, for a coordination topology, the coordination worktree (`<Mission directory>-coord`). A `single_branch` Mission
      has no lane worktree: its work packages run in the write checkout.'
    status: active
    see_also:
      - term:spec-kitty-core/work-package
      - term:spec-kitty-core/lane
  - id: project-charter
    name: Project Charter
    definition: 'The compiled, project-specific charter under `.kittify/charter/`: the operator''s decisions in `charter.md`
      and `charter.yaml`, activation choices in `activation.yaml`, interview answers in `interview/answers.yaml`, and the
      reference manifest as the `catalog` section of `charter.yaml`.'
    status: active
    see_also:
      - term:spec-kitty-core/charter
      - term:spec-kitty-core/operator
  - id: artifact
    name: Artifact
    definition: Any file produced or consumed during the mission lifecycle (e.g., `spec.md`, `plan.md`, `tasks.md`, prompt
      files). Artifacts are identified by an artifact key, fingerprinted by content hash, and classified by role.
    status: draft
    see_also:
      - term:spec-kitty-core/artifact-class
      - term:spec-kitty-core/artifact-key
  - id: mission-dossier
    name: Mission Dossier
    definition: 'The local inventory and integrity check of a Mission''s artifacts. It answers three questions: which artifacts
      exist (each indexed with a content hash), whether every required artifact is present (against the expected artifact
      manifest), and what changed since the last recorded snapshot (`spec-kitty reconcile --mission <slug>` names each differing
      artifact).'
    status: draft
    see_also:
      - term:spec-kitty-core/artifact
      - term:spec-kitty-core/dossier-snapshot
      - term:spec-kitty-core/parity-hash
  - id: artifact-class
    name: Artifact Class
    definition: The role an artifact plays in the Mission lifecycle, one of `input`, `workflow`, `output`, `evidence`, `policy`
      or `runtime` in the expected artifact manifest; an indexed artifact may also be `other`.
    status: draft
  - id: artifact-key
    name: Artifact Key
    definition: Stable, unique identifier for an artifact within a dossier, following the pattern `{class}.{type}.{qualifier}`
      (e.g., `input.spec.main`).
    status: draft
    see_also:
      - term:spec-kitty-core/artifact-class
  - id: content-hash
    name: Content Hash
    definition: A checksum of the artifact's contents (using SHA256) that locks in what the artifact contains. Any changes
      to the artifact will cause the calculated hash to change as well, making it useful for detecting modifications.
    status: draft
    see_also:
      - term:spec-kitty-core/parity-hash
      - term:spec-kitty-core/sha256
  - id: expected-artifact-manifest
    name: Expected Artifact Manifest
    definition: Registry of required and optional artifacts per mission type and step, defining the completeness contract
      for a dossier.
    status: draft
    see_also:
      - term:spec-kitty-core/completeness-status
      - term:spec-kitty-core/missing-detection
  - id: completeness-status
    name: Completeness Status
    definition: 'Whether all required artifacts in the manifest are present: `complete`, `incomplete`, or `unknown` (no manifest).'
    status: draft
    see_also:
      - term:spec-kitty-core/expected-artifact-manifest
  - id: parity-hash
    name: Parity Hash
    definition: A checksum over the (relative path, content hash) pairs of every present artifact in a dossier, sorted by
      path so the scan order does not matter, written as `sha256:<64 hex>`. Any change of an artifact's content or path changes
      it; it answers "has anything in this dossier changed?".
    status: draft
    see_also:
      - term:spec-kitty-core/content-hash
      - term:spec-kitty-core/parity-baseline
      - term:spec-kitty-core/parity-drift
  - id: parity-baseline
    name: Parity Baseline
    definition: A saved parity hash representing the last accepted state of a dossier. Scoped to a specific project, Mission,
      target branch, and mission type so that baselines from different contexts can never be confused with each other. Drift
      is detected by comparing the current parity hash against this baseline.
    status: draft
    see_also:
      - term:spec-kitty-core/parity-hash
      - term:spec-kitty-core/parity-drift
  - id: parity-drift
    name: Parity Drift
    definition: When the current parity hash no longer matches the saved baseline, something in the dossier has changed since
      it was last accepted. This mismatch is called parity drift. It tells the curator "artifacts have been modified — review
      what changed."
    status: draft
    see_also:
      - term:spec-kitty-core/parity-hash
      - term:spec-kitty-core/parity-baseline
  - id: dossier-snapshot
    name: Dossier Snapshot
    definition: 'A frozen picture of a dossier at a specific moment: which artifacts are present, how many are required vs
      optional, whether all required artifacts exist, and the parity hash at that time. Scanning the same unchanged content
      always produces the same snapshot.'
    status: draft
    see_also:
      - term:spec-kitty-core/mission-dossier
      - term:spec-kitty-core/parity-hash
      - term:spec-kitty-core/completeness-status
  - id: artifact-indexing
    name: Artifact Indexing
    definition: The process of walking through a Mission directory, identifying each artifact file, computing its content
      hash, and recording it in the dossier. Also checks for any required artifacts that are missing.
    status: draft
    see_also:
      - term:spec-kitty-core/content-hash
      - term:spec-kitty-core/missing-detection
  - id: missing-detection
    name: Missing Detection
    definition: 'What artifact indexing records when a required artifact is absent or unreadable: a reason code, `not_found`,
      `unreadable` or `invalid_utf8`.'
    status: draft
    see_also:
      - term:spec-kitty-core/artifact-indexing
      - term:spec-kitty-core/expected-artifact-manifest
  - id: tool
    name: Tool
    definition: Concrete runtime product used to execute commands (for example Claude Code, Codex, opencode).
    status: active
    see_also:
      - term:spec-kitty-core/agent
      - term:spec-kitty-core/slash-command
  - id: pack-skill
    name: Pack skill
    definition: 'A thin, parameterised entry point a team shares through a Charter Pack instead of private per-user copies:
      an artifact of kind `skill` (URN `skill:<id>`), declared as `<id>.skill.yaml` in a pack''s `skills/` directory or the
      project layer. Activated with `spec-kitty charter activate skill <id>`, it is rendered as a `SKILL.md` into each configured
      tool. It carries no charter substance of its own: it `requires` the procedures and directives that do.'
    status: active
    see_also:
      - term:spec-kitty-core/slash-command
      - term:spec-kitty-core/tool
  - id: slash-command
    name: Slash Command
    definition: User-facing command surface that triggers a lifecycle operation (for example specify, plan, tasks, review,
      consolidate).
    status: active
  - id: semantic-check
    name: Semantic Check
    definition: Deterministic validation step that compares extracted terms with active glossary scope(s) before generation
      proceeds.
    status: active
    see_also:
      - term:spec-kitty-core/glossary-scope
      - term:spec-kitty-core/glossary-strictness
      - term:spec-kitty-core/term-sense
      - term:spec-kitty-core/semantic-check-evaluation
  - id: glossary-strictness
    name: Glossary Strictness
    definition: Policy mode controlling warning/block behavior for semantic conflicts.
    status: active
  - id: clarification-prompt
    name: Clarification Prompt
    definition: Targeted question emitted when conflict severity/confidence requires human input before continuing generation.
    status: active
  - id: generation-boundary
    name: Generation Boundary
    definition: Point where text/code generation would begin and semantic gate policy is enforced.
    status: active
  - id: collaboration-mode
    name: Collaboration Mode
    definition: The level of operator involvement during a mission step or workflow. Determines how much real-time oversight
      the operator provides versus delegating to agents.
    status: draft
    see_also:
      - term:spec-kitty-core/operator
      - term:spec-kitty-core/interactive-mode
      - term:spec-kitty-core/hands-off-with-review-mode
      - term:spec-kitty-core/fully-delegated-mode
  - id: interactive-mode
    name: Interactive Mode
    definition: The operator works alongside agents in real time — conducting interviews, pair-developing, micro-prompting,
      or making decisions as they arise. The operator is present and actively steering.
    status: draft
    see_also:
      - term:spec-kitty-core/collaboration-mode
      - term:spec-kitty-core/operator
  - id: hands-off-with-review-mode
    name: Hands-off with Review Mode
    definition: Agents operate independently during execution, but the operator reviews results at defined checkpoints before
      work is accepted or advanced. The operator is absent during execution but present for review.
    status: draft
    see_also:
      - term:spec-kitty-core/collaboration-mode
      - term:spec-kitty-core/operator
  - id: fully-delegated-mode
    name: Fully Delegated Mode
    definition: The agentic stack operates asynchronously without the operator present. Work proceeds until a final Accept/Decline
      decision point, where the operator returns to approve or reject the outcome. Also known as "AFK mode."
    status: draft
    see_also:
      - term:spec-kitty-core/collaboration-mode
      - term:spec-kitty-core/operator
  - id: communication-artifact
    name: communication artifact
    definition: A durable artifact produced or consumed while a Mission runs, for example a commit, a pull request or a review
      comment, as distinct from the planning artifacts (spec, plan, tasks) produced before execution begins.
    status: active
  - id: owned-checkout
    name: owned checkout
    definition: A linked git checkout that Spec Kitty has validated, for one command invocation, as owning a given Mission.
      The operator names it with `--owned-checkout <path>`, or a command without the flag adopts it after validation; every
      lifecycle read and write of that Mission then resolves inside it.
    status: draft
    see_also:
      - term:spec-kitty-core/repository-root-checkout
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/target-branch
  - id: adr
    name: ADR (Architectural Decision Record)
    definition: Immutable record of a significant technical/domain decision, with context and consequences.
    status: active
  - id: glossary-strictness-policy
    name: Glossary Strictness Policy
    definition: Governance rule for how semantic conflicts are treated (`warn` vs `block`) under each strictness mode.
    status: active
  - id: clarification-burst-policy
    name: Clarification Burst Policy
    definition: An intended rule, not shipped, for limiting clarification interruptions by prioritising the highest-impact
      conflicts and capping the prompts per burst. Today the clarification step prompts for every unresolved conflict in turn.
    status: draft
  - id: precedence-rule
    name: Precedence Rule
    definition: Ordering used when policy settings conflict.
    status: active
  - id: pack-level
    name: Pack Level
    definition: The level a Charter Pack occupies, declared by `pack_level` in its `pack.yaml`, one of `built-in`, `org` or
      `project` in ascending precedence. A pack states its own level; loading refuses a pack whose declared level disagrees
      with where it is configured.
    status: active
    see_also:
      - term:spec-kitty-core/charter-pack
      - term:spec-kitty-core/precedence-rule
  - id: charter-interview
    name: Charter Interview
    definition: A guided question-and-answer process that walks the operator through their project's preferences, constraints,
      and artifact selections. Answers are saved to `answers.yaml` and used to compile the charter.
    status: active
    see_also:
      - term:spec-kitty-core/charter
      - term:spec-kitty-core/charter-compiler
      - term:spec-kitty-core/operator
  - id: charter-compiler
    name: Charter Compiler
    definition: The processor that takes the operator's interview answers and their selected doctrine artifacts, and combines
      them into a finalized charter document and supporting governance files.
    status: active
    see_also:
      - term:spec-kitty-core/charter
      - term:spec-kitty-core/charter-interview
      - term:spec-kitty-core/charter-offering
  - id: governance-resolution
    name: Governance Resolution
    definition: The result of checking the project's active charter against the charter offering, confirming that the referenced
      paradigms, directives and tools exist and are compatible with each other.
    status: active
    see_also:
      - term:spec-kitty-core/charter-compiler
      - term:spec-kitty-core/charter-offering
  - id: activated-vs-available-profile
    name: Activated vs Available Profile
    definition: 'An available profile is any agent profile in a layer of the charter offering (built-in, org pack or project
      layer); an activated profile is one the project has turned on through `activated_agent_profiles` (absent key: every
      available profile; `[]`: none; a list: those listed), minus its `deactivated_agent_profiles` exclusions unless a pack
      requires it. Only activated profiles are selectable by default; the others show under `--all` or `--show-available`.'
    status: active
    see_also:
      - term:spec-kitty-core/abstract-base-profile
      - term:spec-kitty-core/exclusion
      - term:spec-kitty-core/effective-set
  - id: effective-set
    name: Effective Set
    definition: 'The artifacts of one kind that are actually in force: the kind''s allow state (`activated_<kind>` when present,
      nothing for `[]`, every available artifact when absent) minus its effective deny. A deny never removes a required artifact.'
    status: active
    see_also:
      - term:spec-kitty-core/activation-ledger
      - term:spec-kitty-core/exclusion
      - term:spec-kitty-core/effective-deny
      - term:spec-kitty-core/required-floor
      - term:spec-kitty-core/activated-vs-available-profile
  - id: abstract-base-profile
    name: Abstract Base Profile
    definition: An agent profile that is referenced via a `specializes_from` lineage edge but is not itself activated in the
      project charter. It acts as a shared-element store that concrete profiles inherit from; it is not directly selectable
      as a runtime persona. Resolving a profile whose lineage traverses an abstract base (an ancestor not in the activated
      set) yields a lineage warning rather than an error.
    status: active
    see_also:
      - term:spec-kitty-core/activated-vs-available-profile
  - id: agent
    name: Agent
    definition: Logical collaborator identity used in workflow coordination (for example implementer, reviewer).
    status: active
    see_also:
      - term:spec-kitty-core/tool
      - term:spec-kitty-core/role
  - id: role
    name: Role
    definition: Responsibility assignment for a step or work package (implementer, reviewer, planner, etc.).
    status: active
    see_also:
      - term:spec-kitty-core/agent
      - term:spec-kitty-core/agent-profile
      - term:spec-kitty-core/authored-intent
      - term:spec-kitty-core/resolved-binding
  - id: agent-profile
    name: Agent Profile
    definition: Structured logical collaborator identity and behavior guidance, identified by a stable profile ID, that can
      govern assignment, handoff, role-scoped behavior, and tool-native custom-agent/subagent projection.
    status: active
    see_also:
      - term:spec-kitty-core/agent
      - term:spec-kitty-core/role
      - term:spec-kitty-core/tool
      - term:spec-kitty-core/authored-intent
      - term:spec-kitty-core/resolved-binding
  - id: authored-intent
    name: Authored Intent
    definition: Who or what a work package was *designed* to be run by — the authored/recommended `role`, `agent_profile`,
      and `model`. Authored once at tasks-finalize; frontmatter-canonical and static for the life of the WP; never mirrored
      into events.
    status: draft
    see_also:
      - term:spec-kitty-core/resolved-binding
      - term:spec-kitty-core/agent-profile
      - term:spec-kitty-core/role
  - id: resolved-binding
    name: Resolved Binding
    definition: 'Who or what actually ran a work package at a lifecycle transition: the resolved role, agent profile (with
      its version), model and provider. Recorded in the status event log, latest wins, and it shifts across the lifecycle
      (implementer, then reviewer). Contrast authored intent, which the work package''s frontmatter carries.'
    status: draft
    see_also:
      - term:spec-kitty-core/authored-intent
      - term:spec-kitty-core/agent-profile
      - term:spec-kitty-core/role
  - id: mission-participant
    name: Mission Participant
    definition: Human or tool-backed collaborator participating in a mission and, when execution is active, in one or more
      mission runs.
    status: active
  - id: mission-owner
    name: Mission Owner
    definition: Participant responsible for tie-breaking unresolved semantic conflicts when collaborators disagree.
    status: active
  - id: operator
    name: operator
    definition: The human who remains responsible and accountable for the decisions made during a Mission. Agents assist and
      propose; the operator owns the final call, so automation supports human judgement rather than replacing it. Mission
      steps and procedures name this role `operator`, and the `human-in-charge` agent profile is the human-performed profile
      that serves it.
    status: active
    see_also:
      - term:spec-kitty-core/mission-owner
      - term:spec-kitty-core/collaboration-mode
    avoid:
      - human in charge
      - human in command
  - id: term-surface
    name: Term Surface
    definition: The raw text of a domain term as it appears in mission inputs or outputs, before the system determines what
      it means. For example, the word "agent" is a term surface that could mean different things in different contexts.
    status: draft
    see_also:
      - term:spec-kitty-core/term-sense
      - term:spec-kitty-core/glossary-scope
  - id: term-sense
    name: Term Sense
    definition: 'The specific meaning of a term surface within a particular glossary scope. Carries the definition, where
      it came from (provenance), how confident the system is in it, and its status: `draft` (auto-extracted), `active` or
      `deprecated`.'
    status: draft
    see_also:
      - term:spec-kitty-core/term-surface
      - term:spec-kitty-core/provenance
      - term:spec-kitty-core/confidence-score
  - id: confidence-score
    name: Confidence Score
    definition: 'A value between 0.0 and 1.0 indicating how certain the system is about a term extraction or sense resolution.
      Higher values mean higher certainty. It feeds conflict severity scoring: an unknown term with confidence below 0.5 at
      a critical step scores high severity, which blocks generation under `medium` strictness.'
    status: draft
    see_also:
      - term:spec-kitty-core/term-sense
      - term:spec-kitty-core/semantic-check
  - id: mission-type
    name: Mission Type
    definition: Reusable workflow blueprint that configures the mission's steps (actions), their templates, and guardrails.
    status: active
  - id: feature
    name: Feature
    definition: Retired name for a Mission (of type `software-dev`). Write Mission; "feature" in the product-capability sense
      and the Gherkin keyword are unaffected.
    status: deprecated
    see_also:
      - term:spec-kitty-core/mission
  - id: mission-action
    name: Mission Action
    definition: Outer lifecycle action for a mission, such as `specify`, `plan`, `implement`, `review`, or `accept`.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
      - term:spec-kitty-core/procedure
  - id: workflow
    name: Workflow
    definition: Umbrella prose term for the overall flow of work.
    status: active
  - id: step-sequence
    name: Step Sequence
    definition: The order in which a mission type's steps run, the order of the `steps` list in its `<id>.mission-type.yaml`.
    status: active
  - id: command-template
    name: Command Template
    definition: The Markdown prompt of one mission-type step (its `prompt_path`, under the mission type's `steps/`), rendered
      for the agent when the step runs.
    status: active
    see_also:
      - term:spec-kitty-core/template-resolution
  - id: template-resolution
    name: Template Resolution
    definition: Finding the right prompt and templates for a mission action, given the active mission type and the agent that
      runs it.
    status: active
    see_also:
      - term:spec-kitty-core/command-template
  - id: mission-discovery
    name: Mission Discovery
    definition: How the runtime finds the mission types it can run, the `<id>.mission-type.yaml` files of the packs in the
      charter offering.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
  - id: command-envelope
    name: Command Envelope
    definition: 'Standard JSON wrapper around the output of every `spec-kitty orchestrator-api` command: `contract_version`,
      `command`, `timestamp`, `correlation_id`, `success`, `error_code` and `data`.'
    status: active
    see_also:
      - term:spec-kitty-core/orchestrator-api
      - term:spec-kitty-core/contract-version
      - term:spec-kitty-core/json
  - id: contract-version
    name: Contract Version
    definition: Version number on the orchestrator API that tells consumers whether the API has changed in a breaking way.
    status: active
    see_also:
      - term:spec-kitty-core/orchestrator-api
      - term:spec-kitty-core/command-envelope
  - id: orchestrator-api
    name: Orchestrator API
    definition: 'JSON-based interface that lets external orchestration tools drive Spec Kitty operations programmatically:
      the `spec-kitty orchestrator-api` command group, whose commands answer in the Command Envelope instead of human-facing
      output.'
    status: active
    see_also:
      - term:spec-kitty-core/command-envelope
      - term:spec-kitty-core/api
  - id: decision
    name: Decision
    definition: A structured choice presented to the operator or their delegated agent during the next-command loop. Each
      decision describes what needs to happen next and offers options to advance the mission. In event-backed runtimes, a
      pending Decision is tracked until answered, then closed.
    status: active
    see_also:
      - term:spec-kitty-core/decision-kind
      - term:spec-kitty-core/decision-input-request
      - term:spec-kitty-core/decision-input-answer
      - term:spec-kitty-core/operator
  - id: decision-kind
    name: Decision Kind
    definition: The type of choice a decision presents, for example which step to run next, how to resolve a conflict or which
      agent takes a work package. `spec-kitty next --json` carries it as the top-level `kind` field.
    status: active
    see_also:
      - term:spec-kitty-core/decision
      - term:spec-kitty-core/decision-input-request
  - id: decision-input-request
    name: Decision Input Request
    definition: The event emitted by the runtime when it opens a Decision and requires a response from the operator or a delegated
      agent. Carries the question text, candidate options, step context, and a unique `decision_id`. Opening a Decision Input
      Request is what makes a Decision "pending".
    status: active
    see_also:
      - term:spec-kitty-core/decision
      - term:spec-kitty-core/decision-input-answer
      - term:spec-kitty-core/mission-run
  - id: decision-input-answer
    name: Decision Input Answer
    definition: The event emitted when the operator or a delegated agent answers a pending Decision. Carries the chosen answer,
      the actor identity, and the originating `decision_id`. Answering closes the Decision; the loop continues.
    status: active
    see_also:
      - term:spec-kitty-core/decision
      - term:spec-kitty-core/decision-input-request
  - id: tracker-connector
    name: Tracker Connector
    definition: Outbound integration boundary that projects host lifecycle state to external tracker systems without transferring
      lifecycle authority.
    status: active
    see_also:
      - term:spec-kitty-core/target-branch
      - term:spec-kitty-core/orchestrator-api
      - term:spec-kitty-core/wpstatuschanged
    aliases:
      - Tracker Connector Boundary
  - id: primary-partition
    name: PRIMARY partition
    definition: The placement of a Mission's stable planning artifacts (spec, plan, work-package outlines, `meta.json`), as
      distinct from the COORD partition. A partition decides which surface an artifact kind is written to; it is not a git
      branch. Missions without a coordination topology route every artifact to PRIMARY.
    status: active
    see_also:
      - term:spec-kitty-core/primary-branch
      - term:spec-kitty-core/coord-partition
      - term:spec-kitty-core/topology-surface
      - term:spec-kitty-core/repository-root-checkout
      - term:spec-kitty-core/target-ref
      - term:spec-kitty-core/target-branch
  - id: target-ref
    name: Target Ref / Commit Target
    definition: 'The git ref a Mission''s planning artifacts and status events are committed against, the "commit target":
      the Mission''s `target_branch`. Distinct from the partition (which decides the surface an artifact is written to) and
      from the repository''s primary branch.'
    status: active
    see_also:
      - term:spec-kitty-core/target-branch
      - term:spec-kitty-core/merge-target-branch
      - term:spec-kitty-core/base-branch
      - term:spec-kitty-core/current-branch
      - term:spec-kitty-core/primary-partition
    avoid:
      - primary target
      - primary ref
  - id: lane-consolidation
    name: Lane Consolidation
    definition: 'The lane step of `spec-kitty consolidate`: a local consolidation of completed lane branches into the Mission
      branch, with no push. The first of the three "merge" senses; the command then integrates the Mission branch into its
      target locally and publishes only when the operator passes `--push`.'
    status: active
    see_also:
      - term:spec-kitty-core/branch-integration
      - term:spec-kitty-core/merge-target-branch
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/topology-surface
  - id: branch-integration
    name: branch integration
    definition: 'The `git merge` of a Mission branch into its target branch, the second of the three "merge" senses: after
      lane consolidation, before publishing. The merge strategy (`merge`, `squash` or `rebase`) chooses how it is done.'
    status: active
    see_also:
      - term:spec-kitty-core/lane-consolidation
      - term:spec-kitty-core/target-branch
      - term:spec-kitty-core/merge-target-branch
  - id: branch-relative-provenance
    name: Branch-relative provenance
    definition: 'The meaning of a commit SHA a Mission records (`merged_commit`, `accepted_from_commit`, `lane_head`, `base_commit`
      and SHAs cited as evidence): a commit on the branch the Mission was built on, as it stood when the value was written.
      After a rebase landing it may resolve only through the pull request''s head ref, and it is never repointed. `pr_merge_commit`
      is the exception: its writer checks it is on the target branch.'
    status: active
    see_also:
      - term:spec-kitty-core/lane-consolidation
      - term:spec-kitty-core/evidence-gate
  - id: work-package-window
    name: Work-package window
    definition: 'The span of lane history one approved work package is accountable for: from its window-open SHA, recorded
      when the work package is claimed or started, to its newest approval stamp. A work package with a window gap is judged
      from the claim base to its approval stamp instead.'
    status: draft
    see_also:
      - term:spec-kitty-core/window-gap
  - id: window-gap
    name: Window gap
    definition: 'The recorded absence of a window for a work package: "not recorded", "capture failed", "lane branch missing"
      or "not on lane". A gap never refuses by itself; the work package is judged by its approval stamp and listed in the
      gap report.'
    status: draft
    see_also:
      - term:spec-kitty-core/gap-report
      - term:spec-kitty-core/work-package-window
  - id: gap-report
    name: Gap report
    definition: The part of the `spec-kitty consolidate` output (fresh run, resume and forecast; `window_gaps` in the JSON)
      that lists every work package judged by the fallback approval-stamp bound, with its window gap reason.
    status: draft
    see_also:
      - term:spec-kitty-core/window-gap
      - term:spec-kitty-core/work-package-window
  - id: evidence-gate
    name: Evidence gate
    definition: 'A command that turns a Mission''s local status or code into a durable verdict: preparing a review workspace,
      `accept`, `consolidate`, and the `orchestrator-api` `accept-mission` and `consolidate-mission` forms. Each runs the
      origin freshness check before it trusts a local branch.'
    status: active
    see_also:
      - term:spec-kitty-core/origin-freshness-check
      - term:spec-kitty-core/status-evidence-branch
      - term:spec-kitty-core/lane-consolidation
  - id: origin-freshness-check
    name: Origin freshness check
    definition: 'Refreshing the remote''s view of a branch and classifying the local branch against it: `up_to_date`, `behind`,
      `ahead`, `diverged`, `local_missing`, `remote_missing`, `unreachable`, `no_remote`, `remote_ambiguous` or `compare_failed`
      (`not_checked` when the check is off). Landing gates refuse a stale or unverifiable branch unless the operator passes
      `--origin-check warn` (or sets `SPEC_KITTY_ORIGIN_CHECK=warn`); `off` contacts nothing.'
    status: active
    see_also:
      - term:spec-kitty-core/evidence-gate
      - term:spec-kitty-core/status-evidence-branch
  - id: status-evidence-branch
    name: Status evidence branch
    definition: 'The branch whose copy of a Mission''s `status.events.jsonl` an evidence gate reads: the coordination branch
      for a coordination topology, the write branch for `single_branch` (`kitty/mission-...` for a protected target, the target
      itself with `--commit-to-target`), and the target branch for `lanes`. The origin freshness check judges it only on commits
      that change this Mission''s status log, under every directory alias of the Mission. A gate never moves it; it refuses
      and names the pull command.'
    status: active
    see_also:
      - term:spec-kitty-core/evidence-gate
      - term:spec-kitty-core/origin-freshness-check
      - term:spec-kitty-core/coord-partition
      - term:spec-kitty-core/primary-partition
  - id: coord-partition
    name: COORD partition
    definition: 'The placement of a Mission''s lifecycle artifacts (status events, notes, trace, issue matrix, acceptance
      matrix, review cycles), as distinct from the PRIMARY partition. Not a branch or a directory: only `coord` and `lanes_with_coord`
      Missions have a coordination surface; the others write everything to PRIMARY.'
    status: active
    see_also:
      - term:spec-kitty-core/primary-partition
      - term:spec-kitty-core/topology-surface
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/mission
  - id: topology-surface
    name: Topology Surface
    definition: 'The physical tree a Mission artifact is read from and written to: the repository-root planning tree (PRIMARY),
      the Mission''s coordination tree (COORD), a lane worktree, the consolidated tree or a temporary tree. The mission-topology
      sense of "surface", distinct from a tool surface.'
    status: active
    see_also:
      - term:spec-kitty-core/primary-partition
      - term:spec-kitty-core/coord-partition
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/lane-consolidation
      - term:spec-kitty-core/repository-root-checkout
  - id: op
    name: Op
    definition: A lightweight, governed ad-hoc unit of work, opened with `spec-kitty dispatch "<request>"`, which routes the
      request to an agent profile, loads the charter context for it and writes a `started` event to an append-only Op record
      under `kitty-ops/`. An Op creates no spec, plan, work package, branch or worktree; it is opened and closed within one
      sitting, and closed with `spec-kitty profile-invocation complete --outcome <done|failed|abandoned>`. Unclosed Ops are
      reported by `spec-kitty doctor ops` and swept to `abandoned`, which is a lapse, not a completion. DIRECTIVE_053 requires
      choosing an Op or a Mission before work starts; Mission-sized work (a spec, reviewable work packages, a review gate,
      more than one sitting) is never an Op.
    status: active
    see_also:
      - term:spec-kitty-core/mission
      - term:spec-kitty-core/tool
    aliases:
      - profile invocation
  - id: high-severity-block-rule
    name: High-Severity Block Rule
    definition: Under the default `medium` glossary strictness, generation is blocked only when high-severity semantic conflicts
      remain unresolved. `max` strictness blocks on any unresolved conflict and `off` never blocks.
    status: active
  - id: event-envelope
    name: Event Envelope
    definition: Standard wrapper for an emitted event, including identity, ordering, and payload fields.
    status: active
  - id: glossary-evolution-log
    name: Glossary Evolution Log
    definition: Append-only sequence of glossary-related events that records candidate extraction, semantic checks, clarifications,
      and sense updates. Stored per Mission in `.kittify/events/glossary/<mission_id>.events.jsonl`.
    status: active
    see_also:
      - term:spec-kitty-core/semantic-check
      - term:spec-kitty-core/clarification-prompt
  - id: glossary-scope
    name: Glossary Scope
    definition: Bounded semantic scope used for term/sense resolution.
    status: active
  - id: semantic-check-evaluation
    name: Semantic Check Evaluation
    definition: Deterministic pre-generation evaluation of extracted terms against active glossary scopes.
    status: active
  - id: replay
    name: Replay
    definition: Reconstructing effective glossary state and decisions from canonical append-only events.
    status: active
  - id: dossier-event
    name: Dossier Event
    definition: 'An event emitted by a dossier operation: artifact indexed, snapshot computed, required artifact missing,
      or parity drift detected.'
    status: draft
    see_also:
      - term:spec-kitty-core/mission-dossier
      - term:spec-kitty-core/anomaly-event
      - term:spec-kitty-core/event-envelope
  - id: anomaly-event
    name: Anomaly Event
    definition: An event that is only emitted when something unexpected happens — such as a required artifact being missing
      or parity drift being detected. Unlike routine lifecycle events, anomaly events signal conditions that may need the
      operator's attention.
    status: draft
    see_also:
      - term:spec-kitty-core/dossier-event
      - term:spec-kitty-core/operator
  - id: wpstatuschanged
    name: WPStatusChanged
    definition: The event that carries a work package's move from one status lane to another (for example `planned` to `claimed`).
      Each move is one row of the Mission's `status.events.jsonl`.
    status: active
    see_also:
      - term:spec-kitty-core/work-package
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/event-envelope
  - id: lamport-clock
    name: Lamport Clock
    definition: A logical counter carried in an event envelope that orders events without relying on wall-clock time. Each
      new event increments the counter, so envelopes that carry it can be ordered across machines. The work package status
      log does not use it; its lane transitions are ordered by their recorded timestamp.
    status: active
    see_also:
      - term:spec-kitty-core/event-envelope
      - term:spec-kitty-core/replay
  - id: tail-cursor
    name: Tail cursor
    definition: 'A reader''s resumable position in `spec-kitty events tail`: a byte offset into the selected log of a Mission
      plus a content invariant (a digest of the bytes at that offset) that proves later growth is a continuation and not a
      rollback. The caller owns it; the command persists nothing.'
    status: draft
    see_also:
      - term:spec-kitty-core/tail-envelope
      - term:spec-kitty-core/resume-token
  - id: resume-token
    name: resume token
    definition: The (offset, content invariant) pair a consumer of `spec-kitty events tail` stores across restarts and passes
      back with `--from-offset` and `--from-invariant`. With both, a stale or rolled-back position is refused instead of trusted.
    status: draft
    see_also:
      - term:spec-kitty-core/tail-cursor
      - term:spec-kitty-core/tail-envelope
  - id: log-truncated
    name: log_truncated
    definition: 'The signal `spec-kitty events tail` emits when it detects a rollback of the log it follows (a size shrink,
      or regrowth whose content no longer matches): `"type": "log_truncated"`, a `reason` (`size_shrink` or `content_mismatch`),
      the offset where it was detected, and a resync offset and invariant at 0.'
    status: draft
    see_also:
      - term:spec-kitty-core/tail-envelope
      - term:spec-kitty-core/tail-cursor
  - id: tail-envelope
    name: Tail envelope
    definition: One JSON line that `spec-kitty events tail --json` writes to stdout, either a line of the selected log passed
      through or a `log_truncated` signal; each pass-through line also carries the offset and invariant just past it, ready
      to store as a resume token. Errors go to stderr only.
    status: draft
    see_also:
      - term:spec-kitty-core/tail-cursor
      - term:spec-kitty-core/resume-token
      - term:spec-kitty-core/log-truncated
  - id: api
    name: API
    definition: Application Programming Interface — a defined way for one piece of software to talk to another. Instead of
      a human clicking buttons, an API lets programs send requests and receive structured responses.
    status: draft
  - id: cli
    name: CLI
    definition: Command Line Interface — a text-based way to interact with software by typing commands into a terminal, rather
      than clicking through a graphical interface. Spec Kitty's primary interface is a CLI.
    status: draft
    see_also:
      - term:spec-kitty-core/ui
  - id: ui
    name: UI
    definition: User Interface — any surface through which a person interacts with software. This can be graphical (buttons,
      windows) or text-based (a CLI).
    status: draft
    see_also:
      - term:spec-kitty-core/cli
  - id: markdown
    name: Markdown
    definition: A lightweight text formatting language that uses simple symbols (`#` for a heading, a pair of asterisks for
      bold) to create readable documents. Files use the `.md` extension.
    status: draft
  - id: yaml
    name: YAML
    definition: A human-readable configuration file format that uses indentation and key-value pairs to structure data. Files
      use the `.yaml` or `.yml` extension. Used in Spec Kitty for mission definitions and project configuration.
    status: draft
    see_also:
      - term:spec-kitty-core/json
  - id: json
    name: JSON
    definition: A structured data format using curly braces and key-value pairs, commonly used for machine-to-machine communication.
      Less human-readable than YAML but widely supported by programming tools.
    status: draft
    see_also:
      - term:spec-kitty-core/yaml
  - id: sha256
    name: SHA256
    definition: A hashing algorithm that produces a fixed-length checksum from any input. Even a tiny change in the input
      produces a completely different checksum, making it useful for detecting whether content has been modified.
    status: draft
    see_also:
      - term:spec-kitty-core/content-hash
      - term:spec-kitty-core/parity-hash
  - id: topology
    name: Topology
    definition: 'The shape a Mission is given at creation, stored as `topology` in `meta.json`: `single_branch` (no coordination
      branch, no lanes; every work package runs in the write checkout), `lanes` (code lanes, no coordination), `coord` (coordination,
      no lanes) or `lanes_with_coord`. Without `--topology`, create applies the size default; an explicit value is settled
      at create and never re-decided. A Mission created before the field existed is read as `lanes`.'
    status: active
    see_also:
      - term:spec-kitty-core/write-checkout
      - term:spec-kitty-core/code-lane
      - term:spec-kitty-core/topology-surface
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/size-default
  - id: size-default
    name: Size default
    definition: 'The topology a Mission gets when it is created without `--topology`: one topic branch and no worktree, recorded
      as provisional `single_branch`. The first `finalize-tasks` settles it once, by size: at most two work packages or at
      most one code lane stays `single_branch`; anything larger becomes `lanes_with_coord`, with the topic branch as its coordination
      branch. A settled Mission, and one created with an explicit topology, is never re-decided.'
    status: active
    see_also:
      - term:spec-kitty-core/topic-branch
      - term:spec-kitty-core/topology
      - term:spec-kitty-core/mission-branch
  - id: repo-root-lane
    name: Repo-root lane
    definition: The single bookkeeping lane of a `single_branch` mission, keeping the existing lane id `lane-planning`. It
      always resolves to the write checkout, never to a `.worktrees/` path, and has no lane branch. It generalizes the planning
      lane that every topology already carries for `planning_artifact` work packages.
    status: active
    see_also:
      - term:spec-kitty-core/write-checkout
      - term:spec-kitty-core/code-lane
      - term:spec-kitty-core/lane
  - id: code-lane
    name: Code lane
    definition: A lane that resolves to a lane worktree under `.worktrees/` and a lane branch. Only `lanes` and `lanes_with_coord`
      Missions have code lanes; a repo-root lane never is one. A `single_branch` Mission whose `lanes.json` holds a code lane
      fails closed until `spec-kitty migrate backfill-topology --restamp-single-branch` (or `spec-kitty upgrade`) re-stamps
      it.
    status: active
    see_also:
      - term:spec-kitty-core/repo-root-lane
      - term:spec-kitty-core/lane-work-tip
      - term:spec-kitty-core/lane
      - term:spec-kitty-core/topology
  - id: protected-target
    name: Protected target
    definition: A target branch that is the repository's primary branch or that the protection policy reports as protected.
      A `single_branch` Mission on a protected target gets a Mission branch at create unless `--commit-to-target` is passed;
      an explicit `lanes` create on a protected target is refused before any write.
    status: active
    see_also:
      - term:spec-kitty-core/mission-branch
      - term:spec-kitty-core/primary-branch
      - term:spec-kitty-core/target-branch
  - id: mission-branch
    name: Mission branch
    definition: '`kitty/mission-<slug>-<mid8>`. A `single_branch` Mission gets one, checked out in its write checkout, when
      it targets a protected target without `--commit-to-target`; `spec-kitty consolidate` then lands it onto the target.
      Lane-based Missions use the same name as the consolidation base of their code lanes, and on a coordination topology
      it is also the coordination branch. A default Mission''s mission branch is its topic branch.'
    status: active
    see_also:
      - term:spec-kitty-core/topic-branch
      - term:spec-kitty-core/protected-target
      - term:spec-kitty-core/write-checkout
      - term:spec-kitty-core/lane-consolidation
      - term:spec-kitty-core/target-branch
  - id: lane-work-tip
    name: Lane work tip
    definition: The last commit made on a lane branch, recorded when the commit happens (under `refs/spec-kitty/lane-tip/<branch>`,
      by a post-commit hook when installed), as distinct from the lane's creation base. A destroyed lane with unabsorbed work
      is refused with `DESTROYED_LANE`, which names the restore command; a lane whose tip cannot be known is refused with
      `LANE_WORK_TIP_UNKNOWN`.
    status: active
    see_also:
      - term:spec-kitty-core/absorbed-lane
      - term:spec-kitty-core/code-lane
      - term:spec-kitty-core/lane
  - id: absorbed-lane
    name: Absorbed lane
    definition: A lane whose work tip is an ancestor of the target, equals the lane's base (`tip == base`, nothing was ever
      committed), or whose integration into the target would change nothing (for example after a squash). The destroyed-lane
      guard treats an absorbed lane as safe to re-cut; an unabsorbed one is refused. Squash detection needs git >= 2.38; if
      git cannot evaluate absorption (including any older git) the check fails closed and the lane is not treated as absorbed.
    status: active
    see_also:
      - term:spec-kitty-core/lane-work-tip
      - term:spec-kitty-core/lane-consolidation
  - id: execution-mode-stamp
    name: Execution-mode stamp
    definition: 'The `execution_mode` recorded on status events: `worktree` or `direct_repo`. `direct_repo` is stamped for
      every work package that runs in a write checkout, and also for `planning_artifact` work packages of every topology,
      because they resolve to the repo-root lane. It is not the work-product kind (`code_change` or `planning_artifact`),
      which work-package frontmatter also calls `execution_mode`.'
    status: active
    see_also:
      - term:spec-kitty-core/write-checkout
      - term:spec-kitty-core/work-package
  - id: started-work-package
    name: Started work package
    definition: A work package whose status history ever recorded a move into a working lane (`claimed`, `in_progress`, `for_review`,
      `in_review`, `approved` or `done`), forced moves included. Resetting it to `planned` or canceling it does not unstart
      it. A started work package keeps its recorded execution lane when `finalize-tasks` is re-run.
    status: active
    see_also:
      - term:spec-kitty-core/lane-membership-frozen
      - term:spec-kitty-core/lane-work-tip
      - term:spec-kitty-core/code-lane
      - term:spec-kitty-core/work-package
  - id: lane-membership-frozen
    name: LANE_MEMBERSHIP_FROZEN
    definition: The error with which `spec-kitty agent mission finalize-tasks` refuses a re-finalize that cannot keep every
      started work package on its recorded execution lane; its reason is `started_lanes_collapsed`, `started_wp_removed`,
      `started_wp_kind_changed` or `status_unreadable`. It is raised before any status write and writes nothing. Never answer
      it by deleting `lanes.json`, forcing or resetting git.
    status: active
    see_also:
      - term:spec-kitty-core/started-work-package
      - term:spec-kitty-core/code-lane
      - term:spec-kitty-core/repo-root-lane
  - id: software-dev-mission
    name: software-dev mission
    definition: The Mission type for building or changing software (a feature, a fix, a refactor, with tests). It runs discovery,
      specify, plan, tasks, analyze, implement, review and accept, and favours test-first work.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
      - term:spec-kitty-core/mission
  - id: research-mission
    name: research mission
    definition: The Mission type for systematically investigating a question and producing evidence-backed findings. It runs
      scoping, methodology, gathering, synthesis, output and accept; every source is documented and every finding traces back
      to evidence.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
      - term:spec-kitty-core/mission
  - id: documentation-mission
    name: documentation mission
    definition: The Mission type for creating or overhauling user-facing or contributor documentation, treating documentation
      as code and organising it by the four Divio types (tutorial, how-to, reference, explanation). It supports writing from
      scratch, filling gaps and updating existing docs, and ends with an acceptance step.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
      - term:spec-kitty-core/mission
  - id: plan-mission
    name: plan mission
    definition: The Mission type for a goal-oriented plan or strategy document rather than code or docs. It runs specify,
      research, plan and review, and a review may send a draft back for another pass instead of forcing linear progress.
    status: active
    see_also:
      - term:spec-kitty-core/mission-type
      - term:spec-kitty-core/mission
