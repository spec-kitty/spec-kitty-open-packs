schema_version: '1.0'
id: test-first-cycle
title: Test-First Cycle
description: |
  Drive each production change that carries a lasting regression risk from a failing test; record real-run or gate evidence for configuration and glue work (DIRECTIVE_034).
entry_condition: |
  New behavior or a behavior change with a lasting regression risk is about to be implemented in production code.
exit_condition: |
  Every production change with a lasting regression risk was preceded by a failing test that captured the intended behavior, or took another route DIRECTIVE_034 allows (a policy check with a recorded red, or a recorded skip justification); configuration and glue work cites its real-run or gate evidence; and the work moved in short red-green cycles, one behavior per cycle.
steps:
- title: Select the test-first tactic for the scope
  description: |
    Before the first production edit, decide whether the change carries a lasting regression risk (DIRECTIVE_034 owns the classes, the when-unsure default and the evidence rule). If it does not, record the real-run or gate evidence and do not write a test that restates configuration. Otherwise pick the tactic: acceptance-test-first for user-facing behavior boundaries, tdd-red-green-refactor for unit-level iteration, the testing pack's zombies-tdd (when installed) for incremental case discovery.
- title: Write a failing test first
  description: |
    For a change with a lasting regression risk, write a test that captures the intended behavior and fails before any production code is written.
- title: Keep red-green cycles short and vertical
  description: |
    Keep each cycle to minutes, not hours, one behavior at a time (tactic tdd-red-green-refactor owns vertical slicing). Restructure only in green mode, as procedure disciplined-refactoring-cycle describes.
