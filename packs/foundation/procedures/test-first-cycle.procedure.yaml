schema_version: '1.0'
id: test-first-cycle
title: Test-First Cycle
description: |
  Drive each production change that carries a lasting regression risk from a failing test; record real-run or gate evidence for configuration and glue work (DIRECTIVE_034).
entry_condition: |
  New behavior or a behavior change with a lasting regression risk is about to be implemented in production code.
exit_condition: |
  Every production change with a lasting regression risk was preceded by a failing test that captured the intended behavior (configuration and glue work cites its real-run or gate evidence), and the work moved in short red-green-refactor cycles.
steps:
- title: Select the test-first tactic for the scope
  description: |
    Before the first production edit, decide whether the change carries a lasting regression risk (an unrelated future edit could break it unnoticed). Product logic; scripts that gate or classify (CI gates, linters, classifiers); invariants; and security or permission policy always do. When unsure, treat the change as carrying a lasting regression risk. If it does not, record the real-run or gate evidence (it must exercise the change) and do not write a test that restates configuration. Otherwise pick the tactic: acceptance-test-first for user-facing behavior boundaries, tdd-red-green-refactor for unit-level iteration, the testing pack's zombies-tdd (when installed) for incremental case discovery.
- title: Write a failing test first
  description: |
    For a change with a lasting regression risk, write a test that captures the intended behavior and fails before any production code is written.
- title: Keep red-green-refactor cycles short
  description: |
    Keep each cycle to minutes, not hours.
