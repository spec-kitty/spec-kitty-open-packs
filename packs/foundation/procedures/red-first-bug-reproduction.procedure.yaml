schema_version: '1.0'
id: red-first-bug-reproduction
title: Red-First Bug Reproduction
description: |
  Capture a bug in a test that fails for the right reason, so the fix is proven rather than assumed.
entry_condition: |
  A bug is to be fixed.
exit_condition: |
  A reproduction test driven through the pre-existing entry point failed for the right reason on the unfixed code (its failure text recorded as evidence) and passes after the fix, and a live run confirmed the corrected behavior.
steps:
- title: Invert a test that pins the defect
  description: |
    If an existing (characterization) test asserts the buggy behavior, that test is the reproduction anchor: invert its assertion to the correct behavior instead of writing a parallel test. Tactic `delete-the-assertion-not-the-test` covers how.
- title: Write the reproduction test through the pre-existing entry point
  description: |
    Otherwise, before changing product code, write a test through the entry point that exists on the unfixed code (command, public function or seam), never the fix's not-yet-written API. Keep it red for the bug's symptom, not for a missing symbol (DIRECTIVE_034 owns the red shape).
- title: Split across work packages
  description: |
    When the reproduction lands in a sibling work package that comes before the fix, mark it as a strict expected failure that names the fixing work package (in pytest, `@pytest.mark.xfail(strict=True, reason="fixed in WPnn")`), so intermediate commits stay green. The fixing work package removes the marker, and strictness turns a premature pass into a failure, which forces that flip. This is not masking a defect (DIRECTIVE_041).
- title: Prove red-first, then green
  description: |
    Run it against the unfixed code and confirm it fails for the right reason, then apply the fix and confirm green. Record the observed failure text (the assertion message or error output) in the work package's evidence, so a reviewer can confirm it failed for the bug's symptom. When the work is split, the fix and the green run happen in the fixing work package. New-API unit tests are fine as contract coverage but are not the bug capture.
- title: Confirm the fix with a live run
  description: |
    Keep the defect open until a live reproduction run produces the fixed output; code that "looks fixed" is not evidence.
