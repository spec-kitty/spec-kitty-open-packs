  relation: in_tension_with
  reason: Locality of Change bounds new work to the minimum scope the goal requires; Boy Scout Rule endorses opportunistic
    improvement of touched areas, which can justify expanding a change beyond that boundary. Both remain valid, co-activatable
    rules -- the tension is resolved per-change by keeping adjacent campsite cleaning inside the touched area while deferring
    genuinely broad refactors with an explicit rationale, not by retiring either rule. See directive:RECONCILE_CHANGE_SCOPE_TENSIONS.
- source: directive:DIRECTIVE_024
  target: procedure:keep-change-local
  relation: requires
  when: editing code, tests, or docs while executing a scoped work package or bug fix
  reason: Keeps edits on the target behavior, justifies any wider reach, keeps cleanup separate, and checks the diff for scope
    creep before commit.
