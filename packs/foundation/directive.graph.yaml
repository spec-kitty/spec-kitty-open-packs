  reason: The Boy Scout Rule encourages leaving touched code better than found, which can justify changes beyond the smallest
    viable diff the tactic prescribes. Both remain valid, co-activatable rules -- apply smallest-viable-diff discipline for
    goal delivery, and fold in only the touched-area fixes Boy Scout Rule requires, deferring broader opportunistic improvement
    to an explicit task. See directive:RECONCILE_CHANGE_SCOPE_TENSIONS.
