id: execution-lanes
schema_version: '1.0'
tool: spec-kitty
title: Execution Lanes
guide_path: execution-lanes.guide.md
summary: |
  Operational guidance for Spec Kitty's default multi-lane implementation workspaces. Each lane branch runs its work packages in sequence in a lane worktree that spec-kitty agent action implement allocates, while mission status remains on the resolved status surface. Small missions use single_branch by default, and shared mainline state is reached only through review, consolidation, and quality gates.
commands:
- spec-kitty agent action implement
last_updated: '2026-11-08'
