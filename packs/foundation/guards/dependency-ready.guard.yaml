schema_version: '1.0'
id: dependency-ready
title: The work package's dependencies are satisfied
description: Every work package this one depends on is approved or done, or was canceled with a reason an operator recorded. Approved counts because done is recorded only when the whole mission is consolidated. It guards the claim (planned to claimed) and the start from claimed (claimed to in_progress). When the declared dependencies cannot be read, the move is refused (charter ADR-0054 decisions 6 and 7).
interface: guard/1
implemented_by: builtin:dependency-ready
