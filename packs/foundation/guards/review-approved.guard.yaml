id: review-approved
title: A reviewer approved the work package
description: The reviewer's identity and an approving verdict with its reference are recorded and, on a move out of in_review, the review result is present and consistent with the approval. It guards every move to approved and to done (charter ADR-0054 decision 6).
interface: guard/1
implemented_by: builtin:review-approved
