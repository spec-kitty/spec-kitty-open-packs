schema_version: '1.0'
id: work-package
title: Work package
description: The lanes a work package moves through, as core's status model names them. A guarded move names the built-in checks core runs on it, apart from the actor, workspace and reason checks (transition-context-complete), which this lifecycle does not declare. Core also requires a structured review result on every move out of in_review, which no built-in guard checks on its own, so the moves out of in_review other than approve and complete name no review-result check.
initial: planned
states:
- id: planned
  title: Planned
- id: claimed
  title: Claimed
  description: An agent has taken the work package and has not started it.
- id: in_progress
  title: In progress
  description: Someone is implementing it.
- id: for_review
  title: For review
- id: in_review
  title: In review
  description: A reviewer is reviewing it.
- id: approved
  title: Approved
  description: The review passed; consolidation records it done.
- id: blocked
  title: Blocked
- id: done
  title: Done
  terminal: true
- id: canceled
  title: Canceled
  terminal: true
transitions:
- from: planned
  to: claimed
  event: claim
  guard:
  - ref: dependency-ready
- from: claimed
  to: in_progress
  event: start
  guard:
  - ref: dependency-ready
- from: blocked
  to: in_progress
  event: start
- from: in_progress
  to: for_review
  guard:
  - ref: implementation-ready
  - ref: spec-kitty-pre-review
- from: for_review
  to: in_review
  event: start_review
- from:
  - in_progress
  - in_review
  to: approved
  event: approve
  guard:
  - ref: review-approved
- from:
  - in_review
  - approved
  to: done
  event: complete
  guard:
  - ref: review-approved
- from:
  - in_review
  - approved
  to: in_progress
  event: changes_requested
  guard:
  - ref: review-ref
- from: in_progress
  to: planned
  event: reset
- from: in_review
  to: planned
  event: reset
- from: approved
  to: planned
  event: reset
  guard:
  - ref: review-ref
- from:
  - planned
  - claimed
  - in_progress
  - for_review
  - in_review
  - approved
  to: blocked
  event: block
- from:
  - planned
  - claimed
  - in_progress
  - for_review
  - in_review
  - approved
  - blocked
  to: canceled
  event: cancel
