schema_version: "1.0"
id: DIRECTIVE_045
title: PRs-Only and Read-Intent Before High-Risk Operations
intent: >
  All changes to the protected default branch on the remote go through pull
  requests — agents never push to it directly or merge without explicit
  operator instruction. Before executing any high-risk git operation (merge,
  rebase, deletion, force operations), agents must read the mission spec and
  current context first. Neither rule may be bypassed under time pressure or
  assumed from a task title alone.
enforcement: required
scope: >
  Applies to all agent-driven git operations that touch the protected default
  branch on the remote (for example origin/main) or that constitute high-risk
  operations: merges, rebases, deletions of branches or files, and force
  operations. Also applies during any review or implementation step that could
  result in one of these operations.
integrity_rules:
  - Agents must not push to the protected default branch on the remote, run
    `git push --force`, or run `gh pr merge` without explicit operator
    instruction.
  - "`spec-kitty consolidate` is permitted — it operates on the local default
    branch only. The prohibition applies to pushing the result to the remote
    default branch without a PR."
  - Every high-risk git operation must be preceded by a documented intent
    check (reading mission spec/context). "The task title said to do it" is
    not sufficient justification.
validation_criteria:
  - Agent guidance for consolidate operations explicitly states that
    `spec-kitty consolidate` targets the local default branch only and that a
    pull request must be opened before the result reaches the remote default
    branch.
  - High-risk operation checklists require a mission-spec/context read step
    before execution.
  - Escalation path (to the operator) is documented for cases where intent
    is unclear.
