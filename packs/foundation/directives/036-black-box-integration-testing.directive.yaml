id: DIRECTIVE_036
schema_version: '1.0'
title: Black-Box Integration Testing
intent: |
  Exercise the system under test through its external interfaces only, without reference to its internal code structure, implementation details, or internal paths. Test cases derive from specifications, requirements, and design parameters, and assertions are made on observable outputs returned through those external interfaces. "Black-box" refers to the technique (absence of structural knowledge) and is independent of test scope — the scope is selected separately by responsibility, not by default to end-to-end.
enforcement: required
scope: |
  Applies to integration-level tests — tests that exercise more than one collaborator together through an external interface of the system under test. The system under test may be a deployed service, a compose stack, or an in-process composition of a module and its collaborators; the responsibility boundary — not the deployment topology — determines what is inside the system under test for a given test. Where substitutes may sit, at every test level, is set by DIRECTIVE_054.
integrity_rules:
- Black-box integration tests must not import inside-boundary modules of the system under test to invoke business logic directly.
- Black-box integration tests must not patch, monkeypatch, or otherwise replace inside-boundary collaborators of the system under test (DIRECTIVE_054).
- In a test a change adds or modifies, substitution of outside-boundary dependencies is permitted only on an allow-listed seam of DIRECTIVE_054, and only when the substitute preserves the observable contract the system under test relies on. An existing test that substitutes another seam is remediated when a change touches it, or recorded as a tracked follow-up.
- Assertions must target externally observable state, not private attributes or internal call sequences of inside-boundary components.
- The responsibility boundary used by the test must be stated (in test name, docstring, or supporting doc) so reviewers can judge which components were exercised for real and which were substituted.
validation_criteria:
- Each black-box integration test can be read and understood without reference to the internal code structure of inside-boundary components.
- Each black-box integration test exercises the system under test through an external interface and asserts on observable outputs of that interface.
- Inputs for each test trace back to a specification, requirement, or design parameter rather than to an implementation detail.
- The responsibility boundary applied by the test is identifiable from the test itself.
