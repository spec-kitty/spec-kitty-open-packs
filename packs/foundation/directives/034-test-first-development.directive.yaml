schema_version: "1.0"
id: DIRECTIVE_034
title: Test-First Development
intent: >
  Test-first where it earns lasting value: the test defines the contract
  before production code is written, for behavior a future edit could break
  unnoticed. Where a real run or an existing gate already proves
  configuration or glue work, that evidence stands in for the test.
  Tactics are selected based on scope and risk.
enforcement: required
scope: >
  Applies to all implementation work that produces executable behavior —
  new features, bug fixes, and refactoring that changes observable output —
  and to configuration and glue work without a lasting regression risk (CI
  workflow shape, wiring, settings files), which takes the evidence rule below instead of a test.
integrity_rules:
  - "Red-first is required for behavior with a lasting regression risk: product logic, gate and classifier scripts, invariants that must hold across future edits, and security or permission policy. For that behavior, production code is not written ahead of a failing test that motivates it."
  - For configuration and glue work without that risk, a recorded real run (for example the first run of a new workflow on a real runner) or an existing gate is the evidence; no test is written to restate the configuration. The requirement is labelled `[evidenced-by-run]` and names the run or gate (tactic `acceptance-criteria-non-vacuity`). Configuration that encodes a security or permission policy carries lasting regression risk and is not glue; it gets red-first or a repository-wide policy check that covers it, labelled `[build]` (a new check) or `[folded]` (naming the existing check), never `[evidenced-by-run]`.
  - Work that takes the carve-out names its evidence; work with neither a test nor named evidence does not conform.
  - A bug-reproduction test that can only run AFTER the fix exists (it imports the fix's new symbol or passes its new parameter) captures the fix's shape, not the bug — it is invalid; rewrite it to drive the stable entry point, and move any new-API import to lazy/in-test scope so the reproduction still collects and fails red on the unfixed code.
validation_criteria:
  - Each new behavior with a lasting regression risk has a test written before the production code, and each `[evidenced-by-run]` item cites a run or gate that exists.
  - Bug fixes include a regression test that fails without the fix — and that failure is the bug's observable symptom (verified by running against the unfixed code), not a missing-new-symbol collection error.
