schema_version: '1.0'
id: research
title: Research
description: Conduct systematic research with structured methodology and evidence synthesis
content: |-
  You are a research agent conducting systematic literature reviews and empirical research.
  Your mission is to maintain research integrity and methodological rigor throughout every phase.

  Key Practices:
  - Document ALL sources in research/source-register.csv with proper citations, URLs, and access dates.
  - Extract findings to research/evidence-log.csv with confidence levels (high/medium/low) and contextual notes.
  - Clearly articulate methodology decisions for reproducibility and peer review.
  - Distinguish raw evidence from interpretation; cite every claim.
  - Identify limitations, threats to validity, and alternative explanations.
  - Synthesize findings so that each conclusion traces back to documented evidence rows.

  Citation Standards:
  - Use BibTeX or APA format (include DOI or URL when available).
  - Track access dates for all online sources.
  - Assign confidence levels commensurate with source quality.

  Workflow Phases: question -> methodology -> gather -> analyze -> synthesize -> publish.
requires_substantive_spec: true
path_conventions:
  workspace: research/
  deliverables: findings/
  documentation: reports/
  data: data/
expected_output_artifacts:
- artifact_key: evidence.methodology.detailed
  artifact_class: evidence
  path_pattern: methodology.md
- artifact_key: evidence.synthesis.notes
  artifact_class: evidence
  path_pattern: synthesis.md
- artifact_key: evidence.literature-review
  artifact_class: evidence
  path_pattern: literature-review.md
- artifact_key: evidence.gap-analysis
  artifact_class: evidence
  path_pattern: gap-analysis.md
- artifact_key: evidence.research-log
  artifact_class: evidence
  path_pattern: research.md
- artifact_key: runtime.charter-lint.decay
  artifact_class: runtime
  path_pattern: lint-report.json
steps:
- id: scoping
  title: Research Scoping
  description: Define the research question, scope boundaries, and stakeholder context.
  role: researcher
  prompt_path: steps/scoping.prompt.md
  guidelines_path: steps/scoping.guidelines.md
  expected_output_artifacts:
  - artifact_key: input.spec.research
    artifact_class: input
    path_pattern: spec.md
    blocking: true
    template_path: templates/research-spec-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action scoping --json
  - id: capture-question
    description: Capture the research question, scope boundaries, and stakeholder context
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
      - DIRECTIVE_037
  - id: validate-scope
    description: Validate scope boundaries against research mission inputs and feasibility
    delegates_to:
      kind: tactic
      candidates:
      - requirements-validation-workflow
  - id: document-decisions
    description: Record any scoping decisions made during specification
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_003
  - id: write-spec
    description: Write spec.md to kitty-specs/{mission_slug}/
    command: Write spec.md in kitty-specs/{mission_slug}/
  - id: commit-spec
    description: Commit the research spec to main branch
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_029
      - DIRECTIVE_033
- id: methodology
  title: Methodology Design
  description: Document the research methodology, frameworks, and reproducibility plan.
  role: researcher
  prompt_path: steps/methodology.prompt.md
  guidelines_path: steps/methodology.guidelines.md
  expected_input_artifacts:
  - artifact_key: input.spec.research
    path_pattern: spec.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: workflow.plan.methodology
    artifact_class: workflow
    path_pattern: plan.md
    blocking: true
    template_path: templates/research-plan-template.md
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action methodology --json
  - id: read-spec
    description: Read and understand the research spec produced in scoping
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
  - id: design-methodology
    description: Document research methodology — design choices, frameworks, reproducibility plan
    delegates_to:
      kind: tactic
      candidates:
      - requirements-validation-workflow
      - adr-drafting-workflow
  - id: document-decisions
    description: Record methodology decisions as ADRs
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_003
  - id: write-plan
    description: Write plan.md to kitty-specs/{mission_slug}/
    command: Write plan.md in kitty-specs/{mission_slug}/
  - id: commit-plan
    description: Commit the methodology plan to main branch
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_029
      - DIRECTIVE_033
- id: gathering
  title: Source Gathering
  description: Register sources with citations and emit source_documented events.
  role: researcher
  prompt_path: steps/gathering.prompt.md
  guidelines_path: steps/gathering.guidelines.md
  expected_input_artifacts:
  - artifact_key: workflow.plan.methodology
    path_pattern: plan.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: evidence.source-register
    artifact_class: evidence
    path_pattern: research/source-register.csv
    blocking: true
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action gathering --json
  - id: read-methodology
    description: Read the methodology plan to align gathering against the documented approach
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
  - id: collect-sources
    description: Collect, register, and cite research sources; emit source_documented events for the run engine
    delegates_to:
      kind: tactic
      candidates:
      - requirements-validation-workflow
    guidance: Each accepted source must be appended to source-register.csv and the run engine must observe a `source_documented` event for it. The minimum-source threshold is enforced by the runtime's `event_count("source_documented", 3)` guard, not by this substep.
  - id: validate-sources
    description: Verify each row in source-register.csv has citation, retrieval evidence, and trust grading
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
  - id: commit-register
    description: Commit source-register.csv updates with co-author attribution
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_029
      - DIRECTIVE_033
- id: synthesis
  title: Findings Synthesis
  description: Synthesize evidence into findings, tracing each conclusion to documented sources.
  role: researcher
  prompt_path: steps/synthesis.prompt.md
  guidelines_path: steps/synthesis.guidelines.md
  expected_input_artifacts:
  - artifact_key: evidence.source-register
    path_pattern: research/source-register.csv
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.findings.main
    artifact_class: output
    path_pattern: findings.md
    blocking: true
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action synthesis --json
  - id: read-sources
    description: Read source-register.csv and supporting evidence collected during gathering
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
  - id: synthesize-findings
    description: Synthesize documented evidence into findings; trace each conclusion to source rows
    delegates_to:
      kind: tactic
      candidates:
      - requirements-validation-workflow
      - adr-drafting-workflow
    guidance: Every claim in findings.md must cite at least one row from source-register.csv. If evidence is insufficient for a conclusion, route back to gathering via the `gather_more` transition rather than weakening the finding.
  - id: document-decisions
    description: Record synthesis decisions, alternative interpretations, and excluded evidence
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_003
  - id: write-findings
    description: Write findings.md to kitty-specs/{mission_slug}/
    command: Write findings.md in kitty-specs/{mission_slug}/
  - id: commit-findings
    description: Commit findings.md with co-author attribution
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_029
      - DIRECTIVE_033
- id: output
  title: Publication Output
  description: Prepare findings for publication; verify citation completeness and methodology clarity.
  role: reviewer
  prompt_path: steps/output.prompt.md
  guidelines_path: steps/output.guidelines.md
  expected_input_artifacts:
  - artifact_key: output.findings.main
    path_pattern: findings.md
    blocking: true
  expected_output_artifacts:
  - artifact_key: output.report.publication
    artifact_class: output
    path_pattern: report.md
    blocking: true
  substeps:
  - id: bootstrap
    description: Load charter context for this action
    command: spec-kitty charter context --action output --json
  - id: verify-findings-fidelity
    description: Verify the publication candidate matches findings.md and cited sources
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_010
      - DIRECTIVE_037
  - id: verify-citation-completeness
    description: Confirm every claim in the publication traces to a source-register.csv row and that all sources are cited
    delegates_to:
      kind: tactic
      candidates:
      - usage-examples-sync
  - id: assess-publication-readiness
    description: Evaluate clarity, methodology disclosure, and risk of misinterpretation for peer review
    delegates_to:
      kind: tactic
      candidates:
      - review-intent-and-risk-first
  - id: write-report
    description: Write report.md to kitty-specs/{mission_slug}/
    command: Write report.md in kitty-specs/{mission_slug}/
  - id: gate-publication-approved
    description: Record the publication_approved gate event so the runtime's transition to done unblocks
    delegates_to:
      kind: tactic
      candidates:
      - quality-gate-verification
      - stopping-conditions
    guidance: The `publication_approved` gate is emitted by the run engine, not by this substep; this step exists so reviewers know which gate must pass for the output -> done transition guarded by the runtime.
  - id: commit-report
    description: Commit the published report with co-author attribution
    delegates_to:
      kind: directive
      candidates:
      - DIRECTIVE_029
      - DIRECTIVE_033
- id: accept
  title: Acceptance
  description: Validate research completeness and readiness for publication.
  prompt_path: steps/accept.prompt.md
  expected_input_artifacts:
  - artifact_key: output.report.publication
    path_pattern: report.md
    blocking: true
on_demand_steps:
- id: retrospect
  title: Retrospective
  description: Capture what helped, what did not and the governance gaps of a finished mission as a retrospective record.
  role: facilitator
  prompt_path: steps/retrospect.prompt.md
