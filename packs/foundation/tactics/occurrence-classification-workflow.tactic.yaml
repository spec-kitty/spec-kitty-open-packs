id: occurrence-classification-workflow
schema_version: '1.0'
name: Occurrence Classification Workflow
purpose: |
  Guide mission authors through classifying string occurrences by semantic context before performing bulk edits.
steps:
- title: Identify the target
  description: |
    Name the primary term being changed, its replacement, and the operation type.
  examples:
  - 'target: constitution -> charter (rename)'
- title: Enumerate occurrence categories
  description: |
    List every semantic context where the target appears. The map must classify all eight standard categories, even when the action is do_not_change: code_symbols, import_paths, filesystem_paths, serialized_keys, cli_commands, user_facing_strings, tests_fixtures and logs_telemetry. Add project-specific categories after them if needed.
  examples:
  - code_symbols, import_paths, filesystem_paths, serialized_keys, cli_commands, user_facing_strings, tests_fixtures, logs_telemetry
- title: Assign per-category actions
  description: |
    For each category, choose: rename, manual_review, do_not_change, or rename_if_user_visible.
  examples:
  - 'code_symbols: rename; serialized_keys: do_not_change; cli_commands: manual_review'
- title: Document exceptions
  description: |
    List specific files or patterns that override category-level rules. Each exception needs a path and an action; give a reason too.
  examples:
  - 'exceptions: [{path: CHANGELOG.md, action: do_not_change, reason: historical record}]'
- title: Write and validate the occurrence map
  description: |
    Write the classification to occurrence_map.yaml in the mission directory. There is no standalone validate command: the occurrence-classification gate runs automatically on `spec-kitty agent mission finalize-tasks`, `spec-kitty agent action implement`, and `spec-kitty agent action review` for missions with `change_mode: bulk_edit`, and blocks with "Bulk Edit Gate: BLOCKED" until the map is structurally complete.
  examples:
  - 'spec-kitty agent mission finalize-tasks --mission my-mission  # runs the occurrence-map gate'
