schema_version: "1.0"
id: test-boundaries-by-responsibility
name: Test Boundaries by Functional Responsibility
purpose: Determine test scope by identifying which components are directly responsible for the behavior under test, rather than following structural layer boundaries. Reduces brittle tests while ensuring meaningful validation.
steps:
  - title: Identify the functionality to validate
    description: Write a one-sentence description of the feature or behavior being tested. This anchors all boundary decisions.
    examples:
      - "User registration validates email format and creates account record."
  - title: Map responsibility boundaries
    description: List all components involved in delivering the functionality. For each, ask whether it directly implements logic for this feature. Mark components as inside-boundary (real) or outside-boundary (may be substituted).
    examples:
      - "Inside: UserRegistrationService, EmailValidator. Outside: UserRepository, EmailDeliveryService."
  - title: Classify dependencies
    description: >
      Inside boundary (do NOT mock): business logic, domain models, value objects, validation rules specific to the feature (a validation rule the behavior depends on runs for real).
      Outside boundary (may be substituted): the allow-listed seams of DIRECTIVE_054. Substitution is permitted, never required. A module line is not a responsibility line; another bounded context (its own model, reached only through a published contract) is the allow-listed case, and so is schema-only validation of a data-transfer object by a library the system does not own.
  - title: Write the test scope statement
    description: Formulate a sentence stating what the test validates, what it exercises for real, and what it stubs.
    examples:
      - "This test validates user registration by exercising UserRegistrationService and EmailValidator while stubbing UserRepository and EmailDeliveryService."
  - title: Create the focused test
    description: Instantiate inside-boundary components with real implementations. Substitute outside-boundary components only where needed, at allow-listed seams. Assert on behavior of inside-boundary components, not on stub interactions.
  - title: Verify boundary correctness
    description: >
      Ask two questions:
      (1) If I refactor inside-boundary components without changing functionality, should this test still pass? (Yes.)
      (2) If outside-boundary implementations change, should this test be affected? (No; they sit outside the boundary.)
failure_modes:
  - "Excessive mocking: stubbing components that are part of the functional slice, testing doubles instead of real logic."
  - "Slow or flaky real dependencies: a real external dependency that makes the test slow or nondeterministic; substitute it at an allow-listed seam (substitution is permitted, never required)."
  - "Pinning a call contract on owned logic: a double of a collaborator inside the boundary, asserted on its calls; it can manufacture states the real path never reaches (DIRECTIVE_054)."
  - "Structural bias: defining boundaries by layer (always mock service layer) instead of by responsibility."
  - "Over-assertion: verifying internal implementation details instead of functional outcomes."
